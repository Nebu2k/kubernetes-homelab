# Vanilla Kubernetes ships no metrics-server, and its absence fails quietly:
# kubectl top says "Metrics API not available", the homepage widgets report
# "API error", and any HorizontalPodAutoscaler would do nothing.

# The kubelet serves its metrics over a self-signed certificate issued for the
# node IP, so without this flag every scrape fails with "x509: cannot validate
# certificate". The proper fix would be signing the kubelet server
# certificates with the cluster CA, which on Talos means a machine config
# change and thus a control-plane reboot for one metric. The scrape runs in
# our own cluster network against our own nodes.
args:
  - --kubelet-insecure-tls
  # Node IP first: the Talos nodes have no cluster-resolvable hostname, so the
  # default order via InternalDNS/Hostname leads nowhere.
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname

# One replica. Two would be HA for a number that is re-collected every 15
# seconds anyway, and cost more on three nodes than they are worth.
replicas: 1

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 192Mi

# The ServiceMonitor comes along, kube-prometheus-stack runs in this cluster.
metrics:
  enabled: true
serviceMonitor:
  enabled: true
