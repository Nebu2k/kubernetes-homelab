apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab Dashboard
    favicon: https://gethomepage.dev/assets/favicon.ico
    theme: dark
    color: slate
    headerStyle: boxedWidgets
    useEqualHeights: true
    showStats: true
    layout:
      Management:
        style: row
        columns: 2
      Monitoring:
        style: row
        columns: 3
      Smart Home:
        style: row
        columns: 2
      Automation:
        style: row
        columns: 2
      Media:
        style: row
        columns: 2
      Applications:
        style: row
        columns: 2
      Infrastructure:
        style: row
        columns: 3
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local

  services.yaml: |
    # Services configured by hand because they are not hosted in Kubernetes.
    
    - Management:
      - AWS Console:
          href: https://d-99675baf99.awsapps.com/start/#/console?account_id=077448369105&role_name=AdministratorAccess
          description: AWS Account
          icon: aws.png
          weight: 20

    - Monitoring:
      # Direct link to the node overview. The Grafana tile itself comes from a
      # gethomepage.dev annotation on the ingress and only points at the start
      # page.
      - Node Overview:
          href: https://grafana.elmstreet79.de/d/homelab-node-overview
          description: Alle sieben Hosts (CPU, RAM, Disk, Temperatur)
          icon: mdi-server-network
          weight: 40

    - Infrastructure:
      - Proxmox:
          href: https://pve.elmstreet79.de
          description: Virtualization Host
          icon: proxmox.png
          weight: 10
          widget:
            type: proxmox
            url: https://pve.elmstreet79.de
            username: {{HOMEPAGE_VAR_PROXMOX_USER}}
            password: {{HOMEPAGE_VAR_PROXMOX_PASS}}

      - UniFi Controller:
          href: https://unifi.elmstreet79.de
          description: UniFi Router
          icon: ubiquiti.png
          weight: 20
          ping: 192.168.2.1
          widget:
            type: unifi
            url: https://unifi.elmstreet79.de
            username: {{HOMEPAGE_VAR_UNIFI_USER}}
            password: {{HOMEPAGE_VAR_UNIFI_PASS}}

      - Mac Mini:
          href: https://grafana.elmstreet79.de/d/homelab-node-overview
          description: Mac Mini Server
          icon: apple.png
          weight: 30
          ping: 192.168.2.4
          # Prometheus instead of Glances, the macmini's node_exporter already
          # holds the same numbers. The url-encoded query is:
          #   round(100 * (1 - (node_memory_free_bytes + node_memory_inactive_bytes
          #     + node_memory_purgeable_bytes) / node_memory_total_bytes))
          # Darwin has no MemAvailable, hence the Mach page classes, same
          # definition as NodeHighMemoryDarwin. round() in the query, otherwise
          # the tile shows three decimals.
          widget:
            type: customapi
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=round%28100%20%2A%20%281%20-%20%28node_memory_free_bytes%7Binstance%3D%22192.168.2.4%3A9100%22%7D%20%2B%20node_memory_inactive_bytes%7Binstance%3D%22192.168.2.4%3A9100%22%7D%20%2B%20node_memory_purgeable_bytes%7Binstance%3D%22192.168.2.4%3A9100%22%7D%29%20%2F%20node_memory_total_bytes%7Binstance%3D%22192.168.2.4%3A9100%22%7D%29%29
            refreshInterval: 30000
            mappings:
              - field: data.result.0.value.1
                label: RAM
                format: number
                suffix: "%"

      - Blocky:
          href: https://grafana.elmstreet79.de/d/homelab-dns
          description: DNS Resolver & Werbefilter
          icon: mdi-dns
          weight: 41
          # Blocky has no UI of its own, the numbers come from Prometheus. One
          # widget per query, the API answers a single value each time:
          #   round(sum(increase(blocky_query_total[24h])))
          #   round(100 * sum(increase(blocky_response_total{response_type="BLOCKED"}[24h]))
          #     / sum(increase(blocky_query_total[24h])))
          #   max(blocky_blocking_enabled)
          # The last one is the state of switch.werbefilter in Home Assistant,
          # max() because both replicas report it.
          widgets:
            - type: customapi
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=round%28sum%28increase%28blocky_query_total%5B24h%5D%29%29%29
              refreshInterval: 60000
              mappings:
                - field: data.result.0.value.1
                  label: Anfragen 24h
                  format: number
            - type: customapi
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=round%28100%20%2A%20sum%28increase%28blocky_response_total%7Bresponse_type%3D%22BLOCKED%22%7D%5B24h%5D%29%29%20%2F%20sum%28increase%28blocky_query_total%5B24h%5D%29%29%29
              refreshInterval: 60000
              mappings:
                - field: data.result.0.value.1
                  label: Geblockt
                  format: number
                  suffix: "%"
            - type: customapi
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=max%28blocky_blocking_enabled%29
              refreshInterval: 60000
              mappings:
                - field: data.result.0.value.1
                  label: Filter
                  format: text
                  remap:
                    - value: "1"
                      to: an
                    - value: "0"
                      to: aus

      - Traefik Dashboard:
          href: https://traefik.elmstreet79.de
          description: Reverse Proxy & Load Balancer
          icon: traefik.png
          weight: 70
          widget:
            type: kubernetes
            namespace: traefik
            app: traefik
            podSelector: app.kubernetes.io/name=traefik

    - Media:

      - Plex:
          href: https://plex.elmstreet79.de
          description: Media Server
          icon: plex.png
          weight: 10
          ping: 192.168.2.4
          widget:
            type: plex
            url: https://plex.elmstreet79.de
            key: {{HOMEPAGE_VAR_PLEX_TOKEN}}

    - Applications:

      - Dreambox:
          href: https://dreambox.elmstreet79.de
          description: Dreambox Receiver
          icon: mdi-television-box
          weight: 30
          ping: 192.168.2.11

  bookmarks.yaml: |
    - Developer:
      - GitHub:
          - icon: github-light.png
            href: https://github.com/Nebu2k/kubernetes-homelab
      - LinkedIn:
          - icon: linkedin.png
            href: https://www.linkedin.com/in/nebu2k/
      - Website:
          - icon: mdi-web
            href: https://seb-it.com

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Talos Cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: true

    - unifi_console:
        url: https://unifi.elmstreet79.de
        username: {{HOMEPAGE_VAR_UNIFI_USER}}
        password: {{HOMEPAGE_VAR_UNIFI_PASS}}

  kubernetes.yaml: |
    mode: cluster

  # Empty but present: without the file homepage looks for it and logs a
  # warning on every render. There is no Docker host here.
  docker.yaml: |
    {}
