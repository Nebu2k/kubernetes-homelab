---
# Ingress-only default-deny: nothing from outside the namespace reaches the
# pods except the paths allowed below. Egress stays open (Tesla API, DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: teslamate
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Free within the namespace: teslamate/grafana/exporter <-> database,
# teslamate <-> mosquitto.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: teslamate
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Traefik may reach the TeslaMate UI on 4000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-teslamate
  namespace: teslamate
spec:
  podSelector:
    matchLabels:
      app: teslamate
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 4000
---
# Traefik may reach the Grafana UI on 3000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-grafana
  namespace: teslamate
spec:
  podSelector:
    matchLabels:
      app: teslamate-grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
---
# Prometheus may scrape the postgres-exporter on 9187.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-exporter
  namespace: teslamate
spec:
  podSelector:
    matchLabels:
      app: teslamate-postgres-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
