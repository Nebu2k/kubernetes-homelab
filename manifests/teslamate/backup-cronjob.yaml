# Offsite backup of the Teslamate database to S3.
#
# Teslamate holds the one dataset in this cluster that a house fire would
# destroy irreplaceably: the driving history cannot be recreated.
#
# The database is dumped with pg_dump rather than snapshotting the Longhorn
# volume: a dump is self-contained and restorable without Longhorn.
#
# Layout and retention live in homelab-terraform/aws/s3-teslamate-backup.tf:
#   daily/   30 days
#   monthly/ 365 days (only the run on the 1st writes there as well)
# Changing the prefixes here REQUIRES changing the variables there, or nothing
# cleans up any more.
#
# The bucket is versioned and the IAM user has neither DeleteObject nor
# DeleteObjectVersion, so this job can only write. An "aws s3 rm" added here
# gets AccessDenied, deliberately.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: teslamate-db-backup
  namespace: teslamate
  labels:
    app.kubernetes.io/name: teslamate-db-backup
spec:
  # 01:30 UTC, ahead of the paperless export (02:00) and the HA archive
  # (04:00 on the 1st) so the backup runs do not overlap.
  #
  # timeZone is mandatory: without it the job runs in the timezone of whichever
  # node holds the kube-controller-manager lease, and the nodes do not agree.
  schedule: "30 1 * * *"
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: teslamate-db-backup
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: dump
              emptyDir:
                # Generous but present: without sizeLimit a derailed run fills
                # the node disk and takes down everything else on that node.
                sizeLimit: 1Gi

          # Split into initContainer and container rather than one script, so
          # the pod status shows whether the dump or the upload failed.
          initContainers:
            - name: dump
              # MUST match the version in database-deployment.yaml: pg_dump
              # refuses to dump a server newer than itself. Renovate bumps both
              # because they share the tag; changing one by hand breaks the
              # backup, and only at the next nightly run.
              image: postgres:18.6
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  DUMP="/dump/teslamate_$(date -u +%F).dump"

                  echo "Dumpe ${PGDATABASE} von ${PGHOST} nach ${DUMP}"

                  # -Fc (custom format): compressed, and pg_restore can pull
                  # individual tables out of it, which a plain SQL dump cannot.
                  pg_dump -Fc -f "${DUMP}"

                  # Counter-check before anything is uploaded: pg_restore -l
                  # reads the archive's header and table of contents, so a
                  # truncated dump fails here instead of landing in S3 as an
                  # apparently successful backup.
                  ENTRIES=$(pg_restore -l "${DUMP}" | grep -c ';' || true)
                  if [ "${ENTRIES}" -lt 1 ]; then
                    echo "FEHLER: ${DUMP} ist kein lesbares pg_dump-Archiv."
                    exit 1
                  fi

                  echo "Dump ok, ${ENTRIES} TOC-Eintraege, $(stat -c %s "${DUMP}") Bytes."
              env:
                - name: PGHOST
                  value: teslamate-database
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: teslamate-secrets
                      key: DATABASE_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: teslamate-secrets
                      key: DATABASE_PASS
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: teslamate-secrets
                      key: DATABASE_NAME
              volumeMounts:
                - name: dump
                  mountPath: /dump
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi

          containers:
            - name: upload
              image: amazon/aws-cli:2.36.36
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  DAY=$(date -u +%F)
                  DUMP="/dump/teslamate_${DAY}.dump"

                  if [ ! -s "${DUMP}" ]; then
                    echo "FEHLER: ${DUMP} fehlt oder ist leer."
                    exit 1
                  fi

                  LOCAL_SIZE=$(stat -c %s "${DUMP}")

                  # "aws s3 cp" is right here, unlike in the HA archive job:
                  # that one copies S3 to S3 and reads the source's object tags
                  # (s3:GetObjectTagging, which this key lacks). An upload from
                  # the local filesystem only does PutObject.
                  upload() {
                    KEY="$1"
                    echo "Lade hoch nach s3://${S3_BUCKET_NAME}/${KEY}"
                    aws s3 cp "${DUMP}" "s3://${S3_BUCKET_NAME}/${KEY}" \
                      --region "${S3_REGION}" --only-show-errors

                    REMOTE_SIZE=$(aws s3api head-object \
                      --bucket "${S3_BUCKET_NAME}" --region "${S3_REGION}" \
                      --key "${KEY}" --query 'ContentLength' --output text)

                    if [ "${REMOTE_SIZE}" != "${LOCAL_SIZE}" ]; then
                      echo "FEHLER: Groesse weicht ab, lokal ${LOCAL_SIZE} vs S3 ${REMOTE_SIZE}."
                      exit 1
                    fi
                    echo "  ok, ${REMOTE_SIZE} Bytes."
                  }

                  upload "daily/teslamate_${DAY}.dump"

                  # On the 1st the same dump goes up a second time under the
                  # long-retention prefix. A second upload rather than a
                  # copy-object: the file is local anyway, and this keeps the
                  # IAM policy at GetObject and PutObject.
                  if [ "$(date -u +%d)" = "01" ]; then
                    upload "monthly/teslamate_$(date -u +%Y-%m).dump"
                  fi

                  echo "Backup fuer ${DAY} abgeschlossen."
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-teslamate-backup-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-teslamate-backup-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: S3_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: s3-teslamate-backup-credentials
                      key: S3_BUCKET_NAME
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: s3-teslamate-backup-credentials
                      key: S3_REGION
              volumeMounts:
                - name: dump
                  mountPath: /dump
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
