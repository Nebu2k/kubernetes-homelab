# PVs for the Longhorn volumes restored from the NAS backup. Why this is
# needed and how the restore works is written out once in
# manifests/ripe-atlas/pv.yaml and as a recipe in talos/README.md.
#
# The two mosquitto volumes are called teslamate-mosquitto-* in Longhorn:
# volume and PV names are cluster-wide, PVC names only unique per namespace.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: teslamate-db
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: teslamate-db
    namespace: teslamate
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: teslamate-db
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
---
