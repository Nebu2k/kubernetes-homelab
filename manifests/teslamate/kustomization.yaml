apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teslamate

resources:
  # PVs for the Longhorn volumes restored from the NAS backup; why they belong
  # in git is explained in the header of pv.yaml.
  - pv.yaml
  - namespace.yaml
  - database-pvc.yaml
  - database-pdb.yaml
  - grafana-pvc.yaml
  - mosquitto-pvc.yaml
  - database-deployment.yaml
  - mosquitto-deployment.yaml
  - teslamate-deployment.yaml
  - grafana-deployment.yaml
  - database-service.yaml
  - mosquitto-service.yaml
  - teslamate-service.yaml
  - grafana-service.yaml
  - teslamate-ingress.yaml
  - grafana-ingress.yaml
  - teslamate-secret-sealed.yaml
  - s3-backup-credentials-sealed.yaml
  - backup-cronjob.yaml
  - postgres-exporter-deployment.yaml
  - postgres-exporter-service.yaml
  - postgres-exporter-servicemonitor.yaml
  - networkpolicy.yaml
