# PVs for the Longhorn volumes restored from the NAS backup.
#
# Why this is needed and how the restore works is written out once in
# manifests/ripe-atlas/pv.yaml and as a recipe in talos/README.md.
#
# home-assistant-config is the largest volume in the cluster; the recorder
# database needs the space.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-config
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: home-assistant-config
    namespace: home-assistant
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: home-assistant-config
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-matter-data
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: home-assistant-matter-data
    namespace: home-assistant
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: home-assistant-matter-data
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
