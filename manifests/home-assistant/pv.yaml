# PVs zu den aus dem NAS-Backup restaurierten Longhorn-Volumes.
#
# Warum das noetig ist und wie das Restore ablaeuft, steht einmal ausfuehrlich
# in manifests/ripe-atlas/pv.yaml und als Rezept in talos/README.md.
#
# home-assistant-config ist mit 20 Gi das groesste Volume der Migration und
# traegt die Recorder-Datenbank. Alles, was zwischen dem Snapshot und dem Prune
# im alten Cluster noch geschrieben wurde, fehlt: bei Home Assistant sind das
# ein paar Minuten Sensor-Historie, keine Konfiguration.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-config
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: home-assistant-config
    namespace: home-assistant
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: home-assistant-config
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-matter-data
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: home-assistant-matter-data
    namespace: home-assistant
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: home-assistant-matter-data
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
