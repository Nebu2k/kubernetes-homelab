# Deliberately no `http:` block: that key is gone in 2027.2.0. The proxy
# trust (use_x_forwarded_for, trusted_proxies incl. fd00:10:42::/56) and the
# login limits live in .storage/http and are edited under
# Settings > System > Network.

default_config:

# Metrics to Prometheus (/api/prometheus, bearer token), filtered
# deliberately narrowly: HA holds well over a thousand entities and would
# otherwise export all of them into what is already the largest volume in
# the cluster.
#
# Included are the four sources that measure power and that Prometheus does
# not already know from elsewhere:
#   delta_3              Ecoflow at the rack, the real homelab draw
#   tibber_pulse         house consumption, east and west wing
#   inverter             Hoymiles PV, three plants on one DTU
#   tesla_wall_connector wallbox
# The inverter glob deliberately also catches sensor.inverter_*_2, which is
# the plant at Mama's and does not belong in this household's balance. Keep
# it apart when querying, and filter on entity rather than friendly_name:
# a language switch in HA left a second, stale set of friendly_name series.
# The USW-16 PoE values are left out on purpose, unpoller already provides
# them as unpoller_device_port_poe_watts.
#
# The tado_mode sensors measure nothing, they are exported for their
# hass_entity_available series alone: Tado is the one integration that stops
# working silently when its refresh token is rejected (alert
# HomeAssistantTadoUnavailable).
prometheus:
  namespace: hass
  filter:
    include_entity_globs:
      - sensor.delta_3_*
      - sensor.tibber_pulse_*
      - sensor.inverter_*
      - sensor.tesla_wall_connector_*
      - sensor.*_tado_mode

# The deliberate dashboard, in yaml so it lives in git like everything else.
# The storage-mode dashboards (Home, Bereiche, Map, Roborock) are untouched
# and stay editable in the UI; this one is added next to them.
#
# Not called "Übersicht": that is the title of HA's own default dashboard.
# The url_path has to contain a hyphen, HA rejects single-word paths, and the
# area cards navigate to it literally, so it has to match the paths in
# dashboard-homelab.yaml.
lovelace:
  mode: storage
  dashboards:
    homelab-cockpit:
      mode: yaml
      title: Cockpit
      icon: mdi:view-dashboard
      show_in_sidebar: true
      filename: dashboard-homelab.yaml

# Cluster health for the dashboard, read back from Prometheus. HA already
# pushes power metrics into Prometheus; this is the return path, and it is
# the only one that exists: HA has no Kubernetes integration and Prometheus
# is where the truth about the cluster already lives.
#
# One request rather than seven: every probe is wrapped in label_replace to
# tag it, and the sensors pick their value out of the combined vector by
# that label. The "or vector(0)" on each is what makes a probe report zero
# instead of vanishing, because an empty count() returns no series at all
# and the sensor would go unavailable exactly when the news is good.
rest:
  - resource: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query"
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded
    scan_interval: 60
    timeout: 15
    payload: >-
      query=label_replace(sum(kube_node_status_condition{condition="Ready",status="true"}
      == 1) or vector(0), "probe", "nodes_ready", "", "")
      or label_replace(count(kube_node_info) or vector(0), "probe", "nodes_total", "", "")
      or label_replace(count(ALERTS{alertstate="firing",alertname!="Watchdog"})
      or vector(0), "probe", "alerts_firing", "", "")
      or label_replace(count(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} == 1)
      or vector(0), "probe", "pods_unhealthy", "", "")
      or label_replace(count(longhorn_volume_robustness{state=~"degraded|faulted"} == 1)
      or vector(0), "probe", "volumes_unhealthy", "", "")
      or label_replace(homelab:longhorn_largest_placeable_volume_bytes or vector(0),
      "probe", "largest_placeable_bytes", "", "")
      or label_replace(max(time() - (longhorn_volume_last_backup_at > 0) and on (volume)
      homelab_longhorn_volume_recurring_job_group_info{backup_group="enabled"})
      or vector(0), "probe", "backup_age_seconds", "", "")
      or label_replace(count(argocd_app_info{sync_status!="Synced"}) or vector(0),
      "probe", "argocd_apps_out_of_sync", "", "")
      or label_replace(count(argocd_app_info{health_status!="Healthy"}) or vector(0),
      "probe", "argocd_apps_unhealthy", "", "")
    sensor:
      - name: "Cluster Nodes bereit"
        unique_id: cluster_nodes_ready
        icon: mdi:server
        state_class: measurement
        value_template: >-
          {{ value_json.data.result | selectattr('metric.probe', 'eq', 'nodes_ready')
             | map(attribute='value.1') | first | default(0) | int }}
      - name: "Cluster Nodes gesamt"
        unique_id: cluster_nodes_total
        icon: mdi:server-network
        state_class: measurement
        value_template: >-
          {{ value_json.data.result | selectattr('metric.probe', 'eq', 'nodes_total')
             | map(attribute='value.1') | first | default(0) | int }}
      - name: "Cluster Alerts aktiv"
        unique_id: cluster_alerts_firing
        icon: mdi:alert-circle
        state_class: measurement
        # Watchdog is excluded in the query: it fires permanently by design,
        # as the proof that the alerting path itself works.
        value_template: >-
          {{ value_json.data.result | selectattr('metric.probe', 'eq', 'alerts_firing')
             | map(attribute='value.1') | first | default(0) | int }}
      - name: "Cluster Pods ungesund"
        unique_id: cluster_pods_unhealthy
        icon: mdi:cube-outline
        state_class: measurement
        value_template: >-
          {{ value_json.data.result | selectattr('metric.probe', 'eq', 'pods_unhealthy')
             | map(attribute='value.1') | first | default(0) | int }}
      - name: "Longhorn Volumes ungesund"
        unique_id: cluster_volumes_unhealthy
        icon: mdi:database-alert
        state_class: measurement
        # longhorn_volume_robustness is one-hot: four series per volume over a
        # state label, exactly one of them 1. Comparing the value against 2 or
        # 3 matches nothing, which is what made two alerts silent for months.
        value_template: >-
          {{ value_json.data.result | selectattr('metric.probe', 'eq', 'volumes_unhealthy')
             | map(attribute='value.1') | first | default(0) | int }}
      # Names stay free of umlauts on purpose: the entity_id is the slugified
      # name, and transliteration is not something to guess at.
      - name: "Longhorn platzierbares Volume"
        unique_id: cluster_largest_placeable_volume
        icon: mdi:database-plus
        unit_of_measurement: GB
        device_class: data_size
        state_class: measurement
        value_template: >-
          {{ (value_json.data.result | selectattr('metric.probe', 'eq', 'largest_placeable_bytes')
             | map(attribute='value.1') | first | default(0) | float / 1024 / 1024 / 1024) | round(0) }}
      - name: "Longhorn Backup Alter"
        unique_id: cluster_backup_age_hours
        icon: mdi:backup-restore
        unit_of_measurement: h
        state_class: measurement
        # Oldest backup among the volumes labelled for backup. The daily job
        # runs at 02:00, so anything past ~26h means a run was missed.
        value_template: >-
          {{ (value_json.data.result | selectattr('metric.probe', 'eq', 'backup_age_seconds')
             | map(attribute='value.1') | first | default(0) | float / 3600) | round(1) }}
      - name: "ArgoCD Apps out of sync"
        unique_id: cluster_argocd_apps_out_of_sync
        icon: mdi:sync-alert
        state_class: measurement
        # argocd_app_info comes from the application-controller. Both counts
        # move during a rollout and settle again on their own; only a value
        # that stays put means something went wrong.
        value_template: >-
          {{ value_json.data.result | selectattr('metric.probe', 'eq', 'argocd_apps_out_of_sync')
             | map(attribute='value.1') | first | default(0) | int }}
      - name: "ArgoCD Apps ungesund"
        unique_id: cluster_argocd_apps_unhealthy
        icon: mdi:heart-broken
        state_class: measurement
        value_template: >-
          {{ value_json.data.result | selectattr('metric.probe', 'eq', 'argocd_apps_unhealthy')
             | map(attribute='value.1') | first | default(0) | int }}

  # Blocking state of the two Blocky instances, feeding the switch below. Two
  # sensors because the state is per instance: the two cluster replicas share
  # it through redis, the LXC on pve is its own process and does not take part.
  #
  # Port 4000 is a ClusterIP with no way in from the LAN, which does not matter
  # here: this pod runs in the cluster and resolves .svc names through CoreDNS.
  - resource: "http://blocky-metrics.blocky.svc.cluster.local:4000/api/blocking/status"
    scan_interval: 30
    timeout: 5
    sensor:
      - name: "Werbefilter Cluster"
        unique_id: blocky_blocking_cluster
        icon: mdi:shield-check
        value_template: "{{ 'an' if value_json.enabled else 'aus' }}"
        # Only present while blocking is off, and it counts down: the switch
        # falls back on its own once it reaches zero.
        json_attributes:
          - autoEnableInSec
          - disabledGroups
  - resource: "http://192.168.2.254:4000/api/blocking/status"
    scan_interval: 30
    timeout: 5
    sensor:
      - name: "Werbefilter LXC"
        unique_id: blocky_blocking_lxc
        icon: mdi:shield-check
        value_template: "{{ 'an' if value_json.enabled else 'aus' }}"
        json_attributes:
          - autoEnableInSec
          - disabledGroups

# GET, not POST: Blocky's API answers 405 on POST. The host is passed in by the
# switch below, which calls each command once per instance.
#
# The duration is deliberate. Blocky re-enables itself when it expires and the
# state lives in memory only, so a forgotten disable heals either way, at the
# latest on the next pod restart.
rest_command:
  blocky_disable:
    url: "http://{{ host }}:4000/api/blocking/disable?duration=15m&groups=ads"
    method: get
    timeout: 5
  blocky_enable:
    url: "http://{{ host }}:4000/api/blocking/enable"
    method: get
    timeout: 5

template:
  - switch:
      - name: "Werbefilter"
        unique_id: blocky_blocking
        icon: mdi:shield-check
        # On as soon as ONE instance still filters. .253 and .254 are both
        # handed out by DHCP, so a client falling back to the second one would
        # otherwise still see blocks while the switch claims everything is off.
        # An unreachable instance reads as off, which is what it is.
        state: >-
          {{ is_state('sensor.werbefilter_cluster', 'an')
             or is_state('sensor.werbefilter_lxc', 'an') }}
        # update_entity right after, otherwise the switch would snap back for
        # up to a scan_interval before the new state arrives.
        turn_on:
          - action: rest_command.blocky_enable
            data:
              host: blocky-metrics.blocky.svc.cluster.local
          - action: rest_command.blocky_enable
            data:
              host: 192.168.2.254
          - action: homeassistant.update_entity
            target:
              entity_id:
                - sensor.werbefilter_cluster
                - sensor.werbefilter_lxc
        turn_off:
          - action: rest_command.blocky_disable
            data:
              host: blocky-metrics.blocky.svc.cluster.local
          - action: rest_command.blocky_disable
            data:
              host: 192.168.2.254
          - action: homeassistant.update_entity
            target:
              entity_id:
                - sensor.werbefilter_cluster
                - sensor.werbefilter_lxc

# Shutting down the PC. Its counterpart is the Windows OpenSSH server; the
# key is a secret mounted at /ssh-wol and deliberately not on the config
# volume, which is archived to S3 monthly.
shell_command:
  nebu2k_pc_shutdown: >-
    ssh -i /ssh-wol/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes
    -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new
    -o UserKnownHostsFile=/config/ssh_known_hosts
    sebastian@192.168.2.5 "shutdown /s /t 0"

switch:
  # host: turns the switch into a measured state (ping every 30s) rather
  # than a guessed one. Depends on the static .5.
  - platform: wake_on_lan
    name: Nebu2k-PC
    mac: d8:bb:c1:3d:c8:ae
    host: 192.168.2.5
    turn_off:
      action: shell_command.nebu2k_pc_shutdown

automation: !include automations.yaml

script: !include scripts.yaml

scene: !include scenes.yaml
