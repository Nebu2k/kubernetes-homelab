# The PodSecurity label is mandatory: the pod uses hostNetwork and sets
# NET_ADMIN and NET_RAW, all forbidden by the baseline profile Talos enforces
# cluster-wide. The reason is in the deployment. Without the label the
# deployment stays at 0/1 while the app reports Synced.
apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  labels:
    pod-security.kubernetes.io/enforce: privileged
