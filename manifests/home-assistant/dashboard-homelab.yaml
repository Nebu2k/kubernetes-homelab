      - type: grid
        cards:
          - type: heading
            heading: Erdgeschoss und Keller
            heading_style: title
            icon: mdi:home-floor-g
          - type: area
            area: haustur
            display_type: compact
            navigation_path: /homelab-cockpit/haustur
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: garten
            display_type: compact
            navigation_path: /homelab-cockpit/garten
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: hauswand
            display_type: compact
            navigation_path: /homelab-cockpit/hauswand
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          # No controls at all: this area is the Tesla. Its switchable
          # entities are charging, defrost, sentry mode and the covers of
          # frunk, trunk and windows. None of that belongs one stray tap
          # away.
          - type: area
