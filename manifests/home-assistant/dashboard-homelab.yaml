            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: flur_ostflugel
            display_type: compact
            navigation_path: /homelab-cockpit/flur_ostflugel
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: balkon_ostflugel
            display_type: compact
            navigation_path: /homelab-cockpit/balkon_ostflugel
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light

      - type: grid
        cards:
          - type: heading
            heading: Westflügel
            heading_style: title
            icon: mdi:home-floor-1
          - type: area
            area: schlafzimmer
            display_type: compact
            navigation_path: /homelab-cockpit/schlafzimmer
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: esszimmer
            display_type: compact
            navigation_path: /homelab-cockpit/esszimmer
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: kuche
            display_type: compact
            navigation_path: /homelab-cockpit/kuche
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: gastezimmer
            display_type: compact
            navigation_path: /homelab-cockpit/gastezimmer
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: duschbad
            display_type: compact
            navigation_path: /homelab-cockpit/duschbad
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: flur_westflugel
            display_type: compact
