# Lovelace dashboard in yaml mode, wired up in configuration.yaml under
# lovelace.dashboards. Not editable in the UI by design: it is the one view
# that is supposed to be reviewable in git.
#
# Area ids come from HA's area registry, floor grouping from the floor
# registry. When an area is added or renamed in the UI, it has to be added
# here too, this file does not follow along.
#
# Every area card needs both halves to be usable:
#   navigation_path  without it the card has tap_action "none" and is a
#                    picture, not a link. It points at a subview further
#                    down, so the path has to match lovelace.dashboards in
#                    configuration.yaml.
#   area-controls    limited to lights on purpose. Without the controls key
#                    the feature offers up to four domains, and the switch
#                    domain here means proxmox_server, serverschrank,
#                    waschmaschine_power, kochfeld_power and a row of child
#                    locks. Lights are the one thing that costs nothing when
#                    tapped by accident; everything else stays one level
#                    deeper in the area subview. In areas without lights the
#                    feature renders nothing, so it can sit on every card.
views:
  - title: Zuhause
    path: zuhause
    icon: mdi:home
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Ostflügel
            heading_style: title
            icon: mdi:home-floor-2
          - type: area
            area: wohnzimmer
            display_type: compact
            navigation_path: /homelab-cockpit/wohnzimmer
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: arbeitszimmer
            display_type: compact
            navigation_path: /homelab-cockpit/arbeitszimmer
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: kinderzimmer
            display_type: compact
            navigation_path: /homelab-cockpit/kinderzimmer
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: wannenbad
            display_type: compact
            navigation_path: /homelab-cockpit/wannenbad
            features_position: inline
            features:
              - type: area-controls
                controls:
                  - light
          - type: area
            area: hauswirtschaftsraum
            display_type: compact
            navigation_path: /homelab-cockpit/hauswirtschaftsraum
