  # Area id and name differ here, the area was renamed after it was created.
  - title: Sonjas Zimmer
    path: gastezimmer
    subview: true
    strategy:
      type: area
      area: gastezimmer

  - title: Duschbad
    path: duschbad
    subview: true
    strategy:
      type: area
      area: duschbad

  - title: Flur Westflügel
    path: flur_westflugel
    subview: true
    strategy:
      type: area
      area: flur_westflugel

  - title: Balkon Westflügel
    path: balkon_westflugel
    subview: true
    strategy:
