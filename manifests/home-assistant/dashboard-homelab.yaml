      type: area
      area: wannenbad

  - title: Hauswirtschaftsraum
    path: hauswirtschaftsraum
    subview: true
    strategy:
      type: area
      area: hauswirtschaftsraum

  - title: Flur Ostflügel
    path: flur_ostflugel
    subview: true
    strategy:
      type: area
      area: flur_ostflugel

  - title: Balkon Ostflügel
    path: balkon_ostflugel
    subview: true
    strategy:
      type: area
      area: balkon_ostflugel

  - title: Schlafzimmer
    path: schlafzimmer
    subview: true
    strategy:
