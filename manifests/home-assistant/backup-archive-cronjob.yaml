# Monthly archive of the Home Assistant backups, a backup of the backup.
#
# HA keeps only its last N automatic backups in S3 and deletes older ones
# itself. This job lifts one state out once a month so a far-back restore
# point exists. Its cleanup happens through the S3 lifecycle rule
# "expire-monthly-archive" in homelab-terraform/aws/s3-backup-buckets.tf, so
# changing the prefix here REQUIRES changing the variable there.
#
# A copy job rather than an HA automation, because HA's backup.create only
# ever writes to the local agent and never reaches S3, while
# backup.create_automatic produces an automatic backup that falls under HA's
# retention again. A named, S3-directed, retention-free state exists only
# through the WebSocket API, which an automation cannot call.
#
# Crucially, ONLY the .tar is copied, not its .metadata.json: HA's S3 agent
# lists backups exclusively through the metadata files, so without one the
# archived state is invisible to HA and no retention can ever touch it.
# Restoring then means pulling the tar from S3 and uploading it in the HA UI.
#
# The copy happens server-side inside S3: no byte passes through the cluster
# and no local copy lands on the Longhorn volume.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ha-backup-archive
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-backup-archive
spec:
  # 1st of the month, 04:00 UTC. The daily HA backup lands in the bucket
  # around 03:00 UTC, so this picks up a fresh state.
  #
  # timeZone is mandatory: without it the job runs in the timezone of whichever
  # node holds the kube-controller-manager lease, and drifting ahead of the HA
  # backup would archive the previous day's state.
  schedule: "0 4 1 * *"
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ha-backup-archive
        spec:
          restartPolicy: OnFailure
          containers:
            - name: archive
              image: amazon/aws-cli:2.36.33
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  YM=$(date -u +%Y-%m)

                  # Idempotence: restartPolicy OnFailure may repeat the job,
                  # and a retry must not create a second state for the month.
                  EXISTING=$(aws s3api list-objects-v2 \
                    --bucket "${S3_BUCKET_NAME}" \
                    --region "${S3_REGION}" \
                    --prefix "Monthly_${YM}_" \
                    --query 'length(Contents || `[]`)' \
                    --output text)

                  if [ "${EXISTING}" != "0" ]; then
                    echo "Archivstand fuer ${YM} liegt bereits im Bucket, nichts zu tun."
                    exit 0
                  fi

                  # Find the newest automatic backup. Only the .tar, the
                  # .metadata.json stays behind on purpose (see the header).
                  SRC=$(aws s3api list-objects-v2 \
                    --bucket "${S3_BUCKET_NAME}" \
                    --region "${S3_REGION}" \
                    --prefix "Automatic_backup_" \
                    --query 'sort_by(Contents[?ends_with(Key, `.tar`)], &LastModified)[-1].Key' \
                    --output text)

                  if [ -z "${SRC}" ] || [ "${SRC}" = "None" ]; then
                    echo "FEHLER: kein Automatic_backup_*.tar im Bucket gefunden."
                    echo "Entweder sichert HA nicht mehr nach S3, oder das Namensschema hat sich geaendert."
                    exit 1
                  fi

                  DST="Monthly_${YM}_${SRC}"
                  echo "Archiviere ${SRC}"
                  echo "        -> ${DST}"

                  # The low-level API rather than "aws s3 cp": the high-level
                  # command reads the object tags to carry them over and needs
                  # s3:GetObjectTagging, which this IAM key does not have.
                  #
                  # copy-object copies server-side and gets by with GetObject
                  # on the source and PutObject on the target.
                  # --tagging-directive REPLACE without --tagging sets the
                  # target explicitly to "no tags" and avoids any tagging
                  # access; HA sets no tags anyway.
                  #
                  # Limit: copy-object handles up to 5 GB in one pass. Beyond
                  # that this would need a multipart copy.
                  aws s3api copy-object \
                    --bucket "${S3_BUCKET_NAME}" \
                    --region "${S3_REGION}" \
                    --key "${DST}" \
                    --copy-source "${S3_BUCKET_NAME}/${SRC}" \
                    --tagging-directive REPLACE \
                    --query 'CopyObjectResult.ETag' \
                    --output text

                  # Counter-check: the target must exist and match the source
                  # size exactly. Without it the job reports success as soon as
                  # the API call returned and a partial copy goes unnoticed.
                  SRC_SIZE=$(aws s3api head-object --bucket "${S3_BUCKET_NAME}" \
                    --region "${S3_REGION}" --key "${SRC}" \
                    --query 'ContentLength' --output text)
                  DST_SIZE=$(aws s3api head-object --bucket "${S3_BUCKET_NAME}" \
                    --region "${S3_REGION}" --key "${DST}" \
                    --query 'ContentLength' --output text)

                  if [ "${SRC_SIZE}" != "${DST_SIZE}" ]; then
                    echo "FEHLER: Groesse weicht ab, Quelle ${SRC_SIZE} vs Ziel ${DST_SIZE}."
                    exit 1
                  fi

                  echo "Archivstand fuer ${YM} angelegt, ${DST_SIZE} Bytes."
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-archive-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-archive-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: S3_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: s3-archive-credentials
                      key: S3_BUCKET_NAME
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: s3-archive-credentials
                      key: S3_REGION
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
