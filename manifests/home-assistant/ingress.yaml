apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    # Deliberately no IP whitelist middleware: homeassistant is meant to be
    # reachable as public_host. What makes HA work behind the proxy is
    # use_x_forwarded_for + trusted_proxies, held in HA's own .storage/http.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Home Assistant"
    gethomepage.dev/description: "Smart Home Hub"
    gethomepage.dev/group: "Smart Home"
    gethomepage.dev/icon: "home-assistant.png"
    gethomepage.dev/weight: "10"
spec:
  ingressClassName: traefik
  rules:
    - host: homeassistant.elmstreet79.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  name: http
