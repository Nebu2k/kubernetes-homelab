apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

resources:
  # PVs for the Longhorn volumes restored from the NAS backup.
  # Why they belong in git is explained in the header of pv.yaml.
  - pv.yaml
  - namespace.yaml
  - pvc.yaml
  - matter-pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - s3-archive-credentials-sealed.yaml
  - wol-ssh-key-sealed.yaml
  - backup-archive-cronjob.yaml

# A generator rather than a handwritten ConfigMap, for the hash suffix: the
# init container copies both files into /config once at startup, so without
# it a change would sync and then sit unused until something restarted the
# pod. With the suffix the name changes and the deployment rolls.
configMapGenerator:
  - name: home-assistant-config-cm
    files:
      - configuration.yaml
      - dashboard-homelab.yaml
