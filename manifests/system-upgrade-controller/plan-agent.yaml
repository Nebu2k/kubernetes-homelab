# Agent-Plan: die beiden Worker (k3s-worker-1, prodesk). Hier laeuft die
# gesamte Anwendungslast, deshalb im Gegensatz zum Server-Plan mit drain.
#
# Der prepare-Schritt ist das Wichtigste an dieser Datei. Er blockiert, bis der
# Server-Plan komplett durch ist, und serialisiert damit beide Plans. Ohne ihn
# laufen sie unabhaengig voneinander, und genau das waere hier gefaehrlich:
# saemtliche 22 Longhorn-Volumes haben ihre beiden Replikate auf k3s-worker-1
# (Agent) und raspi5 (Server). Gleichzeitig angefasst waere jedes Volume ohne
# eine einzige laufende Replik.
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
  labels:
    k3s-upgrade: agent
spec:
  concurrency: 1
  postCompleteDelay: 5m
  # Default sind 900s. Ein drain von k3s-worker-1 loest ueber 20 attachte
  # Longhorn-Volumes ab, das kann laenger dauern als der Upgrade selbst.
  jobActiveDeadlineSecs: 1800
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  serviceAccountName: system-upgrade
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  drain:
    # force fuer Pods ohne Controller, deleteEmptydirData fuer die diversen
    # emptyDir-Caches. Ohne beides bricht kubectl drain sofort ab.
    force: true
    deleteEmptydirData: true
    ignoreDaemonSets: true
    skipWaitForDeleteTimeout: 60
    timeout: 15m
  upgrade:
    # Ohne Tag: der Controller haengt spec.version als Tag an (mit "+" -> "-").
    image: rancher/k3s-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.34.9+k3s1
