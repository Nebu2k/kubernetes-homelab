# Server-Plan: die drei Control-Plane-Nodes (k3s-cp-1, raspi4, raspi5).
#
# Alle drei sind gleichzeitig etcd-Member. concurrency: 1 ist deshalb nicht
# Vorsicht, sondern Pflicht: bei drei Membern liegt das Quorum bei 2, ein
# zweiter gleichzeitig fehlender Member wuerde den Cluster anhalten.
#
# Nur cordon, kein drain. Das entspricht dem offiziellen k3s-Beispiel und ist
# hier zusaetzlich richtig, weil auf den Control-Plane-Nodes keine
# Anwendungslast liegt (die haengt am worker-Label). Ein drain wuerde nur
# DaemonSets und Longhorn-Instance-Manager anfassen, ohne Gewinn.
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
  labels:
    k3s-upgrade: server
spec:
  concurrency: 1
  cordon: true
  # Nach jedem Node Luft lassen, bevor der naechste drankommt: etcd muss den
  # neu gestarteten Member wieder aufnehmen, und die Longhorn-Replikate auf
  # raspi5 muessen zurueck auf healthy sein.
  postCompleteDelay: 5m
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  serviceAccountName: system-upgrade
  upgrade:
    # Ohne Tag: der Controller haengt spec.version als Tag an (mit "+" -> "-").
    image: rancher/k3s-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.35.6+k3s1
