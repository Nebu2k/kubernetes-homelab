# Upstream liefert hier rancher/kubectl:v1.30.3 aus. Dieses Image fuehrt die
# "kubectl drain"-Schritte der Plans aus und laege damit vier Minor-Versionen
# unter dem Cluster (v1.34.x). Die kubectl-Skew-Policy erlaubt +/-1. Praktisch
# wuerde es wohl funktionieren, weil drain nur die seit v1.22 stabile
# Eviction-API benutzt, aber ausserhalb der unterstuetzten Spanne einen
# Node-Drain zu fahren ist unnoetiges Risiko.
#
# Deshalb auf die Minor-Version des Clusters gepinnt. Beim k3s-Minor-Sprung
# hier mitziehen, siehe Kommentar bei rancher/kubectl in renovate.json5.
# rancher/kubectl ist multi-arch (amd64 + arm64), laeuft also auch auf den Raspis.
apiVersion: v1
kind: ConfigMap
metadata:
  name: default-controller-env
  namespace: system-upgrade
data:
  # renovate: datasource=docker
  SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE: rancher/kubectl:v1.34.9
