# kube-router as a pure NetworkPolicy controller. What exactly differs from
# the upstream manifest, and why, is in the header of daemonset.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - rbac.yaml
  - daemonset.yaml
  - service.yaml
  - servicemonitor.yaml
