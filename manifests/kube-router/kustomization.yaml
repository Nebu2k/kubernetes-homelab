# kube-router als reiner NetworkPolicy-Controller.
#
# NUR fuer das Talos-Cluster: k3s bringt denselben Controller eingebaut mit.
# Eingebunden in clusters/talos/kustomization.yaml. Was genau vom
# Upstream-Manifest abweicht und warum, steht im Kopf von daemonset.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - rbac.yaml
  - daemonset.yaml
  - service.yaml
  - servicemonitor.yaml
