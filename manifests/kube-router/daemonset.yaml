# kube-router, exclusively as a NetworkPolicy controller.
#
# Talos deploys vanilla Flannel, which does not enforce NetworkPolicies.
# Without this controller the API accepts the default-deny-ingress policies of
# mealie, paperless-ngx and teslamate, kubectl shows them, and they do
# nothing: protection that exists on paper only.
#
# What differs from the upstream manifest, and this is the part that can go
# wrong: kube-router's "firewall-daemonset.yaml" ships a CNI configuration
# despite its name, installs it via initContainer and DELETES existing *.conf
# files in the process, which here would be Flannel's config and thus the
# network. Therefore:
#
#   - no kube-router-cfg ConfigMap,
#   - no install-cni initContainer,
#   - no mount of /etc/cni/net.d,
#   - --enable-cni=false so kube-router writes nothing on its own.
#
# Also different: upstream reads its credentials from
# /var/lib/kube-router/kubeconfig on the node, a kubeadm detail. Talos puts
# nothing there, so this uses the ServiceAccount and the in-cluster config.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-router
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-router
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-router
    spec:
      # If the pod dies the policies are silently ineffective, which puts it
      # in the same class as kube-proxy.
      priorityClassName: system-node-critical
      serviceAccountName: kube-router
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        # On EVERY node, including ones that currently do not schedule: a node
        # without kube-router is a node without policy enforcement.
        - operator: Exists
      containers:
        - name: kube-router
          image: docker.io/cloudnativelabs/kube-router:v2.10.0
          args:
            # The only job. Router, service proxy and load balancer are off:
            # Flannel routes, kube-proxy handles services, MetalLB the rest.
            - --run-firewall=true
            - --run-router=false
            - --run-service-proxy=false
            - --run-loadbalancer=false
            # v4 is on by default, v6 is NOT. Without this the default-deny
            # policies of mealie, paperless-ngx and teslamate are enforced on
            # v4 only and pass every v6 packet, silently. Requires a v6 pod
            # CIDR on the node, so it must not be set before the nodes carry
            # one.
            - --enable-ipv4=true
            - --enable-ipv6=true
            # See the header: without this kube-router writes a CNI config.
            - --enable-cni=false
            - --health-port=20244
            - --metrics-port=20245
          securityContext:
            # iptables and ipset in the host namespace. NET_ADMIN alone is not
            # enough, kube-router also loads kernel modules.
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          livenessProbe:
            httpGet:
              path: /healthz
              port: 20244
            initialDelaySeconds: 15
            periodSeconds: 10
          ports:
            - name: metrics
              containerPort: 20245
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            # Without the lock kube-router and kube-proxy trip over each other
            # as soon as both touch iptables at once.
            - name: xtables-lock
              mountPath: /run/xtables.lock
      volumes:
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
