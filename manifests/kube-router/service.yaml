# For the ServiceMonitor only. kube-router serves no traffic here, the service
# exists purely to give Prometheus a target.
apiVersion: v1
kind: Service
metadata:
  name: kube-router
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-router
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kube-router
  ports:
    - name: metrics
      port: 20245
      targetPort: 20245
      protocol: TCP
