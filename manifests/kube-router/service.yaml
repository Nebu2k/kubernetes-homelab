# Nur fuer den ServiceMonitor. kube-router bedient hier keinen Verkehr, der
# Service existiert allein, damit Prometheus ein Ziel hat.
apiVersion: v1
kind: Service
metadata:
  name: kube-router
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-router
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kube-router
  ports:
    - name: metrics
      port: 20245
      targetPort: 20245
      protocol: TCP
