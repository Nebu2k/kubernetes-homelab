# The numbers that matter are the count of active policies and the duration of
# the last sync (kube_router_controller_iptables_sync_time): if the sync stops,
# the policies are ineffective again, silently.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-router
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-router
  endpoints:
    - port: metrics
      interval: 30s
