# Die Kennzahl, auf die es ankommt, ist die Zahl der aktiven Policies und die
# Dauer des letzten Sync (kube_router_controller_iptables_sync_time). Faellt der
# Sync aus, sind die Policies wieder wirkungslos, und genau das soll nicht
# nochmal unbemerkt passieren.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-router
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-router
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-router
  endpoints:
    - port: metrics
      interval: 30s
