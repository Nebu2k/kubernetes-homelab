apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mealie
resources:
  # PVs for the Longhorn volumes restored from the NAS backup.
  # Why they belong in git is explained in the header of pv.yaml.
  - pv.yaml
  - namespace.yaml
  - pvc.yaml
  - postgresql.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - mealie-secrets-sealed.yaml
  - networkpolicy.yaml
  - backup-cronjob.yaml
  - s3-mealie-backup-credentials-sealed.yaml
  - mealie-backup-token-sealed.yaml
