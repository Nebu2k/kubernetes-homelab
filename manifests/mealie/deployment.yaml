apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
      app: mealie
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: mealie
        app: mealie
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      # No initContainer and no fsGroup: /app/run.sh starts as root, creates
      # the abc user from PUID/PGID, chowns /app itself and drops via gosu. A
      # securityContext forbidding root breaks exactly that.
      containers:
      - name: mealie
        image: ghcr.io/mealie-recipes/mealie:v3.23.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9000
          protocol: TCP
        env:
        - name: TZ
          value: "Europe/Berlin"
        # Controls the links in notifications and invitations. Without it
        # Mealie logs "BASE_URL is not set" and sends localhost:8080 links.
        - name: BASE_URL
          value: "https://mealie.elmstreet79.de"
        # Internal-only service, but self-registration stays closed anyway.
        # New family members join through an invitation link from the UI.
        - name: ALLOW_SIGNUP
          value: "false"

        - name: DB_ENGINE
          value: "postgres"
        - name: POSTGRES_SERVER
          value: "postgresql"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: POSTGRES_PASSWORD

        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        # /api/app/about is unauthenticated and the same target the image's
        # own healthcheck.sh uses. / serves the SPA, which stays up even when
        # the backend hangs.
        livenessProbe:
          httpGet:
            path: /api/app/about
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/app/about
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mealie-data
