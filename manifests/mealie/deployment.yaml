apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
      app: mealie
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: mealie
        app: mealie
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      # Kein initContainer und kein fsGroup: /app/run.sh startet als root, legt
      # den User abc mit PUID/PGID an, macht selbst ein chown -R auf /app und
      # dropt per gosu. Ein securityContext, der root verbietet, bricht genau
      # diesen Ablauf.
      containers:
      - name: mealie
        image: ghcr.io/mealie-recipes/mealie:v3.22.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9000
          protocol: TCP
        env:
        - name: TZ
          value: "Europe/Berlin"
        # Steuert die Links in Benachrichtigungen und Einladungen. Ohne das
        # meldet Mealie im Log "BASE_URL is not set" und verschickt Links auf
        # localhost:8080.
        - name: BASE_URL
          value: "https://mealie.elmstreet79.de"
        # Intern-only-Dienst, aber Selbstregistrierung bleibt trotzdem zu.
        # Neue Familienmitglieder kommen ueber einen Einladungslink aus der UI.
        - name: ALLOW_SIGNUP
          value: "false"

        # PostgreSQL
        - name: DB_ENGINE
          value: "postgres"
        - name: POSTGRES_SERVER
          value: "postgresql"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: POSTGRES_PASSWORD

        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        # /api/app/about ist unauthentifiziert und dasselbe Ziel, das die
        # eingebaute healthcheck.sh des Images abfragt. / liefert die SPA und
        # taugt hier nicht: die steht auch dann, wenn das Backend haengt.
        livenessProbe:
          httpGet:
            path: /api/app/about
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/app/about
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mealie-data
