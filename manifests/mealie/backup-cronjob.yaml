# Offsite-Backup der Mealie-Rezepte nach S3.
#
# Gesichert wird das ZIP aus Mealies eingebautem Backup, nicht ein pg_dump.
# Grund: die Rezepte stecken zur Haelfte in der Datenbank und zur Haelfte im
# Data-Verzeichnis (Bilder, Assets). Ein Dump allein waere eine halbe
# Wiederherstellung. Das ZIP enthaelt beides und laesst sich ueber Mealies
# eigenen Endpunkt POST /api/admin/backups/{file_name}/restore zurueckspielen,
# ist also ein Backup-Weg mit dokumentiertem Rueckweg.
#
# Ablage und Aufbewahrung stehen in homelab-terraform/aws/s3-mealie-backup.tf:
#   daily/   30 Tage
#   monthly/ 365 Tage (nur der Lauf am Monatsersten legt zusaetzlich hier ab)
# Aendern sich die Praefixe hier, MUESSEN die Variablen dort mitgehen, sonst
# raeumt niemand mehr auf.
#
# Der IAM-User "homelab-mealie-backup" hat weder DeleteObject noch
# DeleteObjectVersion. Dieser Job kann in S3 nichts loeschen, nur schreiben.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mealie-backup
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie-backup
spec:
  # 02:30 UTC, in der Luecke zwischen dem Paperless-Export (02:00) und dem
  # HA-Archiv (04:00), damit sich die naechtlichen Backup-Laeufe nicht
  # ueberlappen. Die Frische-Sonde um 06:00 sieht das Ergebnis danach.
  #
  # timeZone ist Pflicht: ohne das Feld laeuft der Job in der Zeitzone der Node,
  # die gerade den kube-controller-manager haelt, und der Zeitplan wandert mit
  # dem Lease.
  schedule: "30 2 * * *"
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mealie-backup
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: backup
              emptyDir:
                # Das ZIP liegt heute im einstelligen MB-Bereich, waechst aber
                # mit jedem Rezeptbild. Ohne sizeLimit schreibt ein entgleister
                # Lauf die Node-Disk voll und reisst mit, was sonst noch auf der
                # Node laeuft.
                sizeLimit: 2Gi

          # Zwei Schritte als initContainer + container, damit im Fehlerfall am
          # Pod-Status ablesbar ist, ob das Backup oder der Upload gescheitert
          # ist.
          initContainers:
            - name: create-and-fetch
              image: alpine:3.24
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  apk add --no-cache curl jq >/dev/null

                  API="http://mealie:80/api"
                  AUTH="Authorization: Bearer ${MEALIE_API_TOKEN}"

                  # Warten, bis der eigene Pod die NetworkPolicy passieren darf.
                  # Der Namespace hat ein default-deny auf Ingress, und
                  # kube-router traegt einen frisch gestarteten Pod erst mit
                  # einigen Sekunden Verzug in seine ipsets ein: der erste
                  # Versuch scheitert, der zweite rund 15 s spaeter liefert 200.
                  # Ohne diese Schleife waere jeder Lauf ein
                  # Muenzwurf, und zwar einer, der wie ein Mealie-Ausfall
                  # aussieht.
                  echo "Warte auf Erreichbarkeit von mealie..."
                  i=0
                  until curl -sf --max-time 5 "${API}/app/about" -o /dev/null; do
                    i=$((i + 1))
                    if [ "${i}" -ge 20 ]; then
                      echo "FEHLER: mealie nach ${i} Versuchen nicht erreichbar."
                      exit 1
                    fi
                    sleep 10
                  done
                  echo "  erreichbar nach ${i} Fehlversuchen."

                  echo "Erzeuge Backup..."
                  # Mealie baut das ZIP synchron. Bei vielen Bildern dauert das,
                  # deshalb ein grosszuegiges Timeout statt des curl-Defaults.
                  curl -sf --max-time 600 -X POST "${API}/admin/backups" \
                    -H "${AUTH}" -o /dev/null

                  # POST liefert nur eine Meldung, nicht den Dateinamen. Den
                  # juengsten Eintrag aus der Liste zu nehmen ist deshalb der
                  # einzige Weg; concurrencyPolicy Forbid stellt sicher, dass
                  # dabei kein zweiter Lauf dazwischenfunkt.
                  NAME=$(curl -sf --max-time 60 "${API}/admin/backups" -H "${AUTH}" \
                    | jq -r '.imports | max_by(.date) | .name')

                  if [ -z "${NAME}" ] || [ "${NAME}" = "null" ]; then
                    echo "FEHLER: kein Backup in der Liste gefunden."
                    exit 1
                  fi
                  echo "Juengstes Backup: ${NAME}"

                  # Zweistufig, und das ist keine Umstaendlichkeit: der Endpunkt
                  # /admin/backups/{name} liefert NICHT die Datei, sondern einen
                  # kurzlebigen fileToken. Erst /utils/download gibt das ZIP her,
                  # und zwar ohne Bearer-Header, der Token selbst ist die
                  # Berechtigung.
                  TOKEN=$(curl -sf --max-time 60 "${API}/admin/backups/${NAME}" \
                    -H "${AUTH}" | jq -r '.fileToken')

                  if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
                    echo "FEHLER: kein fileToken erhalten."
                    exit 1
                  fi

                  curl -sf --max-time 600 -o /backup/mealie.zip \
                    "${API}/utils/download?token=${TOKEN}"

                  # Gegenprobe vor dem Upload. Ein abgebrochener Download oder
                  # eine als ZIP getarnte Fehlerseite faellt hier durch, statt
                  # als scheinbar erfolgreiches Backup in S3 zu landen und erst
                  # beim Restore aufzufliegen.
                  if ! unzip -t /backup/mealie.zip >/dev/null 2>&1; then
                    echo "FEHLER: /backup/mealie.zip ist kein lesbares ZIP."
                    exit 1
                  fi

                  # Der Name wandert zum Upload-Container, der ihn fuer den
                  # S3-Key und fuer das Aufraeumen braucht.
                  printf '%s' "${NAME}" > /backup/name.txt

                  echo "Backup ok, $(stat -c %s /backup/mealie.zip) Bytes."
              env:
                - name: MEALIE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mealie-backup-token
                      key: MEALIE_API_TOKEN
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi

          containers:
            - name: upload
              image: amazon/aws-cli:2.36.18
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  DAY=$(date -u +%F)
                  ZIP="/backup/mealie.zip"
                  NAME=$(cat /backup/name.txt)

                  if [ ! -s "${ZIP}" ]; then
                    echo "FEHLER: ${ZIP} fehlt oder ist leer."
                    exit 1
                  fi

                  LOCAL_SIZE=$(stat -c %s "${ZIP}")

                  upload() {
                    KEY="$1"
                    echo "Lade hoch nach s3://${S3_BUCKET_NAME}/${KEY}"
                    aws s3 cp "${ZIP}" "s3://${S3_BUCKET_NAME}/${KEY}" \
                      --region "${S3_REGION}" --only-show-errors

                    REMOTE_SIZE=$(aws s3api head-object \
                      --bucket "${S3_BUCKET_NAME}" --region "${S3_REGION}" \
                      --key "${KEY}" --query 'ContentLength' --output text)

                    if [ "${REMOTE_SIZE}" != "${LOCAL_SIZE}" ]; then
                      echo "FEHLER: Groesse weicht ab, lokal ${LOCAL_SIZE} vs S3 ${REMOTE_SIZE}."
                      exit 1
                    fi
                    echo "  ok, ${REMOTE_SIZE} Bytes."
                  }

                  upload "daily/mealie_${DAY}.zip"

                  # Am Monatsersten dasselbe ZIP ein zweites Mal unter dem
                  # Praefix mit der langen Aufbewahrung. Bewusst ein zweiter
                  # Upload statt copy-object innerhalb S3: die Datei liegt
                  # ohnehin lokal, und das spart dem IAM-User jedes Kopier-Recht.
                  if [ "$(date -u +%d)" = "01" ]; then
                    upload "monthly/mealie_$(date -u +%Y-%m).zip"
                  fi

                  # Erst jetzt aufraeumen, nach belegtem Upload. Mealie legt
                  # jedes Backup dauerhaft im Data-Verzeichnis ab; taeglich eines
                  # laeuft die 5-Gi-PVC sonst voll. Das juengste bleibt liegen,
                  # damit ein Restore aus der UI ohne Umweg ueber S3 moeglich
                  # ist.
                  API="http://mealie:80/api"
                  AUTH="Authorization: Bearer ${MEALIE_API_TOKEN}"

                  # Ab hier ist das Backup bereits belegt in S3. Nichts, was jetzt
                  # noch schiefgeht, darf den Job rot faerben, sonst meldet die
                  # Ueberwachung einen Backup-Fehler, den es nicht gibt. Deshalb
                  # haengt an jedem Aufruf ein "|| true" bzw. eine Warnung.
                  if OLD_NAMES=$(curl -sf --max-time 60 "${API}/admin/backups" -H "${AUTH}" \
                       | jq -r --arg keep "${NAME}" '.imports[] | select(.name != $keep) | .name'); then
                    echo "${OLD_NAMES}" | while read -r OLD; do
                      [ -n "${OLD}" ] || continue
                      echo "Raeume altes Backup weg: ${OLD}"
                      curl -sf --max-time 60 -X DELETE \
                        "${API}/admin/backups/${OLD}" -H "${AUTH}" -o /dev/null || \
                        echo "  WARNUNG: ${OLD} liess sich nicht loeschen."
                    done
                  else
                    echo "WARNUNG: Backup-Liste nicht abrufbar, nichts aufgeraeumt."
                  fi

                  echo "Backup fuer ${DAY} abgeschlossen."
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-mealie-backup-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-mealie-backup-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: S3_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: s3-mealie-backup-credentials
                      key: S3_BUCKET_NAME
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: s3-mealie-backup-credentials
                      key: S3_REGION
                - name: MEALIE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mealie-backup-token
                      key: MEALIE_API_TOKEN
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
