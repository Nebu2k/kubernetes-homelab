# Offsite backup of the Mealie recipes to S3.
#
# What is saved is the ZIP from Mealie's built-in backup, not a pg_dump: the
# recipes live half in the database and half in the data directory (images,
# assets), so a dump alone would be half a restore. The ZIP contains both and
# can be replayed through Mealie's own restore endpoint.
#
# Layout and retention live in homelab-terraform/aws/s3-mealie-backup.tf:
#   daily/   30 days
#   monthly/ 365 days (only the run on the 1st writes there as well)
# Changing the prefixes here REQUIRES changing the variables there, or nothing
# cleans up any more.
#
# The IAM user has neither DeleteObject nor DeleteObjectVersion: this job can
# only write to S3, never delete.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mealie-backup
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie-backup
spec:
  # 02:30 UTC, in the gap between the paperless export (02:00) and the HA
  # archive (04:00) so the nightly runs do not overlap; the freshness probe at
  # 06:00 sees the result afterwards.
  #
  # timeZone is mandatory: without it the job runs in the timezone of whichever
  # node holds the kube-controller-manager lease.
  schedule: "30 2 * * *"
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mealie-backup
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: backup
              emptyDir:
                # The ZIP grows with every recipe image. Without sizeLimit a
                # derailed run fills the node disk and takes down whatever else
                # runs there.
                sizeLimit: 2Gi

          # Split into initContainer and container so the pod status shows
          # whether the backup or the upload failed.
          initContainers:
            - name: create-and-fetch
              image: alpine:3.24
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  apk add --no-cache curl jq >/dev/null

                  API="http://mealie:80/api"
                  AUTH="Authorization: Bearer ${MEALIE_API_TOKEN}"

                  # Wait until this pod may pass the NetworkPolicy. The
                  # namespace has a default-deny on ingress and the enforcer
                  # picks a freshly started pod up with a delay, so the first
                  # attempt fails. Measured around 400 ms under
                  # kube-network-policies, it was 15s under kube-router.
                  # Without the loop every run would be a coin flip that looks
                  # like a Mealie outage.
                  echo "Warte auf Erreichbarkeit von mealie..."
                  i=0
                  until curl -sf --max-time 5 "${API}/app/about" -o /dev/null; do
                    i=$((i + 1))
                    if [ "${i}" -ge 20 ]; then
                      echo "FEHLER: mealie nach ${i} Versuchen nicht erreichbar."
                      exit 1
                    fi
                    sleep 10
                  done
                  echo "  erreichbar nach ${i} Fehlversuchen."

                  echo "Erzeuge Backup..."
                  # Mealie builds the ZIP synchronously, which takes a while
                  # with many images, hence a generous timeout.
                  curl -sf --max-time 600 -X POST "${API}/admin/backups" \
                    -H "${AUTH}" -o /dev/null

                  # The POST returns a message, not the filename, so taking
                  # the newest list entry is the only way. concurrencyPolicy
                  # Forbid keeps a second run from interfering.
                  NAME=$(curl -sf --max-time 60 "${API}/admin/backups" -H "${AUTH}" \
                    | jq -r '.imports | max_by(.date) | .name')

                  if [ -z "${NAME}" ] || [ "${NAME}" = "null" ]; then
                    echo "FEHLER: kein Backup in der Liste gefunden."
                    exit 1
                  fi
                  echo "Juengstes Backup: ${NAME}"

                  # Two steps by necessity: /admin/backups/{name} does NOT
                  # return the file but a short-lived fileToken. Only
                  # /utils/download hands out the ZIP, and without a bearer
                  # header, because the token itself is the authorisation.
                  TOKEN=$(curl -sf --max-time 60 "${API}/admin/backups/${NAME}" \
                    -H "${AUTH}" | jq -r '.fileToken')

                  if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
                    echo "FEHLER: kein fileToken erhalten."
                    exit 1
                  fi

                  curl -sf --max-time 600 -o /backup/mealie.zip \
                    "${API}/utils/download?token=${TOKEN}"

                  # Counter-check before the upload: a truncated download or
                  # an error page disguised as a ZIP fails here instead of
                  # landing in S3 as an apparently successful backup.
                  if ! unzip -t /backup/mealie.zip >/dev/null 2>&1; then
                    echo "FEHLER: /backup/mealie.zip ist kein lesbares ZIP."
                    exit 1
                  fi

                  # The name travels to the upload container, which needs it
                  # for the S3 key and for the cleanup.
                  printf '%s' "${NAME}" > /backup/name.txt

                  echo "Backup ok, $(stat -c %s /backup/mealie.zip) Bytes."
              env:
                - name: MEALIE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mealie-backup-token
                      key: MEALIE_API_TOKEN
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi

          containers:
            - name: upload
              image: amazon/aws-cli:2.36.37
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  DAY=$(date -u +%F)
                  ZIP="/backup/mealie.zip"
                  NAME=$(cat /backup/name.txt)

                  if [ ! -s "${ZIP}" ]; then
                    echo "FEHLER: ${ZIP} fehlt oder ist leer."
                    exit 1
                  fi

                  LOCAL_SIZE=$(stat -c %s "${ZIP}")

                  upload() {
                    KEY="$1"
                    echo "Lade hoch nach s3://${S3_BUCKET_NAME}/${KEY}"
                    aws s3 cp "${ZIP}" "s3://${S3_BUCKET_NAME}/${KEY}" \
                      --region "${S3_REGION}" --only-show-errors

                    REMOTE_SIZE=$(aws s3api head-object \
                      --bucket "${S3_BUCKET_NAME}" --region "${S3_REGION}" \
                      --key "${KEY}" --query 'ContentLength' --output text)

                    if [ "${REMOTE_SIZE}" != "${LOCAL_SIZE}" ]; then
                      echo "FEHLER: Groesse weicht ab, lokal ${LOCAL_SIZE} vs S3 ${REMOTE_SIZE}."
                      exit 1
                    fi
                    echo "  ok, ${REMOTE_SIZE} Bytes."
                  }

                  upload "daily/mealie_${DAY}.zip"

                  # On the 1st the same ZIP goes up a second time under the
                  # long-retention prefix. A second upload rather than a
                  # copy-object: the file is local anyway and this saves the
                  # IAM user any copy permission.
                  if [ "$(date -u +%d)" = "01" ]; then
                    upload "monthly/mealie_$(date -u +%Y-%m).zip"
                  fi

                  # Clean up only after a proven upload. Mealie keeps every
                  # backup in its data directory permanently, which would fill
                  # the PVC. The newest one stays so a restore from the UI
                  # works without going through S3.
                  API="http://mealie:80/api"
                  AUTH="Authorization: Bearer ${MEALIE_API_TOKEN}"

                  # From here the backup is proven to be in S3. Nothing that
                  # still goes wrong may turn the job red, or the monitoring
                  # reports a backup failure that did not happen. Hence the
                  # "|| true" on each call.
                  if OLD_NAMES=$(curl -sf --max-time 60 "${API}/admin/backups" -H "${AUTH}" \
                       | jq -r --arg keep "${NAME}" '.imports[] | select(.name != $keep) | .name'); then
                    echo "${OLD_NAMES}" | while read -r OLD; do
                      [ -n "${OLD}" ] || continue
                      echo "Raeume altes Backup weg: ${OLD}"
                      curl -sf --max-time 60 -X DELETE \
                        "${API}/admin/backups/${OLD}" -H "${AUTH}" -o /dev/null || \
                        echo "  WARNUNG: ${OLD} liess sich nicht loeschen."
                    done
                  else
                    echo "WARNUNG: Backup-Liste nicht abrufbar, nichts aufgeraeumt."
                  fi

                  echo "Backup fuer ${DAY} abgeschlossen."
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-mealie-backup-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-mealie-backup-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: S3_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: s3-mealie-backup-credentials
                      key: S3_BUCKET_NAME
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: s3-mealie-backup-credentials
                      key: S3_REGION
                - name: MEALIE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: mealie-backup-token
                      key: MEALIE_API_TOKEN
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
