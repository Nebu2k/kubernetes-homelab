# PVs for the Longhorn volumes restored from the NAS backup. Why this is
# needed and how the restore works is written out once in
# manifests/ripe-atlas/pv.yaml and as a recipe in talos/README.md. In short:
# without a pre-bound PV the PVC binds to a freshly provisioned empty volume,
# which only shows once the data is missing.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-data
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: mealie-data
    namespace: mealie
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: mealie-data
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
---
# The Longhorn volume is called mealie-postgresql-data rather than just
# postgresql-data like the PVC: volume and PV names are cluster-wide and
# paperless-ngx ships a PVC of the same name.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-postgresql-data
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: postgresql-data
    namespace: mealie
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: mealie-postgresql-data
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
