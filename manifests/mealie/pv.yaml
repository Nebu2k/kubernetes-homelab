# PVs zu den aus dem NAS-Backup restaurierten Longhorn-Volumes.
#
# Warum das noetig ist und wie das Restore ablaeuft, steht einmal ausfuehrlich
# in manifests/ripe-atlas/pv.yaml und als Rezept in talos/README.md. Kurz:
# ohne vorgebundenes PV bindet die PVC aus manifests/ an ein frisch
# provisioniertes, leeres Volume, und das faellt erst auf, wenn die Daten
# fehlen.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-data
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: mealie-data
    namespace: mealie
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: mealie-data
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
---
# Das Longhorn-Volume heisst mealie-postgresql-data und nicht wie die PVC nur
# postgresql-data: Volume- und PV-Namen sind clusterweit, und paperless-ngx
# bringt eine PVC desselben Namens mit.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mealie-postgresql-data
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: postgresql-data
    namespace: mealie
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: mealie-postgresql-data
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
