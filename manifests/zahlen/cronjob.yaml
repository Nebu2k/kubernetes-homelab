# Daily pull of the App Store Connect reports, see the header of fetch.rb.
#
# The job writes to the same RWO volume nginx reads from, so it has to land
# on nginx's node: the podAffinity below. Longhorn attaches an RWO volume to
# one node, and any number of pods on that node may mount it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zahlen-fetch
  namespace: zahlen
  labels:
    app.kubernetes.io/name: zahlen-fetch
  annotations:
    # A failed run is reported by its own alert, it is not an unhealthy app.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  # 15:30 UTC: Apple publishes a day by 5 am Pacific (13:00 UTC in winter) for
  # the Americas and earlier for everyone else, so one run after that sees the
  # complete previous day. The last three days are re-read on every run anyway.
  #
  # timeZone is mandatory: without it the job runs in the timezone of whichever
  # node holds the kube-controller-manager lease.
  schedule: "30 15 * * *"
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # One retry for a flaky network; an API that refuses does not change its
      # mind a minute later, and the failed job is the alert's signal.
      backoffLimit: 1
      # The very first run backfills a year of daily reports (~8 minutes).
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zahlen-fetch
        spec:
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: zahlen-web
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            # Same group as the nginx pod, so neither mount re-chowns the
            # volume away from the other.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fetch
              image: ruby:4.0.9-slim-trixie
              command: ["ruby", "/app/fetch.rb"]
              env:
                - name: DATA_DIR
                  value: /data
                - name: ASC_KEY_PATH
                  value: /secrets/AuthKey.p8
                # Developer Program membership, spread over the months in the
                # result column.
                - name: FIXED_COSTS_EUR_PER_YEAR
                  value: "99"
                - name: ASC_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: asc-sales-key
                      key: ASC_KEY_ID
                - name: ASC_ISSUER_ID
                  valueFrom:
                    secretKeyRef:
                      name: asc-sales-key
                      key: ASC_ISSUER_ID
                - name: ASC_VENDOR_NUMBER
                  valueFrom:
                    secretKeyRef:
                      name: asc-sales-key
                      key: ASC_VENDOR_NUMBER
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: key
                  mountPath: /secrets
                  readOnly: true
                - name: data
                  mountPath: /data
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  memory: 384Mi
          volumes:
            - name: script
              configMap:
                name: zahlen-fetch
            - name: key
              secret:
                secretName: asc-sales-key
                items:
                  - key: AuthKey.p8
                    path: AuthKey.p8
            - name: data
              persistentVolumeClaim:
                claimName: zahlen-data
