# The page itself comes from the ConfigMap, data.json from the volume the
# fetch job writes. Nothing here is cached: data.json changes daily and the
# page is a few kilobytes.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    location = /data.json {
        alias /data/site/data.json;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
