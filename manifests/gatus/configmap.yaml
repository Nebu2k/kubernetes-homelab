apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
data:
  config.yaml: |
    # Prometheus measures from INSIDE, Gatus from OUTSIDE: does an answer
    # arrive and is it correct. Alerting still takes one path only: Gatus
    # writes metrics, the rules live in the "gatus" group of
    # manifests/kube-prometheus-stack/prometheus-rules.yaml and go to SNS via
    # Alertmanager. Gatus' own alert providers stay unconfigured on purpose.
    #
    # The pod resolves through CoreDNS, so the split-horizon rewrite applies
    # and the cluster checks run through Traefik, testing the whole chain
    # (DNS, LB, TLS, app). ndots: 1 keeps external names out of the search
    # domains.

    metrics: true

    # The default is 3, where a single 10s timeout would hold up a third of
    # the queue across ~40 endpoints.
    concurrency: 8

    storage:
      type: sqlite
      path: /data/data.db
      caching: true

    ui:
      title: "Status | elmstreet79.de"
      header: "elmstreet79.de"
      dashboard-heading: "Homelab Status"
      dashboard-subheading: "Erreichbarkeit der Dienste, von aussen gemessen"
      default-sort-by: group
      buttons:
        - name: "Dashboard"
          link: "https://home.elmstreet79.de"
        - name: "Grafana"
          link: "https://grafana.elmstreet79.de"

    endpoints:
      - name: Homepage
        group: Cluster
        url: "https://home.elmstreet79.de"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"
          # Canary for the wildcard cert that ALL hosts here share.
          - "[CERTIFICATE_EXPIRATION] > 240h"

      # Cloudflare Worker, nicht im Cluster. Der Check deckt den ganzen Weg ab:
      # Blocky loest www ueber den zone-Eintrag nach draussen auf.
      - name: Landing Page
        group: Internet
        url: "https://www.elmstreet79.de"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"

      # Der Apex bleibt Traefiks Aufgabe und schickt intern auf www
      # (manifests/external-services/apex-redirect.yaml).
      - name: Apex-Redirect
        group: Cluster
        url: "https://elmstreet79.de"
        interval: 60s
        # Ohne ignore-redirect folgt Gatus dem 301 und prueft am Ende www,
        # nicht den Redirect.
        client:
          ignore-redirect: true
        conditions:
          - "[STATUS] == 301"

      - name: ArgoCD
        group: Cluster
        url: "https://argocd.elmstreet79.de/healthz"
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Grafana
        group: Cluster
        url: "https://grafana.elmstreet79.de/api/health"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          # Grafana still answers 200 when only its database is gone.
          - "[BODY].database == ok"

      - name: Prometheus
        group: Cluster
        url: "https://prometheus.elmstreet79.de/-/healthy"
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Alertmanager
        group: Cluster
        url: "https://alertmanager.elmstreet79.de/-/healthy"
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Longhorn
        group: Cluster
        url: "https://longhorn.elmstreet79.de"
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Home Assistant
        group: Cluster
        url: "https://homeassistant.elmstreet79.de"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"

      - name: Paperless
        group: Cluster
        url: "https://paperless.elmstreet79.de"
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Mealie
        group: Cluster
        url: "https://mealie.elmstreet79.de/api/app/about"
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: TeslaMate
        group: Cluster
        url: "https://teslamate.elmstreet79.de/api/health"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].database == ok"

      - name: TeslaMate Settings
        group: Cluster
        url: "https://teslamate-settings.elmstreet79.de"
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: FR24 Feeder
        group: Cluster
        url: "https://fr24.elmstreet79.de"
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: PiAware Feeder
        group: Cluster
        url: "https://piaware.elmstreet79.de"
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      # Infrastructure outside the cluster, addressed by IP rather than by
      # name on purpose: if Traefik fails, every cluster check above goes red
      # while these stay green, which tells at a glance whether the reverse
      # proxy or the hardware behind it broke.
      - name: Proxmox
        group: Infrastruktur
        url: "https://192.168.2.8:8006/"
        interval: 2m
        client:
          insecure: true  # self-signed
        conditions:
          - "[STATUS] == 200"

      - name: UniFi Gateway
        group: Infrastruktur
        url: "https://192.168.2.1/"
        interval: 2m
        client:
          insecure: true
        conditions:
          - "[STATUS] == 200"

      - name: UniFi NAS
        group: Infrastruktur
        url: "https://192.168.2.6/"
        interval: 2m
        client:
          insecure: true
        conditions:
          - "[STATUS] == 200"

      # The NAS carries the Longhorn backups over CIFS. If the share is gone
      # the recurring jobs run into nothing, which would otherwise take hours
      # to notice.
      - name: UniFi NAS (SMB)
        group: Infrastruktur
        url: "tcp://192.168.2.6:445"
        interval: 5m
        conditions:
          - "[CONNECTED] == true"

      - name: Plex
        group: Infrastruktur
        url: "http://192.168.2.4:32400/identity"
        interval: 2m
        conditions:
          - "[STATUS] == 200"

      - name: Dreambox
        group: Infrastruktur
        url: "https://192.168.2.11/"
        interval: 5m
        client:
          insecure: true
        conditions:
          # 401 is the healthy answer (basic auth); 502 or 000 would be the
          # failure, hence an exact match instead of "< 500".
          - "[STATUS] == 401"

      # DNS. Checks not just that a resolver is alive but that the
      # split-horizon rewrite actually answers, whose silent failure hits only
      # a subset of the clients.
      - name: CoreDNS (Cluster)
        group: DNS
        url: "10.43.0.10"
        interval: 60s
        dns:
          query-name: "argocd.elmstreet79.de"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[BODY] == 192.168.2.250"

      - name: Blocky (Cluster)
        group: DNS
        url: "192.168.2.253"
        interval: 60s
        dns:
          query-name: "argocd.elmstreet79.de"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[BODY] == 192.168.2.250"

      - name: Blocky (LXC pve)
        group: DNS
        url: "192.168.2.254"
        interval: 60s
        dns:
          query-name: "argocd.elmstreet79.de"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[BODY] == 192.168.2.250"

      # The v6 side, queried straight from the pod: the pod network is
      # dual-stack, so the ULA is reachable without the relay this used to need.
      # Both instances get their own check, because a v6 failure is invisible
      # everywhere else: the v4 endpoints above stay green while only clients
      # with a v6 resolver are dead.
      #
      # Brackets and an explicit port are required, the address is a literal.
      - name: Blocky Cluster (IPv6)
        group: DNS
        url: "[fd2e:9a71:c3b5::253]:53"
        interval: 60s
        dns:
          query-name: "argocd.elmstreet79.de"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[BODY] == 192.168.2.250"

      - name: Blocky LXC (IPv6)
        group: DNS
        url: "[fd2e:9a71:c3b5::254]:53"
        interval: 60s
        dns:
          query-name: "argocd.elmstreet79.de"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[BODY] == 192.168.2.250"

      # Checks not reachability but whether the blocklists are actually
      # loaded. With loading.strategy: fast Blocky starts even when no
      # download succeeds and then answers fully but unfiltered, which every
      # other DNS endpoint here would happily report as green.
      - name: Blocky Filter (Cluster)
        group: DNS
        url: "192.168.2.253"
        interval: 5m
        dns:
          query-name: "doubleclick.net"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[BODY] == 0.0.0.0"

      - name: Blocky Filter (LXC pve)
        group: DNS
        url: "192.168.2.254"
        interval: 5m
        dns:
          query-name: "doubleclick.net"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[BODY] == 0.0.0.0"

      # Counter-check from outside: does the public name still resolve (CNAME
      # to nebu2k.ipv64.net)? The address is dynamic, so only the RCODE.
      # Bewusst homeassistant und nicht www: www ist ein Cloudflare Worker und
      # bliebe gruen, auch wenn DynDNS laengst tot waere.
      - name: Cloudflare (oeffentlicher Record)
        group: DNS
        url: "1.1.1.1"
        interval: 5m
        dns:
          query-name: "homeassistant.elmstreet79.de"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
      - name: Uplink (1.1.1.1)
        group: Internet
        url: "tcp://1.1.1.1:443"
        interval: 60s
        conditions:
          - "[CONNECTED] == true"

      - name: haushelden-service.de
        group: Internet
        url: "https://haushelden-service.de"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"

      - name: peters.club
        group: Internet
        url: "https://peters.club"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"

      - name: homeworx.solutions
        group: Internet
        url: "https://homeworx.solutions"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"

      - name: seb-it.com
        group: Internet
        url: "https://seb-it.com"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
      # Domain expiry (RDAP/WHOIS) in its own group, so a cranky WHOIS answer
      # does not turn the site above red. Gatus allows no interval below 5m
      # here anyway and daily is plenty.
      #
      # NO .de domains: DENIC publishes no expiry date, so Gatus answers
      # "domain extension de does not have an expiration date" permanently.
      # That would be an endpoint which can never go green.
      - name: peters.club
        group: Domains
        url: "https://peters.club"
        interval: 12h
        conditions:
          - "[DOMAIN_EXPIRATION] > 720h"

      - name: homeworx.solutions
        group: Domains
        url: "https://homeworx.solutions"
        interval: 12h
        conditions:
          - "[DOMAIN_EXPIRATION] > 720h"

      - name: seb-it.com
        group: Domains
        url: "https://seb-it.com"
        interval: 12h
        conditions:
          - "[DOMAIN_EXPIRATION] > 720h"
