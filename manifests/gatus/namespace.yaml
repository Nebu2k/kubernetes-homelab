apiVersion: v1
kind: Namespace
metadata:
  name: gatus
  labels:
    # dns-v6-relay needs hostNetwork, which the cluster-wide PodSecurity
    # "baseline" forbids: without this label the pod is rejected while gatus
    # itself starts normally, which is exactly the silent failure the relay
    # was built against.
    #
    # As in manifests/readsb/namespace.yaml this sits on the namespace and not
    # in talos/talconfig.yaml: the condition belongs to the pod, and a change
    # there reboots the control plane.
    pod-security.kubernetes.io/enforce: privileged
