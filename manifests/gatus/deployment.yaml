apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: gatus
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"

      # CoreDNS ist gewollt: nur damit greift der Split-Horizon-Rewrite und die
      # Checks auf *.elmstreet79.de laufen ueber Traefik. ndots: 1, damit
      # externe Namen (haushelden-service.de) nicht erst die Search-Domains
      # durchlaufen muessen.
      dnsConfig:
        options:
          - name: ndots
            value: "1"

      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.36.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: GATUS_CONFIG_PATH
              value: "/config/config.yaml"

          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
