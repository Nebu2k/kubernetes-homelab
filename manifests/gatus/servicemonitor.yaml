# Gatus writes its results as Prometheus metrics (metrics: true in its
# config). Alerting happens in the "gatus" group of
# manifests/kube-prometheus-stack/prometheus-rules.yaml so there is ONE path
# (Alertmanager -> SNS).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
