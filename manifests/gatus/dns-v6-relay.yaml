# DNS relay so Gatus can check the resolvers over IPv6.
#
# The pod network is deliberately IPv4-only, so a query from the gatus pod to
# a ULA fails immediately with "network unreachable" regardless of whether the
# resolver is alive. Real v6 exists only in the host network, where the nodes
# sit in the manual ULA fd2e:9a71:c3b5::/64 via SLAAC.
#
# This pod therefore runs with hostNetwork and forwards a v4 query on port
# 5354 unchanged to the v6 upstream. Gatus queries the relay through an
# ordinary ClusterIP service and the v6 hop happens for real on the LAN. That
# catches what would otherwise fail silently: if the LXC loses its static ULA
# (e.g. MLD snooping without a querier on vmbr0) all v4 checks stay green and
# only clients with a v6 resolver are dead.
#
# Only the LXC on pve has a v6 address, hence exactly ONE upstream per port.
#
# If the relay itself fails the Gatus endpoint goes red without DNS being
# broken. A concurrent KubeDeploymentReplicasMismatch tells the two apart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-v6-relay
  namespace: gatus
  labels:
    app.kubernetes.io/name: dns-v6-relay
data:
  Corefile: |
    .:5354 {
        errors
        health :8154
        ready :8155

        # NO cache plugin: every Gatus query must actually reach the upstream,
        # otherwise the check measures the relay's memory.
        #
        # max_fails 0 disables upstream ejection. Otherwise forward remembers
        # "host down" after a few timeouts and answers SERVFAIL without
        # retrying, keeping the check red long after the resolver returned.
        forward . [fd2e:9a71:c3b5::16]:53 {
            max_fails 0
        }
    }

    # Second port for the Blocky LXC. A separate port rather than a second
    # upstream in the same block: forward would alternate between them and the
    # check would never know which resolver answered, so a dead one would stay
    # green. No own health/ready, those plugins may appear once per server
    # block and test the process anyway.
    .:5355 {
        errors

        forward . [fd2e:9a71:c3b5::254]:53 {
            max_fails 0
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-v6-relay
  namespace: gatus
  labels:
    app.kubernetes.io/name: dns-v6-relay
spec:
  replicas: 1
  # Recreate rather than RollingUpdate: with hostNetwork two pods would
  # briefly contend for host port 5354.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-v6-relay
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: dns-v6-relay
    spec:
      # The entire point of this pod. Both worker nodes sit in the ULA, so it
      # may move between them.
      hostNetwork: true
      # The relay resolves no names (its upstream is an IP literal), and
      # ClusterFirst would be misleading with hostNetwork anyway.
      dnsPolicy: Default

      nodeSelector:
        node-role.kubernetes.io/worker: "worker"

      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.6
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 5354
              protocol: UDP
            - name: dns-tcp
              containerPort: 5354
              protocol: TCP
            - name: blocky-udp
              containerPort: 5355
              protocol: UDP
            - name: blocky-tcp
              containerPort: 5355
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true

          livenessProbe:
            httpGet:
              path: /health
              port: 8154
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8155
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # Not needed on port 5354, but the coredns binary carries it as
              # a file capability: outside the bounding set the kernel already
              # refuses the exec with "operation not permitted".
              add: ["NET_BIND_SERVICE"]

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

      volumes:
        - name: config
          configMap:
            name: dns-v6-relay
---
apiVersion: v1
kind: Service
metadata:
  name: dns-v6-relay
  namespace: gatus
  labels:
    app.kubernetes.io/name: dns-v6-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dns-v6-relay
  ports:
    - name: dns-udp
      port: 5354
      targetPort: 5354
      protocol: UDP
    - name: dns-tcp
      port: 5354
      targetPort: 5354
      protocol: TCP
    - name: blocky-udp
      port: 5355
      targetPort: 5355
      protocol: UDP
    - name: blocky-tcp
      port: 5355
      targetPort: 5355
      protocol: TCP
