# Der Scanner-Share des UniFi-NAS wird direkt als paperless-Consume-Verzeichnis
# gemountet, ueber csi-driver-smb. Kein privileged-Container im Anwendungs-Pod,
# kein Eigenbau-Image und keine Kopie ueber ein Longhorn-Zwischenvolume.
# Paperless raeumt den Share selbst auf und loescht konsumierte Dateien.
#
# Statisches PV (kein StorageClass-Provisioning): der Share existiert bereits
# und wir wollen genau sein Wurzelverzeichnis, nicht ein pro-PV angelegtes
# Unterverzeichnis.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-consume-smb
spec:
  capacity:
    # Bei SMB bedeutungslos, das Feld ist aber Pflicht.
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  # Retain: das PV zeigt auf echte Daten auf dem NAS. Ein geloeschtes PVC darf
  # hier niemals irgendetwas anfassen.
  persistentVolumeReclaimPolicy: Retain
  # Leerer String = kein StorageClass, sonst wuerde der Default-Provisioner
  # das PVC an sich reissen.
  storageClassName: ""
  mountOptions:
    - vers=3.0
    - uid=1000
    - gid=1000
    - dir_mode=0770
    - file_mode=0660
    # Upstream-Empfehlung: manche NAS liefern doppelte Inode-Nummern, was zu
    # Datenkorruption fuehren kann.
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    # Muss clusterweit eindeutig sein.
    volumeHandle: paperless-consume-smb
    volumeAttributes:
      source: //192.168.2.6/scans
    # Keys username + password, genau so erwartet der Treiber sie.
    nodeStageSecretRef:
      name: smb-credentials
      namespace: paperless-ngx
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume-smb
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteMany
  # Bindet fest an das PV oben, nicht ueber einen Selector.
  volumeName: paperless-consume-smb
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
