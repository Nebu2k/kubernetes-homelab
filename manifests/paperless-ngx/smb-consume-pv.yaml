# The UniFi NAS scanner share is mounted directly as the paperless consume
# directory through csi-driver-smb: no privileged container in the application
# pod, no custom image and no copy through an intermediate Longhorn volume.
# Paperless cleans up the share itself and deletes consumed files.
#
# A static PV rather than StorageClass provisioning: the share already exists
# and we want exactly its root, not a per-PV subdirectory.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-consume-smb
spec:
  capacity:
    # Meaningless for SMB, but the field is mandatory.
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  # Retain: the PV points at real data on the NAS, so a deleted PVC must never
  # touch anything here.
  persistentVolumeReclaimPolicy: Retain
  # Empty string means no StorageClass, otherwise the default provisioner
  # would claim the PVC.
  storageClassName: ""
  mountOptions:
    - vers=3.0
    - uid=1000
    - gid=1000
    - dir_mode=0770
    - file_mode=0660
    # Upstream recommendation: some NAS devices return duplicate inode
    # numbers, which can corrupt data.
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    # Must be unique cluster-wide.
    volumeHandle: paperless-consume-smb
    volumeAttributes:
      source: //192.168.2.6/scans
    # Keys username + password, exactly as the driver expects them.
    nodeStageSecretRef:
      name: smb-credentials
      namespace: paperless-ngx
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume-smb
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteMany
  # Binds directly to the PV above rather than through a selector.
  volumeName: paperless-consume-smb
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
