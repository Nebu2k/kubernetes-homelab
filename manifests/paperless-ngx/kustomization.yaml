apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless-ngx
resources:
  - namespace.yaml
  - pvc.yaml
  # PVs for the Longhorn volumes restored from the NAS backup; why they belong
  # in git is explained in the header of pv.yaml.
  - pv.yaml
  # The CIFS consume directory, not a Longhorn volume.
  - smb-consume-pv.yaml
  - db-pvc.yaml
  - postgresql.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - paperless-secrets-sealed.yaml
  - smb-credentials-sealed.yaml
  - backup-cronjob.yaml
  - s3-backup-credentials-sealed.yaml
  - networkpolicy.yaml