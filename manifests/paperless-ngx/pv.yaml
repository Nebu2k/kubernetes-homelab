# PVs for the Longhorn volumes restored from the NAS backup. Why this is
# needed and how the restore works is written out once in
# manifests/ripe-atlas/pv.yaml and as a recipe in talos/README.md.
#
# Not in here: paperless-consume-smb, which is a CIFS share rather than a
# Longhorn volume and has its own PV in smb-consume-pv.yaml.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-data
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: paperless-data
    namespace: paperless-ngx
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: paperless-data
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
