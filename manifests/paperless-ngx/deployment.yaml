apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
      app: paperless-ngx
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: paperless-ngx
        app: paperless-ngx
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      initContainers:
      - name: fix-permissions
        # consume is deliberately absent: it is a CIFS mount whose ownership
        # comes from the uid/gid mount options in the PV. chown on it fails
        # with "Operation not permitted" and would block the pod start.
        image: busybox:1.38.0
        command:
        - sh
        - -c
        - |
          chown -R 1000:1000 /usr/src/paperless/data /usr/src/paperless/media /usr/src/paperless/export
          chmod -R 755 /usr/src/paperless/data /usr/src/paperless/media /usr/src/paperless/export
        volumeMounts:
        - name: data
          mountPath: /usr/src/paperless/data
        - name: media
          mountPath: /usr/src/paperless/media
        - name: export
          mountPath: /usr/src/paperless/export
      containers:
      - name: paperless-ngx
        image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: PAPERLESS_TIME_ZONE
          value: "Europe/Berlin"
        - name: PAPERLESS_OCR_LANGUAGE
          value: "deu+eng"
        - name: PAPERLESS_OCR_LANGUAGES
          value: "deu eng"
        - name: PAPERLESS_URL
          value: "https://paperless.elmstreet79.de"
        - name: PAPERLESS_ALLOWED_HOSTS
          value: "*"
        - name: PAPERLESS_CORS_ALLOWED_HOSTS
          value: "https://paperless.elmstreet79.de"
        - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
          value: "https://paperless.elmstreet79.de"
        # No PAPERLESS_TRUSTED_PROXIES. Once set, python-ipware requires at
        # least one more X-Forwarded-For entry than the list has, but Traefik
        # sets exactly one, so the list can never be satisfied and the log says
        # "Unable to determine IP address". Left empty, ipware takes the first
        # XFF entry, which here is the real client: Traefik runs without
        # forwardedHeaders.trustedIPs and overwrites incoming X-Forwarded-*
        # headers instead of appending to them.
        #
        # allauth's proxy count would otherwise derive from that list's length
        # and fall to 0, putting every client into the same rate-limit bucket.
        # Hence it is set explicitly rather than as a side effect.
        - name: PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT
          value: "1"
        - name: PAPERLESS_USE_X_FORWARD_HOST
          value: "true"
        - name: PAPERLESS_USE_X_FORWARD_PORT
          value: "true"
        
        - name: PAPERLESS_REDIS
          value: "redis://redis:6379"
        
        # Must be explicit. Paperless still derives the engine from the
        # presence of PAPERLESS_DBHOST as a fallback, but does not rely on it.
        - name: PAPERLESS_DBENGINE
          value: "postgresql"
        - name: PAPERLESS_DBHOST
          value: "postgresql"
        - name: PAPERLESS_DBPORT
          value: "5432"
        - name: PAPERLESS_DBNAME
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: POSTGRES_DB
        - name: PAPERLESS_DBUSER
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: POSTGRES_USER
        - name: PAPERLESS_DBPASS
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: POSTGRES_PASSWORD
        
        - name: PAPERLESS_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: paperless-secrets
              key: PAPERLESS_ADMIN_USER
        - name: PAPERLESS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: paperless-secrets
              key: PAPERLESS_ADMIN_PASSWORD
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: paperless-secrets
              key: PAPERLESS_SECRET_KEY
        
        # Consume sits on CIFS, where inotify does not work, so polling
        # instead of native events. Called PAPERLESS_CONSUMER_POLLING until v2.
        - name: PAPERLESS_CONSUMER_POLLING_INTERVAL
          value: "30"
        # v3 lets duplicates through by default and only marks them in the UI.
        # This keeps the old behaviour of rejecting them.
        - name: PAPERLESS_CONSUMER_DELETE_DUPLICATES
          value: "true"
        - name: PAPERLESS_CONSUMER_RECURSIVE
          value: "true"
        - name: PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS
          value: "true"
        # No PAPERLESS_CONSUMER_IGNORE_PATTERNS: the NAS artefacts (.DS_Store,
        # ._*, desktop.ini, @eaDir) are all in the built-in defaults.

        # Separates "run OCR" from "produce an archive file". "always" means
        # every document gets a searchable archive file.
        - name: PAPERLESS_ARCHIVE_FILE_GENERATION
          value: "always"
        - name: PAPERLESS_FILENAME_FORMAT
          value: "{{ created_year }}/{{ correspondent }}/{{ created }}-{{ title }}"
        - name: PAPERLESS_TIKA_ENABLED
          value: "false"
        - name: PAPERLESS_ENABLE_HTTP_REMOTE_USER
          value: "false"
        
        volumeMounts:
        - name: data
          mountPath: /usr/src/paperless/data
        - name: media
          mountPath: /usr/src/paperless/media
        - name: export
          mountPath: /usr/src/paperless/export
        - name: consume
          mountPath: /usr/src/paperless/consume
        
        resources:
          requests:
            cpu: 200m
            memory: 2Gi
          limits:
            memory: 4Gi
        
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      
      - name: s3-backup-sync
        image: amazon/aws-cli:2.36.25
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          
          echo "S3 Backup Sidecar started - monitoring /export/current directory"
          echo "S3 Versioning enabled - only changed files will create new versions"
          
          while true; do
            if [ -d "/export/current" ] && [ -n "$(ls -A /export/current 2>/dev/null)" ]; then
              echo "$(date): Found backup in /export/current, syncing to S3..."
              
              if aws s3 sync "/export/current" "s3://${S3_BUCKET_NAME}/paperless-backup/" \
                --region "${S3_REGION}" \
                --storage-class STANDARD_IA \
                --no-progress; then
                
                echo "$(date): Successfully synced to S3"
                echo "$(date): S3 Versioning automatically handles changed files - unchanged files not re-uploaded"
              else
                echo "$(date): ERROR: Failed to sync to S3"
              fi
            fi
            
            # The export runs once daily at 02:00, hourly is enough.
            sleep 3600
          done
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-backup-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-backup-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: s3-backup-credentials
              key: S3_BUCKET_NAME
        - name: S3_REGION
          valueFrom:
            secretKeyRef:
              name: s3-backup-credentials
              key: S3_REGION
        volumeMounts:
        - name: export
          mountPath: /export
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-data
      - name: media
        persistentVolumeClaim:
          claimName: paperless-media
      - name: export
        persistentVolumeClaim:
          claimName: paperless-export
      # The scanner share directly, via csi-driver-smb. See smb-consume-pv.yaml.
      - name: consume
        persistentVolumeClaim:
          claimName: paperless-consume-smb
