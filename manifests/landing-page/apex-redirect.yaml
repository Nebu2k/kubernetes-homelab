---
# Redirects the bare apex domain to www with a 301. The wildcard certificate
# covers the apex as well (its dnsNames include it), so TLS works through the
# TLSStore default.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: apex-to-www
  namespace: landing-page
spec:
  redirectRegex:
    regex: '^https?://elmstreet79\.de/(.*)'
    replacement: 'https://www.elmstreet79.de/${1}'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apex-redirect
  namespace: landing-page
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`elmstreet79.de`)
      kind: Rule
      middlewares:
        - name: apex-to-www
      services:
        # The CRD requires a service; the redirect middleware runs before it
        # and the backend is never reached.
        - name: landing-page
          port: 80
  tls: {}
