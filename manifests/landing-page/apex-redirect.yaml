---
# Leitet die nackte Apex-Domain per 301 auf www um.
# Das Wildcard-Cert deckt `elmstreet79.de` mit ab (dnsNames enthält den Apex),
# TLS greift also über den TLSStore-Default.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: apex-to-www
  namespace: landing-page
spec:
  redirectRegex:
    regex: '^https?://elmstreet79\.de/(.*)'
    replacement: 'https://www.elmstreet79.de/${1}'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apex-redirect
  namespace: landing-page
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`elmstreet79.de`)
      kind: Rule
      middlewares:
        - name: apex-to-www
      services:
        # Service ist im CRD Pflicht; die Redirect-Middleware greift davor,
        # der Backend wird nie erreicht.
        - name: landing-page
          port: 80
  tls: {}
