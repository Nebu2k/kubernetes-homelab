---
deployment:
  replicas: 2

nodeSelector:
  node-role.kubernetes.io/worker: "worker"

# Beide Replicas sind vorher auf k3s-worker-1 gelandet, weil nichts sie
# auseinanderhielt. Mit externalTrafficPolicy: Local (siehe service unten)
# kuendigt MetalLB die .250 nur noch von Nodes an, auf denen ein bereiter
# Traefik-Pod laeuft. Ohne Spreizung waere worker-1 damit ein Single Point
# of Failure geworden: bei Ausfall haette es erst einen Pod-Start auf
# prodesk gebraucht, bevor die VIP ueberhaupt wieder angekuendigt wird.
topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

# Muss zur harten Spreizung oben passen. Der Chart-Default ist
# maxUnavailable: 0 / maxSurge: 1, wuerde beim Rollout also einen dritten
# Pod hochziehen. Bei zwei Replicas auf zwei zulaessigen Nodes verletzt der
# die maxSkew und bliebe Pending: das Update haengt fest. Andersherum
# ersetzt der Rollout je einen Pod an Ort und Stelle, ohne dritten Platz.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# Schuetzt den Ingress bei freiwilligen Stoerungen, vor allem beim Node-Drain
# durch den system-upgrade-controller. Ohne PDB darf ein Drain beide Pods
# gleichzeitig raeumen, und mit externalTrafficPolicy: Local haette dann kein
# Node mehr einen bereiten Endpoint: MetalLB kuendigt die .250 nicht mehr an,
# der komplette Ingress ist weg.
#
# minAvailable statt maxUnavailable, weil die Zusage dann an der absoluten Zahl
# haengt und nicht an replicas: bei einem versehentlichen Scale-Down auf 1
# blockiert der PDB den Drain, statt stillschweigend alles freizugeben.
#
# Kein Deadlock mit der harten Spreizung oben: der geraeumte Pod bleibt Pending,
# bis der Node zurueck ist (der andere Node hat wegen maxSkew keinen Platz).
# Der PDB verlangt nur einen laufenden Pod, und den gibt es die ganze Zeit.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# CRD providers for Middleware and ServersTransport
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
  kubernetesIngress:
    enabled: true

# MetalLB LoadBalancer IP.
# MUSS als Annotation gesetzt werden. Das Traefik-Chart kennt keinen
# service.loadBalancerIP-Wert, Helm hat den Key bisher stillschweigend
# ignoriert (im gerenderten Service stand nie eine IP). Traefik bekam die
# .250 nur deshalb, weil es der einzige LoadBalancer im Cluster ist und
# MetalLB die erste freie Adresse aus dem Pool .250-.253 vergibt.
# An der .250 haengen der UniFi-Portforward (80/443) und der
# Split-Horizon-Wildcard *.elmstreet79.de, sie darf also nicht wandern.
# metallb.io/ ist der aktuelle Prefix, metallb.universe.tf/ ist seit 0.14.9
# deprecated.
service:
  annotations:
    metallb.io/loadBalancerIPs: "192.168.2.250"
  # Ab Chart 41 liegt type unter spec, das fruehere top-level service.type
  # gibt es nicht mehr.
  spec:
    type: LoadBalancer
    # Ohne das SNAT-tet kube-proxy jedes eingehende Paket auf das
    # CNI-Gateway des Nodes, auf dem Traefik laeuft. Traefik sah dadurch
    # clusterweit nur 10.42.6.1 statt echter Clients, und jedes Backend
    # hinter dem Ingress bekam dieselbe Adresse in X-Forwarded-For. Mit
    # Local reicht MetalLB (L2) die Quell-IP unveraendert durch.
    #
    # Preis: die .250 wird nur noch von Nodes mit einem bereiten
    # Traefik-Pod angekuendigt. Deshalb die topologySpreadConstraints oben,
    # damit das nicht auf einen einzelnen Node zusammenfaellt.
    externalTrafficPolicy: Local

# Prometheus metrics
metrics:
  prometheus:
    enabled: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true

# Logs. Chart 41 folgt der Traefik-Syntax: aus logs.general wurde log,
# aus logs.access wurde accessLog.
log:
  level: INFO
accessLog:
  enabled: true

# Frueher stand hier ein globalArguments-Block mit --api.dashboard=true,
# --ping=true und einem readTimeout von 24h. Der war nachweislich
# wirkungslos: das Chart kennt globalArguments nicht mehr (seit dem Wechsel
# auf global.xx), und im gerenderten wie im laufenden Pod tauchte keines
# der drei Argumente aus diesem Block auf.
# api.dashboard und ping setzt das Chart ohnehin selbst.
# Der readTimeout war damit nie aktiv, Traefik laeuft auf seinem Default
# von 60s. Am 2026-08-04 entschieden, das so zu lassen: das Cluster lief
# jahrelang auf 60s ohne ein einziges Problem, ein Timeout ohne Leidensdruck
# ist keine Verbesserung. Falls doch mal noetig (Kandidaten: HA-Websockets,
# Plex), waere der native Key in v41
# ports.websecure.transport.respondingTimeouts.readTimeout.

# Dashboard
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.elmstreet79.de`)
    entryPoints: ["websecure"]

# Ports
ports:
  web:
    port: 80
    exposedPort: 80
    expose:
      default: true
  websecure:
    port: 443
    exposedPort: 443
    expose:
      default: true
    http3:
      enabled: false
    # Ab Chart 41 liegt tls unter http.
    http:
      tls:
        enabled: true
  metrics:
    port: 9100
    expose:
      default: false
