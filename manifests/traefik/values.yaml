---
deployment:
  replicas: 2

nodeSelector:
  node-role.kubernetes.io/worker: "worker"

# Without this both replicas land on the same node. With
# externalTrafficPolicy: Local MetalLB only announces .250 from nodes running
# a ready Traefik pod, so that single node would be a point of failure.
topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

# Must match the hard spread above. The chart default would pull up a third
# pod during a rollout, which violates maxSkew and stays Pending: the update
# deadlocks. This way each pod is replaced in place.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# Protects the ingress during voluntary disruptions, above all a node drain.
# Without the PDB a drain may evict both pods at once, and with
# externalTrafficPolicy: Local no node would have a ready endpoint left:
# MetalLB stops announcing .250 and the whole ingress is gone.
#
# minAvailable rather than maxUnavailable, so the guarantee is an absolute
# number instead of a fraction of replicas.
#
# No deadlock with the hard spread above: the evicted pod stays Pending until
# its node returns, and the PDB only demands one running pod, which exists
# throughout.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
  kubernetesIngress:
    enabled: true

# MUST be an annotation: the Traefik chart has no service.loadBalancerIP value
# and Helm silently ignores the key, leaving the rendered service without an
# address. metallb.io/ is the current prefix, metallb.universe.tf/ has been
# deprecated since 0.14.9.
#
# The UniFi port forward (80/443) and the split-horizon wildcard both point at
# .250, so it must not move and is requested explicitly rather than left to
# MetalLB's allocation order.
service:
  annotations:
    metallb.io/loadBalancerIPs: "192.168.2.250"
  # Since chart 41 type lives under spec, there is no top-level service.type.
  spec:
    type: LoadBalancer
    # Without this kube-proxy SNATs every incoming packet to the CNI gateway
    # of Traefik's node, so Traefik and every backend behind the ingress see
    # one single address in X-Forwarded-For. With Local, MetalLB (L2) passes
    # the source IP through unchanged.
    #
    # The price is that .250 is only announced from nodes with a ready Traefik
    # pod, hence the topologySpreadConstraints above.
    externalTrafficPolicy: Local

metrics:
  prometheus:
    enabled: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true

# Chart 41 follows Traefik's own syntax: logs.general became log,
# logs.access became accessLog.
log:
  level: INFO
accessLog:
  enabled: true

# NO globalArguments block. Since the move to global.xx the chart no longer
# knows the key and swallows it silently, so it appears neither in the
# rendered manifest nor in the running pod. api.dashboard and ping are set by
# the chart anyway.
#
# Traefik therefore runs on its 60s readTimeout default. If that ever needs
# changing, the native key in v41 is
# ports.websecure.transport.respondingTimeouts.readTimeout.

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.elmstreet79.de`)
    entryPoints: ["websecure"]

ports:
  web:
    port: 80
    exposedPort: 80
    expose:
      default: true
  websecure:
    port: 443
    exposedPort: 443
    expose:
      default: true
    http3:
      enabled: false
    # Since chart 41 tls lives under http.
    http:
      tls:
        enabled: true
  metrics:
    port: 9100
    expose:
      default: false
