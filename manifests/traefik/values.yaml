---
deployment:
  replicas: 2

nodeSelector:
  node-role.kubernetes.io/worker: "worker"

# CRD providers for Middleware and ServersTransport
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
  kubernetesIngress:
    enabled: true

# MetalLB LoadBalancer IP.
# MUSS als Annotation gesetzt werden. Das Traefik-Chart kennt keinen
# service.loadBalancerIP-Wert, Helm hat den Key bisher stillschweigend
# ignoriert (im gerenderten Service stand nie eine IP). Traefik bekam die
# .250 nur deshalb, weil es der einzige LoadBalancer im Cluster ist und
# MetalLB die erste freie Adresse aus dem Pool .250-.253 vergibt.
# An der .250 haengen der UniFi-Portforward (80/443) und der
# Split-Horizon-Wildcard *.elmstreet79.de, sie darf also nicht wandern.
# metallb.io/ ist der aktuelle Prefix, metallb.universe.tf/ ist seit 0.14.9
# deprecated.
service:
  annotations:
    metallb.io/loadBalancerIPs: "192.168.2.250"
  # Ab Chart 41 liegt type unter spec, das fruehere top-level service.type
  # gibt es nicht mehr.
  spec:
    type: LoadBalancer

# Prometheus metrics
metrics:
  prometheus:
    enabled: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true

# Logs. Chart 41 folgt der Traefik-Syntax: aus logs.general wurde log,
# aus logs.access wurde accessLog.
log:
  level: INFO
accessLog:
  enabled: true

# Frueher stand hier ein globalArguments-Block mit --api.dashboard=true,
# --ping=true und einem readTimeout von 24h. Der war nachweislich
# wirkungslos: das Chart kennt globalArguments nicht mehr (seit dem Wechsel
# auf global.xx), und im gerenderten wie im laufenden Pod tauchte keines
# der drei Argumente aus diesem Block auf.
# api.dashboard und ping setzt das Chart ohnehin selbst.
# Der readTimeout war damit nie aktiv, Traefik laeuft auf seinem Default
# von 60s. Bewusst NICHT mitmigriert, damit dieses Upgrade das Verhalten
# nicht aendert. Siehe ROADMAP.md, ob wir die 24h ueberhaupt wollen.

# Dashboard
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.elmstreet79.de`)
    entryPoints: ["websecure"]

# Ports
ports:
  web:
    port: 80
    exposedPort: 80
    expose:
      default: true
  websecure:
    port: 443
    exposedPort: 443
    expose:
      default: true
    http3:
      enabled: false
    # Ab Chart 41 liegt tls unter http.
    http:
      tls:
        enabled: true
  metrics:
    port: 9100
    expose:
      default: false
