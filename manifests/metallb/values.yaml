controller:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

speaker:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"
  # FRR sidecar in the speaker, the old scheme. Stays off.
  frr:
    enabled: false

# FRR as a standalone DaemonSet, a separate switch since chart 0.16 and ON by
# default. NOT the same as speaker.frr above: left unset, metallb-frr-k8s runs
# on every node plus a statuscleaner deployment even with speaker.frr.enabled
# false. This is plain layer 2 without BGP, so FRR is useless.
frrk8s:
  enabled: false

# Kubernetes labels control-plane nodes with
# node.kubernetes.io/exclude-from-external-load-balancers and MetalLB honours
# it. Here every node is control plane, so without this NOBODY announces: the
# service gets its address, ArgoCD reports Healthy, and still no node answers
# the ARP. Visible only as an empty "kubectl get servicel2status -A".
#
# Ignoring the label beats deleting it on the nodes: Talos would set it again
# on the next reconcile, and it does not fit allowSchedulingOnControlPlanes,
# because these nodes ARE the workers.
speaker:
  ignoreExcludeLB: true
