controller:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

speaker:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"
  # FRR-Sidecar im Speaker, altes Schema. Bleibt aus.
  frr:
    enabled: false

# FRR als eigenständiges DaemonSet, seit Chart 0.16 ein separater Schalter und
# per Default AN. Das ist NICHT dasselbe wie speaker.frr oben: bleibt der hier
# ungesetzt, laufen metallb-frr-k8s auf jeder Node plus ein
# statuscleaner-Deployment, auch wenn speaker.frr.enabled false ist. Hier läuft
# reines Layer2 und kein BGP, FRR ist nutzlos.
frrk8s:
  enabled: false

# Kubernetes setzt auf Control-Plane-Nodes
# node.kubernetes.io/exclude-from-external-load-balancers.
# MetalLB respektiert das Label und kuendigt von solchen Nodes nichts an. Hier
# sind alle Nodes Control-Plane, also kuendigt sonst NIEMAND an: der Service
# bekommt seine IP, ArgoCD meldet Healthy, und trotzdem beantwortet kein Node
# das ARP. Sichtbar nur an einem leeren "kubectl get servicel2status -A".
#
# Das Label zu ignorieren ist richtiger, als es an den Nodes zu loeschen: Talos
# setzt es beim naechsten Reconcile ohnehin wieder, und es passt nicht zu
# allowSchedulingOnControlPlanes, denn diese Nodes SIND die Worker.
speaker:
  ignoreExcludeLB: true
