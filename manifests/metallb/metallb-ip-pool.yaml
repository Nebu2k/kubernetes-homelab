---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-pool
  namespace: metallb-system
spec:
  addresses:
    # Ein durchgehender Bereich, seit der Talos-VIP am 2026-08-09 von der .248
    # auf die .29 gezogen ist. Vorher musste der Pool um die .248 herumgebaut
    # werden (.240-.247 plus .249-.253), sonst haette MetalLB irgendwann den
    # Kubernetes-Endpoint des Clusters an einen Service vergeben.
    #
    # Die .250 traegt Traefik (UniFi-Portforward auf 80/443 und der
    # Split-Horizon-Wildcard *.elmstreet79.de). Sie ist in
    # manifests/traefik/values.yaml ausdruecklich angefordert und nicht der
    # Vergabereihenfolge ueberlassen: bei einer Adresse, an der ein
    # Portforward haengt, muss das fest sein.
    #
    # ACHTUNG bei allem ab .249: die UniFi-Regel fuer die beiden Gast-VLANs
    # erlaubt .249-.254. Was MetalLB von dort vergibt, ist aus den Gast-VLANs
    # erreichbar, aus dem vorderen Teil dagegen nicht. MetalLB vergibt der
    # Reihe nach, neue Dienste landen also vorn; hierher kommt nur, was seine
    # Adresse explizit anfordert. Bei genau so einem Dienst zweimal hinsehen.
    - 192.168.2.240-192.168.2.253
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-pool
