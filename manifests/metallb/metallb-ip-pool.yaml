---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-pool
  namespace: metallb-system
spec:
  addresses:
    # One contiguous range. The cluster VIP lies outside it on purpose (see
    # talos/talconfig.yaml), otherwise the pool would need a hole so MetalLB
    # cannot hand the Kubernetes API to a service.
    #
    # .250 carries Traefik and .253 Blocky, both requested explicitly in their
    # own manifests rather than left to allocation order: a port forward and a
    # DHCP setting point at them, so they must not move. The neighbouring .254
    # is the second Blocky instance on pve and lies outside the pool.
    #
    # Careful with everything from .249 up: the UniFi rule grants the two
    # guest VLANs .249-.254, so whatever MetalLB allocates from there is
    # reachable from them while the lower part is not. MetalLB allocates in
    # order, so new services land at the front and only explicit requests end
    # up here.
    - 192.168.2.240-192.168.2.253
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-pool
