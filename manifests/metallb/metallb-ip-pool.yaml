---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-pool
  namespace: metallb-system
spec:
  addresses:
    # Die .250 ist am 2026-08-09 an das Talos-Cluster abgegeben worden, siehe
    # clusters/talos/metallb/metallb-ip-pool.yaml. Sie muss hier RAUS, bevor sie
    # dort dazukommt: beide Cluster haengen im selben L2-Segment, und zwei
    # Speaker auf derselben Adresse heisst ARP-Flattern statt Umzug.
    #
    # IPv4-only. Kein v6-Pool: Traefik ist SingleStack v4 und die ISP-GUA
    # (2a00:1e:...) rotiert, deshalb intern ULA.
    - 192.168.2.251-192.168.2.253
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-pool
  # interfaces removed to auto-detect on all nodes (ens18, eno1, eth0)
