---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  forward.override: |
    forward . 1.1.1.1 2606:4700:4700::1111  # Cloudflare IPv4 + IPv6
  # Split-Horizon: interne Auflösung für *.elmstreet79.de auf Traefik (192.168.2.250).
  # Spiegelt den AdGuard-Wildcard-Rewrite, damit auch Cluster-Pods (z.B. die Homepage)
  # die Dienste über die Ingress-Hosts erreichen, statt am Public-DNS zu scheitern
  # (intern-only-Hosts sind extern NXDOMAIN). Self-contained, unabhängig von AdGuard.
  elmstreet79.server: |
    elmstreet79.de:53 {
        # Nur einzelne Sub-Labels matchen (^[^.]+): argocd.elmstreet79.de JA,
        # github.com.elmstreet79.de NEIN. Sonst fängt die Search-Domain-Expansion
        # der Pods (ndots:5 + search elmstreet79.de) JEDEN externen Host ab.
        template IN A {
            match "^[^.]+\.elmstreet79\.de\.$"
            answer "{{ .Name }} 60 IN A 192.168.2.250"
            fallthrough
        }
        template IN AAAA {
            match "^[^.]+\.elmstreet79\.de\.$"
            rcode NOERROR
            fallthrough
        }
        forward . 1.1.1.1 2606:4700:4700::1111
    }
