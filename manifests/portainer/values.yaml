# Portainer management UI values
service:
  type: ClusterIP  # Access via Ingress
# Single replica for homelab (HA not supported due to BoltDB)
replicaCount: 1

# Schedule only on worker nodes
nodeSelector:
  node-role.kubernetes.io/worker: "worker"

# Hier standen frueher "annotations" (Reloader) sowie "livenessProbe" und
# "readinessProbe" mit auf die Raspis abgestimmten Timings. Alle drei waren
# wirkungslos: das Portainer-Chart hardcodiert die Probes im
# Deployment-Template und kennt weder einen Probe- noch einen
# podAnnotations-Wert. Am laufenden Deployment standen entsprechend die
# Chart-Defaults (initialDelaySeconds 45 statt der gewuenschten 60) und keine
# Reloader-Annotation.
# Die Annotation haette ohnehin nichts bewirkt, Portainer mountet weder
# Secrets noch ConfigMaps. Entfernt, damit die Datei nicht laenger etwas
# behauptet, was nicht passiert.

# Persistent storage
persistence:
  enabled: true
  size: 1Gi
  storageClass: longhorn  # Use Longhorn for replicated storage

