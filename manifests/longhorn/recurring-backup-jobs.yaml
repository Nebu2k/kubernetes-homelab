# Die Zeiten sind gespreizt und concurrency steht ueberall auf 1: mehrere
# gleichzeitige Laeufe belasten etcd spuerbar.
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-daily
  namespace: longhorn-system
spec:
  cron: "0 1 * * *"
  task: "snapshot"
  retain: 7
  concurrency: 1
  groups:
    - snapshot
  labels: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup-daily
  namespace: longhorn-system
spec:
  cron: "0 8 * * *"
  task: "snapshot-cleanup"
  retain: 0
  concurrency: 2
  groups:
    - snapshot
  labels: {}
---
# Gibt freien Speicher an die NVMe zurueck.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim-weekly
  namespace: longhorn-system
spec:
  cron: "0 7 * * 0"
  task: "filesystem-trim"
  retain: 0
  concurrency: 1
  groups:
    - maintenance
  labels: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: "backup"
  retain: 7
  concurrency: 1
  groups:
    - backup
  labels: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: longhorn-system
spec:
  cron: "0 3 * * 0"
  task: "backup"
  retain: 4
  concurrency: 1
  groups:
    - backup
  labels: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-monthly
  namespace: longhorn-system
spec:
  cron: "0 4 1 * *"
  task: "backup"
  retain: 6
  concurrency: 1
  groups:
    - backup
  labels: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-yearly
  namespace: longhorn-system
spec:
  cron: "0 5 1 1 *"
  task: "backup"
  retain: 1
  concurrency: 1
  groups:
    - backup
  labels: {}
---
# Sichert nur die Longhorn-Konfiguration. volume-backup-policy=disabled ist
# Pflicht: sonst erzeugt jeder Lauf pro Volume zusaetzlich Snapshot und
# Volume-Backup, und die raeumt kein retain je auf.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: system-backup-daily
  namespace: longhorn-system
spec:
  cron: "0 6 * * *"
  task: "system-backup"
  retain: 7
  concurrency: 1
  parameters:
    volume-backup-policy: "disabled"
  labels: {}