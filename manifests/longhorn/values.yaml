# Longhorn distributed storage values
persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  defaultNodeSelector:
    enable: true
    selector: "storage"
  recurringJobSelector:
    enable: true
    jobList: '[{"name":"backup","isGroup":true},{"name":"snapshot","isGroup":true},{"name":"maintenance","isGroup":true}]'

# Backup-Target: SMB-Share direkt auf dem UniFi-NAS (192.168.2.6, 300 GB).
#
# Das NAS ist das einzige Backup-Ziel von Longhorn. Es gibt keine
# Offsite-Kopie der Volume-Backups: nach S3 gehen nur die etcd-Snapshots
# (manifests/etcd-backup/) und die anwendungseigenen Dumps
# (paperless-ngx, teslamate, Home Assistant).
defaultBackupStore:
    backupTarget: "cifs://192.168.2.6/longhorn_backup"
    backupTargetCredentialSecret: longhorn-nas-cifs-secret
# Default settings
defaultSettings:
  # Jede Node traegt ein Zonen-Label, gesetzt in talos/talconfig.yaml: "pve"
  # talos-cp-1, "blech" prodesk, "raspi5" der Pi. "false" zwingt Longhorn, die
  # zwei Repliken auf zwei Zonen zu verteilen.
  #
  # Ohne das genuegt Longhorn schon, dass die Repliken auf zwei verschiedenen
  # NODES liegen, und das waere hier zu wenig: zwei pve-VMs sind zwei Nodes,
  # aber eine einzige NVMe. Beide Repliken dort waeren keine Redundanz, nur
  # zwei Kopien auf demselben Datentraeger.
  #
  # Je Geraet eine Zone, nicht je Geraeteklasse: laegen prodesk und raspi5
  # zusammen in "blech", gaebe es nur zwei Zonen und damit zwangslaeufig immer
  # eine Replik auf pve. Mit drei Zonen kann Longhorn auch beide auf Blech
  # legen.
  replicaZoneSoftAntiAffinity: "false"
  defaultReplicaCount: "2"
  # RWX (ReadWriteMany) Support via NFS
  rwxVolumeFastFailover: "true"
  # Automatic replica rebalancing across nodes
  replicaAutoBalance: "best-effort"
  # Limit concurrent replica rebuilds per node to prevent overload (especially on Raspberry Pis)
  concurrentReplicaRebuildPerNodeLimit: "2"
  # Reduce backup concurrency to prevent overwhelming ARM nodes during nightly backups
  backupConcurrentLimit: "1"  # Default is 2, reduce to 1 to prevent raspi5 overload
  # Volume-Engines automatisch mit der Manager-Version mitziehen. Auf 0 bleiben
  # die Engines auf ihrer alten Version stehen, waehrend der Manager weiterlaeuft;
  # Longhorn erlaubt aber nur einen Minor-Schritt am Stueck (1.10 -> 1.11 ->
  # 1.12), und dann ist der naechste Schritt nicht mehr sauber abgedeckt.
  # 1 statt hoeher, gleiche Ruecksicht auf die ARM-Node wie oben.
  # Live-Upgrade greift nur bei gesunden Volumes ohne iSCSI-Frontend.
  concurrentAutomaticEngineUpgradePerNodeLimit: "1"
  concurrentVolumeBackupRestorePerNodeLimit: "2"  # Default is 5, reduce to 2
  # Do not block on replica availability when a node is drained.
  # "allow-if-replica-is-stopped" only handles replicas, not engines of attached
  # volumes. "always-allow" force-detaches volumes instead of holding the drain.
  # NOTE: this does NOT remove the instance-manager PodDisruptionBudgets, which
  # is what actually blocks a drain here: they sit at minAvailable: 1 /
  # disruptionsAllowed: 0. A `kubectl drain` on a storage node therefore still
  # needs the replicas evicted from the Longhorn UI first.
  nodeDrainPolicy: "always-allow"
  # Reclaim space from removed snapshots during filesystem-trim.
  # Without this, the weekly trim only releases free filesystem blocks but leaves
  # marked-removed snapshots on disk: high-churn volumes (Prometheus) bloat to
  # 10x their nominal size.
  removeSnapshotsDuringFilesystemTrim: "true"

# Disable preUpgrade hook (causes issues with ArgoCD)
preUpgradeChecker:
  jobEnabled: false
