persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  defaultNodeSelector:
    enable: true
    selector: "storage"
  recurringJobSelector:
    enable: true
    jobList: '[{"name":"backup","isGroup":true},{"name":"snapshot","isGroup":true},{"name":"maintenance","isGroup":true}]'

# SMB share on the UniFi NAS, Longhorn's only backup target. There is no
# offsite copy of the volume backups: only the etcd snapshots and the
# application-level dumps go to S3.
defaultBackupStore:
    backupTarget: "cifs://192.168.2.6/longhorn_backup"
    backupTargetCredentialSecret: longhorn-nas-cifs-secret
defaultSettings:
  # Every node carries a zone label set in talos/talconfig.yaml. "false"
  # forces Longhorn to spread the two replicas across two zones. Two different
  # NODES would not be enough here: two pve VMs are two nodes but one NVMe, so
  # both replicas there would be two copies on the same disk rather than
  # redundancy.
  #
  # One zone per device, not per device class: with prodesk and raspi5 sharing
  # a zone there would be only two, forcing one replica onto pve every time.
  replicaZoneSoftAntiAffinity: "false"
  defaultReplicaCount: "2"
  rwxVolumeFastFailover: "true"
  replicaAutoBalance: "best-effort"
  # Throttled so a rebuild or a nightly backup does not knock over raspi5.
  concurrentReplicaRebuildPerNodeLimit: "2"
  backupConcurrentLimit: "1"
  # Pull the volume engines along with the manager version. At 0 the engines
  # stay on their old version while the manager moves on, and since Longhorn
  # allows only one minor step at a time the next upgrade is no longer covered.
  # Live upgrade only applies to healthy volumes without an iSCSI frontend.
  concurrentAutomaticEngineUpgradePerNodeLimit: "1"
  concurrentVolumeBackupRestorePerNodeLimit: "2"
  # Do not block on replica availability when a node is drained.
  # "allow-if-replica-is-stopped" only handles replicas, not engines of attached
  # volumes. "always-allow" force-detaches volumes instead of holding the drain.
  # NOTE: this does NOT remove the instance-manager PodDisruptionBudgets, which
  # is what actually blocks a drain here: they sit at minAvailable: 1 /
  # disruptionsAllowed: 0. A `kubectl drain` on a storage node therefore still
  # needs the replicas evicted from the Longhorn UI first.
  nodeDrainPolicy: "always-allow"
  # Reclaim space from removed snapshots during filesystem-trim.
  # Without this, the weekly trim only releases free filesystem blocks but leaves
  # marked-removed snapshots on disk: high-churn volumes (Prometheus) bloat to
  # 10x their nominal size.
  removeSnapshotsDuringFilesystemTrim: "true"

# Disable preUpgrade hook (causes issues with ArgoCD)
preUpgradeChecker:
  jobEnabled: false
