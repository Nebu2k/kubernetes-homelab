# Identical to the chart's "longhorn" class except that the recurringJobSelector
# leaves out the "backup" and "snapshot" groups: for regenerable, constantly
# rewritten data (Prometheus TSDB) every retention point pins another full copy.
# A volume's group labels come from its class at creation time, so this is the
# only place where that survives a recreation; labels on a volumeClaimTemplate
# are ignored.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-nobackup
  annotations:
    # Parameters are immutable, a plain replace fails too. Force deletes and
    # recreates the class; existing PVs are unaffected.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  recurringJobSelector: '[{"name":"maintenance","isGroup":true}]'
  dataLocality: "disabled"
  nodeSelector: "storage"
  unmapMarkSnapChainRemoved: "ignored"
  disableRevisionCounter: "true"
  dataEngine: "v1"
