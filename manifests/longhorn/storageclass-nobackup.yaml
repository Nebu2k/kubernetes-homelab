# Identical to the chart's "longhorn" class except that the recurringJobSelector
# leaves out the "backup" group. A volume's group labels come from its class at
# creation time, so this is the only place where "deliberately not backed up"
# survives a recreation. Labels on a volumeClaimTemplate do NOT do it: the
# Prometheus volume was recreated by the Talos migration on 2026-08-09 and sat in
# the nightly backup two hours later, despite the template listing only snapshot
# and maintenance.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-nobackup
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  recurringJobSelector: '[{"name":"snapshot","isGroup":true},{"name":"maintenance","isGroup":true}]'
  dataLocality: "disabled"
  nodeSelector: "storage"
  unmapMarkSnapChainRemoved: "ignored"
  disableRevisionCounter: "true"
  dataEngine: "v1"
