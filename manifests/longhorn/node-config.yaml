---
# Longhorn Node Configuration
# Exclude low-storage nodes from replica scheduling

# Storage-capable nodes
#
# ACHTUNG, spec.disks ist auf diesem Node und auf raspi5 faktisch eingefroren.
# Nicht anfassen, ohne den Absatz hier gelesen zu haben.
#
# Beide Nodes tragen zwei Disk-Eintraege auf demselben Pfad /var/lib/longhorn/:
# den hier gepflegten und die default-disk-<fsid-hash>, die Longhorn beim ersten
# Start selbst anlegt. Longhorn laesst pro Dateisystem-ID nur einen gelten, der
# andere liegt auf Ready=False/DiskFilesystemChanged. Welcher gewinnt, ist
# Registrierungsreihenfolge: hier die automatische, auf raspi5 die von hier.
#
# Am 2026-08-08 versucht wegzuraeumen, drei Sackgassen, alle vom
# validator.longhorn.io-Webhook:
#
#  1. disks-Block ersatzlos streichen -> "Delete Disk ... Please disable the
#     disk and remove all replicas first". CRDs kennen keine Merge-Strategie pro
#     Feld, ein fehlendes `disks` wird als "ganze Map loeschen" angewendet und
#     haette die AKTIVE Disk mitgenommen. Nur der Webhook hat das verhindert.
#  2. Nur den toten Eintrag streichen, den aktiven per fsid-Hash eintragen ->
#     derselbe Fehler, diesmal fuer den toten. Der Loesch-Check haengt an
#     allowScheduling: true, und das steht dort seit jeher.
#  3. Den toten erst auf allowScheduling: false setzen -> "duplicate disk paths
#     on node k3s-worker-1". Jedes Update, das beide Eintraege enthaelt, wird
#     abgelehnt.
#
# Es gibt also keinen Uebergang, den der Webhook durchlaesst. Aufloesen liesse
# sich das nur, indem alle Replikate von diesem Node wegziehen (177 GB), die
# Disk dann leer geloescht wird und die Replikate zurueckkommen. Fuer einen
# Eintrag, der ausser einem roten Haken im Longhorn-UI nichts tut, ist das nicht
# verhaeltnismaessig.
#
# Praktische Folge, und die ist echt: **spec.disks ist auf diesen beiden Nodes
# nicht mehr aenderbar**, auch nicht storageReserved. Was fuer Wartung gebraucht
# wird, geht ueber die Node-Ebene (spec.allowScheduling, spec.tags), die ist
# nicht betroffen. Sauber wird es erst bei einem Reimage des Nodes: dann diesen
# disks-Block ersatzlos streichen und Longhorn die Disk allein anlegen lassen,
# so wie es prodesk unten schon macht.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: k3s-worker-1
  namespace: longhorn-system
spec:
  name: k3s-worker-1
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-k3s-worker-1:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      tags:
        - storage

---
# raspi5 ist der umgekehrte Fall zu k3s-worker-1: hier hat der Eintrag aus diesem
# Manifest gewonnen, nicht der automatische. Welcher gewinnt, ist
# Registrierungsreihenfolge, nicht Absicht.
#
# ACHTUNG, der disks-Block darf hier NICHT weg. An dieser Disk haengen die
# aktiven Replikate aller Volumes. Das tote Gegenstueck
# (default-disk-ba524caa2357cade) ist am 2026-08-08 stattdessen direkt aus
# spec.disks entfernt worden, imperativ: es stand nie in git, und Longhorn legt
# es nicht neu an, solange spec.disks nicht leer ist.
#
# Bei einem Reimage von raspi5 aendert sich die Dateisystem-ID und damit der
# Name der automatischen Disk. Dann entsteht das Duplikat neu. In dem Fall diesen
# Block ersatzlos streichen, statt ihn anzupassen.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: raspi5
  namespace: longhorn-system
spec:
  name: raspi5
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-raspi5:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      tags:
        - storage

---
# prodesk: dritter Storage-Node seit 2026-08-08.
#
# Vorher stand er hier auf allowScheduling: false, weil sein Root-LV nur 100 GB
# hatte. Das war der Ubuntu-Installer-Default (subiquity legt bei "LVM group"
# hoechstens 100 GB an und laesst den Rest der VG nicht allokiert), nicht die
# Groesse der Platte: 135 GB der 238-GB-NVMe lagen ungenutzt in der VG. Am
# 2026-08-08 per lvextend + resize2fs geholt, Longhorn meldet seitdem 248 GB.
#
# Damit liegen die Replikate erstmals auf drei Failure-Domains statt zwei:
# k3s-worker-1 (VM auf pve), raspi5 (ARM, eigenes Blech), prodesk (x86, eigenes
# Blech). Bei numberOfReplicas 2 gibt es endlich einen Ausweichnode, wenn einer
# der beiden alten wegfaellt oder ein Upgrade laeuft.
#
# BEWUSST OHNE disks-Block, anders als bei k3s-worker-1 und raspi5 oben. Ein
# eigener Disk-Key auf /var/lib/longhorn/ ist immer ein Duplikat der Disk, die
# Longhorn beim ersten Start selbst anlegt (default-disk-<fsid-hash>), und
# Longhorn laesst pro Dateisystem-ID nur einen Eintrag zu. Der zweite landet
# dauerhaft auf Ready=False/DiskFilesystemChanged. Genau das ist auf beiden
# Nodes oben passiert, seit jeher und unbemerkt: auf raspi5 gewann der Eintrag
# aus diesem Manifest, auf k3s-worker-1 der automatische. Welcher gewinnt, ist
# Registrierungsreihenfolge, nicht Absicht. Die Eintraege hier NICHT einfach
# loeschen, auf raspi5 haengen die aktiven Replikate am Manifest-Eintrag.
#
# Wirksam ist ohnehin nur das Node-Tag: die StorageClass selektiert ueber
# persistence.defaultNodeSelector (nodeSelector "storage"), nicht ueber
# diskSelector. Die tags am Disk sind unbenutzt.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: prodesk
  namespace: longhorn-system
spec:
  name: prodesk
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false

---
# Low-storage nodes (excluded from replica scheduling)
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: k3s-cp-1
  namespace: longhorn-system
spec:
  name: k3s-cp-1
  tags: [] # No storage tag
  allowScheduling: false # Disable storage scheduling
  evictionRequested: false

---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: raspi4
  namespace: longhorn-system
spec:
  name: raspi4
  tags: [] # No storage tag
  allowScheduling: false # Disable storage scheduling
  evictionRequested: false
