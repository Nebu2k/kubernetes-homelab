# Longhorn-Node-Konfiguration.
#
# MIT disks-Block, und der ist Pflicht: Longhorn erzeugt die default-disk nur,
# wenn es das Node-CR SELBST anlegt. Unter GitOps ist ArgoCD schneller,
# longhorn-manager findet das CR bereits vor, adoptiert es und ergaenzt nichts.
# Ergebnis waeren Nodes mit Ready=True, Schedulable=True und null Kapazitaet.
# Das faellt nicht auf, bis das erste Volume Pending bleibt: an der Node selbst
# ist nichts rot.
#
# WELCHER DISK-SCHLUESSEL HIER STEHT, HAENGT AN DER REIHENFOLGE. Tritt eine Node
# dem Cluster bei, waehrend Longhorn schon laeuft, war longhorn-manager zuerst
# da und hat das Node-CR mit einem Namen wie default-disk-<fsid-hash> selbst
# angelegt. Dann gilt: erst lesen, dann uebernehmen.
#
#   kubectl -n longhorn-system get nodes.longhorn.io <name> \
#     -o jsonpath='{.spec.disks}'
#
# Ein frei gewaehlter Name waere ein ZWEITER Eintrag auf /var/lib/longhorn/ und
# damit eine Sackgasse: Umbenennen ginge auch nachtraeglich nicht, das waere ein
# Entfernen und Hinzufuegen auf demselben Pfad in einem Schritt, und der
# validator.longhorn.io-Webhook laesst das nicht durch. Der haessliche Name ist
# der Preis dafuer, den Webhook nicht zu bekaempfen.
#
# Aus demselben Grund NIE ein Node-CR loeschen, auch nicht "zum Aufraeumen":
# Longhorn legt es sofort mit seinem eigenen Disk-Namen neu an, ArgoCD schreibt
# seinen Eintrag dazu, und das Duplikat ist nicht mehr aufloesbar.
#
# Einen Node hier ZU ENTFERNEN reicht nicht, ArgoCD kommt beim Prune nicht
# durch: der validator.longhorn.io-Webhook lehnt das Loeschen ab, solange
# allowScheduling true ist, selbst wenn die Node laengst weg ist und null
# Replikate und null Engines traegt. Die Fehlermeldung steht dann nur in
# .status.operationState.message der Application, die App bleibt OutOfSync und
# retryt endlos. Also vor dem Entfernen aus dieser Datei:
#
#   kubectl -n longhorn-system patch nodes.longhorn.io <name> \
#     --type=merge -p '{"spec":{"allowScheduling":false}}'
#
# Die tags sind kein Schmuck. Die StorageClass longhorn selektiert
# nodeSelector: storage. Ein Node ohne den Tag bekommt nie ein Replikat und
# meldet trotzdem Ready und Schedulable. Longhorn legt Auto-CRs ohne Tags an.
#
# storageReserved: 30 GiB, auf allen Nodes gleich. /var/lib/longhorn liegt auf
# der EPHEMERAL-Partition (xfs), und die traegt auch die Container-Images und
# die Logs. Ohne Reserve fuellt Longhorn sie bis an den Rand und nimmt das
# kubelet mit.
#
# Der Betrag ist bewusst absolut und nicht anteilig, obwohl die Partitionen
# sehr unterschiedlich gross sind (talos-cp-1 395 GiB, prodesk 236 GiB, raspi5
# 931 GiB): Images und Logs brauchen, was sie brauchen, das skaliert nicht mit
# der Plattengroesse. Longhorns Default waeren 30 Prozent, auf raspi5 also
# 279 GiB verschenkt. Nutzbar sind damit rund 371 GiB auf talos-cp-1, rund
# 198 GiB auf prodesk und rund 909 GiB auf raspi5.
#
# Alle Nodes tragen Storage. Sie sind alle Control-Plane und tragen alle
# Workloads, eine Unterscheidung gaebe es nicht abzubilden.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: talos-cp-1
  namespace: longhorn-system
spec:
  name: talos-cp-1
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-talos-cp-1:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 32212254720
      tags:
        - storage

---
# Disk-Schluessel von Longhorn vorgefunden, nicht frei gewaehlt. Begruendung
# steht oben im Kopf, kurz: er kam nach Longhorn ins Cluster.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: prodesk
  namespace: longhorn-system
spec:
  name: prodesk
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-1030400000000:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 32212254720
      tags:
        - storage

---
# Ebenfalls vorgefundener Disk-Schluessel, gleicher Grund wie bei prodesk.
#
# raspi5 ist die groesste Storage-Node im Cluster: sein EPHEMERAL liegt nicht
# auf dem Bootmedium, sondern auf der 1-TB-NVMe (die SD-Karte traegt nur EFI,
# BOOT, META und STATE, siehe talos/talconfig.yaml). Longhorns Default haette
# hier 279 GiB reserviert, die 30 GiB gelten aus demselben Grund wie oben.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: raspi5
  namespace: longhorn-system
spec:
  name: raspi5
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-1030100000000:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 32212254720
      tags:
        - storage
