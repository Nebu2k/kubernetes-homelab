# Longhorn node configuration.
#
# The disks block is mandatory: Longhorn only creates the default disk when it
# creates the Node CR ITSELF. Under GitOps ArgoCD is faster, longhorn-manager
# finds the CR already there, adopts it and adds nothing. The result would be
# nodes with Ready=True, Schedulable=True and zero capacity, which goes
# unnoticed until the first volume stays Pending.
#
# WHICH DISK KEY BELONGS HERE DEPENDS ON THE ORDER OF EVENTS. If a node joins
# while Longhorn is already running, longhorn-manager got there first and
# named the disk something like default-disk-<fsid-hash>. So read it first,
# then adopt it:
#
#   kubectl -n longhorn-system get nodes.longhorn.io <name> \
#     -o jsonpath='{.spec.disks}'
#
# A freely chosen name would be a SECOND entry on /var/lib/longhorn/ and a
# dead end: renaming later is a remove and an add on the same path in one
# step, which the validator.longhorn.io webhook rejects. The ugly name is the
# price for not fighting the webhook.
#
# For the same reason NEVER delete a Node CR, not even to tidy up: Longhorn
# recreates it immediately with its own disk name, ArgoCD adds its entry, and
# the duplicate cannot be resolved.
#
# REMOVING a node from this file is not enough either, ArgoCD cannot prune it:
# the webhook refuses the deletion while allowScheduling is true, even when
# the node is long gone and carries zero replicas and engines. The error only
# appears in the Application's .status.operationState.message, the app stays
# OutOfSync and retries forever. So before removing it here:
#
#   kubectl -n longhorn-system patch nodes.longhorn.io <name> \
#     --type=merge -p '{"spec":{"allowScheduling":false}}'
#
# The tags are not decoration: the longhorn StorageClass selects
# nodeSelector: storage, and a node without the tag never receives a replica
# while still reporting Ready and Schedulable. Auto-created CRs have no tags.
#
# storageReserved is 30 GiB on every node. /var/lib/longhorn sits on the
# EPHEMERAL partition, which also carries the container images and the logs;
# without a reserve Longhorn fills it to the brim and takes the kubelet down.
#
# The amount is deliberately absolute rather than proportional although the
# partitions differ widely in size: images and logs need what they need, that
# does not scale with disk size. Longhorn's default of 30 percent would waste
# hundreds of GiB on the largest node.
#
# Every node carries storage. They are all control plane and all carry
# workloads, so there is no distinction to model.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: talos-cp-1
  namespace: longhorn-system
spec:
  name: talos-cp-1
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-talos-cp-1:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 32212254720
      tags:
        - storage

---
# Disk key found rather than chosen: this node joined after Longhorn was
# already running, see the header.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: prodesk
  namespace: longhorn-system
spec:
  name: prodesk
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-1030400000000:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 32212254720
      tags:
        - storage

---
# Disk key found as well, same reason as prodesk.
#
# raspi5 is the largest storage node: its EPHEMERAL partition is not on the
# boot medium but on the NVMe, while the SD card only carries EFI, BOOT, META
# and STATE (see talos/talconfig.yaml).
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: raspi5
  namespace: longhorn-system
spec:
  name: raspi5
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-1030100000000:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 32212254720
      tags:
        - storage
