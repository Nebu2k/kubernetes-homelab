# Longhorn-Node-Konfiguration des Talos-Clusters.
#
# Eigene Datei statt manifests/longhorn/node-config.yaml: dort stehen die
# k3s-Nodes (k3s-worker-1, raspi5, prodesk, k3s-cp-1, raspi4). Die gibt es hier
# nicht, und Longhorn-Node-CRs fuer nicht existierende Nodes bleiben als Leichen
# liegen.
#
# MIT disks-Block, und das ist der Unterschied zu prodesk im k3s-Cluster.
#
# Der erste Versuch am 2026-08-08 liess den Block weg, in der Annahme, Longhorn
# lege die Disk wie dort selbst an. Tut es nicht: Longhorn erzeugt die
# default-disk nur, wenn es das Node-CR SELBST anlegt. Unter GitOps ist ArgoCD
# schneller, longhorn-manager findet das CR bereits vor, adoptiert es und
# ergaenzt nichts. Ergebnis waren drei Nodes mit Ready=True, Schedulable=True
# und null Kapazitaet. Das faellt nicht auf, bis das erste Volume Pending
# bleibt: an der Node selbst ist nichts rot.
#
# prodesk ist deshalb kein Gegenbeispiel: er lief als k3s-Node schon mit
# Longhorn, bevor er in dessen node-config.yaml auftauchte. Dort war Longhorn
# zuerst da, hier ArgoCD.
#
# Aus demselben Grund kann die Duplikat-Falle aus dem k3s-Cluster hier nicht
# zuschlagen. Dort tragen zwei Nodes zwei Eintraege auf /var/lib/longhorn/, den
# manuellen und den automatischen, und der validator.longhorn.io-Webhook laesst
# keinen Uebergang mehr durch, der das aufloest (die drei Sackgassen stehen in
# manifests/longhorn/node-config.yaml). Voraussetzung dafuer sind ZWEI
# Eintraege. Solange ArgoCD das CR anlegt, entsteht der automatische nie.
#
# Der Restrisiko-Fall ist, dass jemand ein Node-CR ganz loescht: dann legt
# Longhorn es mit default-disk-<fsid-hash> neu an und ArgoCD schreibt seinen
# Eintrag dazu. Dann ist es dasselbe Problem wie im alten Cluster. Node-CRs also
# nicht loeschen, auch nicht "zum Aufraeumen".
#
# Bei prodesk ist genau das am 2026-08-09 auf anderem Weg eingetreten, ohne dass
# jemand etwas geloescht hat: er ist dem Cluster beigetreten, als Longhorn schon
# lief. Damit war longhorn-manager zuerst da und hat das Node-CR selbst angelegt.
# Fuer neue Nodes gilt die Reihenfolge oben also NICHT, sie ist genau umgedreht.
#
# Deshalb traegt prodesk unten den vorgefundenen Namen default-disk-1030400000000
# statt default-disk-prodesk. Ein eigener Name waere ein ZWEITER Eintrag auf
# /var/lib/longhorn/ und damit die Sackgasse aus dem k3s-Cluster. Umbenennen
# ginge auch nachtraeglich nicht: das waere ein Entfernen und Hinzufuegen auf
# demselben Pfad in einem Schritt, und der validator.longhorn.io-Webhook laesst
# das nicht durch. Der haessliche Name ist der Preis dafuer, den Webhook nicht
# zu bekaempfen. Bei jedem weiteren Node, der spaeter dazukommt (raspi5): erst
# "kubectl -n longhorn-system get nodes.longhorn.io <name> -o jsonpath=
# '{.spec.disks}'" lesen, dann den vorgefundenen Schluessel uebernehmen.
#
# Einen Node hier ZU ENTFERNEN reicht nicht, ArgoCD kommt beim Prune nicht
# durch: der validator.longhorn.io-Webhook lehnt das Loeschen ab, solange
# allowScheduling true ist, selbst wenn die Node laengst weg ist und null
# Replikate und null Engines traegt. Die Fehlermeldung steht dann nur in
# .status.operationState.message der Application, die App bleibt OutOfSync und
# retryt endlos. Also vor dem Entfernen aus dieser Datei:
#
#   kubectl -n longhorn-system patch nodes.longhorn.io <name> \
#     --type=merge -p '{"spec":{"allowScheduling":false}}'
#
# Am 2026-08-09 beim Abbau von talos-cp-3 aufgelaufen.
#
# Die tags sind kein Schmuck. Die StorageClass longhorn selektiert
# nodeSelector: storage. Ein Node ohne den Tag bekommt nie ein Replikat und
# meldet trotzdem Ready und Schedulable. Longhorn legt Auto-CRs ohne Tags an,
# prodesk waere also still unbeteiligt geblieben.
#
# storageReserved: 30 GiB, auf allen Nodes gleich. /var/lib/longhorn liegt auf
# der EPHEMERAL-Partition (xfs), und die traegt auch die Container-Images und
# die Logs. Ohne Reserve fuellt Longhorn sie bis an den Rand und nimmt das
# kubelet mit.
#
# Der Betrag ist bewusst absolut und nicht anteilig, obwohl die Partitionen
# sehr unterschiedlich gross sind (VMs 124 GiB, prodesk 236 GiB, raspi5 1 TB):
# Images und Logs brauchen, was sie brauchen, das skaliert nicht mit der
# Plattengroesse. Longhorns Default waeren 30 Prozent gewesen, auf raspi5 also
# 279 GiB verschenkt. Nutzbar sind damit rund 93 GiB je VM, rund 206 GiB auf
# prodesk und rund 900 GiB auf raspi5.
#
# Alle Nodes tragen Storage. Sie sind alle Control-Plane und tragen alle
# Workloads, eine Unterscheidung gaebe es nicht abzubilden.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: talos-cp-1
  namespace: longhorn-system
spec:
  name: talos-cp-1
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-talos-cp-1:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 32212254720
      tags:
        - storage

---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: talos-cp-2
  namespace: longhorn-system
spec:
  name: talos-cp-2
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-talos-cp-2:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 32212254720
      tags:
        - storage

---
# Disk-Schluessel von Longhorn vorgefunden, nicht frei gewaehlt. Begruendung
# steht oben im Kopf, kurz: er kam nach Longhorn ins Cluster.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: prodesk
  namespace: longhorn-system
spec:
  name: prodesk
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-1030400000000:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 32212254720
      tags:
        - storage

---
# Ebenfalls vorgefundener Disk-Schluessel, gleicher Grund wie bei prodesk.
#
# raspi5 ist die groesste Storage-Node im Cluster: sein EPHEMERAL liegt nicht
# auf dem Bootmedium, sondern auf der 1-TB-NVMe (die SD-Karte traegt nur EFI,
# BOOT, META und STATE, siehe talos/talconfig.yaml). Longhorns Default haette
# hier 279 GiB reserviert, die 30 GiB gelten aus demselben Grund wie oben.
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: raspi5
  namespace: longhorn-system
spec:
  name: raspi5
  tags:
    - storage
  allowScheduling: true
  evictionRequested: false
  disks:
    default-disk-1030100000000:
      allowScheduling: true
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 32212254720
      tags:
        - storage
