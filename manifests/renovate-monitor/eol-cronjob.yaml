# End-of-life check for the versions in use, weekly against endoflife.date.
#
# Automerged dependencies stay current and never get close to EOL. This is for
# the ones that move by hand: Kubernetes minors (Renovate offers none), Postgres
# majors, and the Debian release pinned by an image suffix like -trixie. Talos
# is not on endoflife.date; its minors arrive as a manual PR and are reported
# by renovate-manual-update.
#
# The versions come from the Dependency Dashboards, which list every detected
# dependency. Every entry in PRODUCTS has to be found there, so a changed
# dashboard format fails loudly instead of checking nothing.
#
# The job exits 1 if a version is EOL within LEAD_DAYS; VersionEndOfLife in
# prometheus-rules.yaml reports it, once per run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: version-eol
  namespace: monitoring
  labels:
    app.kubernetes.io/name: version-eol
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  # Mondays. Weekly is the reminder cadence, EOL dates do not move faster.
  schedule: "20 8 * * 1"
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: version-eol
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: python:3.15-alpine
              command:
                - python3
                - -c
                - |
                  import datetime, json, re, sys, time, urllib.error, urllib.request

                  OWNER = "Nebu2k"
                  REPOS = ["kubernetes-homelab", "homelab-terraform"]
                  LEAD_DAYS = 90
                  today = datetime.datetime.now(datetime.timezone.utc).date()

                  # Renovate depName -> endoflife.date product, version parts per cycle.
                  PRODUCTS = {
                      "kubernetes/kubernetes": ("kubernetes", 2),
                      "postgres": ("postgresql", 1),
                      "redis": ("redis", 2),
                      "longhorn": ("longhorn", 2),
                      "cert-manager": ("cert-manager", 2),
                      "alpine": ("alpine-linux", 2),
                      "python": ("python", 2),
                      "ruby": ("ruby", 2),
                      "nginxinc/nginx-unprivileged": ("nginx", 2),
                      "hashicorp/terraform": ("terraform", 2),
                  }

                  def get(url):
                      request = urllib.request.Request(
                          url, headers={"Accept": "application/json", "User-Agent": "version-eol"}
                      )
                      for attempt in range(1, 4):
                          try:
                              with urllib.request.urlopen(request, timeout=30) as response:
                                  return json.load(response)
                          except urllib.error.HTTPError as error:
                              if error.code < 500 or attempt == 3:
                                  sys.exit(f"{url} answered {error.code}")
                          except urllib.error.URLError as error:
                              if attempt == 3:
                                  sys.exit(f"{url} unreachable: {error}")
                          time.sleep(60)

                  releases = {}
                  def cycles(product):
                      if product not in releases:
                          releases[product] = get(f"https://endoflife.date/api/v1/products/{product}")["result"]["releases"]
                      return releases[product]

                  debian = {r["codename"].lower(): r["name"] for r in cycles("debian") if r.get("codename")}

                  # (product, cycle) -> dependencies using it
                  used, seen = {}, set()
                  for repo in REPOS:
                      issues = get(f"https://api.github.com/repos/{OWNER}/{repo}/issues?state=open&creator={OWNER}&per_page=100")
                      dashboard = next((i for i in issues if i["title"] == "Dependency Dashboard"), None)
                      if dashboard is None:
                          sys.exit(f"{repo}: no Dependency Dashboard")
                      for name, version in re.findall(r"^ - `(\S+) (\S+)`", dashboard["body"] or "", re.M):
                          ref = f"{name} {version}"
                          for token in version.split("-")[1:]:
                              if token in debian:
                                  used.setdefault(("debian", debian[token]), set()).add(ref)
                          if name not in PRODUCTS:
                              continue
                          product, parts = PRODUCTS[name]
                          match = re.match(r"v?(\d+(?:\.\d+)*)", version)
                          if not match:
                              sys.exit(f"cannot read the version of {ref}")
                          cycle = ".".join(match.group(1).split(".")[:parts])
                          used.setdefault((product, cycle), set()).add(ref)
                          seen.add(name)

                  missing = sorted(set(PRODUCTS) - seen)
                  if missing:
                      sys.exit("not in any Dependency Dashboard, update PRODUCTS: " + ", ".join(missing))

                  findings = []
                  for (product, cycle), refs in sorted(used.items()):
                      release = next((r for r in cycles(product) if r["name"] == cycle), None)
                      where = ", ".join(sorted(refs))
                      if release is None:
                          findings.append(f"{product} {cycle} is not listed at endoflife.date ({where})")
                          continue
                      eol = release.get("eolFrom")
                      days = (datetime.date.fromisoformat(eol) - today).days if eol else None
                      when = f"EOL {eol}, in {days} days" if eol else "no EOL date yet"
                      line = f"{product} {cycle}: {when} ({where})"
                      if release.get("isEol") or (days is not None and days <= LEAD_DAYS):
                          findings.append(line)
                      else:
                          print(f"ok    {line}")

                  if not findings:
                      print(f"Nothing reaches EOL within {LEAD_DAYS} days.")
                      sys.exit(0)
                  for line in findings:
                      print(f"EOL   {line}")
                  sys.exit(f"{len(findings)} version(s) at or near EOL")
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop: ["ALL"]
