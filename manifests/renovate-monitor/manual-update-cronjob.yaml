# Reports Renovate PRs that wait for a human merge (automerge disabled by a
# packageRule: Postgres majors, Talos minors, argo-cd chart majors, Terraform
# majors), once, on the day they appear. Renovate opens them with the owner's
# token, so GitHub itself never notifies about them.
#
# The job exits 1 if such a PR is younger than 24h; RenovateManualUpdate in
# prometheus-rules.yaml reports it. The window equals the schedule, so every PR
# lands in exactly one run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-manual-update
  namespace: monitoring
  labels:
    app.kubernetes.io/name: renovate-manual-update
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  schedule: "10 8 * * *"
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate-manual-update
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: python:3.15-alpine
              command:
                - python3
                - -c
                - |
                  import datetime, json, sys, time, urllib.error, urllib.request

                  OWNER = "Nebu2k"
                  REPOS = ["kubernetes-homelab", "homelab-terraform"]
                  WINDOW_HOURS = 24
                  now = datetime.datetime.now(datetime.timezone.utc)

                  def get(path):
                      request = urllib.request.Request(
                          "https://api.github.com" + path,
                          headers={"Accept": "application/vnd.github+json", "User-Agent": "renovate-manual-update"},
                      )
                      for attempt in range(1, 4):
                          try:
                              with urllib.request.urlopen(request, timeout=30) as response:
                                  return json.load(response)
                          except urllib.error.HTTPError as error:
                              if error.code < 500 or attempt == 3:
                                  sys.exit(f"GitHub API answered {error.code} for {path}")
                          except urllib.error.URLError as error:
                              if attempt == 3:
                                  sys.exit(f"GitHub API unreachable: {error}")
                          time.sleep(60)

                  new, waiting = [], []
                  for repo in REPOS:
                      for item in get(f"/repos/{OWNER}/{repo}/issues?state=open&creator={OWNER}&per_page=100"):
                          body = item.get("body") or ""
                          if "pull_request" not in item or "generated by [Mend Renovate" not in body:
                              continue
                          # Negated on purpose: if Renovate rewords the line,
                          # every PR shows up instead of none.
                          if "**Automerge**: Enabled." in body:
                              continue
                          created = datetime.datetime.fromisoformat(item["created_at"].replace("Z", "+00:00"))
                          age = (now - created).total_seconds() / 3600
                          line = f"{item['html_url']}  {item['title']}"
                          (new if age <= WINDOW_HOURS else waiting).append(line)

                  for line in waiting:
                      print(f"still waiting: {line}")
                  if not new:
                      print("No new update to merge by hand.")
                      sys.exit(0)
                  for line in new:
                      print(f"NEW: {line}")
                  sys.exit(f"{len(new)} new update(s) to merge by hand")
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop: ["ALL"]
