# Die beiden PVs zu den aus dem NAS-Backup restaurierten Longhorn-Volumes.
#
# Sie stehen hier und nicht in manifests/, weil sie ein Zustand dieses Clusters
# sind: im k3s-Cluster hat der Provisioner die PVs dynamisch angelegt und sie
# heissen dort pvc-<uuid>. Ein Restore erzeugt dagegen ein Volume mit einem
# gewaehlten Namen, und dazu gehoert ein handgeschriebenes PV.
#
# Warum ueberhaupt ins git und nicht bloss von Hand angelegt: ohne PV bindet die
# PVC aus manifests/ripe-atlas/pvc.yaml an ein FRISCH provisioniertes, leeres
# Volume. Das faellt nicht auf, der Pod startet, und die Probe-Keys sind weg.
# Mit dem PV hier ist die Verdrahtung explizit; fehlt das Longhorn-Volume
# dahinter, scheitert das Attachen sichtbar, statt still leer zu starten.
#
# claimRef zeigt vorwaerts auf die PVC, die ArgoCD aus derselben App anlegt.
# Damit ist das PV vorgebunden und der Provisioner fasst die PVC nicht an. Ohne
# claimRef koennte parallel dynamisch provisioniert werden.
#
# Der Longhorn-Volume-Name steht in volumeHandle und ist die einzige Verbindung
# zum restaurierten Volume. Das Restore selbst (Volume-CR mit fromBackup) ist
# Handarbeit und steht bewusst nicht im git: der Backup-URL ist eine
# Momentaufnahme, ein Re-Sync duerfte daraus nie einen alten Stand herstellen.
# Das Rezept steht in talos/README.md.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ripe-atlas-etc
  annotations:
    # Ohne die Annotation raeumt bei reclaimPolicy Delete niemand das
    # Longhorn-Volume ab: das erledigt der external-provisioner, und der fasst
    # nur PVs an, die ihn als Erzeuger nennen.
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 128Mi
  accessModes:
    - ReadWriteOnce
  # Delete wie bei den dynamisch provisionierten PVs im k3s-Cluster. Ein Prune
  # der App nimmt damit auch hier das Volume mit, so wie es die ROADMAP fuer den
  # Migrationsschritt beschreibt.
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: ripe-atlas-etc
    namespace: ripe-atlas
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: ripe-atlas-etc
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      # Muss zum nodeSelector des restaurierten Volumes passen, sonst findet
      # Longhorn keine Disk: die StorageClass selektiert auf den Tag storage.
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ripe-atlas-spool
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: ripe-atlas-spool
    namespace: ripe-atlas
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: ripe-atlas-spool
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
