# Das PodSecurity-Label ist keine Kuer: der Container laeuft als root und setzt
# NET_RAW, weil die Probe mit ICMP und Traceroute misst. NET_RAW steht nicht auf
# der Liste erlaubter capabilities.add des baseline-Profils, das Talos
# clusterweit erzwingt (CHOWN, KILL, SETUID, SETGID, FOWNER und DAC_OVERRIDE
# dagegen schon). Ohne das Label lehnt der Namespace den Pod ab, das Deployment
# bleibt bei 0/1 und die App meldet trotzdem Synced.
apiVersion: v1
kind: Namespace
metadata:
  name: ripe-atlas
  labels:
    pod-security.kubernetes.io/enforce: privileged
