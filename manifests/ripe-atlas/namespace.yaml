# The PodSecurity label is required: the container runs as root and sets
# NET_RAW, because the probe measures with ICMP and traceroute, and NET_RAW is
# not among the capabilities the baseline profile permits. Without the label
# the namespace rejects the pod, the deployment stays at 0/1 and the app still
# reports Synced.
apiVersion: v1
kind: Namespace
metadata:
  name: ripe-atlas
  labels:
    pod-security.kubernetes.io/enforce: privileged
