# The two PVs for the Longhorn volumes restored from the NAS backup.
#
# Dynamically provisioned PVs are created by the provisioner, are named
# pvc-<uuid> and appear in no manifest. A restore instead produces a volume
# with a chosen name, which needs a handwritten PV.
#
# Why in git rather than created by hand: without a PV the PVC binds to a
# FRESHLY provisioned, empty volume. That goes unnoticed, the pod starts, and
# the probe keys are gone. With the PV the wiring is explicit, and a missing
# Longhorn volume behind it fails the attach visibly instead of starting empty.
#
# claimRef points forward at the PVC that ArgoCD creates from the same app, so
# the PV is pre-bound and the provisioner leaves the PVC alone.
#
# The Longhorn volume name in volumeHandle is the only link to the restored
# volume. The restore itself (a Volume CR with fromBackup) is manual and
# deliberately not in git: the backup URL is a snapshot, and a re-sync must
# never recreate an old state from it. The recipe is in talos/README.md.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ripe-atlas-etc
  annotations:
    # Without this annotation nobody cleans up the Longhorn volume under
    # reclaimPolicy Delete: the external-provisioner does that, and it only
    # touches PVs naming it as their creator.
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 128Mi
  accessModes:
    - ReadWriteOnce
  # Delete as with the dynamically provisioned PVs, so pruning the app takes
  # the Longhorn volume with it here too.
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: ripe-atlas-etc
    namespace: ripe-atlas
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: ripe-atlas-etc
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      # Must match the restored volume's nodeSelector, otherwise Longhorn
      # finds no disk: the StorageClass selects on the storage tag.
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ripe-atlas-spool
  annotations:
    pv.kubernetes.io/provisioned-by: driver.longhorn.io
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: longhorn
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: ripe-atlas-spool
    namespace: ripe-atlas
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: ripe-atlas-spool
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "30"
      nodeSelector: storage
      dataEngine: v1
      backupTargetName: default
