apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  # Carries the PodSecurity label only, see namespace.yaml.
  - namespace.yaml
  - grafana-ingress.yaml
  - prometheus-ingress.yaml
  - alertmanager-ingress.yaml
  - prometheus-rules.yaml
  - etcd-scrapeconfig.yaml
  - node-exporter-external-scrapeconfig.yaml
  - home-assistant-scrapeconfig.yaml
  - blocky-lxc-scrapeconfig.yaml
  - aws-credentials-sealed.yaml
  - grafana-admin-sealed.yaml
  - home-assistant-token-sealed.yaml

# Our own Grafana dashboards. The grafana-sc-dashboard sidecar collects every
# ConfigMap labelled grafana_dashboard=1 across all namespaces (METHOD=WATCH);
# third-party boards go through grafana.dashboards.*.gnetId in values.yaml.
#
# disableNameSuffixHash, because a changing name would make the sidecar import
# the dashboard additionally under the new name instead of replacing it.
configMapGenerator:
  - name: grafana-dashboard-node-overview
    files:
      - node-overview.json=dashboards/node-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-traefik-overview
    files:
      - traefik-overview.json=dashboards/traefik-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-backup-overview
    files:
      - backup-overview.json=dashboards/backup-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-proxmox-overview
    files:
      - proxmox-overview.json=dashboards/proxmox-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-verfuegbarkeit
    files:
      - verfuegbarkeit.json=dashboards/verfuegbarkeit.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-dns-overview
    files:
      - dns-overview.json=dashboards/dns-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-energie-overview
    files:
      - energie-overview.json=dashboards/energie-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
