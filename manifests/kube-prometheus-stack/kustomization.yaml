apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  # Traegt nur das PodSecurity-Label. Gebraucht wird die Ausnahme fuer den
  # node-exporter-DaemonSet: hostNetwork, hostPID, hostPort 9100 und drei
  # hostPath-Volumes, alles unter dem baseline-Profil verboten, das Talos
  # clusterweit erzwingt.
  - namespace.yaml
  - grafana-ingress.yaml
  - prometheus-ingress.yaml
  - alertmanager-ingress.yaml
  - prometheus-rules.yaml
  - etcd-scrapeconfig.yaml
  - node-exporter-external-scrapeconfig.yaml
  - home-assistant-scrapeconfig.yaml
  - aws-credentials-sealed.yaml
  - grafana-admin-sealed.yaml
  - home-assistant-token-sealed.yaml

# Eigene Grafana-Dashboards. Der grafana-sc-dashboard-Sidecar sammelt alle
# ConfigMaps mit dem Label grafana_dashboard=1 ueber alle Namespaces ein
# (METHOD=WATCH), das Chart braucht dafuer nichts. Fremd-Dashboards aus
# grafana.com laufen dagegen weiter ueber grafana.dashboards.default.*.gnetId
# in values.yaml.
#
# disableNameSuffixHash, weil der Name sonst bei jeder Aenderung wechselt: der
# Sidecar wuerde das Dashboard unter neuem Namen zusaetzlich importieren, statt
# es zu ersetzen.
configMapGenerator:
  - name: grafana-dashboard-node-overview
    files:
      - node-overview.json=dashboards/node-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-traefik-overview
    files:
      - traefik-overview.json=dashboards/traefik-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-backup-overview
    files:
      - backup-overview.json=dashboards/backup-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-proxmox-overview
    files:
      - proxmox-overview.json=dashboards/proxmox-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-verfuegbarkeit
    files:
      - verfuegbarkeit.json=dashboards/verfuegbarkeit.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
