apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - grafana-ingress.yaml
  - prometheus-ingress.yaml
  - alertmanager-ingress.yaml
  - etcd-scrapeconfig.yaml
  - node-exporter-external-scrapeconfig.yaml
  - aws-credentials-sealed.yaml
  - grafana-admin-sealed.yaml

# Am 2026-08-09 aus DIESER Liste heraus und nur noch im Talos-Overlay
# (clusters/talos/kube-prometheus-stack/kustomization.yaml):
#
#   prometheus-rules.yaml
#     Die homelab-eigenen Regeln folgen den Diensten, nicht dem Monitoring.
#     Seit der zweiten Welle laeuft im k3s-Cluster keine Anwendung mehr, hier
#     wuerden fast alle Gruppen dauerhaft absent() melden. Das k3s-Prometheus
#     behaelt die defaultRules des Charts, die beschreiben das Cluster selbst.
#
#   home-assistant-scrapeconfig.yaml, home-assistant-token-sealed.yaml
#     Das Target ist ein Service im eigenen Cluster, und Home Assistant laeuft
#     seit dem 2026-08-09 drueben.
#
# Die Dateien selbst bleiben hier liegen: sie sind die gemeinsame Quelle, das
# Overlay referenziert sie. Beim Abbau von k3s faellt diese Datei weg, nicht
# ihr Inhalt.

# Eigene Grafana-Dashboards. Der grafana-sc-dashboard-Sidecar sammelt alle
# ConfigMaps mit dem Label grafana_dashboard=1 ueber alle Namespaces ein
# (METHOD=WATCH), das Chart braucht dafuer nichts. Fremd-Dashboards aus
# grafana.com laufen dagegen weiter ueber grafana.dashboards.default.*.gnetId
# in values.yaml.
#
# disableNameSuffixHash, weil der Name sonst bei jeder Aenderung wechselt: der
# Sidecar wuerde das Dashboard unter neuem Namen zusaetzlich importieren, statt
# es zu ersetzen.
configMapGenerator:
  - name: grafana-dashboard-node-overview
    files:
      - node-overview.json=dashboards/node-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-traefik-overview
    files:
      - traefik-overview.json=dashboards/traefik-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-backup-overview
    files:
      - backup-overview.json=dashboards/backup-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-proxmox-overview
    files:
      - proxmox-overview.json=dashboards/proxmox-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-verfuegbarkeit
    files:
      - verfuegbarkeit.json=dashboards/verfuegbarkeit.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
