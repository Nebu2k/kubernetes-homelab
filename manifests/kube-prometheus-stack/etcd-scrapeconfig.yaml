# etcd metrics of the three Talos control planes. Static targets, because etcd
# is not a pod with a service and ArgoCD excludes Endpoints objects globally.
#
# Requires the etcd patch in talos/talconfig.yaml
# (listen-metrics-urls: http://0.0.0.0:2381); otherwise Talos binds the metrics
# to 127.0.0.1 and a Prometheus in the pod network sees nothing. The parameter
# only takes effect after a node reboot, there is no
# "talosctl service etcd restart".
#
# The job label must match `.*etcd.*`, or neither the etcd rules from
# defaultRules nor the etcd dashboard nor the etcd-homelab group apply.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: etcd
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  scheme: HTTP
  metricsPath: /metrics
  # This list must follow the etcd members. A missing node does NOT show up
  # here: Prometheus simply scrapes two targets instead of three, all green,
  # and the etcd alerts silently apply only to the ones listed.
  staticConfigs:
    - targets:
        - 192.168.2.20:2381
      labels:
        node: talos-cp-1
    - targets:
        - 192.168.2.22:2381
      labels:
        node: raspi5
    - targets:
        - 192.168.2.23:2381
      labels:
        node: prodesk
  relabelings:
    - targetLabel: job
      replacement: etcd
      action: replace
