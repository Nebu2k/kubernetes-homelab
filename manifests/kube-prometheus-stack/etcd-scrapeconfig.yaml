# etcd-Metriken der drei Talos-Control-Planes.
#
# Gleiche Bauart wie manifests/kube-prometheus-stack/etcd-scrapeconfig.yaml, nur
# andere Adressen: statische Targets, weil etcd auch hier kein Pod mit Service
# ist, und weil ArgoCD Endpoints-Objekte global ausschliesst.
#
# Voraussetzung ist der etcd-Patch in talos/talconfig.yaml
# (listen-metrics-urls: http://0.0.0.0:2381). Talos bindet die Metriken sonst
# auf 127.0.0.1, und ein Prometheus im Pod-Netz sieht davon nichts. Achtung: der
# Parameter greift erst nach einem Node-Reboot, "talosctl service etcd restart"
# gibt es nicht ("doesn't support restart operation via API").
#
# Das Job-Label muss `.*etcd.*` erfuellen, sonst greifen weder die etcd-Regeln
# aus defaultRules noch das etcd-Dashboard noch die Gruppe etcd-homelab aus
# prometheus-rules.yaml.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: etcd
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  scheme: HTTP
  metricsPath: /metrics
  # Die Liste ist statisch und muss den etcd-Membern folgen. Eine fehlende Node
  # faellt hier NICHT auf: Prometheus scrapet dann einfach zwei statt drei
  # Ziele, alle gruen, und die etcd-Alerts gelten stillschweigend nur noch fuer
  # die Ziele, die dastehen. Genau so war raspi5 vom Join am 2026-08-09 bis zum
  # Abbau von talos-cp-2 unbeobachtet.
  staticConfigs:
    - targets:
        - 192.168.2.20:2381
      labels:
        node: talos-cp-1
    - targets:
        - 192.168.2.22:2381
      labels:
        node: raspi5
    - targets:
        - 192.168.2.23:2381
      labels:
        node: prodesk
  relabelings:
    - targetLabel: job
      replacement: etcd
      action: replace
