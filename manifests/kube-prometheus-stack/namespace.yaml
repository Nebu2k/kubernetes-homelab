# Der monitoring-Namespace als echte Ressource, nur damit das PodSecurity-Label
# verlaesslich sitzt.
#
# managedNamespaceMetadata an der Application taugt dafuer nicht: das wirkt nur
# beim ANLEGEN des Namespace. Existiert er schon, kommt das Label nicht mehr an,
# auch nicht nach einer terminierten Sync-Operation. Als Manifest ist der
# Namespace Teil des Sync und die Sache eindeutig.
#
# Gebraucht wird die Ausnahme fuer den node-exporter-DaemonSet: hostNetwork,
# hostPID, hostPort 9100 und drei hostPath-Volumes, alles unter dem
# baseline-Profil verboten, das Talos clusterweit erzwingt. Ohne das Label
# bleibt der DaemonSet bei 0/3, waehrend Prometheus, Grafana und Alertmanager
# normal starten und die App Synced meldet.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
