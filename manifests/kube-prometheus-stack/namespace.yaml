# The namespace exists as a real resource only so the PodSecurity label sits
# reliably. managedNamespaceMetadata on the Application only applies when the
# namespace is CREATED; as a manifest the namespace is part of the sync.
#
# The exemption is for the node-exporter DaemonSet: hostNetwork, hostPID,
# hostPort 9100 and three hostPath volumes, all forbidden under the baseline
# profile Talos enforces cluster-wide. Without the label the DaemonSet stays
# at 0/3 while everything else starts and the app reports Synced.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
