apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    # Node filesystem alerts
    - name: node-disk-space
      interval: 30s
      rules:
        - alert: NodeFilesystemSpaceWarning
          expr: |
            (
              node_filesystem_avail_bytes{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*"} / 
              node_filesystem_size_bytes{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*"}
            ) < 0.20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node filesystem space is running low"
            description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $value | humanizePercentage }} available (threshold: 20%)."

        - alert: NodeFilesystemSpaceCritical
          expr: |
            (
              node_filesystem_avail_bytes{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*"} / 
              node_filesystem_size_bytes{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*"}
            ) < 0.10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node filesystem space is critically low"
            description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $value | humanizePercentage }} available (threshold: 10%)."

        - alert: NodeFilesystemInodeWarning
          expr: |
            (
              node_filesystem_files_free{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*"} / 
              node_filesystem_files{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*"}
            ) < 0.20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node filesystem inodes are running low"
            description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $value | humanizePercentage }} inodes available."

    # Longhorn volume alerts
    - name: longhorn-storage
      interval: 30s
      rules:
        - alert: LonghornVolumeSpaceWarning
          expr: |
            (
              kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".+"} / 
              kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+"}
            ) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume space usage is high"
            description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full (threshold: 80%)."

        - alert: LonghornVolumeSpaceCritical
          expr: |
            (
              kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".+"} / 
              kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+"}
            ) > 0.90
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume space usage is critical"
            description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full (threshold: 90%)."

        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume is degraded"
            description: "Volume {{ $labels.volume }} is in degraded state. Check replica health."

        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume is faulted"
            description: "Volume {{ $labels.volume }} is in faulted state. Immediate action required!"

        - alert: LonghornNodeStorageWarning
          expr: |
            (
              longhorn_node_storage_usage_bytes / 
              longhorn_node_storage_capacity_bytes
            ) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn node storage usage is high"
            description: "Node {{ $labels.node }} storage is {{ $value | humanizePercentage }} full (threshold: 80%)."

        - alert: LonghornNodeStorageCritical
          expr: |
            (
              longhorn_node_storage_usage_bytes / 
              longhorn_node_storage_capacity_bytes
            ) > 0.90
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn node storage usage is critical"
            description: "Node {{ $labels.node }} storage is {{ $value | humanizePercentage }} full (threshold: 90%)."

    # Backup-Ziel-Alerts (seit dem Wechsel MinIO -> SMB-Share am UniFi-NAS,
    # 2026-08-01). Vorher gab es hier eine Luecke: die Longhorn-Alerts oben
    # decken Volumes und Node-Disks ab, aber nichts davon haette gemeldet, dass
    # Backups nicht mehr durchlaufen. Bei MinIO war das folgenlos (eigene VM mit
    # 484 GB), beim NAS-Share mit 300 GB waere ein stiller Ausfall teuer.
    - name: longhorn-backup
      interval: 60s
      rules:
        # Hauptalert. Faengt JEDE Ursache, unter der Backups aufhoeren: Share
        # voll, Auth kaputt, NAS aus, RecurringJob gescheitert, Target nicht
        # erreichbar. Deshalb bewusst auf das Ergebnis gemuenzt statt auf einen
        # bestimmten Fehlerzustand.
        #
        # Das "> 0" ist nicht kosmetisch: Volumes ohne jemals ein Backup melden
        # last_backup_at = 0 und wuerden sonst dauerhaft feuern. Damit faellt
        # auch das Prometheus-Volume automatisch raus, das bewusst nicht mehr
        # gesichert wird. Preis: ein Volume, das faelschlich NIE gesichert wird,
        # faellt durch dieses Netz. Das ist ein Konfigurationsfehler und wird
        # ueber die Gruppenlabels geprueft, nicht ueber einen Alert.
        #
        # 36h statt 24h, damit ein einzelner ausgefallener Lauf (backup-daily
        # laeuft 02:00) nicht sofort meldet, zwei aufeinanderfolgende aber schon.
        - alert: LonghornBackupStale
          expr: |
            (
              longhorn_volume_last_backup_at > 0
              and
              (time() - longhorn_volume_last_backup_at) > 129600
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume has not been backed up recently"
            description: "Volume {{ $labels.volume }} had no successful backup for over 36h. Check the CIFS target //192.168.2.6/longhorn_backup (share full? NAS reachable? credentials still valid?)."

        # Ergaenzung zum Alert oben, meldet frueher und nennt das konkrete
        # Backup. longhorn_backup_state: 0=New 1=Pending 2=InProgress
        # 3=Completed 4=Error 5=Unknown.
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn backup failed"
            description: "Backup {{ $labels.backup }} of volume {{ $labels.volume }} is in Error state."

        # Fuellstand des Backup-Ziels. Der Share liegt auf dem UniFi-NAS und hat
        # keinen eigenen Exporter, deshalb ueber die Summe der Backup-Groessen
        # statt ueber echte Share-Statistik. Naeherung nach unten (Longhorn
        # dedupliziert Bloecke), als Frueh-Warnung reicht das.
        # 240 GiB = 80% der 300 GB des Shares.
        - alert: LonghornBackupStoreSpaceWarning
          expr: sum(longhorn_backup_actual_size_bytes) > 257698037760
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn backup store is filling up"
            description: "Backups on //192.168.2.6/longhorn_backup total {{ $value | humanize1024 }}B (threshold: 240GiB of 300GB). Longhorn does NOT free space by itself when the share is full, backups just start failing. Reduce retain values or drop volumes from the backup group."

    # Offsite-Backup-Jobs (S3)
    #
    # Diese Gruppe deckt eine Luecke, die die Upstream-Alerts NICHT schliessen.
    # KubeJobFailed und KubeJobNotCompleted melden einen Job, der laeuft und
    # dabei scheitert oder haengt. Sie melden nicht den Fall, der bei einem
    # Backup viel gefaehrlicher ist: einen Job, der ueberhaupt nicht mehr laeuft.
    # CronJob versehentlich aus der kustomization geflogen, suspended, Schedule
    # vertippt, Namespace leer geraeumt: in all diesen Faellen ist upstream
    # still, und das faellt erst auf, wenn man das Backup braucht.
    #
    # Anker ist deshalb das ALTER des letzten erfolgreich abgeschlossenen Jobs,
    # analog zu LonghornBackupStale weiter oben.
    #
    # Zwei Dinge, die an dieser Konstruktion haengen und leicht kaputtgehen:
    #
    # 1. Das "or absent(...)" ist der eigentliche Kern. Verschwindet der CronJob,
    #    verschwinden mit ihm auch seine Jobs und damit die Metrik. Ohne den
    #    absent-Zweig loest sich der Alert dann in Luft auf, statt zu feuern,
    #    also genau im schlimmsten Fall. Deshalb steht er hier pro Job einzeln
    #    und nicht ueber einen gemeinsamen Selektor: absent() ueber mehrere Jobs
    #    feuert erst, wenn ALLE fehlen.
    # 2. Die Metrik lebt nur, solange der Job im Cluster liegt
    #    (successfulJobsHistoryLimit: 3). Bei einem taeglichen Job sind das drei
    #    Tage, bei einem monatlichen drei Monate, beides deutlich mehr als die
    #    Schwellen unten. Wer die History verkleinert, muss hier mitdenken.
    #
    # Nach dem ERSTEN Deployment eines solchen Jobs einmal von Hand anstossen
    # (kubectl create job --from=cronjob/<name>), sonst feuert der absent-Zweig
    # bis zum ersten regulaeren Lauf zu Recht ins Leere. Bei einem monatlichen
    # Job waeren das bis zu vier Wochen Dauerfeuer.
    #
    # NICHT abgedeckt: ob das Objekt wirklich in S3 angekommen ist. Dafuer
    # braucht es eine S3-Metrikquelle, siehe ROADMAP Punkt 7.
    - name: offsite-backup-jobs
      interval: 60s
      rules:
        # Taeglich 01:30 UTC. 36h wie bei Longhorn: ein einzelner ausgefallener
        # Lauf soll nicht sofort melden, zwei aufeinanderfolgende schon.
        - alert: TeslaMateBackupJobStale
          expr: |
            (
              time() - max(kube_job_status_completion_time{namespace="teslamate", job_name=~"teslamate-db-backup.*"}) > 129600
            )
            or
            absent(kube_job_status_completion_time{namespace="teslamate", job_name=~"teslamate-db-backup.*"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TeslaMate database backup has not succeeded recently"
            description: "No successful teslamate-db-backup job for over 36h (or the CronJob is gone entirely). This is the ONLY offsite copy of the driving history. Check `kubectl -n teslamate get cronjob,job` and the logs of the last attempt."

        # Laeuft nur am 1. des Monats. Der groesste regulaere Abstand sind 31
        # Tage, 35 lassen also vier Tage Luft und melden trotzdem lange bevor
        # der naechste Lauf faellig waere. Das ist der Job mit der laengsten
        # Blindzeit ueberhaupt, deshalb hier ueberhaupt ein Alert.
        - alert: HomeAssistantArchiveJobStale
          expr: |
            (
              time() - max(kube_job_status_completion_time{namespace="home-assistant", job_name=~"ha-backup-archive.*"}) > 3024000
            )
            or
            absent(kube_job_status_completion_time{namespace="home-assistant", job_name=~"ha-backup-archive.*"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Home Assistant monthly archive job has not succeeded recently"
            description: "No successful ha-backup-archive job for over 35 days (or the CronJob is gone entirely). Without it the S3 bucket only holds HA's last 3 automatic backups, so the long-term restore point stops growing. Check `kubectl -n home-assistant get cronjob,job`."

        # Deckt NUR die Export-Haelfte ab. Der Upload macht der S3-Sidecar auf
        # eigenem Timer, ein erfolgreicher Job beweist also nicht, dass etwas in
        # S3 gelandet ist. Trotzdem sinnvoll: faellt der Export aus, exportiert
        # der Sidecar unbemerkt denselben alten Stand weiter.
        - alert: PaperlessExportJobStale
          expr: |
            (
              time() - max(kube_job_status_completion_time{namespace="paperless-ngx", job_name=~"paperless-backup-trigger.*"}) > 129600
            )
            or
            absent(kube_job_status_completion_time{namespace="paperless-ngx", job_name=~"paperless-backup-trigger.*"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Paperless document export has not succeeded recently"
            description: "No successful paperless-backup-trigger job for over 36h. The S3 sidecar keeps syncing, so the bucket looks healthy while its content silently ages. NOTE: this alert only covers the export, not the upload to S3. The upload half is covered by OffsiteBackupNotArriving below."

        # Die drei Alerts oben belegen, dass ein Job gelaufen ist. Dieser hier
        # belegt, dass etwas im Bucket ANGEKOMMEN ist, und das ist nicht
        # dasselbe: bei paperless laeuft der Upload im Sidecar auf eigenem
        # Timer, und bei HA gibt es ueberhaupt keinen Job. Der CronJob
        # offsite-backup-freshness (manifests/backup-monitor/) prueft das einmal
        # taeglich um 06:00 UTC und endet mit exit 1, sobald ein Bucket zu alt
        # ist.
        #
        # Der erste Zweig braucht die Altersbedingung, sonst meldet der Alert
        # ewig weiter: failedJobsHistoryLimit haelt fehlgeschlagene Jobs am
        # Leben, ein blosses "max(...) > 0" bliebe also auch dann feuernd, wenn
        # der naechste Lauf laengst wieder gruen war. Die 90000s (25h) decken
        # genau einen Tagesabstand ab.
        #
        # Kein "for": ein fehlgeschlagener Job bleibt fehlgeschlagen, da wartet
        # nichts darauf, sich von selbst zu erholen. Der absent-Zweig faengt den
        # Fall, dass der CronJob verschwindet, wie bei den drei Alerts oben, der
        # mittlere den Fall, dass er gar nicht mehr zum Laufen kommt.
        - alert: OffsiteBackupNotArriving
          expr: |
            (
              max(
                kube_job_status_failed{namespace="monitoring", job_name=~"offsite-backup-freshness.*"} > 0
                and on(job_name)
                (time() - kube_job_created{namespace="monitoring", job_name=~"offsite-backup-freshness.*"} < 90000)
              ) > 0
            )
            or
            (
              time() - max(kube_job_status_completion_time{namespace="monitoring", job_name=~"offsite-backup-freshness.*"}) > 172800
            )
            or
            absent(kube_job_status_completion_time{namespace="monitoring", job_name=~"offsite-backup-freshness.*"})
          labels:
            severity: warning
          annotations:
            summary: "An offsite backup bucket has stopped receiving objects"
            description: "The daily offsite-backup-freshness check failed, or has not succeeded for over 48h. At least one of the three S3 buckets has received nothing new for longer than its threshold, which the per-job alerts above cannot see. Run `kubectl -n monitoring logs job/<last offsite-backup-freshness job>` for the per-bucket ages."

    # Pod and container alerts
    - name: pod-health
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{job!~".*cronjob.*"}[15m]) > 0
            and
            kube_pod_owner{owner_kind!="Job"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod is crash looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is restarting frequently."

        # Job-owned pods are excluded, same as in PodCrashLooping above. A Job
        # that retries leaves its failed attempt lying around until the
        # controller cleans up, which used to fire this alert on every k3s
        # upgrade and on every CronJob retry. Genuinely failed Jobs are already
        # covered by the upstream KubeJobFailed, so this closes no gap.
        - alert: PodNotReady
          expr: |
            kube_pod_status_phase{phase!~"Succeeded|Running"} > 0
            and
            kube_pod_owner{owner_kind!="Job"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in {{ $labels.phase }} state for more than 10 minutes."

    # Node alerts
    - name: node-health
      interval: 30s
      rules:
        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node is under memory pressure"
            description: "Node {{ $labels.node }} is experiencing memory pressure."

        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node is under disk pressure"
            description: "Node {{ $labels.node }} is experiencing disk pressure."

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node is not ready"
            description: "Node {{ $labels.node }} is not ready. Check node status immediately."

        - alert: NodeHighCPU
          expr: |
            (
              100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
            ) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node CPU usage is high"
            description: "Node {{ $labels.instance }} CPU usage is {{ $value | humanize }}% (threshold: 80%)."

        - alert: NodeHighMemory
          expr: |
            (
              (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) /
              node_memory_MemTotal_bytes
            ) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node memory usage is high"
            description: "Node {{ $labels.instance }} memory usage is {{ $value | humanizePercentage }} (threshold: 85%)."

    # TeslaMate data freshness alerts
    - name: teslamate
      interval: 60s
      rules:
        # Fires when TeslaMate stopped recording data (e.g. expired Tesla API
        # token). Threshold is generous to tolerate a car sleeping while parked;
        # raise it if you get false positives during long idle periods.
        - alert: TeslaMateNoData
          expr: max by (car_id) (teslamate_last_data_age_seconds) > 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TeslaMate hat seit über 24h keine Daten empfangen"
            description: "Auto {{ $labels.car_id }}: letzter Datenpunkt vor {{ $value | humanizeDuration }}. Tesla-API-Token prüfen (Sign-in in der TeslaMate-Web-UI) und teslamate-Logs kontrollieren."

        # Safety net: if the exporter itself is down the metric disappears, which
        # would otherwise silence TeslaMateNoData without anyone noticing.
        - alert: TeslaMateFreshnessExporterDown
          expr: absent(teslamate_last_data_age_seconds)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "TeslaMate Freshness-Exporter liefert keine Metrik"
            description: "teslamate_last_data_age_seconds fehlt seit >30m. Der No-Data-Alert ist damit blind. Deployment teslamate/teslamate-postgres-exporter prüfen."

    # UniFi-Poller. Bis zum Sprung auf v3 gab es hier gar nichts: ein stiller
    # unpoller hat die UniFi-Dashboards einfach leer laufen lassen, ohne dass
    # es jemandem aufgefallen waere. v3 liefert zwei Selbstauskunfts-Metriken,
    # auf denen sich das sauber aufsetzen laesst.
    - name: unifi-poller
      interval: 30s
      rules:
        # Der Hauptalert. Ab v3 bedient unpoller /metrics aus einem Cache, den
        # ein Hintergrund-Poller alle 30s erneuert. Waechst das Alter, kommt
        # unpoller nicht mehr an den Controller: die Werte sind dann zwar noch
        # da, aber eingefroren, und genau das sieht man im Graphen nicht.
        # 300s ist das Zehnfache des Intervalls, also weit jenseits von Jitter.
        - alert: UnpollerCacheStale
          expr: unpoller_prometheus_cache_age_seconds > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "unpoller liefert eingefrorene UniFi-Daten"
            description: "Der Metrik-Cache ist {{ $value | humanizeDuration }} alt (erwartet: <30s). unpoller erreicht den Controller https://192.168.2.1 nicht mehr oder wird abgewiesen. UniFi-Dashboards zeigen ab jetzt Standdaten."

        # Zaehlt fehlgeschlagene Hintergrund-Aktualisierungen. Faengt den Fall,
        # dass einzelne Polls scheitern, aber genug durchkommen, damit das
        # Cache-Alter unter der Schwelle bleibt. Typisch: 429-Backoff oder ein
        # abgelaufenes Controller-Passwort.
        - alert: UnpollerRefreshFailing
          expr: increase(unpoller_prometheus_refresh_failures_total[15m]) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "unpoller scheitert wiederholt am UniFi-Controller"
            description: "{{ $value | printf \"%.0f\" }} fehlgeschlagene Aktualisierungen in 15min. Zugangsdaten des Benutzers readonly und Erreichbarkeit des Controllers pruefen (kubectl logs -n monitoring -l app.kubernetes.io/name=unpoller)."

        # Sicherheitsnetz, gleiche Logik wie bei TeslaMate: faellt unpoller
        # ganz aus, verschwinden beide Metriken und die Alerts oben werden
        # still, statt zu feuern.
        - alert: UnpollerDown
          expr: absent(unpoller_prometheus_cache_age_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "unpoller liefert keine Metriken mehr"
            description: "unpoller_prometheus_cache_age_seconds fehlt seit >15m. Die beiden anderen unpoller-Alerts sind damit blind. Deployment monitoring/unifi-poller pruefen."

    # SealedSecrets. Der Controller wurde bis 2026-08-05 gar nicht gescrapt,
    # der ServiceMonitor haengt jetzt an apps/sealed-secrets.yaml.
    #
    # Das Ziel ist genau EIN Signal: ein SealedSecret, das sich nicht mehr
    # entschluesseln laesst. Das ist der Fall, der sonst erst beim naechsten
    # Cluster-Neuaufbau auffaellt, und SealedSecrets sind nicht
    # rueckentschluesselbar. Key-Alter oder Cert-Ablauf lassen sich hier NICHT
    # alarmieren, dafuer gibt es keine Metrik.
    - name: sealed-secrets
      interval: 60s
      rules:
        # condition_info ist -1 (false), 0 (unknown/absent) oder 1 (true).
        # Alarmiert wird nur auf -1: 0 steht auch fuer "Bedingung noch nicht
        # gesetzt" und waere direkt nach dem Anlegen eines SealedSecrets ein
        # Fehlalarm.
        #
        # Haeufigste Ursache ist nicht ein kaputtes Secret, sondern ein
        # fehlender privater Key: versiegelt wird immer gegen den laufenden
        # Controller, und der rotiert alle 30 Tage. Wer die alten
        # sealed-secrets-key*-Secrets in kube-system verliert, verliert damit
        # alles, was gegen sie versiegelt wurde.
        - alert: SealedSecretUnsealFailed
          expr: sealed_secrets_controller_condition_info{condition="Synced"} == -1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SealedSecret laesst sich nicht mehr entschluesseln"
            description: "{{ $labels.namespace }}/{{ $labels.name }} steht auf Synced=False. Der zugehoerige Sealing-Key fehlt im Cluster (Secrets sealed-secrets-key* in kube-system) oder das Secret wurde gegen einen fremden Controller versiegelt. Das dahinterliegende Secret ist damit nicht neu erzeugbar: kubectl -n kube-system logs -l app.kubernetes.io/name=sealed-secrets pruefen, bevor irgendetwas geloescht wird."

        # Sicherheitsnetz, gleiche Logik wie bei unpoller und TeslaMate. Ohne
        # Scrape verschwindet condition_info und der Alert oben wird still,
        # statt zu feuern. build_info ist dafuer der stabilere Anker: es gibt
        # sie auch dann, wenn kein einziges SealedSecret existiert.
        - alert: SealedSecretsControllerDown
          expr: absent(sealed_secrets_controller_build_info)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SealedSecrets-Controller liefert keine Metriken mehr"
            description: "sealed_secrets_controller_build_info fehlt seit >15m. SealedSecretUnsealFailed ist damit blind. Deployment kube-system/sealed-secrets-controller und den ServiceMonitor sealed-secrets-controller pruefen."
