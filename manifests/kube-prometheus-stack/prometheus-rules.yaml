apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    # Two filters that exist because pve and macmini are scraped under
    # job=node-exporter as well:
    #
    # - readonly filesystems are excluded. They cannot fill up, and macOS
    #   mounts its CoreSimulator runtimes and the sealed system volume readonly
    #   at ~97% full by construction. The upstream mixin does the same.
    # - the /System/Volumes/* mountpoints report the same numbers from the same
    #   APFS container, so a full macmini would raise four alerts instead of one.
    - name: node-disk-space
      interval: 30s
      rules:
        - alert: NodeFilesystemSpaceWarning
          expr: |
            (
              node_filesystem_avail_bytes{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*|^/System/Volumes/(Preboot|Update|VM)$"} /
              node_filesystem_size_bytes{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*|^/System/Volumes/(Preboot|Update|VM)$"}
            ) < 0.20
            unless on (instance, device, mountpoint) node_filesystem_readonly == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node filesystem space is running low"
            description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $value | humanizePercentage }} available (threshold: 20%)."

        - alert: NodeFilesystemSpaceCritical
          expr: |
            (
              node_filesystem_avail_bytes{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*|^/System/Volumes/(Preboot|Update|VM)$"} /
              node_filesystem_size_bytes{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*|^/System/Volumes/(Preboot|Update|VM)$"}
            ) < 0.10
            unless on (instance, device, mountpoint) node_filesystem_readonly == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node filesystem space is critically low"
            description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $value | humanizePercentage }} available (threshold: 10%)."

        - alert: NodeFilesystemInodeWarning
          expr: |
            (
              node_filesystem_files_free{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*|^/System/Volumes/(Preboot|Update|VM)$"} /
              node_filesystem_files{mountpoint!~"^/run.*|^/sys.*|^/proc.*|^/dev.*|^/System/Volumes/(Preboot|Update|VM)$"}
            ) < 0.20
            unless on (instance, device, mountpoint) node_filesystem_readonly == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node filesystem inodes are running low"
            description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has only {{ $value | humanizePercentage }} inodes available."

    - name: longhorn-storage
      interval: 30s
      rules:
        - alert: LonghornVolumeSpaceWarning
          expr: |
            (
              kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".+"} / 
              kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+"}
            ) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume space usage is high"
            description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full (threshold: 80%)."

        - alert: LonghornVolumeSpaceCritical
          expr: |
            (
              kubelet_volume_stats_used_bytes{persistentvolumeclaim=~".+"} / 
              kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".+"}
            ) > 0.90
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume space usage is critical"
            description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full (threshold: 90%)."

        # longhorn_volume_robustness is one-hot, not an enum: every volume gets
        # four series (state=unknown|healthy|degraded|faulted) and exactly one
        # of them is 1. The obvious "== 2" and "== 3" match nothing at all,
        # max() over the whole metric is 1. Both alerts were silent from the
        # day they were written, found 2026-08-10.
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness{state="degraded"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume is degraded"
            description: "Volume {{ $labels.volume }} is in degraded state. Check replica health."

        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness{state="faulted"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume is faulted"
            description: "Volume {{ $labels.volume }} is in faulted state. Immediate action required!"

        - alert: LonghornNodeStorageWarning
          expr: |
            (
              longhorn_node_storage_usage_bytes / 
              longhorn_node_storage_capacity_bytes
            ) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn node storage usage is high"
            description: "Node {{ $labels.node }} storage is {{ $value | humanizePercentage }} full (threshold: 80%)."

        - alert: LonghornNodeStorageCritical
          expr: |
            (
              longhorn_node_storage_usage_bytes / 
              longhorn_node_storage_capacity_bytes
            ) > 0.90
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn node storage usage is critical"
            description: "Node {{ $labels.node }} storage is {{ $value | humanizePercentage }} full (threshold: 90%)."

        # Longhorn's own view of a node, which is not the kubelet's: these
        # conditions go false while the node stays Ready for Kubernetes, over a
        # kernel module missing after an upgrade, broken mount propagation, a
        # disk it can no longer write. A node that is really gone takes its
        # longhorn-manager and with it these series along, so the metric never
        # reaches 0 in that case: NodeNotReady covers it, not this rule.
        - alert: LonghornNodeNotReady
          expr: longhorn_node_status{condition="ready"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn haelt eine Node fuer nicht bereit"
            description: >-
              Node {{ $labels.node }} meldet sich bei Longhorn als nicht bereit,
              obwohl ihr longhorn-manager laeuft. Ihre Repliken zaehlen damit
              nicht mehr, Longhorn baut sie nach einer Wartezeit auf den
              uebrigen Nodes neu auf. Die betroffenen Volumes laufen bis dahin
              degraded auf einer einzigen Replik.

        # allowScheduling stays out of this on purpose: that is the manual
        # switch in the UI, false is intended there.
        - alert: LonghornDiskUnschedulable
          expr: |
            longhorn_disk_status{condition="schedulable"} == 0
            unless on (node) (longhorn_node_status{condition="ready"} == 0)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn plant auf einer Disk nichts mehr ein"
            description: >-
              Disk {{ $labels.disk }} auf Node {{ $labels.node }} nimmt keine
              neuen Repliken mehr an, obwohl die Node selbst bereit ist. Anders
              als bei LonghornNodeSchedulingBudgetLow ist das kein knapper
              Platz, sondern eine Absage von Longhorn selbst.

    # Scheduling budget, not actual usage. The alerts above measure what is on
    # disk; Longhorn schedules by REQUESTED volume size, and a disk can stop
    # accepting replicas long before it looks full (80% budget at 16% usage is
    # a normal operating point). The failure mode is a PVC stuck on Pending
    # with the volume on "Scheduling Failed", which is not an error state on
    # any existing object and therefore escapes every other Longhorn alert.
    #
    # Two rules decide whether a disk still accepts, the tighter one wins:
    #
    #   over-provisioning (100%): scheduled must stay below capacity - reserved
    #   minimum free      ( 25%): 25% of capacity must remain free afterwards
    #
    # PromQL cannot minimise two vectors element-wise, hence the bool
    # multiplication in the third rule. Ugly, but it keeps the alerts readable.
    - name: longhorn-scheduling
      interval: 30s
      rules:
        - record: homelab:longhorn_node_headroom_overprovisioning_bytes
          expr: |
            max by (node) (
                longhorn_node_storage_capacity_bytes
              - longhorn_node_storage_reservation_bytes
              - longhorn_node_storage_scheduled_bytes
            )

        - record: homelab:longhorn_node_headroom_minavailable_bytes
          expr: |
            max by (node) (
                0.75 * longhorn_node_storage_capacity_bytes
              - longhorn_node_storage_usage_bytes
            )

        # What this node still accepts: the minimum of both rules, never negative.
        - record: homelab:longhorn_node_schedulable_bytes
          expr: |
            clamp_min(
                (
                  homelab:longhorn_node_headroom_overprovisioning_bytes
                  <= bool
                  homelab:longhorn_node_headroom_minavailable_bytes
                ) * homelab:longhorn_node_headroom_overprovisioning_bytes
              + (
                  homelab:longhorn_node_headroom_overprovisioning_bytes
                  > bool
                  homelab:longhorn_node_headroom_minavailable_bytes
                ) * homelab:longhorn_node_headroom_minavailable_bytes
            , 0)

        # The largest volume the cluster can still create. Every volume needs
        # two replicas on two nodes in two zones (both anti-affinity settings
        # are false, so hard), and each node is its own zone: the second
        # largest node decides, which is what min(topk(2, ...)) yields.
        - record: homelab:longhorn_largest_placeable_volume_bytes
          expr: min(topk(2, homelab:longhorn_node_schedulable_bytes))

        - alert: LonghornNodeSchedulingBudgetLow
          expr: homelab:longhorn_node_schedulable_bytes < 20 * 1024 * 1024 * 1024
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn node nimmt kaum noch neue Repliken an"
            description: >-
              Node {{ $labels.node }} kann nur noch {{ $value | humanize1024 }}B
              an neuen Volumes aufnehmen. Sie faellt damit faktisch als Ziel aus,
              alle neuen Volumes landen auf den uebrigen Nodes. Das ist noch kein
              Ausfall, aber eine Fehlerdomaene weniger zur Auswahl.

        - alert: LonghornCannotPlaceLargeVolume
          expr: homelab:longhorn_largest_placeable_volume_bytes < 100 * 1024 * 1024 * 1024
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn kann keine grossen Volumes mehr anlegen"
            description: >-
              Das groesste Volume, das noch zwei Repliken unterbringt, waere
              {{ $value | humanize1024 }}B. Zum Vergleich: paperless-media ist
              50 GiB. Neue Volumes oberhalb dieser Groesse bleiben still auf
              Pending stehen.

        - alert: LonghornCannotPlaceVolume
          expr: homelab:longhorn_largest_placeable_volume_bytes < 20 * 1024 * 1024 * 1024
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn kann praktisch keine Volumes mehr anlegen"
            description: >-
              Es gibt keine zwei Nodes mehr, die zusammen ein Volume von mehr als
              {{ $value | humanize1024 }}B aufnehmen. Jede neue PVC bleibt auf
              Pending, jeder zugehoerige Pod startet nicht. Auch ein Rebuild
              nach einem Node-Ausfall findet dann kein Ziel mehr.

    # None of the Longhorn alerts above notices that backups stopped running.
    # The target is a 300 GB SMB share on the UniFi NAS; a silent failure there
    # would be expensive.
    - name: longhorn-backup
      interval: 60s
      rules:
        # Aimed at the result rather than a specific failure state, so it
        # catches every cause: share full, auth broken, NAS off, RecurringJob
        # failed, target unreachable.
        #
        # The "> 0" keeps volumes that were never backed up out, they report
        # last_backup_at = 0 and would fire forever. LonghornBackupNeverRan
        # covers those.
        #
        # The group-label join is the second half of that: last_backup_at keeps
        # the old timestamp when a volume leaves the backup group, so the "> 0"
        # alone lets it age into this alert forever. Only volumes that are
        # supposed to be backed up count.
        #
        # 36h, not 24h: one missed run (backup-daily at 02:00) stays quiet,
        # two consecutive ones do not.
        - alert: LonghornBackupStale
          expr: |
            (
              longhorn_volume_last_backup_at > 0
              and
              (time() - longhorn_volume_last_backup_at) > 129600
            )
            and on (volume)
            homelab_longhorn_volume_recurring_job_group_info{backup_group="enabled"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume has not been backed up recently"
            description: "Volume {{ $labels.volume }} had no successful backup for over 36h. Check the CIFS target //192.168.2.6/longhorn_backup (share full? NAS reachable? credentials still valid?)."

        # The other half of LonghornBackupStale, whose "> 0" deliberately lets
        # a never-backed-up volume through. Whether it SHOULD be backed up
        # lives only in the volume's group label, so the metric comes from the
        # customResourceState block in values.yaml.
        #
        # The age bound sits in the offset and not in a long "for": a fresh
        # volume legitimately has no backup until the 02:00 run, and a "for"
        # timer lives in memory and restarts with Prometheus. The offset reads
        # stored data and survives. It also stays quiet for 26h after rollout,
        # until the metric has that much history.
        - alert: LonghornBackupNeverRan
          expr: |
            (
              homelab_longhorn_volume_recurring_job_group_info{backup_group="enabled"}
              and
              homelab_longhorn_volume_recurring_job_group_info{backup_group="enabled"} offset 26h
            )
            unless on (volume) (longhorn_volume_last_backup_at > 0)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} soll gesichert werden, hat aber noch nie ein Backup gehabt"
            description: "Das Volume traegt recurring-job-group.longhorn.io/backup=enabled und meldet trotzdem last_backup_at = 0, seit ueber 26h. Typischer Fall: per fromBackup restauriert und der erste 02:00-Lauf steht noch aus, oder ein RecurringJob greift nicht. Backup von Hand erzwingen: Snapshot-CR plus Backup-CR mit RecurringJob: backup-daily in spec.labels, Rezept in operations.md."

        # Net below both rules above, which go quiet instead of firing when the
        # group metric disappears. TargetDown does not cover this: it needs an
        # existing up series, so a kube-state-metrics target that vanishes
        # entirely takes the alert with it. It also catches ksm running fine
        # while its customResourceState block or the longhorn RBAC rule broke,
        # which nothing else would show.
        - alert: LonghornBackupGroupMetricMissing
          expr: absent(homelab_longhorn_volume_recurring_job_group_info)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Die Longhorn-Gruppenlabel-Metrik fehlt, zwei Backup-Alerts sind blind"
            description: "homelab_longhorn_volume_recurring_job_group_info liefert nichts. Solange das so ist, koennen LonghornBackupStale und LonghornBackupNeverRan nicht mehr feuern. Kommt aus kube-state-metrics: Pod da? Und liefert der customResourceState-Block noch? kubectl -n monitoring get pods -l app.kubernetes.io/name=kube-state-metrics und kubectl -n monitoring logs deploy/kube-prometheus-stack-kube-state-metrics | grep -i 'custom resource'"

        # Fires earlier than the alert above and names the concrete backup.
        # longhorn_backup_state: 0=New 1=Pending 2=InProgress 3=Completed
        # 4=Error 5=Unknown.
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn backup failed"
            description: "Backup {{ $labels.backup }} of volume {{ $labels.volume }} is in Error state."

        # The share has no exporter of its own, so this sums backup sizes
        # instead of reading real share statistics. An underestimate, because
        # Longhorn deduplicates blocks, but good enough as an early warning.
        # 240 GiB = 80% of the 300 GB share.
        - alert: LonghornBackupStoreSpaceWarning
          expr: sum(longhorn_backup_actual_size_bytes) > 257698037760
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn backup store is filling up"
            description: "Backups on //192.168.2.6/longhorn_backup total {{ $value | humanize1024 }}B (threshold: 240GiB of 300GB). Longhorn does NOT free space by itself when the share is full, backups just start failing. Reduce retain values or drop volumes from the backup group."

    # Offsite backup jobs (S3).
    #
    # KubeJobFailed and KubeJobNotCompleted report a job that runs and fails or
    # hangs. They do not report the case that matters more for a backup: a job
    # that stopped running at all (dropped from the kustomization, suspended,
    # schedule typo). The anchor is therefore the AGE of the last successful
    # job, like LonghornBackupStale above.
    #
    # Two things this construction hangs on:
    #
    # 1. The "or absent(...)" is the core. If the CronJob disappears so do its
    #    jobs and the metric, and the alert would evaporate exactly in the
    #    worst case. It stands per job rather than over a shared selector,
    #    because absent() across several only fires once ALL are missing.
    # 2. The metric only lives while the job object does
    #    (successfulJobsHistoryLimit: 3). Shrinking that history breaks this.
    #
    # Trigger such a job once by hand after its first deployment
    # (kubectl create job --from=cronjob/<name>), otherwise the absent branch
    # fires rightfully until the first scheduled run.
    #
    # NOT covered: whether the object actually arrived in S3. That needs an S3
    # metric source, see ROADMAP.
    - name: offsite-backup-jobs
      interval: 60s
      rules:
        # Daily at 01:30 UTC. 36h as with Longhorn: one missed run stays quiet,
        # two consecutive ones do not.
        - alert: TeslaMateBackupJobStale
          expr: |
            (
              time() - max(kube_job_status_completion_time{namespace="teslamate", job_name=~"teslamate-db-backup.*"}) > 129600
            )
            or
            absent(kube_job_status_completion_time{namespace="teslamate", job_name=~"teslamate-db-backup.*"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TeslaMate database backup has not succeeded recently"
            description: "No successful teslamate-db-backup job for over 36h (or the CronJob is gone entirely). This is the ONLY offsite copy of the driving history. Check `kubectl -n teslamate get cronjob,job` and the logs of the last attempt."

        # Runs on the 1st only. The longest regular gap is 31 days, so 35
        # leaves four days of slack and still reports long before the next run
        # would be due. This job has the longest blind window of all.
        - alert: HomeAssistantArchiveJobStale
          expr: |
            (
              time() - max(kube_job_status_completion_time{namespace="home-assistant", job_name=~"ha-backup-archive.*"}) > 3024000
            )
            or
            absent(kube_job_status_completion_time{namespace="home-assistant", job_name=~"ha-backup-archive.*"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Home Assistant monthly archive job has not succeeded recently"
            description: "No successful ha-backup-archive job for over 35 days (or the CronJob is gone entirely). Without it the S3 bucket only holds HA's last 3 automatic backups, so the long-term restore point stops growing. Check `kubectl -n home-assistant get cronjob,job`."

        # Covers the export half ONLY. The S3 sidecar uploads on its own
        # timer, so a successful job proves nothing about S3. Still worth it:
        # if the export stops, the sidecar keeps syncing the same stale state.
        - alert: PaperlessExportJobStale
          expr: |
            (
              time() - max(kube_job_status_completion_time{namespace="paperless-ngx", job_name=~"paperless-backup-trigger.*"}) > 129600
            )
            or
            absent(kube_job_status_completion_time{namespace="paperless-ngx", job_name=~"paperless-backup-trigger.*"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Paperless document export has not succeeded recently"
            description: "No successful paperless-backup-trigger job for over 36h. The S3 sidecar keeps syncing, so the bucket looks healthy while its content silently ages. NOTE: this alert only covers the export, not the upload to S3. The upload half is covered by OffsiteBackupNotArriving below."

        # The three alerts above prove a job ran. This one proves something
        # ARRIVED in the bucket, which is not the same: paperless uploads from
        # a sidecar on its own timer and HA has no job at all. The CronJob
        # offsite-backup-freshness (manifests/backup-monitor/) checks daily at
        # 06:00 UTC and exits 1 as soon as a bucket is too old.
        #
        # The first branch needs the age condition: failedJobsHistoryLimit
        # keeps failed jobs around, so a bare "max(...) > 0" would keep firing
        # long after the next run went green. 90000s covers one daily gap.
        #
        # No "for": a failed job stays failed, nothing recovers on its own.
        - alert: OffsiteBackupNotArriving
          expr: |
            (
              max(
                kube_job_status_failed{namespace="monitoring", job_name=~"offsite-backup-freshness.*"} > 0
                and on(job_name)
                (time() - kube_job_created{namespace="monitoring", job_name=~"offsite-backup-freshness.*"} < 90000)
              ) > 0
            )
            or
            (
              time() - max(kube_job_status_completion_time{namespace="monitoring", job_name=~"offsite-backup-freshness.*"}) > 172800
            )
            or
            absent(kube_job_status_completion_time{namespace="monitoring", job_name=~"offsite-backup-freshness.*"})
          labels:
            severity: warning
          annotations:
            summary: "An offsite backup bucket has stopped receiving objects"
            description: "The daily offsite-backup-freshness check failed, or has not succeeded for over 48h. At least one of the six checks (teslamate, home assistant, paperless heartbeat, and one per etcd server node) has received nothing new for longer than its threshold, which the per-job alerts above cannot see. Run `kubectl -n monitoring logs job/<last offsite-backup-freshness job>` for the individual ages."

    - name: cloudflare
      interval: 60s
      rules:
        # Cloudflare notifies about Security Center findings nowhere, they only
        # sit in the dashboard. The CronJob cloudflare-security-insights
        # (manifests/security-insights/) asks daily at 07:00 UTC for everything
        # not archived and exits 1 if anything is left.
        #
        # Same shape as OffsiteBackupNotArriving: the age condition is needed
        # because failedJobsHistoryLimit keeps failed jobs around, and a bare
        # "> 0" would keep firing after the next run went green.
        - alert: CloudflareSecurityInsightsFinding
          expr: |
            (
              max(
                kube_job_status_failed{namespace="monitoring", job_name=~"cloudflare-security-insights.*"} > 0
                and on(job_name)
                (time() - kube_job_created{namespace="monitoring", job_name=~"cloudflare-security-insights.*"} < 90000)
              ) > 0
            )
            or
            (
              time() - max(kube_job_status_completion_time{namespace="monitoring", job_name=~"cloudflare-security-insights.*"}) > 172800
            )
            or
            absent(kube_job_status_completion_time{namespace="monitoring", job_name=~"cloudflare-security-insights.*"})
          labels:
            severity: warning
          annotations:
            summary: "Cloudflare Security Center has an unarchived finding"
            description: "The daily cloudflare-security-insights check failed, or has not succeeded for over 48h. Either an insight is sitting unarchived in the Security Center, or the token lost its permission. Run `kubectl -n monitoring logs job/<last cloudflare-security-insights job>` to see which. Archive findings you accept in the dashboard and they disappear here too."

    - name: pod-health
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{job!~".*cronjob.*"}[15m]) > 0
            and
            kube_pod_owner{owner_kind!="Job"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod is crash looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is restarting frequently."

        # Job-owned pods are excluded, same as PodCrashLooping above: a
        # retrying Job leaves its failed attempt around until the controller
        # cleans up. Real Job failures are covered by upstream KubeJobFailed.
        - alert: PodNotReady
          expr: |
            kube_pod_status_phase{phase!~"Succeeded|Running"} > 0
            and
            kube_pod_owner{owner_kind!="Job"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in {{ $labels.phase }} state for more than 10 minutes."

    - name: node-health
      interval: 30s
      rules:
        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node is under memory pressure"
            description: "Node {{ $labels.node }} is experiencing memory pressure."

        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node is under disk pressure"
            description: "Node {{ $labels.node }} is experiencing disk pressure."

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node is not ready"
            description: "Node {{ $labels.node }} is not ready. Check node status immediately."

        - alert: NodeHighCPU
          expr: |
            (
              100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
            ) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node CPU usage is high"
            description: "Node {{ $labels.instance }} CPU usage is {{ $value | humanize }}% (threshold: 80%)."

        - alert: NodeHighMemory
          expr: |
            (
              (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) /
              node_memory_MemTotal_bytes
            ) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node memory usage is high"
            description: "Node {{ $labels.instance }} memory usage is {{ $value | humanizePercentage }} (threshold: 85%)."

        # macmini needs its own rule: darwin's node_exporter uses different
        # metric names (node_memory_total_bytes and the Mach page classes), so
        # the rule above and the mixin's NodeMemoryHighUtilization silently
        # match nothing there.
        #
        # "Available" on macOS is free + inactive + purgeable; wired, active
        # and compressed are in use. Both sides add up to the total.
        - alert: NodeHighMemoryDarwin
          expr: |
            (
              1 - (
                (node_memory_free_bytes + node_memory_inactive_bytes + node_memory_purgeable_bytes) /
                node_memory_total_bytes
              )
            ) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node memory usage is high (macOS)"
            description: "Node {{ $labels.instance }} memory usage is {{ $value | humanizePercentage }} (threshold: 85%)."

    - name: teslamate
      interval: 60s
      rules:
        # Fires when TeslaMate stopped recording (e.g. expired API token).
        # The threshold tolerates a car sleeping while parked.
        - alert: TeslaMateNoData
          expr: max by (car_id) (teslamate_last_data_age_seconds) > 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TeslaMate hat seit über 24h keine Daten empfangen"
            description: "Auto {{ $labels.car_id }}: letzter Datenpunkt vor {{ $value | humanizeDuration }}. Tesla-API-Token prüfen (Sign-in in der TeslaMate-Web-UI) und teslamate-Logs kontrollieren."

        # Safety net: without a scrape the metric disappears and the alert
        # above goes silent instead of firing.
        - alert: TeslaMateFreshnessExporterDown
          expr: absent(teslamate_last_data_age_seconds)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "TeslaMate Freshness-Exporter liefert keine Metrik"
            description: "teslamate_last_data_age_seconds fehlt seit >30m. Der No-Data-Alert ist damit blind. Deployment teslamate/teslamate-postgres-exporter prüfen."

    # A silent unpoller leaves the UniFi dashboards empty without anyone
    # noticing. The two self-reporting metrics added in v3 make that visible.
    - name: unifi-poller
      interval: 30s
      rules:
        # Since v3 unpoller serves /metrics from a cache refreshed every 30s.
        # A growing cache age means it can no longer reach the controller: the
        # values are still there but frozen, which a graph does not show.
        # 300s is ten times the interval, well beyond jitter.
        - alert: UnpollerCacheStale
          expr: unpoller_prometheus_cache_age_seconds > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "unpoller liefert eingefrorene UniFi-Daten"
            description: "Der Metrik-Cache ist {{ $value | humanizeDuration }} alt (erwartet: <30s). unpoller erreicht den Controller https://192.168.2.1 nicht mehr oder wird abgewiesen. UniFi-Dashboards zeigen ab jetzt Standdaten."

        # Catches the case where individual polls fail but enough get through
        # to keep the cache age below the threshold. Typically a 429 backoff
        # or an expired controller password.
        - alert: UnpollerRefreshFailing
          expr: increase(unpoller_prometheus_refresh_failures_total[15m]) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "unpoller scheitert wiederholt am UniFi-Controller"
            description: "{{ $value | printf \"%.0f\" }} fehlgeschlagene Aktualisierungen in 15min. Zugangsdaten des Benutzers readonly und Erreichbarkeit des Controllers pruefen (kubectl logs -n monitoring -l app.kubernetes.io/name=unpoller)."

        # Safety net: if unpoller dies both metrics disappear and the alerts
        # above go silent instead of firing.
        - alert: UnpollerDown
          expr: absent(unpoller_prometheus_cache_age_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "unpoller liefert keine Metriken mehr"
            description: "unpoller_prometheus_cache_age_seconds fehlt seit >15m. Die beiden anderen unpoller-Alerts sind damit blind. Deployment monitoring/unifi-poller pruefen."

    # SealedSecrets, ServiceMonitor in apps/sealed-secrets.yaml. Exactly one
    # signal matters: a SealedSecret that can no longer be decrypted, which
    # would otherwise surface at the next cluster rebuild. Key age and cert
    # expiry cannot be alerted on, there is no metric for them.
    - name: sealed-secrets
      interval: 60s
      rules:
        # condition_info is -1 (false), 0 (unknown/absent) or 1 (true). Only
        # -1 alerts: 0 also means "condition not set yet" and would be a false
        # alarm right after creating a SealedSecret.
        #
        # The usual cause is a missing private key rather than a broken secret.
        # Sealing always happens against the running controller, which rotates
        # every 30 days: losing the old sealed-secrets-key* secrets in
        # kube-system loses everything sealed against them.
        - alert: SealedSecretUnsealFailed
          expr: sealed_secrets_controller_condition_info{condition="Synced"} == -1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "SealedSecret laesst sich nicht mehr entschluesseln"
            description: "{{ $labels.namespace }}/{{ $labels.name }} steht auf Synced=False. Der zugehoerige Sealing-Key fehlt im Cluster (Secrets sealed-secrets-key* in kube-system) oder das Secret wurde gegen einen fremden Controller versiegelt. Das dahinterliegende Secret ist damit nicht neu erzeugbar: kubectl -n kube-system logs -l app.kubernetes.io/name=sealed-secrets pruefen, bevor irgendetwas geloescht wird."

        # Safety net: without a scrape condition_info disappears and the alert
        # above goes silent. build_info is the stabler anchor, it exists even
        # when no SealedSecret does.
        - alert: SealedSecretsControllerDown
          expr: absent(sealed_secrets_controller_build_info)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "SealedSecrets-Controller liefert keine Metriken mehr"
            description: "sealed_secrets_controller_build_info fehlt seit >15m. SealedSecretUnsealFailed ist damit blind. Deployment kube-system/sealed-secrets-controller und den ServiceMonitor sealed-secrets-controller pruefen."

    # Gatus measures from outside what Prometheus measures from inside. Its
    # own alert providers stay unconfigured on purpose so that there is ONE
    # path (Alertmanager -> SNS) and silences live in one place.
    #
    # These thresholds sit deliberately ahead of those in the Gatus config:
    # the alert warns before the endpoint turns red on the dashboard.
    - name: gatus
      interval: 60s
      rules:
        # gatus_results_endpoint_success is a gauge (0 = check red). 10m also
        # covers the endpoints on a 5m interval, so one missed run stays quiet.
        - alert: GatusEndpointDown
          expr: gatus_results_endpoint_success == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Gatus: {{ $labels.group }}/{{ $labels.name }} ist rot"
            description: "Der Check {{ $labels.group }}/{{ $labels.name }} (Typ {{ $labels.type }}) scheitert seit >10m. Welche Bedingung genau, steht auf https://status.elmstreet79.de. Faustregel: ist die Gruppe Cluster komplett rot und Infrastruktur gruen, liegt es an Traefik oder am Wildcard-Cert, nicht an den Diensten."

        # Without this, a stalled renewal of the wildcard cert only surfaces
        # once a browser complains. The "> 0" branch is mandatory: the metric
        # is 0 for endpoints without TLS (TCP, DNS, http), which would
        # otherwise all fire immediately.
        - alert: GatusCertificateExpiringSoon
          expr: gatus_results_certificate_expiration_seconds > 0 < 1209600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Zertifikat fuer {{ $labels.name }} laeuft in <14 Tagen ab"
            description: "{{ $labels.group }}/{{ $labels.name }}: noch {{ $value | humanizeDuration }}. Bei *.elmstreet79.de zuerst cert-manager pruefen (Certificate wildcard-elmstreet79-de in cert-manager, ClusterIssuer letsencrypt-prod, Cloudflare-Token)."

        # Domain expiry comes from RDAP/WHOIS every 12h. An expired domain is
        # the one outage no redeploy fixes.
        - alert: GatusDomainExpiringSoon
          expr: gatus_results_domain_expiration_seconds > 0 < 3888000
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "Domain {{ $labels.name }} laeuft in <45 Tagen ab"
            description: "{{ $labels.name }}: noch {{ $value | humanizeDuration }}. Verlaengerung beim Registrar pruefen (INWX bzw. Cloudflare)."

        # Safety net: without a scrape the gauges above disappear and the
        # alerts go silent. Gatus is the only source of these metrics, so an
        # outage blinds the whole group.
        - alert: GatusDown
          expr: absent(gatus_results_endpoint_success)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Gatus liefert keine Metriken mehr"
            description: "gatus_results_endpoint_success fehlt seit >15m, alle Gatus-Alerts sind damit blind. Deployment gatus/gatus und den ServiceMonitor gatus pruefen."

    # Every host in the house hangs off one wildcard cert from a single
    # ClusterIssuer (DNS-01 via Cloudflare).
    #
    # Ordered by how early they catch things: NotReady and RenewalOverdue fire
    # while the old cert is still valid, ExpiringSoon is the net below them.
    - name: cert-manager
      interval: 60s
      rules:
        # The metric carries three series per certificate (True/False/Unknown)
        # and exactly one is active. Without the condition="True" selector the
        # expression is permanently satisfied even for a healthy cert.
        - alert: CertManagerCertNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} ist nicht ready"
            description: "Ausgestellt ueber {{ $labels.issuer_kind }} {{ $labels.issuer_name }}. Das bestehende Cert gilt meist noch, die Erneuerung scheitert aber. kubectl describe certificate -n {{ $labels.namespace }} {{ $labels.name }}, dann die CertificateRequest und die Order dazu."

        # The metric is when cert-manager WANTS to renew (30 days before
        # expiry with Let's Encrypt). If that lies in the past, renewal was due
        # and did not happen. A successful run moves the value forward again.
        - alert: CertManagerCertRenewalOverdue
          expr: time() - certmanager_certificate_renewal_timestamp_seconds > 259200
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Erneuerung von {{ $labels.namespace }}/{{ $labels.name }} ist seit >3 Tagen ueberfaellig"
            description: "cert-manager wollte laengst erneuern und hat es nicht geschafft. Bis zum Ablauf bleiben noch Wochen, aber der Fehler ist jetzt schon da: haeufigste Ursache ist das Cloudflare-Token fuer die DNS-01-Challenge (SealedSecret in cert-manager) oder ein Rate-Limit bei Let's Encrypt."

        # Net below the two above, fires only after a week of failed renewal.
        - alert: CertManagerCertExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 1814400
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} laeuft in <21 Tagen ab"
            description: "Noch {{ $value | humanizeDuration }}. Bei *.elmstreet79.de haengt daran JEDER Host, intern wie oeffentlich. Gatus meldet dasselbe unabhaengig davon von aussen (GatusCertificateExpiringSoon), zwei Melder fuer denselben Ausfall sind hier Absicht."

        - alert: CertManagerClusterIssuerNotReady
          expr: certmanager_clusterissuer_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ClusterIssuer {{ $labels.name }} ist nicht ready"
            description: "Solange der Issuer haengt, kann kein einziges Zertifikat ausgestellt oder erneuert werden. Zuerst das Cloudflare-API-Token pruefen."

        # Let's Encrypt caps per domain and week. The usual way in is a loop of
        # failing orders, after which nothing can be issued for days.
        - alert: CertManagerAcmeRateLimited
          expr: sum(rate(certmanager_http_acme_client_request_count{status="429"}[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Let's Encrypt antwortet mit 429 (Rate-Limit)"
            description: "cert-manager laeuft ins ACME-Rate-Limit. Nicht weiter retriggern, sondern die Ursache der fehlschlagenden Orders suchen: die Limits gelten pro Domain und Woche."

        # Safety net. certmanager_clock_time_seconds is the stabler anchor
        # than the certificate metrics: it exists even with no Certificate.
        - alert: CertManagerDown
          expr: absent(certmanager_clock_time_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "cert-manager liefert keine Metriken mehr"
            description: "certmanager_clock_time_seconds fehlt seit >15m, alle cert-manager-Alerts sind damit blind. Deployment cert-manager/cert-manager und den ServiceMonitor cert-manager pruefen."

    # The 15 upstream rules (defaultRules.rules.etcd) cover outright failure;
    # this group only adds what is too coarse or missing for this cluster.
    # Scraped through etcd-scrapeconfig.yaml under job label "etcd".
    - name: etcd-homelab
      interval: 60s
      rules:
        # Upstream only fires at p99 > 0.5s. Its job is "etcd is about to
        # stop", not "the disk is getting slow", and the latter is the likelier
        # development here: /var/lib/etcd and /var/lib/longhorn share the same
        # EPHEMERAL partition on every node, so Longhorn IO and etcd's fsync
        # compete for one disk. The value grows with the node's replica count.
        #
        # When this fires the question is not which node broke but where extra
        # Longhorn load appeared. Redistributing replicas only moves the load
        # along the same curve; a separate disk for the Longhorn path would
        # help. 50ms is about four times the current peak.
        - alert: EtcdFsyncSlow
          expr: |
            histogram_quantile(0.99, sum by (node, le) (
              rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd"}[5m])
            )) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "etcd-fsync auf {{ $labels.node }} ist langsam (p99 {{ $value | humanizeDuration }})"
            description: "Die WAL-fsync-Dauer liegt ueber 50ms. etcd bestaetigt jeden Write erst nach dem fsync, eine langsame Platte bremst damit den gesamten API-Server. Auf jeder Node teilen sich /var/lib/etcd und /var/lib/longhorn dieselbe EPHEMERAL-Partition, der Wert haengt also an der Longhorn-Last dieser Node. Erst pruefen, ob dort Repliken neu aufgebaut werden (kubectl -n longhorn-system get replicas.longhorn.io -o wide): waehrend eines Rebuilds ist ein erhoehter Wert erwartbar und geht von selbst zurueck."

        # A member that keeps losing sight of the leader.
        #
        # Upstream's etcdHighNumberOfLeaderChanges checks a 15m window with
        # for: 5m and sleeps through this: the value oscillates around the
        # threshold, every dip resets the hold time, so the five minutes never
        # accumulate. A longer window does not have that problem.
        #
        # The counter is per member and means "I saw a different leader than
        # before". Rising on ONE member while the Raft term stands cluster-wide
        # means there was no election: that member repeatedly loses and regains
        # contact. Quorum is never at risk, which is why nothing else notices.
        #
        # The likeliest cause is the network, not the disk and not load. On
        # raspi5 it is end0's TX ring (siderolabs/sbc-raspberrypi#91 and
        # manifests/rpi5-net-tuning/): a stalled TX ring produces ZERO error
        # counters while disk, CPU, temperature, link speed, MTU and ICMP
        # latency all look fine. Concurrent Longhorn load is the misleading
        # trail, it is merely the traffic that first fills the undersized ring.
        #
        # So diagnosis does not start at the disk:
        #
        #   talosctl -n <all> etcd status     # compare term and index
        #   histogram_quantile(0.99, sum by (instance,To,le) (
        #     rate(etcd_network_peer_round_trip_time_seconds_bucket[10m])))
        #
        # The second expression is the decisive one: split by source AND
        # target it shows at once whether a node or a path is stuck. Summed by
        # target alone it looks as if all three were affected.
        #
        # 6 per hour sits above what a rolling Talos upgrade produces.
        - alert: EtcdMemberLosesLeader
          expr: |
            max by (node) (
              increase(etcd_server_leader_changes_seen_total{job="etcd"}[1h])
            ) > 6
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "etcd auf {{ $labels.node }} verliert staendig den Leader ({{ $value | printf \"%.0f\" }} Wechsel in einer Stunde)"
            description: "Dieser Member sieht laufend neue Leader, die anderen nicht. Zuerst mit talosctl etcd status pruefen, ob der Raft-Term wirklich steigt: steht er, hat es keine Wahl gegeben und der Member verliert nur wiederholt den Kontakt. Dann die Peer-Latenz nach Quelle UND Ziel aufschluesseln, nicht nur nach Ziel. Platte und CPU sind erst danach dran."

        # Net below every etcd alert: without it a dropped ScrapeConfig or a
        # missing listen-metrics-urls in a node's machine config just goes
        # quiet.
        #
        # Its limit: it counts targets, it does not check WHICH. After a node
        # swap that left the old node in the ScrapeConfig it still counts
        # three and stays quiet, while every etcd alert silently does not
        # apply to the new node. The list must follow the members.
        - alert: EtcdMetricsMissing
          expr: count(up{job="etcd"} == 1) < 3 or absent(up{job="etcd"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Es liefern nur {{ $value }} von 3 etcd-Membern Metriken"
            description: "Entweder ist ein Member weg (dann feuert auch etcdMembersDown), oder auf der Node fehlt der etcd-Patch listen-metrics-urls: http://0.0.0.0:2381 aus talos/talconfig.yaml und Port 2381 bindet wieder nur auf 127.0.0.1. Der Parameter greift erst nach einem Node-Reboot."

    # Fan control on raspi5, see manifests/rpi5-fan/.
    - name: rpi5-fan
      interval: 60s
      rules:
        # The controller replaces a missing kernel driver in userspace. If it
        # dies the fan stays at its last setting, and that is the failure you
        # do NOT hear: a quiet Pi sounds exactly like a quiet Pi with a dead
        # controller, except the second one heats up until it throttles.
        - alert: Rpi5FanControllerDown
          expr: absent(rpi5_fan_last_loop_timestamp_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Die Luefterregelung auf raspi5 liefert keine Metriken mehr"
            description: "Der Luefter steht auf seinem letzten Wert. Beim Beenden per SIGTERM setzt der Regler auf 100 Prozent, das gilt aber nicht, wenn der Pod hart stirbt oder gar nicht erst startet. Nachsehen mit: kubectl -n rpi5-fan logs ds/rpi5-fan"

        # The case neither absent() nor the liveness probe sees: the pod runs
        # and the metrics thread answers, but the control loop in the main
        # thread is stuck. The loop runs every 5s, so 120s is unambiguous.
        - alert: Rpi5FanControllerStalled
          expr: time() - rpi5_fan_last_loop_timestamp_seconds > 120
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Die Luefterregelung auf raspi5 laeuft, regelt aber nicht mehr"
            description: "Der letzte Regeldurchlauf ist {{ $value | humanizeDuration }} her, erwartet werden 5 Sekunden. Der Prozess lebt und antwortet auf /metrics, die Schleife steht aber. Pod neu starten: kubectl -n rpi5-fan rollout restart ds/rpi5-fan"

        # Second, independent view on the same problem. It also reports when
        # the controller runs fine but the curve is too weak or the fan is
        # mechanically stuck.
        - alert: Rpi5TooHot
          expr: rpi5_fan_temperature_celsius > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "raspi5 ist seit 10 Minuten ueber 80 Grad ({{ $value }} C)"
            description: "Ab 80 Grad drosselt der Pi 5 seinen Takt. Entweder reicht die Kennlinie in manifests/rpi5-fan/fan.py nicht, oder der Luefter dreht trotz Ansteuerung nicht."



    # Availability is measured by Gatus from outside (group DNS, including a
    # check that filtering actually happens) and surfaces as GatusEndpointDown.
    # This group only holds what Gatus cannot see from there.
    - name: blocky
      interval: 60s
      rules:
        # A lost scrape is not the same as a dead resolver: Blocky can answer
        # DNS and still have lost its metrics port. Conversely this catches the
        # LXC vanishing before any client notices.
        - alert: BlockyTargetDown
          expr: up{job="blocky-metrics"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Blocky {{ $labels.instance }} liefert keine Metriken mehr"
            description: "Das Ziel {{ $labels.instance }} antwortet seit >10m nicht auf /metrics. Ob DNS selbst noch geht, steht auf https://status.elmstreet79.de in der Gruppe DNS. Cluster-Instanz: kubectl -n blocky get pods. LXC: pct status 402 auf pve."

        # With loading.strategy: fast Blocky starts even when no download
        # succeeds and then answers fully but unfiltered. An undersized cache
        # is therefore silent: nothing red, nothing slow, just less blocked.
        # Measured 359k across the three lists. The threshold sits above the
        # 256k that remain when 1Hosts drops out, so losing either of the two
        # big lists trips it, with room for the lists to shrink.
        - alert: BlockyDenylistTooSmall
          expr: blocky_denylist_cache_entries < 300000
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Blockys Denylist {{ $labels.group }} hat nur {{ $value }} Eintraege"
            description: "Erwartet werden rund 359k (AdAway + oisd big + 1Hosts Lite). Bei deutlich weniger fehlt eine ganze Liste und {{ $labels.instance }} filtert entsprechend weniger. Logs ansehen: kubectl -n blocky logs -l app.kubernetes.io/name=blocky -c blocky --tail=-1"

        # The direct signal, and the one that fires first: a source that 404s
        # burns its five attempts on every refresh. increase() over a window
        # wider than refreshPeriod so a restart cannot hide a permanent
        # failure, guarded by the current counter so a fixed one clears with
        # the next start instead of lingering for 26h.
        - alert: BlockyDownloadsFailing
          expr: increase(blocky_failed_downloads_total[26h]) > 0 and blocky_failed_downloads_total > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Blocky auf {{ $labels.instance }} kann eine Blockliste nicht laden"
            description: "{{ $value | printf \"%.0f\" }} gescheiterte Downloads in 26h. Meist ist eine Quell-URL umgezogen oder verschwunden; mit loading.strategy: fast laeuft Blocky ohne diese Liste weiter. Welche es ist, steht im Log: kubectl -n blocky logs -l app.kubernetes.io/name=blocky -c blocky --tail=-1"

        # The lists reload every 24h (loading.refreshPeriod). If that stops
        # they age silently: blocking continues, just with stale data. 30h
        # tolerates one missed run.
        - alert: BlockyListsStale
          expr: time() - blocky_last_list_group_refresh_timestamp_seconds > 108000
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Blocky auf {{ $labels.instance }} hat seine Listen seit {{ $value | humanizeDuration }} nicht erneuert"
            description: "Erwartet wird alle 24h. Meist erreicht der Resolver die Download-Quellen nicht mehr; blocky_failed_downloads_total steigt dann mit. Das Blocking selbst laeuft mit dem alten Stand weiter."

        # Blocking can be switched off at runtime through Blocky's REST API,
        # unauthenticated. On the LXC that port is reachable from the guest
        # VLANs while the UniFi rule covers an address range instead of a port
        # list (see ROADMAP), so this rule is the only thing that would notice.
        - alert: BlockyBlockingDisabled
          expr: blocky_blocking_enabled == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Blocky auf {{ $labels.instance }} filtert nicht mehr"
            description: "Das Blocking ist zur Laufzeit abgeschaltet worden und geht durch einen Neustart von selbst wieder an, weil es nirgends in der Konfiguration steht. Wenn das niemand war, gehoert der Port 4000 dieser Instanz zugesperrt."

        # The only upstream is the local Unbound. If it dies Blocky keeps
        # answering from cache and returns SERVFAIL for everything else; the
        # error response ratio is the earliest signal.
        - alert: BlockyHighServfailRate
          expr: |
            sum by (instance) (rate(blocky_response_total{response_code="SERVFAIL"}[10m]))
              / clamp_min(sum by (instance) (rate(blocky_response_total[10m])), 0.001) > 0.1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Blocky auf {{ $labels.instance }} beantwortet {{ $value | humanizePercentage }} aller Anfragen mit SERVFAIL"
            description: "Fast immer der lokale Unbound: entweder tot, oder er kommt nicht mehr an die Root-Server. Cluster-Instanz: kubectl -n blocky logs -l app.kubernetes.io/name=blocky -c unbound --tail=-1. LXC: pct exec 402 -- rc-service unbound status"

        # The LXC pulls config.yml from the repo every 15 minutes so both
        # instances run the same state without a terraform apply. Persistent
        # failure breaks nothing: Blocky keeps running the old config, which
        # is exactly why nobody would notice.
        #
        # The metric comes from the node_exporter textfile collector in the
        # container, not from Blocky.
        - alert: BlockyConfigSyncFailing
          expr: blocky_config_sync_success == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Blocky-LXC holt die Konfiguration nicht mehr aus dem Repo"
            description: "Der Sync scheitert seit >1h. Die LXC laeuft mit einem aelteren Stand als die Cluster-Instanz. Von Hand anstossen und die Ausgabe lesen: pct exec 402 -- /etc/periodic/15min/blocky-config-sync"

    # Tado is the one integration that dies quietly. Its OAuth refresh token
    # rotates roughly every 10 minutes and only the newest one is usable; after
    # a hard kill or a longer outage the stored one can come back rejected with
    # a 400, and then every start ends in a reauth prompt that has to be
    # clicked in the UI. Measured in August 2026: twice unnoticed for 5h41 and
    # 3h03, both times after HA was gone for 7 minutes.
    #
    # The 400 itself cannot be alerted on. PyTado builds its logger with
    # Logger(__name__) instead of logging.getLogger(), so it has no parent and
    # its own handler: the error reaches the container's stderr and never HA's
    # log, where only the consequence ("Device login flow status is PENDING")
    # shows up.
    - name: home-assistant
      interval: 60s
      rules:
        # absent(), not == 0: the prometheus integration drops the labelset of
        # an entity that turns unavailable instead of reporting zero, so the
        # series disappears entirely. All nine tado_mode sensors go at once
        # because they hang off one coordinator, which is why a single rule
        # covers the whole set and one dead valve stays quiet. The up{} guard
        # keeps this about Tado, a dead HA is covered by pod-health and Gatus.
        #
        # Tado's own API also has short outages that heal by themselves, 5 and
        # 30 minutes in the same period, so a firing alert can resolve without
        # anyone doing anything.
        - alert: HomeAssistantTadoUnavailable
          expr: |
            absent(hass_entity_available{job="home-assistant", entity=~"sensor\\..*_tado_mode"})
              and on() up{job="home-assistant"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Tado liefert Home Assistant seit >15m keine Daten"
            description: "Die Heizungssteuerung ist weg, HA laeuft. Meist ist der Refresh-Token abgelehnt worden und HA wartet auf eine Neuanmeldung: Einstellungen, Geraete und Dienste, Tado. Der Grund steht nicht im HA-Log, sondern nur im Container-stderr: kubectl -n home-assistant logs deploy/home-assistant -c home-assistant | grep PyTado"

    # The cluster keeps itself current through Renovate. pve and the macmini
    # hang on nothing and are only noticed when someone thinks of them, which
    # is what these rules replace. pve reports through the apt and needrestart
    # textfile collectors, the macmini through its own softwareupdate one.
    - name: host-updates
      interval: 5m
      rules:
        # Security origins only. The full pending count is always non-zero on a
        # Proxmox host and would make this rule permanent noise. Three days of
        # grace so a freshly published update does not page on the same day.
        - alert: AptSecurityUpdatesPending
          expr: sum by (instance) (apt_upgrades_pending{origin=~".*security.*"}) > 0
          for: 72h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} hat seit drei Tagen {{ $value }} offene Security-Updates"
            description: "Ansehen mit: ssh pve 'apt update && apt list --upgradable'. Auf pve liegen talos-cp-1 und der Blocky-LXC, ein Reboot kostet also ein etcd-Member von dreien und fuer die Dauer den zweiten Resolver."

        # Set by /var/run/reboot-required, so it survives the upgrade itself and
        # only clears on the actual reboot. On pve that is practically only
        # dbus: nothing installs update-notifier-common, and the Proxmox kernel
        # does not write the flag. The kernel case is HostKernelOutdated below.
        - alert: NodeRebootRequired
          expr: node_reboot_required > 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} wartet seit einem Tag auf einen Reboot"
            description: "Ein Paket hat /var/run/reboot-required gesetzt. Der Reboot ist eine Entscheidung, keine Nebenwirkung: erst pruefen, was gerade auf pve laeuft."

        # needrestart_kernel_status_info: 1 current, 2 ABI upgrade, 3 version
        # upgrade. This is the only working kernel signal on a Proxmox host,
        # see NodeRebootRequired above.
        #
        # needrestart_services_total deliberately has NO rule. Every security
        # update leaves processes on replaced libraries and nothing clears that
        # before the next restart, so it would fire permanently. It is a
        # dashboard tile instead.
        - alert: HostKernelOutdated
          expr: needrestart_kernel_status_info > 1
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} laeuft seit einem Tag auf einem alten Kernel"
            description: "Installiert ist {{ $labels.expected }}, laufen tut {{ $labels.current }}. Das schliesst nur ein Reboot. Auf pve liegen talos-cp-1 und der Blocky-LXC, er kostet also ein etcd-Member von dreien und fuer die Dauer den zweiten Resolver."

        # macOS has no apt, so the collector behind this is a hand-written
        # LaunchAgent on the macmini that parses "softwareupdate --list", see
        # operations.md. Only the recommended ones alert; Apple also lists
        # optional items that nobody intends to install.
        #
        # Restarting the macmini is the expensive part, not the update: Plex,
        # node_exporter and the Actions-Runner all come back through
        # LaunchAgents at auto-login, but not before.
        - alert: MacosUpdatesPending
          expr: softwareupdate_pending_recommended > 0
          for: 72h
          labels:
            severity: warning
          annotations:
            summary: "macmini hat seit drei Tagen {{ $value }} offene macOS-Updates"
            description: "Ansehen mit: ssh macmini 'softwareupdate --list'. Einspielen von Hand, weil ein Neustart alle vier Dienste des macmini mitnimmt."

        # Net below all rules above: if a textfile stops being written they go
        # quiet instead of firing, and nothing else would show it. Every file
        # needs its own absent(), a combined one would only fire once ALL of
        # them are gone.
        - alert: HostUpdateMetricsStale
          expr: |
            (time() - node_textfile_mtime_seconds{file=~".+/(apt|needrestart|softwareupdate).prom"} > 172800)
              or absent(node_textfile_mtime_seconds{file=~".+/apt.prom"})
              or absent(node_textfile_mtime_seconds{file=~".+/needrestart.prom"})
              or absent(node_textfile_mtime_seconds{file=~".+/softwareupdate.prom"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Ein Update-Textfile-Collector liefert nichts Frisches mehr"
            description: "apt.prom, needrestart.prom oder softwareupdate.prom ist aelter als zwei Tage oder ganz weg. Solange das so ist, sind die Update-Alerts blind. Nachsehen: ssh pve 'ls -l /var/lib/prometheus/node-exporter/ && systemctl list-timers | grep -E \"apt|needrestart\"' bzw. ssh macmini 'ls -l /usr/local/var/lib/node_exporter/textfile_collector/ && launchctl print gui/501/com.speters.softwareupdate-collector'"

    # pve is scraped twice and the split decides which metric an alert may
    # use: node-exporter on 192.168.2.8 delivers the OS view (CPU, RAM, /,
    # updates) and is already covered by the node-* rules above; pve-exporter
    # delivers the API view, which nothing else sees. Only the second one is
    # in here.
    #
    # No CPU or memory rule: NodeHighCPU and NodeHighMemory already match this
    # host, and pve_node_cpus_total is 0, so pve_node_cpu_load cannot be
    # normalised anyway.
    - name: proxmox-host
      # The ServiceMonitor scrapes every 120s, a shorter evaluation would only
      # re-read the same sample.
      interval: 120s
      rules:
        # This is why the group exists. Debian's node-exporter carries "mnt" in
        # its default mount-points-exclude, so /mnt/nvme-2tb (1.8TB, holds the
        # disk of talos-cp-1) and /mnt/pve/nas-nfs have no NodeFilesystemSpace*
        # alert, without an error and without a gap in any dashboard. local-lvm
        # is a thin pool rather than a filesystem and node-exporter could never
        # see it. Covering this here keeps the fix in git instead of in an ARGS
        # line on the host.
        - alert: ProxmoxStorageSpaceWarning
          expr: pve_storage_used_bytes / (pve_storage_total_bytes > 0) > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox-Storage {{ $labels.storage }} ist zu {{ $value | humanizePercentage }} belegt"
            description: "Schwelle 85%. Fuer nvme-2tb, nas-nfs und local-lvm ist das der einzige Alarmweg, node-exporter sieht diese drei nicht. Auf nvme-2tb waechst die qcow2 von talos-cp-1 auch ohne neue Daten, wenn discard=on an der VM fehlt; nas-nfs ist das vzdump-Ziel und traegt zusaetzlich die Longhorn-Backups. Ansehen: ssh pve 'pvesm status'"

        - alert: ProxmoxStorageSpaceCritical
          expr: pve_storage_used_bytes / (pve_storage_total_bytes > 0) > 0.95
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Proxmox-Storage {{ $labels.storage }} ist zu {{ $value | humanizePercentage }} belegt"
            description: "Schwelle 95%. Laeuft nvme-2tb voll, friert talos-cp-1 ein und das Cluster verliert eines von drei etcd-Membern samt einer Longhorn-Replik. Auf nas-nfs treffen vzdump und die Longhorn-Backups zusammen, dort scheitern beide still. Ansehen: ssh pve 'pvesm status'"

        # On pve there are exactly two guests, and both are load-bearing. The
        # cluster reports the same outage one level up (NodeNotReady,
        # BlockyTargetDown); this one names the cause on the pve side and
        # separates "guest is stopped" from "network or metrics are gone".
        #
        # 10m so that a reboot of the LXC stays quiet. A guest reboot of the VM
        # does not show up here at all, qm keeps it as running.
        - alert: ProxmoxGuestStopped
          expr: pve_vm_status == 0 or pve_lxc_status == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Gast {{ $labels.name }} ({{ $labels.vmid }}) laeuft nicht mehr auf pve"
            description: "Die VM talos-cp-1 ist ein etcd-Member von dreien und traegt eine Longhorn-Replik, der LXC blocky ist der zweite Resolver auf 192.168.2.254. Status: ssh pve 'qm list && pct list'"

        # Net below both rules above: without it a dead exporter, an expired
        # API token or a switched-off pve just make them go quiet.
        - alert: ProxmoxMetricsMissing
          expr: absent(pve_node_up) or pve_node_up == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "pve-exporter liefert keine Proxmox-Metriken mehr"
            description: "pve_node_up fehlt oder steht auf 0, damit sind die Storage- und Gast-Alerts blind. Ursachen der Reihe nach: Deployment monitoring/proxmox-exporter, das API-Token im Secret pve-api-credentials, pve selbst. Pruefen: kubectl -n monitoring logs deploy/proxmox-exporter --tail=-1"

    # SMART for pve's two NVMes, and NOT from pve-exporter: the Proxmox API
    # knows nothing about disk health. The values come from nvme.prom, a
    # textfile collector of the prometheus-node-exporter-collectors package
    # that runs every 15 minutes. nvme0n1 carries pve-root and local-lvm,
    # nvme1n1 carries /mnt/nvme-2tb and with it talos-cp-1.
    #
    # smartmon.prom is gone (2026-08-14), file and timer both: its condition
    # ConditionPathExistsGlob=/dev/sd* never matched on an NVMe-only host, so
    # the file froze at smartmon_device_smart_healthy=1 and read like a health
    # signal while being a snapshot of a single old run.
    #
    # nvme_num_err_log_entries_total gets no rule either: the log also counts
    # harmless entries, an aborted identify by nvme-cli included.
    - name: proxmox-disks
      interval: 60s
      rules:
        # The device's own summary judgement, a bitmap: spare below threshold,
        # temperature outside spec, reliability degraded, media switched to
        # read-only, volatile memory backup failed. Any bit is a reason to have
        # a replacement in the house.
        - alert: NvmeCriticalWarning
          expr: nvme_critical_warning > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} auf {{ $labels.instance }} meldet einen SMART-Kritikalfehler"
            description: "critical_warning ist {{ $value }} (Bitmap: 1 Spare unter Schwelle, 2 Temperatur ausser Spezifikation, 4 Zuverlaessigkeit degradiert, 8 nur noch lesbar, 16 Backup des fluechtigen Speichers gescheitert). Vollstaendig: ssh pve 'nvme smart-log /dev/{{ $labels.device }}'. Liegt es an nvme1n1, haengt talos-cp-1 daran: erst pruefen, ob eine Longhorn-Replik dieser Node woanders vollstaendig ist."

        # Media errors are irreversible, so the counter alone would fire
        # forever. The window asks for NEW errors, the second condition keeps
        # it from firing on a counter reset after a reboot.
        - alert: NvmeMediaErrors
          expr: increase(nvme_media_errors_total[24h]) > 0 and nvme_media_errors_total > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} auf {{ $labels.instance }} hat neue Medienfehler"
            description: "{{ $value | printf \"%.0f\" }} neue nicht korrigierbare Datenfehler in 24h. Das sind verlorene Bloecke, keine Warnung: Backups pruefen und die Platte einplanen. ssh pve 'nvme smart-log /dev/{{ $labels.device }}'"

        # Early warning before bit 0 of critical_warning trips. The devices
        # report their own threshold at 0.1, this sits deliberately ahead of
        # it.
        - alert: NvmeSpareLow
          expr: nvme_available_spare_ratio < 0.2
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} auf {{ $labels.instance }} hat nur noch {{ $value | humanizePercentage }} Reserve-Bloecke"
            description: "Die eigene Schwelle des Geraets liegt bei 10%, darunter meldet es einen Kritikalfehler. Bis dahin ist Zeit fuer einen geplanten Tausch."

        - alert: NvmeWearHigh
          expr: nvme_percentage_used_ratio > 0.8
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} auf {{ $labels.instance }} hat {{ $value | humanizePercentage }} ihrer Schreiblast erreicht"
            description: "Der Hersteller rechnet ab 100% mit Ausfaellen, die Platte laeuft danach weiter. Ein Wert, der sich planen laesst: Verlauf im Node-Exporter-Dashboard ansehen und den Tausch terminieren."

        # 70 instead of the ~80 at which these devices throttle: the alert is
        # meant to arrive before the performance drop, not with it.
        - alert: NvmeTooHot
          expr: nvme_temperature_celsius > 70
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} auf {{ $labels.instance }} ist {{ $value }} Grad heiss"
            description: "Im Leerlauf liegen die beiden Platten bei 33 und 40 Grad. Ab rund 80 Grad drosseln sie, was auf nvme1n1 die IO von talos-cp-1 trifft. Meist steht der Luefter oder der Kuehlkoerper sitzt lose."

        # Net below every rule above. The file is rewritten every 15 minutes;
        # when that stops the values simply freeze and nothing fires, which is
        # what smartmon.prom did until it was removed.
        - alert: NvmeSmartMetricsStale
          expr: |
            (time() - node_textfile_mtime_seconds{file=~".+/nvme.prom"} > 3600)
              or absent(node_textfile_mtime_seconds{file=~".+/nvme.prom"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Die SMART-Werte von pve sind nicht mehr frisch"
            description: "nvme.prom ist aelter als eine Stunde oder ganz weg, obwohl der Timer alle 15 Minuten laeuft. Solange das so ist, sind alle Nvme*-Alerts blind und ein Plattenfehler faellt nur noch smartd auf. Pruefen: ssh pve 'systemctl list-timers prometheus-node-exporter-nvme.timer && ls -l /var/lib/prometheus/node-exporter/'"

    # ArgoCD is the one component nothing else watches: it rolls out every
    # other app, but a sync that keeps failing is only visible in its own UI.
    #
    # argocd_app_info carries one series per Application, labelled with the
    # current sync_status (Synced, OutOfSync, Unknown) and health_status
    # (Healthy, Progressing, Degraded, Suspended, Missing, Unknown). Both
    # labels change during any rollout, hence the long "for" on both rules:
    # the alert is about a state that stays, not about one being reached.
    - name: argocd
      interval: 60s
      rules:
        # Every app in this repo syncs automatically, so OutOfSync resolves
        # itself within a reconciliation cycle (30s). Half an hour of it means
        # the sync is failing, and the reason is in the app's own history.
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status!="Synced"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD: {{ $labels.name }} steht seit 30 Minuten auf {{ $labels.sync_status }}"
            description: "Der Selfheal kommt nicht durch. Grund steht unter https://argocd.elmstreet79.de/applications/{{ $labels.name }} unter History and Rollback, oder per kubectl -n argocd get app {{ $labels.name }} -o jsonpath='{.status.operationState.message}'. Haeufig ist es ein Manifest, das der API-Server ablehnt, oder eine CRD, die noch fehlt."

        # Suspended is excluded: it is the state of a deliberately paused app,
        # not a fault. Progressing stays in on purpose, past half an hour it
        # means a rollout is stuck rather than running.
        - alert: ArgoCDAppUnhealthy
          expr: argocd_app_info{health_status!~"Healthy|Suspended"}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD: {{ $labels.name }} ist seit 30 Minuten {{ $labels.health_status }}"
            description: "Die Ressourcen der App sind nicht gesund: Degraded oder Missing zeigt auf die App selbst, ein haengendes Progressing meist auf einen Pod, der nicht ready wird. Details unter https://argocd.elmstreet79.de/applications/{{ $labels.name }}."

        # Safety net: the metric only exists while the application-controller
        # is scraped, and both rules above go silent without it. That is the
        # blind spot that existed permanently until the metrics services were
        # deployed.
        - alert: ArgoCDMetricsMissing
          expr: absent(argocd_app_info)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD liefert keine Metriken mehr"
            description: "argocd_app_info fehlt seit >15m, die ArgoCD-Alerts und die HA-Kacheln sind damit blind. Der StatefulSet argocd/argocd-application-controller, der Service argocd-application-controller-metrics und der gleichnamige ServiceMonitor gehoeren geprueft. Der Service kommt aus homelab-terraform/argocd-talos/, nicht aus diesem Repo."
