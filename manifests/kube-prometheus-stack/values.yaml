# kube-prometheus-stack Helm values
# Optimized for Raspberry Pi homelab

# CRDs vor dem Operator aktualisieren.
#
# Helm aktualisiert CRDs grundsaetzlich nicht, ArgoCD rendert sie zwar mit
# (--include-crds) und wendet sie an, kommt beim Major-Upgrade aber nicht dazu:
# beim Sprung 80.13.2 -> 87.21.0 blockierte der Diff mit
#   ComparisonError: .spec.hostNetwork: field not declared in schema
# Die alertmanagers-CRD im Cluster kannte das Feld noch nicht, Chart 87 rendert
# es. ArgoCD diffed gegen das Cluster-Schema, scheitert, und wendet deshalb auch
# die neue CRD nie an. Henne-Ei, aufgeloest nur per manuellem
# kubectl apply --server-side aus dem Chart-Tarball.
#
# Der Job des crds-Subcharts nimmt genau diesen Schritt vorweg: PreSync-Hook,
# entpackt die mitgelieferten CRDs und wendet sie server-side an, bevor der
# Operator kommt. Mechanisch nichts Neues fuer uns, ArgoCD faehrt fuer diese App
# schon die admission-create/patch-Hooks derselben Bauart.
#
# forceConflicts ist Pflicht: ArgoCD ist durch ServerSideApply=true bereits
# Field-Manager der CRDs, ohne --force-conflicts scheitert der Job daran.
# Die Felder wandern dabei kurz an den Manager "kubectl" und beim folgenden
# Sync zurueck an ArgoCD. Inhaltlich identisch, also kein Dauer-Diff.
#
# Upstream markiert das Feature als preview. Bei Chart-Upgrades im Blick behalten.
crds:
  upgradeJob:
    enabled: true
    forceConflicts: true

# Global settings
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    kubeScheduler: false  # K3s scheduler metrics not exposed
    kubeControllerManager: false  # K3s controller metrics not exposed
    kubeProxy: false  # K3s uses kube-router instead of kube-proxy

# Ohne im Cluster erreichbaren Metrik-Endpoint, deshalb aus.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
# etcd laeuft auf allen drei Control-Plane-Nodes. enabled: true schaltet hier
# nur die Alert-Regeln und das etcd-Dashboard frei, gescrapt wird NICHT ueber
# den Chart, sondern ueber etcd-scrapeconfig.yaml.
#
# Grund: der Chart-Weg fuer externe etcd-Member ist `endpoints:`, und daraus
# entsteht ein Endpoints-Objekt. ArgoCD hat `Endpoints` und `EndpointSlice` in
# `resource.exclusions` und wendet sie deshalb nie an: der Service kaeme sauber
# im Cluster an, das Endpoints-Objekt lautlos nicht, also ein Ziel, das nie
# erscheint, ohne Fehlermeldung dazu. Service und ServiceMonitor bleiben darum
# aus, sonst stehen sie leer herum.
#
# Voraussetzung auf den Nodes ist listen-metrics-urls in talos/talconfig.yaml,
# sonst bindet Port 2381 nur auf 127.0.0.1.
kubeEtcd:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Steht in jedem Alert und damit in der Mail. Bei nur einem Cluster
    # redundant, aber das group_by in dieser Datei enthaelt 'cluster' ohnehin:
    # kommt je eine zweite Instanz dazu, die in dieselbe SNS-Topic alarmiert,
    # ist die Unterscheidung schon da.
    externalLabels:
      cluster: talos
    # Use EndpointSlice instead of deprecated Endpoints API (required for Kubernetes v1.33+)
    discoveryRole: endpointslice
    
    # Request reflects real TSDB usage (~1.3Gi) so the scheduler accounts
    # honestly for this pod instead of over-packing the node.
    resources:
      requests:
        cpu: 200m
        memory: 1280Mi
      limits:
        memory: 2Gi
    
    # Run on worker nodes only.
    #
    # arch ist hier bewusst zusaetzlich gesetzt und keine Doppelung: das
    # worker-Label tragen alle Nodes, es sagt nur "traegt Workloads". Prometheus
    # ist der speicherhungrigste Pod im Cluster, auf raspi5 waere er ein Problem
    # fuer die Node und fuer sich selbst. amd64 macht daraus eine Eigenschaft
    # der Hardware statt eines Versprechens ueber Labels.
    nodeSelector:
      node-role.kubernetes.io/worker: worker
      kubernetes.io/arch: amd64

    # Lifecycle hooks to prevent Longhorn volume attachment issues
    containers:
      - name: prometheus
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - sleep 10 && sync && umount /prometheus || true
    
    # Graceful shutdown period
    terminationGracePeriodSeconds: 120
    
    # Storage configuration
    # Labels select the Longhorn recurring-job groups (backup-daily/weekly/monthly,
    # snapshot-daily, snapshot-cleanup-daily, filesystem-trim-weekly).
    # Without these, the volume falls into the "default" group, which has no jobs.
    #
    # BEWUSST OHNE die backup-Gruppe. Dieses Volume ist sonst mit Abstand der
    # teuerste Posten im Backup-Bestand, in der Groessenordnung 97 GB von 126 GB
    # bei 37 GiB Live-Daten. Grund ist die Kombination aus TSDB und
    # Retention-Kette:
    # Prometheus schreibt seine Blocks permanent um, und jeder der bis zu 18
    # Behaltepunkte (7 daily + 4 weekly + 6 monthly + 1 yearly) haelt die
    # geaenderten Bloecke fest.
    #
    # Metriken sind regenerierbar und ohnehin auf retention: 30d begrenzt, ein
    # Restore aus einem Monate alten Backup waere wertlos. snapshot und
    # maintenance bleiben: Snapshots sind lokal und billig, filesystem-trim gibt
    # sogar Platz zurueck.
    #
    # ACHTUNG, diese Labels allein reichen nicht. Longhorn liest keine
    # PVC-Labels: die Gruppen eines dynamisch provisionierten Volumes kommen aus
    # dem "recurringJobSelector" der StorageClass (manifests/longhorn/values.yaml),
    # und der setzt backup, snapshot und maintenance. Das frisch provisionierte
    # Volume traegt also backup, egal was hier steht.
    #
    # Nach jedem Neuanlegen dieses Volumes (Cluster-Neubau, PVC geloescht und
    # neu gebunden) muss die Gruppe deshalb von Hand wieder weg, sonst landet
    # die TSDB erneut im Backup:
    #
    #   kubectl -n longhorn-system label volumes.longhorn.io <pvc-...> \
    #     recurring-job-group.longhorn.io/backup-
    #
    # Die Labels hier bleiben trotzdem stehen: sie dokumentieren die Absicht an
    # der Stelle, an der man sie sucht.
    storageSpec:
      volumeClaimTemplate:
        metadata:
          labels:
            recurring-job-group.longhorn.io/snapshot: enabled
            recurring-job-group.longhorn.io/maintenance: enabled
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 40Gi
    
    # Retention policy
    retention: 30d
    retentionSize: "30GB"
    
    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# Grafana configuration
grafana:
  enabled: true
  
  # Admin credentials aus dem SealedSecret, nicht im Klartext hier: Grafana
  # haengt an einem Ingress. Die beiden Sidecars melden sich mit genau diesen
  # Werten an /api/admin/provisioning/*/reload an, deshalb muss das Secret zum
  # Passwort in der Grafana-DB passen (siehe grafana-admin-unsealed.yaml.example).
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # Run on worker nodes only
  nodeSelector:
    node-role.kubernetes.io/worker: worker
  
  # RWO Longhorn volume: use Recreate so the old pod releases the volume
  # before the new one starts. RollingUpdate deadlocks on Multi-Attach.
  deploymentStrategy:
    type: Recreate

  # Persistence
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  
  # Ingress will be configured in manifests
  ingress:
    enabled: false
  
  # Request reflects real usage (~300Mi) for honest scheduling.
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      memory: 512Mi
  
  # Pre-installed dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  
  # Additional dashboards
  #
  # Fremd-Dashboards von grafana.com. Eigene Dashboards laufen NICHT hier,
  # sondern als ConfigMap mit dem Label grafana_dashboard=1, siehe
  # kustomization.yaml und dashboards/.
  #
  # Vor jedem neuen gnetId-Eintrag lohnt ein Test: Dashboard-JSON ziehen, die
  # Metriknamen aus den Queries gegen /api/v1/label/__name__/values abgleichen.
  # Ein Community-Board, dessen Metriken es hier nicht gibt, meldet sich nicht,
  # es zeigt leere Panels und sieht damit genauso aus wie eines, bei dem gerade
  # nichts passiert. Genau daran sind mehrere gescheitert (nginx-Boards fuer
  # Traefik, pve-Boards fuer einen anderen Exporter): eigene Boards unter
  # dashboards/ sind in solchen Faellen der kuerzere Weg.
  dashboards:
    default:
      # Node exporter full
      node-exporter:
        gnetId: 1860
        revision: 31
        datasource: Prometheus
      # Longhorn dashboard
      longhorn:
        gnetId: 13032
        revision: 6
        datasource: Prometheus
      # UniFi Poller - Client Insights
      unifi-client-insights:
        gnetId: 11315
        revision: 9
        datasource: Prometheus
      # UniFi Poller - Client DPI (braucht save_dpi im Poller-Config)
      unifi-client-dpi:
        gnetId: 11310
        revision: 5
        datasource: Prometheus
      # UniFi Poller - Network Sites
      unifi-sites:
        gnetId: 11311
        revision: 5
        datasource: Prometheus
      # UniFi Poller - UAP Insights
      unifi-uap:
        gnetId: 11314
        revision: 10
        datasource: Prometheus
      # UniFi Poller - USW Insights
      unifi-usw:
        gnetId: 11312
        revision: 9
        datasource: Prometheus
      # UniFi Poller - USG Insights (WAN/Uplink, greift auch fuer die UDR)
      unifi-usg:
        gnetId: 11313
        revision: 9
        datasource: Prometheus

# Alert Manager
alertmanager:
  enabled: true
  
  # Alertmanager configuration for SNS notifications
  config:
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'sns-receiver'
      routes:
        # Watchdog - silence (always firing, no notification needed)
        - match:
            alertname: Watchdog
          receiver: 'null'
        # InfoInhibitor - silence (meta-alert for info-level inhibition)
        - match:
            alertname: InfoInhibitor
          receiver: 'null'
        # Proxmox exporter - mute during Proxmox backup window (03:00-04:00 CET)
        - match:
            alertname: TargetDown
            job: proxmox-exporter
          receiver: 'sns-receiver'
          mute_time_intervals:
            - proxmox-backup-window
        # Critical alerts - immediate notification
        - match:
            severity: critical
          receiver: 'sns-receiver'
          continue: true
        # Warning alerts - grouped notification
        - match:
            severity: warning
          receiver: 'sns-receiver'
          group_wait: 30s

    time_intervals:
      - name: proxmox-backup-window
        time_intervals:
          - times:
              - start_time: '03:00'
                end_time: '04:00'
            location: 'Europe/Berlin'
    
    receivers:
      - name: 'null'  # No notifications (for Watchdog)
      - name: 'sns-receiver'
        sns_configs:
          # Topic, Mail-Subscription und der publizierende IAM-User stehen in
          # homelab-terraform/aws/sns-alerts.tf.
          - topic_arn: 'arn:aws:sns:eu-central-1:077448369105:homelab'
            sigv4:
              region: 'eu-central-1'
            subject: 'Homelab Alert: {{ .GroupLabels.alertname }}'
            message: |
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }}
              *Severity:* {{ .Labels.severity }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Details:*
              {{ range .Labels.SortedPairs }}  - {{ .Name }}: {{ .Value }}
              {{ end }}
              {{ end }}
            attributes:
              severity: '{{ .GroupLabels.severity }}'
              alertname: '{{ .GroupLabels.alertname }}'
    
    templates: []
  
  alertmanagerSpec:
    # Environment variables from AWS credentials secret
    containers:
      - name: alertmanager
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_REGION
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_REGION
    
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    
    # Run on worker nodes only
    nodeSelector:
      node-role.kubernetes.io/worker: worker
    
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# Node exporter (collects node metrics)
nodeExporter:
  enabled: true

# Kube-state-metrics (cluster state metrics) - note: uses hyphens not camelCase
kube-state-metrics:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

  # Leserecht auf die Longhorn-Volumes, ausschliesslich fuer den Block
  # customResourceState darunter. list+watch, mehr braucht ksm nicht.
  rbac:
    extraRules:
      - apiGroups: ["longhorn.io"]
        resources: ["volumes"]
        verbs: ["list", "watch"]

  # Traegt das Gruppenlabel eines Longhorn-Volumes als Metrik nach.
  #
  # Der Grund: ein Volume, das noch NIE gesichert wurde, meldet
  # longhorn_volume_last_backup_at = 0 und faellt damit aus
  # LonghornBackupStale heraus (das "> 0" dort ist Absicht, sonst feuert das
  # bewusst ungesicherte Prometheus-Volume dauerhaft). Ob das Volume ueberhaupt
  # gesichert werden SOLL, steht nur im Label
  # recurring-job-group.longhorn.io/backup am Volume-Objekt, und kein
  # Longhorn-Exporter gibt das heraus. Erst mit dieser Metrik laesst sich
  # "soll gesichert werden, wurde aber nie" als Alert ausdruecken
  # (LonghornBackupNeverRan in prometheus-rules.yaml).
  #
  # Anlass: beim Talos-Umzug am 2026-08-09 standen alle 15 restaurierten
  # Volumes einen Tag lang unbesichert da, mit korrekten Gruppenlabels, und das
  # Monitoring blieb gruen.
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: longhorn.io
              version: v1beta2
              kind: Volume
            # Eigener Prefix statt des Default kube_customresource_, und
            # bewusst NICHT longhorn_*: dieser Namensraum gehoert dem
            # Longhorn-Exporter, eine Kollision waere schwer zu sehen.
            metricNamePrefix: homelab_longhorn_volume
            labelsFromPath:
              volume: [metadata, name]
            metrics:
              # Der Suffix _info ist Pflicht, nicht Geschmack: bei type: Info
              # haengt ksm ihn NICHT selbst an, sondern uebernimmt den Namen
              # wie er dasteht und loggt nur ein "Info metric does not have
              # _info suffix" auf Info-Level weg. Die Metrik entsteht dann
              # unter dem verkuerzten Namen und jede Regel, die den
              # konventionellen erwartet, laeuft still ins Leere.
              - name: recurring_job_group_info
                help: "Gruppenlabels eines Longhorn-Volumes, 1 je Volume"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      backup_group:
                        [metadata, labels, "recurring-job-group.longhorn.io/backup"]

# Prometheus Operator
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  
  # Run on worker nodes only
  nodeSelector:
    node-role.kubernetes.io/worker: worker
  
  # KEIN prometheusOperator.namespaces setzen, der Operator soll alle
  # Namespaces sehen.
  #
  # Das Feld ist eine Allowlist und ihr Versagen ist still: ein ServiceMonitor
  # ausserhalb der Liste wird nicht abgelehnt, sondern ignoriert. Kein
  # Scrape-Pool, kein Target, keine Zeile im Operator-Log, in ArgoCD steht er
  # gruen und synced da. Eine Liste, die man bei jedem neuen Dienst nachziehen
  # muss und deren Vergessen nicht auffaellt, ist im Homelab die schlechtere
  # Wahl als der Default. Zugriffsrechte kostet das nichts: der Operator haengt
  # an einer ClusterRole, Namespace-Roles gibt es keine.
  #
  # Die Auswahl passiert stattdessen ueber serviceMonitorSelector weiter oben
  # (serviceMonitorSelectorNilUsesHelmValues: false = alle Labels erlaubt).
