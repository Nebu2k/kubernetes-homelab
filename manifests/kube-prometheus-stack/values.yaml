# PreSync hook that applies the chart's CRDs before the operator starts.
# Without it a major upgrade deadlocks: ArgoCD diffs the rendered chart against
# the old cluster schema, fails, and therefore never applies the new CRDs.
# forceConflicts is required because ServerSideApply already made ArgoCD the
# field manager. Upstream still marks the feature as preview.
crds:
  upgradeJob:
    enabled: true
    forceConflicts: true

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    kubeScheduler: false
    kubeControllerManager: false
    kubeProxy: false  # kube-router statt kube-proxy

# No metrics endpoint reachable from inside the cluster.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
# enabled: true only unlocks the alert rules and the etcd dashboard. Scraping
# runs through etcd-scrapeconfig.yaml, because the chart's `endpoints:` path
# produces an Endpoints object and ArgoCD has those in resource.exclusions: it
# would never reach the cluster, silently, leaving a target that never appears.
kubeEtcd:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false

prometheus:
  prometheusSpec:
    # Carried into every alert mail. Redundant with a single cluster, but
    # group_by below already contains 'cluster', so a second one alerting into
    # the same SNS topic stays distinguishable without further changes.
    externalLabels:
      cluster: talos
    # Endpoints is deprecated as of Kubernetes v1.33.
    discoveryRole: endpointslice
    
    # Request reflects real TSDB usage so the scheduler does not over-pack.
    resources:
      requests:
        cpu: 200m
        memory: 1280Mi
      limits:
        memory: 2Gi
    
    # arch is not a duplicate of the worker label: every node carries that one.
    # Prometheus is the most memory-hungry pod in the cluster and would hurt
    # both itself and the node on raspi5.
    nodeSelector:
      node-role.kubernetes.io/worker: worker
      kubernetes.io/arch: amd64

    # Release the Longhorn volume cleanly, otherwise the next attach hangs.
    containers:
      - name: prometheus
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - sleep 10 && sync && umount /prometheus || true
    
    terminationGracePeriodSeconds: 120
    
    # Deliberately WITHOUT the backup group: the TSDB rewrites its blocks
    # constantly, so every retention point pins another copy and this volume
    # dominates the backup target. Metrics are regenerable and capped at 30d.
    #
    # These labels alone do not achieve that. Longhorn ignores PVC labels and
    # takes the groups from the StorageClass recurringJobSelector, which does
    # set backup. After every re-provisioning of this volume, drop it by hand:
    #
    #   kubectl -n longhorn-system label volumes.longhorn.io <pvc-...> \
    #     recurring-job-group.longhorn.io/backup-
    storageSpec:
      volumeClaimTemplate:
        metadata:
          labels:
            recurring-job-group.longhorn.io/snapshot: enabled
            recurring-job-group.longhorn.io/maintenance: enabled
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 40Gi
    
    retention: 30d
    retentionSize: "30GB"
    
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

grafana:
  enabled: true
  
  # The provisioning sidecars authenticate against /api/admin/provisioning/*
  # with exactly these values, so the secret must match the password in
  # Grafana's own database (see grafana-admin-unsealed.yaml.example).
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  nodeSelector:
    node-role.kubernetes.io/worker: worker
  
  # RWO Longhorn volume: RollingUpdate deadlocks on Multi-Attach.
  deploymentStrategy:
    type: Recreate

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  
  ingress:
    enabled: false
  
  # Request reflects real usage for honest scheduling.
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      memory: 512Mi
  
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  
  # Third-party boards from grafana.com. Our own live as ConfigMaps labelled
  # grafana_dashboard=1, see kustomization.yaml and dashboards/.
  #
  # Check the metric names of a new gnetId against /api/v1/label/__name__/values
  # first: a board whose metrics do not exist here shows empty panels and looks
  # exactly like one where nothing is currently happening.
  dashboards:
    default:
      # Node exporter full
      node-exporter:
        gnetId: 1860
        revision: 31
        datasource: Prometheus
      # Longhorn dashboard
      longhorn:
        gnetId: 13032
        revision: 6
        datasource: Prometheus
      # UniFi Poller - Client Insights
      unifi-client-insights:
        gnetId: 11315
        revision: 9
        datasource: Prometheus
      # UniFi Poller - Client DPI (needs save_dpi in the poller config)
      unifi-client-dpi:
        gnetId: 11310
        revision: 5
        datasource: Prometheus
      # UniFi Poller - Network Sites
      unifi-sites:
        gnetId: 11311
        revision: 5
        datasource: Prometheus
      # UniFi Poller - UAP Insights
      unifi-uap:
        gnetId: 11314
        revision: 10
        datasource: Prometheus
      # UniFi Poller - USW Insights
      unifi-usw:
        gnetId: 11312
        revision: 9
        datasource: Prometheus
      # UniFi Poller - USG Insights (WAN/uplink, also covers the UDR)
      unifi-usg:
        gnetId: 11313
        revision: 9
        datasource: Prometheus

alertmanager:
  enabled: true
  
  config:
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'sns-receiver'
      routes:
        # Always firing by design, nothing to notify about.
        - match:
            alertname: Watchdog
          receiver: 'null'
        # Meta-alert for info-level inhibition.
        - match:
            alertname: InfoInhibitor
          receiver: 'null'
        - match:
            alertname: TargetDown
            job: proxmox-exporter
          receiver: 'sns-receiver'
          mute_time_intervals:
            - proxmox-backup-window
        - match:
            severity: critical
          receiver: 'sns-receiver'
          continue: true
        - match:
            severity: warning
          receiver: 'sns-receiver'
          group_wait: 30s

    time_intervals:
      - name: proxmox-backup-window
        time_intervals:
          - times:
              - start_time: '03:00'
                end_time: '04:00'
            location: 'Europe/Berlin'
    
    receivers:
      - name: 'null'  # No notifications (for Watchdog)
      - name: 'sns-receiver'
        sns_configs:
          # Topic, mail subscription and the publishing IAM user live in
          # homelab-terraform/aws/sns-alerts.tf.
          - topic_arn: 'arn:aws:sns:eu-central-1:077448369105:homelab'
            sigv4:
              region: 'eu-central-1'
            subject: 'Homelab Alert: {{ .GroupLabels.alertname }}'
            message: |
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }}
              *Severity:* {{ .Labels.severity }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Details:*
              {{ range .Labels.SortedPairs }}  - {{ .Name }}: {{ .Value }}
              {{ end }}
              {{ end }}
            attributes:
              severity: '{{ .GroupLabels.severity }}'
              alertname: '{{ .GroupLabels.alertname }}'
    
    templates: []
  
  alertmanagerSpec:
    containers:
      - name: alertmanager
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_REGION
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_REGION
    
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    
    nodeSelector:
      node-role.kubernetes.io/worker: worker
    
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

nodeExporter:
  enabled: true

# Chart key uses hyphens, not camelCase.
kube-state-metrics:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

  # Read access to the Longhorn volumes, solely for customResourceState below.
  rbac:
    extraRules:
      - apiGroups: ["longhorn.io"]
        resources: ["volumes"]
        verbs: ["list", "watch"]

  # Exposes a Longhorn volume's group label as a metric. A volume that has
  # never been backed up reports last_backup_at = 0 and thus escapes
  # LonghornBackupStale; whether it SHOULD be backed up lives only in the
  # recurring-job-group.longhorn.io/backup label, which no Longhorn exporter
  # publishes. LonghornBackupNeverRan builds on this metric.
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: longhorn.io
              version: v1beta2
              kind: Volume
            # Not longhorn_*: that namespace belongs to the Longhorn exporter
            # and a collision would be hard to spot.
            metricNamePrefix: homelab_longhorn_volume
            labelsFromPath:
              volume: [metadata, name]
            metrics:
              # The _info suffix is mandatory: ksm does not append it for
              # type: Info, it only logs a note and creates the metric under
              # the shortened name. Rules expecting the conventional one then
              # match nothing, silently.
              - name: recurring_job_group_info
                help: "Recurring-job group labels of a Longhorn volume"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      backup_group:
                        [metadata, labels, "recurring-job-group.longhorn.io/backup"]

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  
  nodeSelector:
    node-role.kubernetes.io/worker: worker
  
  # Deliberately NO prometheusOperator.namespaces. The field is an allowlist
  # that fails silently: a ServiceMonitor outside it is ignored, not rejected,
  # and ArgoCD still shows the app green. Selection happens through
  # serviceMonitorSelector above instead.
