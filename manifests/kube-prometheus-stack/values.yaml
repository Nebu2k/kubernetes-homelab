# PreSync hook that applies the chart's CRDs before the operator starts.
# Without it a major upgrade deadlocks: ArgoCD diffs the rendered chart against
# the old cluster schema, fails, and therefore never applies the new CRDs.
# forceConflicts is required because ServerSideApply already made ArgoCD the
# field manager. Upstream still marks the feature as preview.
crds:
  upgradeJob:
    enabled: true
    forceConflicts: true

# The chart splits its defaults across one PrometheusRule per set, which is
# also one file per set in Prometheus. Switching a set off is the only way to
# shorten that list; the sets below are the ones that cost something and
# deliver nothing here.
#
# There is no kubeScheduler key, the scheduler sets are kubeSchedulerAlerting
# and kubeSchedulerRecording. Both are already off through kubeScheduler.enabled
# below, which gates the templates on top of these switches.
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    kubeControllerManager: false
    # kube-proxy runs, it is just not scraped (kubeProxy.enabled below), and
    # rules without a target fire on absent().
    kubeProxy: false

    # The four KubeAPIErrorBudgetBurn alerts and the burnrate1d/3d recording
    # rules they need. Measured on 2026-08-11: the burnrate set alone took
    # 2.07s of the 2.65s that all 48 rule groups together spend, every 30s.
    #
    # A 30-day error budget on the API server answers a question this cluster
    # does not have: there is one cluster, no tenants and no SLO. An API server
    # in trouble shows up in KubeAPIDown, in the node alerts and in Gatus long
    # before a budget burns.
    #
    # kubeApiserverAvailability and kubeApiserverHistogram stay ON: they cost
    # 0.16s and 0.06s, and the apiserver dashboard reads three of their
    # recording rules. The burnrate set has no dashboard consumer.
    kubeApiserverBurnrate: false
    kubeApiserverSlos: false

    # A single recording rule over container_memory_swap, which cAdvisor never
    # reports here. The three k8s-resources dashboards read it and have been
    # showing an empty panel all along, with or without this switch.
    k8sContainerMemorySwap: false

  # NodeSystemSaturation is rebuilt in prometheus-rules.yaml, once for every
  # other host and once for the macmini: its CI runner boots iOS simulators,
  # which drives load1 far past the upstream threshold of 2 per core on every
  # build. Switching the alert off per host is not possible any other way.
  disabled:
    NodeSystemSaturation: true

# No metrics endpoint reachable from inside the cluster.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
# enabled: true only unlocks the alert rules and the etcd dashboard. Scraping
# runs through etcd-scrapeconfig.yaml, because the chart's `endpoints:` path
# produces an Endpoints object and ArgoCD has those in resource.exclusions: it
# would never reach the cluster, silently, leaving a target that never appears.
kubeEtcd:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false

prometheus:
  prometheusSpec:
    # Carried into every alert mail. Redundant with a single cluster, but
    # group_by below already contains 'cluster', so a second one alerting into
    # the same SNS topic stays distinguishable without further changes.
    externalLabels:
      cluster: talos
    # Endpoints is deprecated as of Kubernetes v1.33.
    discoveryRole: endpointslice
    
    # Request reflects real TSDB usage so the scheduler does not over-pack.
    resources:
      requests:
        cpu: 200m
        memory: 1280Mi
      limits:
        memory: 2Gi
    
    # arch is not a duplicate of the worker label: every node carries that one.
    # Prometheus is the most memory-hungry pod in the cluster and would hurt
    # both itself and the node on raspi5.
    nodeSelector:
      node-role.kubernetes.io/worker: worker
      kubernetes.io/arch: amd64

    # Release the Longhorn volume cleanly, otherwise the next attach hangs.
    containers:
      - name: prometheus
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - sleep 10 && sync && umount /prometheus || true
    
    terminationGracePeriodSeconds: 120
    
    # Deliberately WITHOUT the backup group: the TSDB rewrites its blocks
    # constantly, so every retention point pins another copy and this volume
    # dominates the backup target. Metrics are regenerable and capped at 30d.
    #
    # These labels alone do not achieve that. Longhorn ignores PVC labels and
    # takes the groups from the StorageClass recurringJobSelector, which does
    # set backup. After every re-provisioning of this volume, drop it by hand:
    #
    #   kubectl -n longhorn-system label volumes.longhorn.io <pvc-...> \
    #     recurring-job-group.longhorn.io/backup-
    storageSpec:
      volumeClaimTemplate:
        spec:
          # Not "longhorn": that class hands out the backup group to everything
          # it creates. This volume stays out of the backups on purpose, and the
          # class is the only thing that survives a recreation. See
          # manifests/longhorn/storageclass-nobackup.yaml.
          storageClassName: longhorn-nobackup
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 40Gi
    
    retention: 30d
    retentionSize: "30GB"
    
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

grafana:
  enabled: true
  
  # The provisioning sidecars authenticate against /api/admin/provisioning/*
  # with exactly these values, so the secret must match the password in
  # Grafana's own database (see grafana-admin-unsealed.yaml.example).
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  nodeSelector:
    node-role.kubernetes.io/worker: worker
  
  # RWO Longhorn volume: RollingUpdate deadlocks on Multi-Attach.
  deploymentStrategy:
    type: Recreate

  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  
  ingress:
    enabled: false
  
  # Request reflects real usage for honest scheduling.
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      memory: 512Mi
  
  # Downloaded on container start into the persistent volume. Required by the
  # "Now" panel of the UniFi UAP board (gnetId 11314).
  plugins:
    - grafana-clock-panel

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  
  # Third-party boards from grafana.com. Our own live as ConfigMaps labelled
  # grafana_dashboard=1, see kustomization.yaml and dashboards/.
  #
  # Check the metric names of a new gnetId against /api/v1/label/__name__/values
  # first: a board whose metrics do not exist here shows empty panels and looks
  # exactly like one where nothing is currently happening.
  dashboards:
    default:
      # Node exporter full
      node-exporter:
        gnetId: 1860
        revision: 31
        datasource: Prometheus
      # UniFi Poller - Client Insights
      unifi-client-insights:
        gnetId: 11315
        revision: 9
        datasource: Prometheus
      # UniFi Poller - Client DPI (needs save_dpi in the poller config)
      unifi-client-dpi:
        gnetId: 11310
        revision: 5
        datasource: Prometheus
      # UniFi Poller - Network Sites
      unifi-sites:
        gnetId: 11311
        revision: 5
        datasource: Prometheus
      # UniFi Poller - UAP Insights
      unifi-uap:
        gnetId: 11314
        revision: 10
        datasource: Prometheus
      # UniFi Poller - USW Insights
      unifi-usw:
        gnetId: 11312
        revision: 9
        datasource: Prometheus
      # UniFi Poller - USG Insights (WAN/uplink, also covers the UDR)
      unifi-usg:
        gnetId: 11313
        revision: 9
        datasource: Prometheus

alertmanager:
  enabled: true
  
  config:
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'alerts'
      routes:
        # Fires permanently by design, so it is not a notification but the
        # heartbeat of the alert path itself. Every other channel hangs behind
        # this Alertmanager and stays silent when the cluster is gone; this one
        # alarms from outside as soon as the pings stop arriving.
        - match:
            alertname: Watchdog
          receiver: 'deadmansswitch'
          group_wait: 0s
          # Pings arrive every 10 minutes, not every 5: repeat_interval is only
          # checked at the group_interval ticks, so an equal value always slips
          # to the next one. Lowering it changes nothing without a smaller
          # group_interval. The check tolerates 30 minutes.
          repeat_interval: 5m
        # Meta-alert for info-level inhibition.
        - match:
            alertname: InfoInhibitor
          receiver: 'null'
        - match:
            alertname: TargetDown
            job: proxmox-exporter
          receiver: 'alerts'
          mute_time_intervals:
            - proxmox-backup-window
        # Pending updates are a to-do, not an incident: the collector on the
        # macmini rescans only every 6h, so the global 4h repeats the same
        # number without new information.
        - match:
            alertname: MacosUpdatesPending
          receiver: 'alerts'
          repeat_interval: 24h
        - match:
            severity: critical
          receiver: 'alerts'
          continue: true
        - match:
            severity: warning
          receiver: 'alerts'
          group_wait: 30s

    time_intervals:
      - name: proxmox-backup-window
        time_intervals:
          - times:
              - start_time: '03:00'
                end_time: '04:00'
            location: 'Europe/Berlin'
    
    receivers:
      - name: 'null'  # No notifications (for InfoInhibitor)

      # One receiver with two integrations rather than two receivers behind
      # continue: true, so both channels always carry the same alerts and the
      # routing above stays untouched.
      - name: 'alerts'
        sns_configs:
          # Topic, mail subscription and the publishing IAM user live in
          # homelab-terraform/aws/sns-alerts.tf.
          - topic_arn: 'arn:aws:sns:eu-central-1:077448369105:homelab'
            sigv4:
              region: 'eu-central-1'
            subject: 'Homelab Alert: {{ .GroupLabels.alertname }}'
            message: |
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }}
              *Severity:* {{ .Labels.severity }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Details:*
              {{ range .Labels.SortedPairs }}  - {{ .Name }}: {{ .Value }}
              {{ end }}
              {{ end }}
            attributes:
              severity: '{{ .GroupLabels.severity }}'
              alertname: '{{ .GroupLabels.alertname }}'
        telegram_configs:
          # Own short template: Telegram rejects anything over 4096 characters,
          # which the label listing of the SNS message above would hit on a
          # group of several alerts.
          - bot_token_file: '/etc/alertmanager/secrets/alertmanager-notifications/telegram-bot-token'
            # Not secret without the token, and there is no chat_id_file.
            chat_id: 6529131790
            # No parse_mode on purpose. Several summaries read "laeuft in
            # <14 Tagen ab", and in HTML mode Telegram rejects exactly those
            # messages as an unclosed tag.
            parse_mode: ''
            # instance is appended because the summaries name no host and the
            # description, which does, is not part of this template. Addresses
            # out of the pod and service CIDRs are skipped: for alerts off
            # kube-state-metrics, ArgoCD or Gatus the label carries the
            # exporter's own pod IP, which says nothing and changes on restart.
            message: |-
              {{ .Status | toUpper }} {{ .GroupLabels.alertname }} ({{ .GroupLabels.severity }})
              {{ range .Alerts }}{{ .Annotations.summary }}{{ with .Labels.instance }}{{ if not (match "^10\\.4[23]\\." .) }} [{{ . }}]{{ end }}{{ end }}
              {{ end }}

      # Ping URL of the healthchecks.io check. It alarms when nothing arrives,
      # so send_resolved would be pointless: Watchdog never resolves.
      - name: 'deadmansswitch'
        webhook_configs:
          - url_file: '/etc/alertmanager/secrets/alertmanager-notifications/healthchecks-ping-url'
            send_resolved: false

    templates: []
  
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/<name>/<key>. Files rather than env
    # vars, because the Alertmanager expands no environment variables in its
    # config; only the AWS SDK below reads them.
    secrets:
      - alertmanager-notifications

    containers:
      - name: alertmanager
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_REGION
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_REGION
    
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    
    nodeSelector:
      node-role.kubernetes.io/worker: worker
    
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

nodeExporter:
  enabled: true

# Chart key uses hyphens, not camelCase.
kube-state-metrics:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

  # Off by default, which left the four kube-state-metrics alerts permanently
  # blind: they read kube_state_metrics_*, and those live on the second port
  # that only this switch exposes. Worth having because of customResourceState
  # below, a watch on longhorn.io/volumes that would otherwise fail silently
  # and take the two Longhorn backup alerts with it.
  selfMonitor:
    enabled: true

  # Read access to the Longhorn volumes, solely for customResourceState below.
  rbac:
    extraRules:
      - apiGroups: ["longhorn.io"]
        resources: ["volumes"]
        verbs: ["list", "watch"]

  # Exposes a Longhorn volume's group label as a metric. Whether a volume
  # SHOULD be backed up lives only in the recurring-job-group.longhorn.io/backup
  # label, which no Longhorn exporter publishes. Both LonghornBackupNeverRan
  # and LonghornBackupStale build on this metric.
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: longhorn.io
              version: v1beta2
              kind: Volume
            # Not longhorn_*: that namespace belongs to the Longhorn exporter
            # and a collision would be hard to spot.
            metricNamePrefix: homelab_longhorn_volume
            labelsFromPath:
              volume: [metadata, name]
            metrics:
              # The _info suffix is mandatory: ksm does not append it for
              # type: Info, it only logs a note and creates the metric under
              # the shortened name. Rules expecting the conventional one then
              # match nothing, silently.
              - name: recurring_job_group_info
                help: "Recurring-job group labels of a Longhorn volume"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      backup_group:
                        [metadata, labels, "recurring-job-group.longhorn.io/backup"]

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  
  nodeSelector:
    node-role.kubernetes.io/worker: worker
  
  # Deliberately NO prometheusOperator.namespaces. The field is an allowlist
  # that fails silently: a ServiceMonitor outside it is ignored, not rejected,
  # and ArgoCD still shows the app green. Selection happens through
  # serviceMonitorSelector above instead.
