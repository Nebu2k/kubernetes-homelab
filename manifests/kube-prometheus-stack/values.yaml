# kube-prometheus-stack Helm values
# Optimized for Raspberry Pi homelab

# CRDs vor dem Operator aktualisieren.
#
# Helm aktualisiert CRDs grundsaetzlich nicht, ArgoCD rendert sie zwar mit
# (--include-crds) und wendet sie an, kommt beim Major-Upgrade aber nicht dazu:
# beim Sprung 80.13.2 -> 87.21.0 blockierte der Diff mit
#   ComparisonError: .spec.hostNetwork: field not declared in schema
# Die alertmanagers-CRD im Cluster kannte das Feld noch nicht, Chart 87 rendert
# es. ArgoCD diffed gegen das Cluster-Schema, scheitert, und wendet deshalb auch
# die neue CRD nie an. Henne-Ei, aufgeloest nur per manuellem
# kubectl apply --server-side aus dem Chart-Tarball.
#
# Der Job des crds-Subcharts nimmt genau diesen Schritt vorweg: PreSync-Hook,
# entpackt die mitgelieferten CRDs und wendet sie server-side an, bevor der
# Operator kommt. Mechanisch nichts Neues fuer uns, ArgoCD faehrt fuer diese App
# schon die admission-create/patch-Hooks derselben Bauart.
#
# forceConflicts ist Pflicht: ArgoCD ist durch ServerSideApply=true bereits
# Field-Manager der CRDs, ohne --force-conflicts scheitert der Job daran.
# Die Felder wandern dabei kurz an den Manager "kubectl" und beim folgenden
# Sync zurueck an ArgoCD. Inhaltlich identisch, also kein Dauer-Diff.
#
# Upstream markiert das Feature als preview. Bei Chart-Upgrades im Blick behalten.
crds:
  upgradeJob:
    enabled: true
    forceConflicts: true

# Global settings
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # K3s uses embedded SQLite by default
    kubeScheduler: false  # K3s scheduler metrics not exposed
    kubeControllerManager: false  # K3s controller metrics not exposed
    kubeProxy: false  # K3s uses kube-router instead of kube-proxy

# Disable K3s components that don't expose metrics
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# Prometheus configuration
prometheus:
  
  prometheusSpec:
    # Use EndpointSlice instead of deprecated Endpoints API (required for Kubernetes v1.33+)
    discoveryRole: endpointslice
    
    # Request reflects real TSDB usage (~1.3Gi) so the scheduler accounts
    # honestly for this pod instead of over-packing the node.
    resources:
      requests:
        cpu: 200m
        memory: 1280Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    
    # Run on worker nodes only.
    #
    # arch ist hier bewusst zusaetzlich gesetzt und keine Doppelung: das
    # worker-Label tragen heute nur worker-1 und prodesk (beide amd64), aber es
    # ist eine Konvention, die jeder Node bekommen kann. Prometheus ist der
    # speicherhungrigste Pod im Cluster, auf einem der ARM-Raspis waere er ein
    # Problem fuer die Node und fuer sich selbst. amd64 macht daraus eine
    # Eigenschaft der Hardware statt eines Versprechens ueber Labels.
    # Gegenstueck zur verworfenen VictoriaMetrics-Migration (siehe ROADMAP).
    nodeSelector:
      node-role.kubernetes.io/worker: worker
      kubernetes.io/arch: amd64

    # Lifecycle hooks to prevent Longhorn volume attachment issues
    containers:
      - name: prometheus
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/sh
                - -c
                - sleep 10 && sync && umount /prometheus || true
    
    # Graceful shutdown period
    terminationGracePeriodSeconds: 120
    
    # Storage configuration
    # Labels select the Longhorn recurring-job groups (backup-daily/weekly/monthly,
    # snapshot-daily, snapshot-cleanup-daily, filesystem-trim-weekly).
    # Without these, the volume falls into the "default" group, which has no jobs.
    #
    # BEWUSST OHNE die backup-Gruppe (2026-08-01). Dieses Volume war mit Abstand
    # der teuerste Posten im Backup-Bestand: 97 GB von insgesamt 126 GB, bei nur
    # 37 GiB Live-Daten. Grund ist die Kombination aus TSDB und Retention-Kette:
    # Prometheus schreibt seine Blocks permanent um, und jeder der bis zu 18
    # Behaltepunkte (7 daily + 4 weekly + 6 monthly + 1 yearly) haelt die
    # geaenderten Bloecke fest.
    #
    # Metriken sind regenerierbar und ohnehin auf retention: 30d begrenzt, ein
    # Restore aus einem Monate alten Backup waere wertlos. snapshot und
    # maintenance bleiben: Snapshots sind lokal und billig, filesystem-trim gibt
    # sogar Platz zurueck.
    storageSpec:
      volumeClaimTemplate:
        metadata:
          labels:
            recurring-job-group.longhorn.io/snapshot: enabled
            recurring-job-group.longhorn.io/maintenance: enabled
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 40Gi
    
    # Retention policy
    retention: 30d
    retentionSize: "30GB"
    
    # Service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# Grafana configuration
grafana:
  enabled: true
  
  # Admin credentials (change in production!)
  adminPassword: prom-operator
  
  # Run on worker nodes only
  nodeSelector:
    node-role.kubernetes.io/worker: worker
  
  # RWO Longhorn volume: use Recreate so the old pod releases the volume
  # before the new one starts. RollingUpdate deadlocks on Multi-Attach.
  deploymentStrategy:
    type: Recreate

  # Persistence
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
  
  # Ingress will be configured in manifests
  ingress:
    enabled: false
  
  # Request reflects real usage (~300Mi) for honest scheduling.
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Pre-installed dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
  
  # Additional dashboards
  dashboards:
    default:
      # Kubernetes cluster overview
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      # Node exporter full
      node-exporter:
        gnetId: 1860
        revision: 31
        datasource: Prometheus
      # Longhorn dashboard
      longhorn:
        gnetId: 13032
        revision: 6
        datasource: Prometheus
      # NGINX Ingress Controller
      nginx-ingress:
        gnetId: 9614
        revision: 1
        datasource: Prometheus
      # UniFi Poller - Client Insights
      unifi-client-insights:
        gnetId: 11315
        revision: 9
        datasource: Prometheus
      # UniFi Poller - Network Sites
      unifi-sites:
        gnetId: 11311
        revision: 5
        datasource: Prometheus
      # UniFi Poller - UAP Insights
      unifi-uap:
        gnetId: 11314
        revision: 10
        datasource: Prometheus
      # UniFi Poller - USW Insights
      unifi-usw:
        gnetId: 11312
        revision: 9
        datasource: Prometheus
      # Proxmox via Prometheus
      proxmox-prometheus:
        gnetId: 24550
        revision: 1
        datasource: Prometheus

# Alert Manager
alertmanager:
  enabled: true
  
  # Alertmanager configuration for SNS notifications
  config:
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname', 'cluster', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'sns-receiver'
      routes:
        # Watchdog - silence (always firing, no notification needed)
        - match:
            alertname: Watchdog
          receiver: 'null'
        # InfoInhibitor - silence (meta-alert for info-level inhibition)
        - match:
            alertname: InfoInhibitor
          receiver: 'null'
        # Proxmox exporter - mute during Proxmox backup window (03:00-04:00 CET)
        - match:
            alertname: TargetDown
            job: proxmox-exporter
          receiver: 'sns-receiver'
          mute_time_intervals:
            - proxmox-backup-window
        # Critical alerts - immediate notification
        - match:
            severity: critical
          receiver: 'sns-receiver'
          continue: true
        # Warning alerts - grouped notification
        - match:
            severity: warning
          receiver: 'sns-receiver'
          group_wait: 30s

    time_intervals:
      - name: proxmox-backup-window
        time_intervals:
          - times:
              - start_time: '03:00'
                end_time: '04:00'
            location: 'Europe/Berlin'
    
    receivers:
      - name: 'null'  # No notifications (for Watchdog)
      - name: 'sns-receiver'
        sns_configs:
          - topic_arn: 'arn:aws:sns:eu-central-1:077448369105:homelab'  # TODO: Replace with your SNS Topic ARN
            sigv4:
              region: 'eu-central-1'  # TODO: Replace with your AWS region
            subject: 'Homelab Alert: {{ .GroupLabels.alertname }}'
            message: |
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }}
              *Severity:* {{ .Labels.severity }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Details:*
              {{ range .Labels.SortedPairs }}  - {{ .Name }}: {{ .Value }}
              {{ end }}
              {{ end }}
            attributes:
              severity: '{{ .GroupLabels.severity }}'
              alertname: '{{ .GroupLabels.alertname }}'
    
    templates: []
  
  alertmanagerSpec:
    # Environment variables from AWS credentials secret
    containers:
      - name: alertmanager
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_SECRET_ACCESS_KEY
          - name: AWS_REGION
            valueFrom:
              secretKeyRef:
                name: alertmanager-aws-credentials
                key: AWS_REGION
    
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    
    # Run on worker nodes only
    nodeSelector:
      node-role.kubernetes.io/worker: worker
    
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# Node exporter (collects node metrics)
nodeExporter:
  enabled: true

# Kube-state-metrics (cluster state metrics) - note: uses hyphens not camelCase
kube-state-metrics:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

# Prometheus Operator
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Run on worker nodes only
  nodeSelector:
    node-role.kubernetes.io/worker: worker
  
  # KEIN prometheusOperator.namespaces mehr, der Operator sieht alle Namespaces.
  #
  # Das Feld war eine Allowlist und ihr Versagen war still: ein ServiceMonitor
  # ausserhalb der Liste wurde nicht abgelehnt, sondern ignoriert. Kein
  # Scrape-Pool, kein Target, keine Zeile im Operator-Log, in ArgoCD stand er
  # gruen und synced da. Gekostet hat das den Traefik-ServiceMonitor: in
  # manifests/traefik/values.yaml steht seit jeher metrics.prometheus.
  # serviceMonitor.enabled = true, und trotzdem gab es bis 2026-08-06 keine
  # einzige traefik_*-Metrik. Der einzige Eingang ins Cluster war unbeobachtet.
  # Aufgefallen ist es erst, als Gatus denselben Fehler ausloeste.
  #
  # Die Liste war ausserdem in beide Richtungen falsch: ingress-nginx stand
  # drin, obwohl es den Namespace hier gar nicht gibt (Traefik hat nginx
  # abgeloest). Eine Liste, die man bei jedem neuen Dienst nachziehen muss und
  # deren Vergessen nicht auffaellt, ist im Homelab die schlechtere Wahl als
  # der Default. Zugriffsrechte kostet das nichts: der Operator haengt an einer
  # ClusterRole, Namespace-Roles gibt es keine.
  #
  # Was bleibt, ist die serviceMonitorSelector-Ebene weiter oben
  # (serviceMonitorSelectorNilUsesHelmValues: false = alle Labels erlaubt).
