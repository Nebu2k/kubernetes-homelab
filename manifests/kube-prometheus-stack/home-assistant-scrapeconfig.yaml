# Home Assistant as a metric source: Ecoflow at the rack (the only honest
# figure for the homelab, RAPL only sees the CPU package), Tibber Pulse for
# house consumption, the Hoymiles PV and the wallbox. Which entities are
# exported is decided by the filter in the prometheus block of
# manifests/home-assistant/configmap-configuration.yaml, not here.
#
# Static targets because ArgoCD does not apply Endpoints objects. Scraped
# directly at the ClusterIP so the path needs no ingress and no certificate.
#
# Mind the token: HA runs ip_ban_enabled with login_attempts_threshold 5, so a
# wrong or expired token bans Prometheus' pod IP after five scrapes, and the
# ban survives restarts in /config/ip_bans.yaml. After rotating the token,
# check the first scrape instead of committing blind.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: home-assistant
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  scheme: HTTP
  metricsPath: /api/prometheus
  # The secret must live in Prometheus' namespace, not in HA's.
  authorization:
    type: Bearer
    credentials:
      name: home-assistant-prometheus-token
      key: token
  staticConfigs:
    - targets:
        - home-assistant.home-assistant.svc.cluster.local:8123
  relabelings:
    - targetLabel: job
      replacement: home-assistant
      action: replace
