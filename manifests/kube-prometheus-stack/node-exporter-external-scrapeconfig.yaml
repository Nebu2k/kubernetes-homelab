# node-exporter on the two hosts outside the cluster: pve and macmini. The
# chart's DaemonSet covers the cluster nodes, not these; for pve the
# pve-exporter only provides the API view (no disk IO, interface counters,
# temperatures or SMART).
#
# Static targets instead of Service+Endpoints: ArgoCD excludes Endpoints and
# EndpointSlice globally, so such an object never reaches the cluster and
# leaves a target that silently never appears. See etcd-scrapeconfig.yaml.
#
# job=node-exporter is load-bearing, not cosmetic: every node-exporter rule
# from defaultRules, the mixin's recording rules and the "Node Exporter Full"
# dashboard select on it, and thereby cover these two hosts for free. Without
# the relabeling none of them would match.
#
# Port 9100 is plaintext without auth, reachable only from the LAN.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: node-exporter-external
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  scheme: HTTP
  metricsPath: /metrics
  staticConfigs:
    # Proxmox host, Debian's prometheus-node-exporter plus the package's
    # textfile collectors. smartmon.prom stays empty on purpose: its timer has
    # ConditionPathExistsGlob=/dev/sd*, pve has only NVMe and nvme.prom covers
    # those SMART values.
    - targets:
        - 192.168.2.8:9100
    # The Blocky LXC on pve. node_exporter runs there for its textfile
    # collector, not for the host metrics: the config sync job writes its
    # result as blocky_config_sync_success. Without it a permanently failing
    # sync would be invisible, Blocky would just keep running the old config.
    - targets:
        - 192.168.2.254:9100
    # macmini. node_exporter via brew as a LaunchAgent, same pattern as the
    # other macmini services. darwin has far fewer collectors than linux and
    # partly different metric names, see operations.md.
    - targets:
        - 192.168.2.4:9100
  relabelings:
    - targetLabel: job
      replacement: node-exporter
      action: replace
