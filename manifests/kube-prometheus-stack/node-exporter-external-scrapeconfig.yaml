# node-exporter der zwei Hosts ausserhalb des Clusters: pve und macmini.
#
# Die fuenf Cluster-Nodes bringt das DaemonSet aus dem Chart mit, diese beiden
# nicht. Sie waren bis 2026-08-07 nur ueber Beszel sichtbar, pve zusaetzlich
# ueber den pve-exporter (API-Sicht: Node-, VM-, Storage-Status, aber kein
# Disk-IO, keine Interface-Zaehler, keine Temperaturen, kein SMART).
#
# Statische Targets statt Service+Endpoints wie sonst im external-services-
# Muster: ArgoCD hat Endpoints und EndpointSlice global in resource.exclusions,
# ein Endpoints-Objekt aus dem Repo kommt lautlos nie im Cluster an. Kein
# Sync-Fehler, kein OutOfSync, nur ein Ziel, das nie auftaucht. Dieselbe Falle
# wie bei etcd, Begruendung ausfuehrlich in etcd-scrapeconfig.yaml.
#
# job=node-exporter ist der eigentliche Trick, nicht Kosmetik: samtliche
# node-exporter-Regeln aus defaultRules, die Recording-Rules des Mixins und das
# Dashboard "Node Exporter Full" (gnetId 1860) selektieren darauf. Mit dem
# gleichen Job-Label decken sie diese zwei Hosts ohne weiteres Zutun mit ab.
# Ohne relabeling hiesse der Job "scrapeConfig/monitoring/node-exporter-external"
# und keine einzige davon wuerde greifen.
#
# Port 9100 ist Klartext ohne Auth, aber nur im LAN erreichbar.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: node-exporter-external
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  scheme: HTTP
  metricsPath: /metrics
  staticConfigs:
    # Proxmox-Host. prometheus-node-exporter aus Debian trixie, dazu die
    # Textfile-Collectors des Pakets (apt.prom, nvme.prom). smartmon.prom bleibt
    # leer und das ist richtig so: die Timer-Unit hat
    # ConditionPathExistsGlob=/dev/sd*, pve hat nur NVMe, deren SMART-Werte
    # liefert nvme.prom.
    - targets:
        - 192.168.2.8:9100
    # macmini. node_exporter per brew als LaunchAgent
    # (homebrew.mxcl.node_exporter), gleiches Muster wie die uebrigen
    # macmini-Dienste, kein sudo noetig. darwin hat deutlich weniger Collectors
    # als linux (13 statt ~45) und teilweise andere Metriknamen, siehe
    # betrieb.md "Monitoring und Alerts".
    - targets:
        - 192.168.2.4:9100
  relabelings:
    - targetLabel: job
      replacement: node-exporter
      action: replace
