# The second Blocky instance, the LXC on pve. The cluster instance brings its
# own ServiceMonitor; this container sits outside the cluster and needs a
# static target, because ArgoCD excludes Endpoints objects globally.
#
# job and blocky_instance are set here so both instances share one job and the
# DNS board can show them side by side with sum by (blocky_instance).
#
# Note that port 4000 carries more than metrics: Blocky's unauthenticated REST
# API lives there, and whoever reaches it can switch blocking off. On the
# cluster instance the port is confined to the ClusterIP service. On this LXC
# it is not: .254 falls under the UniFi rule that grants the guest VLANs the
# range .249-.254 instead of individual ports (see ROADMAP).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: blocky-lxc
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  scheme: HTTP
  metricsPath: /metrics
  staticConfigs:
    - targets:
        - 192.168.2.254:4000
  relabelings:
    - targetLabel: job
      replacement: blocky-metrics
      action: replace
    - targetLabel: blocky_instance
      replacement: lxc-pve
      action: replace
