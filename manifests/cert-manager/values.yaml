---
# Install CRDs together with the chart, managed by ArgoCD.
crds:
  enabled: true
  keep: true

nodeSelector:
  node-role.kubernetes.io/worker: "worker"

webhook:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

cainjector:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

startupapicheck:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

# prometheus.enabled is the chart default and ONLY adds prometheus.io
# annotations to the pods, which this stack ignores: it works with
# ServiceMonitors exclusively. Without servicemonitor.enabled not a single
# certmanager_* metric arrives, although the services serve them on 9402.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    interval: 60s
