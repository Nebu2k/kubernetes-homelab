---
# cert-manager Helm values.
# Install CRDs together with the chart (managed by ArgoCD).
crds:
  enabled: true
  keep: true

# Run on worker nodes, consistent with the rest of the cluster.
nodeSelector:
  node-role.kubernetes.io/worker: "worker"

webhook:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

cainjector:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

startupapicheck:
  nodeSelector:
    node-role.kubernetes.io/worker: "worker"

# Prometheus-Metriken.
#
# prometheus.enabled ist der Chart-Default und heisst NUR, dass die Pods
# prometheus.io-Annotationen bekommen. Die wertet dieser Stack nicht aus, er
# arbeitet ausschliesslich mit ServiceMonitors. Ohne servicemonitor.enabled
# kommt deshalb keine einzige certmanager_*-Metrik an, obwohl die Services auf
# 9402 durchgehend welche liefern.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    interval: 60s
