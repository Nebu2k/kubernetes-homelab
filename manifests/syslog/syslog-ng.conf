@version: 4.13

options {
  # BusyBox syslogd forwards without a hostname, so files are named after the
  # sender's address. That needs the real client IP, see service.yaml.
  keep-hostname(no);
  use-dns(no);
  create-dirs(yes);
  stats(freq(0));
};

source s_udp {
  network(transport("udp") port(5514));
};

# Receive time rather than the sender's: the DM900 boots with a stale clock.
destination d_file {
  file("/var/log/remote/${HOST}.log"
    template("${R_ISODATE} ${FACILITY}.${LEVEL} ${MSGHDR}${MESSAGE}\n")
    logrotate(enable(yes) size(10MB) rotations(30))
  );
};

log {
  source(s_udp);
  destination(d_file);
};
