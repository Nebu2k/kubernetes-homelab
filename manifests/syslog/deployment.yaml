# Remote syslog for devices whose local log does not survive a hard hang
# (the DM900 loses the last seconds before it, see syslog-ng.conf).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syslog-ng
  namespace: syslog
  labels:
    app.kubernetes.io/name: syslog-ng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: syslog-ng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syslog-ng
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: syslog-ng
          image: balabit/syslog-ng:4.13.0
          # Bypasses the image's entrypoint, which expects root; every path
          # syslog-ng writes besides the logs goes to /tmp.
          command: ["/usr/sbin/syslog-ng"]
          args:
            - --foreground
            - --stderr
            - --no-caps
            - --cfgfile=/etc/syslog-ng/conf/syslog-ng.conf
            - --persist-file=/tmp/syslog-ng.persist
            - --pidfile=/tmp/syslog-ng.pid
            - --control=/tmp/syslog-ng.ctl
          env:
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: syslog
              containerPort: 5514
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/syslog-ng/conf
              readOnly: true
            - name: data
              mountPath: /var/log/remote
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["/usr/sbin/syslog-ng-ctl", "healthcheck", "--control=/tmp/syslog-ng.ctl", "--timeout", "5"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["/usr/sbin/syslog-ng-ctl", "healthcheck", "--control=/tmp/syslog-ng.ctl", "--timeout", "5"]
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: config
          configMap:
            name: syslog-ng
        - name: data
          persistentVolumeClaim:
            claimName: syslog-data
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
