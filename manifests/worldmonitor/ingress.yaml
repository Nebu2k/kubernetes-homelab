# Intern-only: kein Cloudflare-Record, damit auch kein oeffentlicher Zugang.
# Das ist hier nicht nur Gewohnheit. Der Stack laeuft mit fremden API-Keys und
# ohne jede Benutzerverwaltung, und AGPL-Code oeffentlich zu spiegeln waere ein
# eigenes Thema. Bleibt im LAN und am VPN.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worldmonitor
  namespace: worldmonitor
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "World Monitor"
    gethomepage.dev/description: "Lage-Dashboard"
    gethomepage.dev/group: "Applications"
    gethomepage.dev/icon: "mdi-earth"
    gethomepage.dev/weight: "70"
spec:
  ingressClassName: traefik
  rules:
    - host: worldmonitor.elmstreet79.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worldmonitor
                port:
                  number: 8080
