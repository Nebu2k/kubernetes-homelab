# Das Dashboard selbst: nginx liefert das gebaute Vite-Frontend aus und
# proxied /api/ auf einen Node-Prozess im selben Container (beide unter
# supervisord). Der Node-Teil ist der Sidecar-Server aus src-tauri, also
# derselbe Code, der in der Desktop-App die Vercel-Functions ersetzt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor
  namespace: worldmonitor
  labels:
    app.kubernetes.io/name: worldmonitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worldmonitor
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: worldmonitor
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      containers:
        - name: worldmonitor
          image: ghcr.io/nebu2k/worldmonitor
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Berlin"

            # Die App liest ihre Daten ausschliesslich ueber den REST-Proxy,
            # nie direkt aus Redis.
            - name: UPSTASH_REDIS_REST_URL
              value: "http://worldmonitor-redis-rest"
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worldmonitor
                  key: REDIS_TOKEN

            # LOCAL_API_MODE=docker schaltet den Sidecar in den
            # Container-Betrieb, LOCAL_API_CLOUD_FALLBACK=false verbietet ihm,
            # bei einem Fehler still auf api.worldmonitor.app auszuweichen.
            # Das zweite ist der Punkt, an dem sich Self-Hosting entscheidet:
            # ohne das waere jede Luecke im lokalen Stack unsichtbar, weil die
            # Antwort dann eben aus der Cloud kaeme.
            - name: LOCAL_API_PORT
              value: "46123"
            - name: LOCAL_API_MODE
              value: "docker"
            - name: LOCAL_API_CLOUD_FALLBACK
              value: "false"

            # Relay-Leg. RELAY_SHARED_SECRET ist beidseitig dasselbe Geheimnis:
            # die App schickt es als x-relay-key, das Relay weigert sich ohne
            # es ueberhaupt zu starten.
            - name: WS_RELAY_URL
              value: "http://worldmonitor-ais-relay:3004"
            - name: RELAY_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: worldmonitor
                  key: RELAY_SHARED_SECRET

            # Ohne GROQ_API_KEY bleiben die KI-gestuetzten Einschaetzungen leer,
            # der Rest des Dashboards laeuft weiter. Die uebrigen Keys nutzen
            # einzelne API-Routen; leer gesetzt degradieren sie sauber.
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldmonitor
                  key: GROQ_API_KEY
            - name: FRED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldmonitor
                  key: FRED_API_KEY
            - name: EIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldmonitor
                  key: EIA_API_KEY
            - name: NASA_FIRMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldmonitor
                  key: NASA_FIRMS_API_KEY

          # /api/sidecar-health ist die einzige auth-freie Route des Sidecars
          # und geht durch nginx' /api/-Proxy. Die Probe belegt damit beide
          # Prozesse; eine Probe auf "/" wuerde nur zeigen, dass nginx lebt.
          livenessProbe:
            httpGet:
              path: /api/sidecar-health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/sidecar-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: worldmonitor
  namespace: worldmonitor
  labels:
    app.kubernetes.io/name: worldmonitor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: worldmonitor
