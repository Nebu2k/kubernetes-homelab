# Redis haelt den kompletten Datenbestand des Dashboards: die Seeder schreiben
# hinein, die App liest ausschliesslich daraus. Es ist damit kein Cache im
# Sinne von "darf jederzeit weg", sondern der Grund, warum die Oberflaeche nach
# einem Neustart nicht leer ist. Deshalb PVC statt emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor-redis
  namespace: worldmonitor
  labels:
    app.kubernetes.io/name: worldmonitor-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worldmonitor-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worldmonitor-redis
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      containers:
        - name: redis
          image: redis:8.10.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          # --requirepass, obwohl Redis nur im Namespace erreichbar ist: der
          # REST-Proxy davor ist der eigentliche Zugang und traegt seinen
          # eigenen Token. Das Passwort ist die zweite Schicht, damit ein
          # kompromittierter Pod im selben Namespace nicht einfach am Proxy
          # vorbei liest und schreibt. Uebernommen aus Upstreams compose.
          #
          # $(REDIS_PASSWORD) wird von kubelet aus der env-Liste unten ersetzt,
          # nicht von einer Shell. Es laeuft also keine Shell, die das Passwort
          # in ihrer History oder in /proc/*/cmdline breiter streut als noetig.
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: worldmonitor
                  key: REDIS_PASSWORD
            # redis-cli liest REDISCLI_AUTH von selbst. Ohne das antworten die
            # Probes auf ein blankes "ping" mit NOAUTH und der Pod gilt
            # dauerhaft als ungesund.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: worldmonitor
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 448Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: worldmonitor-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: worldmonitor-redis
  namespace: worldmonitor
  labels:
    app.kubernetes.io/name: worldmonitor-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: worldmonitor-redis
