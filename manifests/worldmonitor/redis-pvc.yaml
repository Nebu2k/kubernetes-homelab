apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worldmonitor-redis-data
  namespace: worldmonitor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  # maxmemory steht auf 256mb, der Rest ist Luft fuer die AOF-Datei und deren
  # Rewrite.
  #
  # Die longhorn-StorageClass haengt jedes neue Volume ueber ihren
  # recurringJobSelector automatisch in die Gruppen backup, snapshot und
  # maintenance. Dieses Volume laeuft also in der naechtlichen NAS-Sicherung
  # mit, obwohl der Inhalt jederzeit neu geseedet werden koennte. Bewusst so
  # gelassen: 2Gi sind die Ausnahme nicht wert.
  resources:
    requests:
      storage: 2Gi
