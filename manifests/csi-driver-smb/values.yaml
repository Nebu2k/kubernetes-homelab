# Mounts CIFS shares as volumes. The mount happens in the node plugin, which
# is privileged but a contained infrastructure component, instead of in the
# application pod where it would force privileged: true.
#
# Kernel cifs support is enough, cifs-utils does NOT have to be installed on
# the nodes: the mount tools live in the smbplugin image.

# No Windows nodes in this cluster.
windows:
  enabled: false

controller:
  # The upstream default of 5 (debug) floods the logs permanently.
  logLevel: 2
  # The controller only does provisioning and resize, it does not belong on
  # the control plane.
  runOnControlPlane: false

node:
  # Same reason as above.
  logLevel: 2

# The node plugin deliberately runs on ALL nodes (default tolerations
# "operator: Exists"). Otherwise a pod with an SMB volume could land on a node
# without a registered plugin and hang in ContainerCreating. The images are
# multi-arch.
