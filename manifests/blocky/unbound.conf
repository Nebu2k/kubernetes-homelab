# Unbound as the recursive upstream for Blocky. Replaces the image's own
# unbound.conf entirely (bind-mounted over the file), so it also carries the
# parts taken unchanged from the image: the auth-zone "." and the hardening.
#
# One Unbound per Blocky instance, local in the same pod. A central one would
# be exactly the single point of failure the two instances avoid.
#
# This file lives here and not with the LXC instance, whose Alpine package
# brings its own configuration; both are equivalent in content, see
# homelab-terraform/proxmox/lxc-blocky.tf.

server:
  verbosity: 1
  num-threads: 2

  # Only the Blocky container in the same pod talks to Unbound. The port is
  # unprivileged, the process runs as UID 1000.
  interface: 127.0.0.1@5335
  access-control: 127.0.0.0/8 allow
  access-control: 0.0.0.0/0 refuse

  # No v6 transport towards the authoritatives. Not caution but fact: the pod
  # network is single-stack v4, a pod has no v6 address and no v6 route at all
  # ("Network is unreachable"). With do-ip6: yes Unbound would still try the
  # nameservers' AAAA records and collect an error per attempt. This line goes
  # once the cluster runs dual-stack.
  do-ip4: yes
  do-ip6: no
  prefer-ip4: yes
  prefer-ip6: no
  do-udp: yes
  do-tcp: yes
  udp-connect: yes

  outgoing-range: 4096
  outgoing-port-permit: 32768
  num-queries-per-thread: 2048

  msg-cache-size: 32m
  msg-cache-slabs: 4
  rrset-cache-size: 64m
  rrset-cache-slabs: 4
  infra-cache-slabs: 4
  key-cache-size: 8m
  key-cache-slabs: 4
  neg-cache-size: 2m
  cache-min-ttl: 0
  cache-max-ttl: 86400
  # Keeps frequent names and their DNSKEYs warm. Blocky prefetches on its own
  # level as well, this works one layer below.
  prefetch: yes
  prefetch-key: yes
  serve-expired: no

  use-systemd: no
  do-daemonize: no
  chroot: ""
  username: ""
  directory: "/usr/local/unbound/"
  logfile: ""
  use-syslog: no
  log-time-ascii: yes
  log-servfail: yes
  pidfile: "/usr/local/unbound/unbound.d/unbound.pid"

  hide-identity: yes
  hide-version: yes
  hide-trustanchor: yes
  harden-short-bufsize: yes
  harden-large-queries: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  harden-algo-downgrade: yes
  qname-minimisation: yes
  aggressive-nsec: yes
  use-caps-for-id: no
  deny-any: yes
  rrset-roundrobin: yes
  minimal-responses: yes
  disable-dnssec-lame-check: no
  do-not-query-localhost: yes

  # Drops answers from public DNS pointing at private addresses (rebinding).
  # The split-horizon rewrite comes from Blocky's customDNS, not from here, and
  # is unaffected.
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10
  private-address: ::ffff:0:0/96
  # plex.direct maps LAN addresses into public DNS by design (Plex hands out
  # per-server certificates for them), so it has to be exempt from the filter.
  private-domain: "plex.direct"
  unblock-lan-zones: no
  insecure-lan-zones: yes

  # DNSSEC validation, the reason Unbound is here at all: validate locally
  # instead of trusting an upstream.
  module-config: "validator iterator"
  auto-trust-anchor-file: "/usr/local/unbound/iana.d/root.key"
  trust-anchor-signaling: yes
  root-key-sentinel: yes
  val-max-restart: 5
  val-clean-additional: yes
  val-permissive-mode: no
  val-log-level: 2
  ignore-cd-flag: no
  zonemd-permissive-mode: no

python:
dynlib:
remote-control:

# Local copy of the root zone via zone transfer (RFC 8806), saving the trip to
# the root servers for every NXDOMAIN of an unknown TLD. fallback-enabled: yes
# means a failed transfer falls back to normal recursion via root.hints.
auth-zone:
  name: "."
  primary: 170.247.170.2        # b.root-servers.net
  primary: 192.33.4.12          # c.root-servers.net
  primary: 199.7.91.13          # d.root-servers.net
  primary: 192.5.5.241          # f.root-servers.net
  primary: 192.112.36.4         # g.root-servers.net
  primary: 193.0.14.129         # k.root-servers.net
  primary: 192.0.47.132         # xfr.cjr.dns.icann.org
  primary: 192.0.32.132         # xfr.lax.dns.icann.org
  fallback-enabled: yes
  for-downstream: no
  for-upstream: yes
  zonemd-check: yes
  zonemd-reject-absence: no
  zonefile: "/usr/local/unbound/iana.d/root.zone"
