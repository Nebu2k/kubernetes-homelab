# Unbound als rekursiver Upstream fuer Blocky. Ersetzt die mitgelieferte
# unbound.conf des Images vollstaendig (Bind-Mount ueber die Datei), enthaelt
# deshalb auch die Teile, die unveraendert vom Image kommen: die auth-zone "."
# und die Standard-Haertung.
#
# Ein Unbound pro Blocky-Instanz, lokal im selben Pod. Ein zentraler Unbound
# waere der Single Point of Failure, den die zwei Instanzen gerade vermeiden.
#
# Die Datei liegt hier und nicht bei der LXC-Instanz, weil das Alpine-Paket dort
# eine eigene Paketkonfiguration mitbringt. Inhaltlich sind beide gleich, siehe
# homelab-terraform/proxmox/lxc-blocky.tf.

server:
  verbosity: 1
  num-threads: 2

  # Nur der Blocky-Container im selben Pod redet mit Unbound. Der Port ist
  # unprivilegiert, der Prozess laeuft als UID 1000.
  interface: 127.0.0.1@5335
  access-control: 127.0.0.0/8 allow
  access-control: 0.0.0.0/0 refuse

  # Kein v6-Transport zu den Autoritativen. Hier ist das keine Vorsicht,
  # sondern der Ist-Zustand: das Pod-Netz ist single-stack v4, ein Pod hat
  # ueberhaupt keine v6-Adresse und keine v6-Route ("Network is unreachable",
  # gemessen 2026-08-09). Im LAN funktioniert v6 dagegen, die Clients haben
  # ISP-GUA und ULA; das gilt fuer die LXC-Instanz, nicht fuer diese hier.
  #
  # Mit do-ip6: yes wuerde Unbound die AAAA-Adressen der Nameserver trotzdem
  # anfassen und pro Versuch einen Fehler kassieren. Die Zeile gehoert erst
  # weg, wenn das Cluster dual-stack faehrt.
  do-ip4: yes
  do-ip6: no
  prefer-ip4: yes
  prefer-ip6: no
  do-udp: yes
  do-tcp: yes
  udp-connect: yes

  outgoing-range: 4096
  outgoing-port-permit: 32768
  num-queries-per-thread: 2048

  msg-cache-size: 32m
  msg-cache-slabs: 4
  rrset-cache-size: 64m
  rrset-cache-slabs: 4
  infra-cache-slabs: 4
  key-cache-size: 8m
  key-cache-slabs: 4
  neg-cache-size: 2m
  cache-min-ttl: 0
  cache-max-ttl: 86400
  # Haelt haeufige Namen und ihre DNSKEYs warm. Blocky prefetcht zusaetzlich auf
  # seiner Ebene, das hier greift eine Schicht tiefer.
  prefetch: yes
  prefetch-key: yes
  serve-expired: no

  use-systemd: no
  do-daemonize: no
  chroot: ""
  username: ""
  directory: "/usr/local/unbound/"
  logfile: ""
  use-syslog: no
  log-time-ascii: yes
  log-servfail: yes
  pidfile: "/usr/local/unbound/unbound.d/unbound.pid"

  hide-identity: yes
  hide-version: yes
  hide-trustanchor: yes
  harden-short-bufsize: yes
  harden-large-queries: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  harden-algo-downgrade: yes
  qname-minimisation: yes
  aggressive-nsec: yes
  use-caps-for-id: no
  deny-any: yes
  rrset-roundrobin: yes
  minimal-responses: yes
  disable-dnssec-lame-check: no
  do-not-query-localhost: yes

  # Antworten aus dem oeffentlichen DNS, die auf private Adressen zeigen,
  # werden verworfen (DNS-Rebinding). Das Split-Horizon-Rewrite auf
  # 192.168.2.250 kommt nicht von hier, sondern aus Blockys customDNS, und ist
  # davon nicht betroffen.
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10
  private-address: ::ffff:0:0/96
  unblock-lan-zones: no
  insecure-lan-zones: yes

  # DNSSEC-Validierung. Genau der Punkt, wegen dem Unbound hier steht: geprueft
  # wird selbst, statt dem Upstream zu glauben.
  module-config: "validator iterator"
  auto-trust-anchor-file: "/usr/local/unbound/iana.d/root.key"
  trust-anchor-signaling: yes
  root-key-sentinel: yes
  val-max-restart: 5
  val-clean-additional: yes
  val-permissive-mode: no
  val-log-level: 2
  ignore-cd-flag: no
  zonemd-permissive-mode: no

python:
dynlib:
remote-control:

# Lokale Kopie der Root-Zone per Zonentransfer (RFC 8806). Spart den Weg zu den
# Root-Servern fuer jedes NXDOMAIN einer unbekannten TLD. fallback-enabled: yes
# bedeutet, dass Unbound bei gescheitertem Transfer normal ueber root.hints
# rekursiert, statt stehen zu bleiben.
auth-zone:
  name: "."
  primary: 170.247.170.2        # b.root-servers.net
  primary: 192.33.4.12          # c.root-servers.net
  primary: 199.7.91.13          # d.root-servers.net
  primary: 192.5.5.241          # f.root-servers.net
  primary: 192.112.36.4         # g.root-servers.net
  primary: 193.0.14.129         # k.root-servers.net
  primary: 192.0.47.132         # xfr.cjr.dns.icann.org
  primary: 192.0.32.132         # xfr.lax.dns.icann.org
  fallback-enabled: yes
  for-downstream: no
  for-upstream: yes
  zonemd-check: yes
  zonemd-reject-absence: no
  zonefile: "/usr/local/unbound/iana.d/root.zone"
