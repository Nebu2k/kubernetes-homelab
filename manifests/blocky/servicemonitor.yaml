apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blocky
  namespace: blocky
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
      app.kubernetes.io/component: metrics
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
      # Sets the same label the LXC instance's ScrapeConfig assigns, so the
      # DNS board can show both side by side instead of telling them apart by
      # pod IP and host address.
      relabelings:
        - targetLabel: blocky_instance
          replacement: cluster
          action: replace
