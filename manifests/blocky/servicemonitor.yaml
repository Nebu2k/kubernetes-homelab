apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blocky
  namespace: blocky
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
      app.kubernetes.io/component: metrics
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
      # Setzt dasselbe Label, das der ScrapeConfig der LXC-Instanz vergibt
      # (manifests/kube-prometheus-stack/blocky-lxc-scrapeconfig.yaml). Erst
      # damit kann das DNS-Board beide Instanzen nebeneinander zeigen, statt
      # sie an Pod-IP und Host-Adresse auseinanderzuhalten.
      relabelings:
        - targetLabel: blocky_instance
          replacement: cluster
          action: replace
