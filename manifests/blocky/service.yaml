# The resolver entry point for the house. .253 sits at the top of the MetalLB
# pool and is requested explicitly rather than left to allocation order,
# because it is configured in the UniFi controller's DHCP settings.
#
# Its neighbour .254 is the second Blocky instance, the LXC on pve; that one
# lies outside the pool and MetalLB never hands it out.
#
# Both addresses fall under the UniFi rule granting the guest VLANs
# .249-.254. For a resolver that is wanted here: the guest VLANs need the
# split-horizon rewrite, otherwise even the public services fail for them.
apiVersion: v1
kind: Service
metadata:
  name: blocky-dns
  namespace: blocky
  labels:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
  annotations:
    # Both addresses in one annotation. spec.loadBalancerIP holds a single
    # address and cannot express a dual-stack service.
    metallb.io/loadBalancerIPs: "192.168.2.253,fd2e:9a71:c3b5::253"
spec:
  type: LoadBalancer
  # The reason the cluster runs dual-stack at all: without a v6 address here
  # the LXC on .254 is the only v6 resolver in the house.
  #
  # Prefer, not Require: a broken v6 half would otherwise take the v4 resolver
  # down with it. v4 stays primary, matching the order of the cluster's
  # service CIDRs.
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  # Load-bearing: Blocky groups clients by IP. Without Local, kube-proxy SNATs
  # every packet to the node's CNI gateway, Blocky would see a single client
  # address and every client rule would be silently ineffective. The same goes
  # for clientLookup and the client labels on the Prometheus metrics.
  externalTrafficPolicy: Local
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
  selector:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
---
# Separate from the LoadBalancer so the metrics are not exposed on .253 in the
# LAN. Prometheus scrapes cluster-internally.
apiVersion: v1
kind: Service
metadata:
  name: blocky-metrics
  namespace: blocky
  labels:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
    # The ServiceMonitor selects on this label. Without it the selector would
    # also match the LoadBalancer, leaving a target without an http port.
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
