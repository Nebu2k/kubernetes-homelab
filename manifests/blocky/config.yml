# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/config.schema.json
#
# One truth for BOTH Blocky instances, one commit is enough. The cluster picks
# this file up through a configMapGenerator; the LXC on pve fetches the exact
# same file from raw.githubusercontent.com every 15 minutes, validates it with
# "blocky validate" and restarts. No terraform apply needed, Terraform only
# owns the container.
#
# The LXC therefore trails the cluster by up to a quarter of an hour, on
# purpose: a bad change shows up in the cluster while the second resolver
# still runs the previous state.
#
# Nothing instance-specific belongs here: no bind interface, no address, no
# hostname. What differs between the two lives in their deployments.

# The only upstream is the local Unbound: a sidecar in the same pod here, the
# Alpine package on the LXC, 127.0.0.1:5335 either way.
upstreams:
  init:
    # Do not block on a starting Unbound: Blocky serves immediately and tries
    # the upstream on the first query.
    strategy: fast
  # strict, not parallel_best: the latter picks two random resolvers per query,
  # so adding a public fallback next to Unbound some day would leak half of all
  # queries even while Unbound is healthy. strict makes the order binding.
  strategy: strict
  groups:
    default:
      - tcp+udp:127.0.0.1:5335
  # More generous than the 2s default: a cold-cache query recurses all the way
  # to the root and is noticeably slower than a Cloudflare anycast answer.
  timeout: 5s

# The blocklist URLs resolve through the local Unbound too, not through
# /etc/resolv.conf: in the cluster that points at CoreDNS, which forwards to
# the house resolver, so the instance would depend on what it replaces.
bootstrapDns:
  - tcp+udp:127.0.0.1:5335

# Outbound v4 only, matching "do-ip6: no" in Unbound.
connectIPVersion: v4

# Split horizon, covering the apex and every subdomain; Traefik 301s the apex
# to www (manifests/landing-page/apex-redirect.yaml). filterUnmappedTypes stays
# on so AAAA and everything but A is answered empty instead of forwarded to
# Unbound: otherwise elmstreet79.de sometimes resolves to the public address.
customDNS:
  customTTL: 1h
  filterUnmappedTypes: true
  mapping:
    elmstreet79.de: 192.168.2.250

# Reverse lookups for the three house subnets go to their UniFi gateway.
# Unbound cannot answer them, private ranges have no delegation in the root.
conditional:
  fallbackUpstream: false
  mapping:
    2.168.192.in-addr.arpa: 192.168.2.1
    4.168.192.in-addr.arpa: 192.168.4.1
    5.168.192.in-addr.arpa: 192.168.5.1

blocking:
  denylists:
    ads:
      # Three sources on three separate hosts, so no single list going away
      # can leave the resolver unfiltered. Adblock syntax (||domain^) is not
      # an option anywhere here: Blocky reads hosts format, bare domains,
      # wildcards and regexes, nothing else.
      #
      # AdAway, hosts format, small and conservative.
      - https://adaway.org/hosts.txt
      # oisd big carries the bulk, roughly 250k wildcard entries, and comes
      # from the maintainer's own domain rather than a code host.
      - https://big.oisd.nl/domainswild
      # 1Hosts Lite covers the German ad networks oisd misses: ioam.de,
      # smartclip, adform, stroeerdigitalgroup.de.
      - https://raw.githubusercontent.com/badmojr/1Hosts/master/Lite/domains.wildcards
      # iCloud Private Relay would otherwise bypass the house resolver and
      # with it split horizon and filtering.
      - |
        mask.icloud.com
        mask-h2.icloud.com
        mask-canary.icloud.com
  clientGroupsBlock:
    default:
      - ads
  # Answer 0.0.0.0, like AdGuard's blocking_mode "default".
  blockType: zeroIp
  loading:
    refreshPeriod: 24h
    downloads:
      timeout: 60s
      attempts: 5
      cooldown: 10s
    # fast, not failOnError: a resolver that refuses to answer because a
    # blocklist is unreachable is worse than one answering unfiltered briefly.
    strategy: fast

caching:
  # Cushions the cold Unbound cache: frequent names are refreshed before their
  # TTL expires.
  prefetching: true
  prefetchExpires: 2h
  prefetchThreshold: 5

# Client names for metrics and later client groups. Only works while Blocky
# sees the real client IP, which in the cluster requires
# externalTrafficPolicy: Local on the LoadBalancer service.
clientLookup:
  upstream: 192.168.2.1

prometheus:
  enable: true
  path: /metrics

ports:
  dns: 53
  http: 4000

# No query log. A CSV in the pod would be gone after every restart and a
# database for it is out of proportion; the Prometheus metrics show what was
# asked and what was blocked.
queryLog:
  type: none

log:
  level: info
  format: text

# Extended DNS Errors: Blocky puts the reason (blocked, upstream error,
# SERVFAIL from DNSSEC validation) into the answer instead of swallowing it.
ede:
  enable: true
