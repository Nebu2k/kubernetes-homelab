apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  namespace: blocky
  labels:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
  # Muss zur harten Spreizung unten passen. maxSurge: 0, weil ein dritter Pod
  # die maxSkew verletzen wuerde und Pending bliebe: das Update haengt fest.
  # Der Rollout ersetzt so je einen Pod an Ort und Stelle.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocky
        app.kubernetes.io/instance: blocky
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      # externalTrafficPolicy: Local am Service kuendigt MetalLB die .253 nur
      # von Nodes an, auf denen ein bereiter Pod laeuft. Ohne Spreizung waere
      # diese eine Node ein Single Point of Failure fuer das Haus-DNS.
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: blocky
              app.kubernetes.io/instance: blocky
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blocky
          image: ghcr.io/0xerr0r/blocky:v0.34.0
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config.yml"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 4000
              protocol: TCP
          securityContext:
            # UID 100 ist der Image-Default. Port 53 bindet der Prozess trotzdem
            # unprivilegiert, weil kubelet net.ipv4.ip_unprivileged_port_start=0
            # in der Pod-Netns setzt; NET_BIND_SERVICE ist der Guertel dazu und
            # unter PodSecurity baseline erlaubt.
            runAsUser: 100
            runAsGroup: 100
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              cpu: 50m
              # Gemessen am 2026-08-09 mit geladenen Listen: 50 Mi Spitze, die
              # 222k Denylist-Eintraege kosten also fast nichts. Der Request
              # liegt bewusst darueber, nicht darauf: unter Speicherdruck
              # raeumt kubelet nach Verbrauch OBERHALB des Requests aus, und
              # der Haus-Resolver soll nicht der erste sein, der geht.
              #
              # Noch ohne echte Last, im DHCP steht die Adresse nicht. Wenn sie
              # dort steht, hier nochmal messen.
              memory: 128Mi
            limits:
              # Bewusst kein CPU-Limit, siehe references/betrieb.md.
              memory: 512Mi
          # "blocky healthcheck" fragt per TCP 127.0.0.1:53 nach
          # healthcheck.blocky. Das prueft den DNS-Listener, nicht nur den
          # Prozess, und ist damit das, was der Service wissen muss.
          startupProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
            - name: blocky-cache
              mountPath: /app/cache
        - name: unbound
          image: madnuttah/unbound:1.26.0-0
          imagePullPolicy: IfNotPresent
          env:
            # Ohne das startet der Entrypoint als root, um UID und GID des
            # Image-Users zu korrigieren, und faellt damit ueber runAsNonRoot.
            # Die Voreinstellung des Images ist 1000:1000 und passt bereits.
            - name: DISABLE_SET_PERMS
              value: "true"
          ports:
            - name: unbound-udp
              containerPort: 5335
              protocol: UDP
            - name: unbound-tcp
              containerPort: 5335
              protocol: TCP
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            # Nicht read-only: unbound-anchor schreibt beim Start die root.key
            # fort und unbound legt seine pid-Datei unter /usr/local/unbound ab.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              # 22 Mi gemessen am 2026-08-09, aber der Cache war leer. Die
              # Konfiguration erlaubt ihm zusammen rund 106 Mi (msg 32m,
              # rrset 64m, key 8m, neg 2m), dahin waechst er unter Last. Der
              # Request bildet dieses Ziel ab und nicht den Startwert.
              memory: 96Mi
            limits:
              memory: 256Mi
          # Kein tcpSocket-Probe: Unbound lauscht auf 127.0.0.1, kubelet waehlt
          # aber die Pod-IP an. Das mitgelieferte Skript sieht im Container
          # selbst nach und prueft dabei /proc/net, loest also nichts auf.
          startupProbe:
            exec:
              command: ["/usr/local/unbound/sbin/healthcheck.sh"]
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["/usr/local/unbound/sbin/healthcheck.sh"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /usr/local/unbound/unbound.conf
              subPath: unbound.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blocky-config
        # Blocky braucht ein beschreibbares /app/cache, auch ohne konfiguriertes
        # cachePath. Bewusst kein PVC: die Listen sind nach einem Neustart in
        # unter einer Minute wieder da, ein RWO-Volume dagegen wuerde die zweite
        # Replik an dieselbe Node binden.
        - name: blocky-cache
          emptyDir: {}
