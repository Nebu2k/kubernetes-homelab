apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  namespace: blocky
  labels:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
  # Must match the hard spread below. maxSurge: 0 because a third pod would
  # violate maxSkew and stay Pending, deadlocking the rollout. This way each
  # pod is replaced in place.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocky
        app.kubernetes.io/instance: blocky
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "worker"
      # With externalTrafficPolicy: Local, MetalLB announces .253 only from
      # nodes running a ready pod. Without the spread that single node would
      # be a point of failure for the whole house's DNS.
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: blocky
              app.kubernetes.io/instance: blocky
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Native sidecar: started as an init container and kept running by
      # restartPolicy Always, so Blocky's main container only starts once
      # Unbound passes its startup probe. Started in parallel, Blocky's
      # blocklist downloads raced the upstream and failed on every cold pod.
      initContainers:
        - name: unbound
          restartPolicy: Always
          image: madnuttah/unbound:1.26.0-0
          imagePullPolicy: IfNotPresent
          env:
            # Without this the entrypoint starts as root to fix the image
            # user's UID and GID and then trips over runAsNonRoot. The image
            # already defaults to 1000:1000.
            - name: DISABLE_SET_PERMS
              value: "true"
          ports:
            - name: unbound-udp
              containerPort: 5335
              protocol: UDP
            - name: unbound-tcp
              containerPort: 5335
              protocol: TCP
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            # Not read-only: unbound-anchor updates root.key at startup and
            # unbound writes its pid file below /usr/local/unbound.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              # The request models the cache under load, not the startup
              # value: the configuration allows roughly 106 Mi in total
              # (msg 32m, rrset 64m, key 8m, neg 2m).
              memory: 96Mi
            limits:
              memory: 256Mi
          # No tcpSocket probe: Unbound listens on 127.0.0.1 while kubelet
          # dials the pod IP. The bundled script checks /proc/net from inside
          # the container and resolves nothing.
          startupProbe:
            exec:
              command: ["/usr/local/unbound/sbin/healthcheck.sh"]
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["/usr/local/unbound/sbin/healthcheck.sh"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /usr/local/unbound/unbound.conf
              subPath: unbound.conf
              readOnly: true
      containers:
        - name: blocky
          image: ghcr.io/0xerr0r/blocky:v0.34.0
          imagePullPolicy: IfNotPresent
          # A directory, not a file: Blocky joins every YAML in it, which keeps
          # the cluster-only redis block out of the config.yml the LXC shares.
          args: ["--config", "/app/conf"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 4000
              protocol: TCP
          securityContext:
            # UID 100 is the image default. Port 53 still binds unprivileged
            # because kubelet sets net.ipv4.ip_unprivileged_port_start=0 in the
            # pod netns; NET_BIND_SERVICE is the belt on top and permitted
            # under PodSecurity baseline.
            runAsUser: 100
            runAsGroup: 100
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              cpu: 50m
              # Deliberately above the measured peak: under memory pressure
              # kubelet evicts by usage ABOVE the request, and the house
              # resolver should not be the first to go. 1.3M list entries
              # measure 208Mi.
              memory: 256Mi
            limits:
              # No CPU limit on purpose, see references/operations.md.
              memory: 512Mi
          # "blocky healthcheck" queries healthcheck.blocky over TCP on
          # 127.0.0.1:53, testing the DNS listener rather than the process.
          startupProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Both files individually via subPath, not the ConfigMap mounted as a
          # directory: that would put its ..data symlink layer in there too,
          # and Blocky descends into it and loads every file a second time.
          # Mounting the whole ConfigMap would also hand it unbound.conf.
          volumeMounts:
            - name: config
              mountPath: /app/conf/config.yml
              subPath: config.yml
              readOnly: true
            - name: config
              mountPath: /app/conf/config-redis.yml
              subPath: config-redis.yml
              readOnly: true
            - name: blocky-cache
              mountPath: /app/cache
      volumes:
        - name: config
          configMap:
            name: blocky-config
        # Blocky needs a writable /app/cache even without a configured
        # cachePath. Deliberately no PVC: the lists are back within a minute
        # after a restart, while an RWO volume would pin the second replica to
        # the same node.
        - name: blocky-cache
          emptyDir: {}
