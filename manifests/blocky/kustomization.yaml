apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blocky

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - poddisruptionbudget.yaml
  - servicemonitor.yaml

# generator statt handgeschriebener ConfigMap wegen des Hash-Suffixes: Blocky
# und Unbound lesen ihre Konfiguration nur beim Start. Ohne Suffix wuerde eine
# Aenderung zwar synchronisiert, die laufenden Pods behielten aber die alte
# Fassung, bis sie zufaellig etwas neu startet. Mit Suffix aendert sich der
# ConfigMap-Name und das Deployment rollt von selbst.
#
# config.yml ist zugleich die Vorlage fuer die LXC-Instanz auf pve, siehe
# Kopf der Datei.
configMapGenerator:
  - name: blocky-config
    files:
      - config.yml
      - unbound.conf
