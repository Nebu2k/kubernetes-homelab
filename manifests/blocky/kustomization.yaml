apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blocky

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - poddisruptionbudget.yaml
  - servicemonitor.yaml

# A generator rather than a handwritten ConfigMap, for the hash suffix: Blocky
# and Unbound read their configuration only at startup, so without it a change
# would sync but the running pods would keep the old copy until something
# restarted them. With the suffix the name changes and the deployment rolls.
#
# config.yml is also the source for the LXC instance on pve, see its header.
configMapGenerator:
  - name: blocky-config
    files:
      - config.yml
      - unbound.conf
