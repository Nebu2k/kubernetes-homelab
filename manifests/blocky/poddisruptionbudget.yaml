# Protects the house DNS during voluntary disruptions, above all a node drain
# in a Talos upgrade. Without the PDB a drain may evict both pods at once, and
# with externalTrafficPolicy: Local no node would have a ready endpoint left:
# MetalLB stops announcing .253 and half the house has no DNS.
#
# minAvailable rather than maxUnavailable, so the guarantee is an absolute
# number instead of a fraction of replicas: after an accidental scale-down to
# 1 the PDB blocks the drain instead of silently releasing everything.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blocky
  namespace: blocky
  labels:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
