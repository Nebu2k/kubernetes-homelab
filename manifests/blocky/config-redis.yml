# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/config.schema.json
#
# Cluster-only, which is why it is not in config.yml: that file is the shared
# truth for the LXC on pve as well, and the LXC cannot resolve this address.
# Blocky is started with "--config /app/conf" and merges every file in that
# directory, so a key must not appear in both files or the load fails.
redis:
  address: redis.blocky.svc.cluster.local:6379
  # Load-bearing: with required: true a redis that is down would keep Blocky
  # from starting, and the house resolver must not hang off the switch.
  required: false
  # Roughly 30s of retrying, because the fallback above is one-way: Blocky
  # connects once at startup and a pod that fails there runs unsynced until it
  # is restarted, with nothing but a WARN in its log to show for it. The
  # default 3 attempts missed a redis that went ready five seconds later.
  connectionAttempts: 15
  connectionCooldown: 2s
