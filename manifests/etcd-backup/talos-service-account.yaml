# Das talosconfig, mit dem die CronJobs unten an die Talos-API kommen.
#
# Kein Kubernetes-ServiceAccount, sondern ein CR der Gruppe talos.dev. Talos
# beobachtet diese Objekte und legt daneben ein Secret gleichen Namens an, das
# unter dem Schluessel "config" ein fertiges talosconfig traegt. Das Zertifikat
# darin laeuft nach sechs Stunden ab und wird laufend erneuert, es liegt also
# nie ein langlebiges Admin-Credential im Cluster.
#
# Voraussetzung ist machine.features.kubernetesTalosAPIAccess in
# talos/talconfig.yaml. Sie ist dort doppelt eingegrenzt: nur die Rolle
# os:etcd:backup und nur der Namespace kube-system. Ein gleichlautendes CR in
# einem anderen Namespace bekommt kein Secret, und mit diesem hier laesst sich
# ausser einem etcd-Snapshot nichts tun: kein Lesen der machine config, kein
# Reboot, kein Zugriff auf die Secrets der Node.
#
# Der Endpoint im ausgestellten talosconfig ist der Service talos.default, den
# Talos beim Aktivieren des Features selbst anlegt. Das "-n <ip>" in den
# CronJobs waehlt darueber die Ziel-Node aus, apid reicht den Aufruf weiter.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: kube-system
spec:
  roles:
    - os:etcd:backup
