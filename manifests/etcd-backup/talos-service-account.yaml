# The talosconfig the CronJobs use to reach the Talos API.
#
# Not a Kubernetes ServiceAccount but a CR of the talos.dev group: Talos
# watches these objects and creates a secret of the same name carrying a ready
# talosconfig under the key "config". Its certificate expires after six hours
# and is renewed continuously, so no long-lived admin credential ever sits in
# the cluster.
#
# Requires machine.features.kubernetesTalosAPIAccess in talos/talconfig.yaml,
# which is confined twice over: only the role os:etcd:backup and only the
# kube-system namespace. An identical CR elsewhere gets no secret, and this
# one can do nothing but take an etcd snapshot: no reading the machine config,
# no reboot, no access to the node's secrets.
#
# The endpoint in the issued talosconfig is the talos.default service Talos
# creates when the feature is enabled; the "-n <ip>" in the CronJobs selects
# the target node through it and apid forwards the call.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: kube-system
spec:
  roles:
    - os:etcd:backup
