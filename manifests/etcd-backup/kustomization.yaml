# Offsite-Backup des Talos-etcd.
#
# Eingebunden ueber apps/etcd-backup.yaml.
#
# Kein namespace.yaml: kube-system existiert immer. Frei waehlbar ist der
# Namespace hier trotzdem nicht, machine.features.kubernetesTalosAPIAccess in
# talos/talconfig.yaml laesst genau diesen einen zu.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - s3-credentials-sealed.yaml
  - talos-service-account.yaml
  - cronjob.yaml
