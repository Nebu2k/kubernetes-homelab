# Offsite backup of the Talos etcd.
#
# No namespace.yaml, kube-system always exists. The namespace is not free to
# choose either: machine.features.kubernetesTalosAPIAccess in
# talos/talconfig.yaml permits exactly this one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - s3-credentials-sealed.yaml
  - talos-service-account.yaml
  - cronjob.yaml
