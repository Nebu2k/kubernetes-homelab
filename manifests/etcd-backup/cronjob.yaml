# Offsite backup of the Talos etcd, one CronJob per control plane.
#
# Talos does not upload snapshots anywhere itself, it only writes one out on
# request through the API, so the upload is the cluster's job, not the node's.
#
# One CronJob per node rather than one with several steps, so an unreachable
# node only breaks its own run. In a shared job the snapshots would be
# initContainers running strictly in sequence and all having to succeed: a
# dead node would then also prevent the healthy ones' snapshots and everything
# in S3 would age at once.
#
# Several snapshots although etcd replicates and the content is identical:
# they prove several independent paths into the bucket, and at roughly 55 MB
# each with a 30-day lifecycle that costs under 10 GB.
#
# THIS LIST MUST FOLLOW THE ETCD MEMBERS. A new control plane belongs here AND
# in the node loop of the freshness probe; a removed one has to go from both.
# Otherwise either a node stops backing up unnoticed, or the probe reports
# "no object at all" forever for a node that no longer exists.
#
# The schedule is staggered so no two snapshots share the line. timeZone is
# mandatory: without it a CronJob runs in the timezone of whichever node holds
# the kube-controller-manager lease.
#
# The object name is "etcd-snapshot-<node>-<unix-ts>", which is the prefix the
# freshness probe checks per node.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot-talos-cp-1
  namespace: kube-system
  labels:
    app.kubernetes.io/name: etcd-snapshot-offsite
spec:
  schedule: "0 0,12 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retry. A node that is gone is still gone on the second attempt, and
      # the failed job IS the signal.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-snapshot-offsite
        spec:
          restartPolicy: Never
          initContainers:
            # The talosctl image is distroless: no /tmp, no shell. The
            # snapshot therefore goes into a mounted volume and the upload
            # needs a second image.
            - name: snapshot
              image: ghcr.io/siderolabs/talosctl:v1.13.9
              command:
                - /talosctl
                - --talosconfig
                - /talos/config
                - --nodes
                - 192.168.2.20
                - etcd
                - snapshot
                - /snapshot/db
              volumeMounts:
                - name: talosconfig
                  mountPath: /talos
                  readOnly: true
                - name: snapshot
                  mountPath: /snapshot
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          containers:
            - name: upload
              image: amazon/aws-cli:2.36.30
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  KEY="etcd-snapshot-${NODE_NAME}-$(date +%s)"
                  echo "lade $(stat -c %s /snapshot/db) Bytes nach s3://${ETCD_BUCKET}/${KEY}"
                  # --only-show-errors, otherwise the aws-cli writes a
                  # progress line per MiB and the job log is unreadable.
                  aws s3 cp --only-show-errors /snapshot/db "s3://${ETCD_BUCKET}/${KEY}"
              env:
                - name: NODE_NAME
                  value: talos-cp-1
              envFrom:
                - secretRef:
                    name: etcd-backup-s3
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: talosconfig
              secret:
                # Created by Talos as soon as the ServiceAccount CR exists.
                secretName: etcd-backup
            - name: snapshot
              emptyDir:
                sizeLimit: 2Gi
---
