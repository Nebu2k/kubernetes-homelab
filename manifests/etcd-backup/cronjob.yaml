---
# raspi5, seit dem 2026-08-09 vierte Control-Plane. Die 00:50 ist der vierte
# freie Staffel-Slot; wenn talos-cp-2 abgebaut ist, wird die 00:20 frei und
# diese Node kann dorthin ruecken. Muss sie aber nicht, der Upload dauert
# Sekunden.
#
# Der Snapshot laeuft ueber die Talos-API und nicht auf der Node, der Pod kann
# also irgendwo im Cluster liegen. arm64 spielt hier keine Rolle.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot-raspi5
  namespace: kube-system
  labels:
    app.kubernetes.io/name: etcd-snapshot-offsite
spec:
  schedule: "50 0,12 * * *"
  timeZone: "Etc/UTC"
