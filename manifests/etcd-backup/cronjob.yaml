---
# raspi5. The snapshot runs through the Talos API rather than on the node, so
# the pod can sit anywhere in the cluster and arm64 does not matter.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot-raspi5
  namespace: kube-system
  labels:
    app.kubernetes.io/name: etcd-snapshot-offsite
spec:
  schedule: "20 0,12 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
