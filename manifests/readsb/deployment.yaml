# ADSB Ultrafeeder: readsb plus tar1090, straight off the RTL dongle. The
# dongle sits on pve and is passed into talos-cp-1 via qemu USB, see
# talos/README.md.
#
# Ultrafeeder rather than docker-readsb-protobuf, whose repo is archived.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readsb
  namespace: adsb
  labels:
    app: readsb
spec:
  replicas: 1
  # Recreate, not RollingUpdate: there is exactly one dongle, and a rolling
  # update would start the new pod while the old one still holds the device,
  # leaving both to fail alternately on "usb_claim_interface error -6".
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: readsb
  template:
    metadata:
      labels:
        app: readsb
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      # The default 30s is enough for the RRD writeback, but it runs at the end
      # of the collectd teardown, behind the rest of the s6 shutdown.
      terminationGracePeriodSeconds: 60
      # The dongle is physically attached to talos-cp-1, so the pod can run
      # nowhere else, which makes that node a pet. Moving the dongle means
      # changing the hostname here and the usb block in
      # homelab-terraform/proxmox/vm-talos.tf, nothing else.
      nodeSelector:
        kubernetes.io/hostname: talos-cp-1
      containers:
        - name: ultrafeeder
          image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder:latest-build-845
          imagePullPolicy: IfNotPresent
          securityContext:
            # privileged instead of the upstream compose's
            # device_cgroup_rules, which Kubernetes has no equivalent for.
            # Together with the hostPath below this is the path to the dongle,
            # and it survives a re-enumeration after a device reset.
            privileged: true
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 30005
              name: beast
              protocol: TCP
            - containerPort: 9273
              name: metrics
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: READSB_DEVICE_TYPE
              value: "rtlsdr"
            # READSB_RTLSDR_DEVICE stays unset: with exactly one dongle readsb
            # takes the only one it finds. READSB_GAIN stays unset too, its
            # default is readsb's built-in autogain, which needs no persistent
            # state.
            #
            # The antenna position is mandatory for Ultrafeeder, the container
            # does not start without it. It lives in the SealedSecret because
            # the repo is public and those are the house coordinates.
            - name: READSB_LAT
              valueFrom:
                secretKeyRef:
                  name: readsb-secret
                  key: lat
            - name: READSB_LON
              valueFrom:
                secretKeyRef:
                  name: readsb-secret
                  key: lon
            - name: READSB_ALT
              valueFrom:
                secretKeyRef:
                  name: readsb-secret
                  key: alt
            # airplanes.live takes ADS-B and MLAT straight from Ultrafeeder,
            # no feeder container of its own. The MLAT results come back on
            # the same connection and land on the local tar1090 map. The mlat
            # entry is also what starts the built-in MLAT hub, which piaware
            # pushes its own results into on port 31004.
            - name: ULTRAFEEDER_CONFIG
              value: "adsb,feed.airplanes.live,30004,beast_reduce_plus_out;mlat,feed.airplanes.live,31090"
            # The name mlat-client registers under. Without it the client
            # invents a random number on every start.
            - name: MLAT_USER
              value: "elmstreet79"
            # Identifies the receiver at the aggregators independently of the
            # public IP, which rotates.
            - name: UUID
              valueFrom:
                secretKeyRef:
                  name: feeder-uuid-secret
                  key: uuid
            # tar1090 keeps traces and heatmap under /var/globe_history, which
            # grows without bound and sits on an emptyDir, i.e. on the node's
            # EPHEMERAL partition.
            - name: MAX_GLOBE_HISTORY
              value: "3"
            # Keeps the graphs1090 RRDs in the /run tmpfs and writes them to the
            # PVC as one tarball, on shutdown and every flush interval. Without
            # this the RRD set is rewritten in place every minute, the write
            # pattern that bloats a Longhorn volume.
            - name: GRAPHS1090_REDUCE_IO
              value: "true"
            # Default is 1d. An unclean pod kill loses everything since the last
            # flush, and an hour of receiver history is the acceptable loss.
            - name: GRAPHS1090_REDUCE_IO_FLUSH_IVAL
              value: "1h"
          volumeMounts:
            - name: usb
              mountPath: /dev/bus/usb
            - name: globe-history
              mountPath: /var/globe_history
            - name: run
              mountPath: /run
            - name: collectd
              mountPath: /var/lib/collectd
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 30005
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
        # emptyDir rather than a Longhorn volume: tar1090 rewrites its traces
        # constantly, exactly the write pattern that bloats a Longhorn volume.
        # A restart costs three days of flight history, not the feed.
        - name: globe-history
          emptyDir: {}
        # Carries the live RRDs on top of the usual s6 and readsb runtime state,
        # roughly 40 Mi in total. Size matches the upstream compose file, and
        # what is used is charged against the memory limit above.
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: collectd
          persistentVolumeClaim:
            claimName: readsb-collectd
