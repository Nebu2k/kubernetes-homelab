apiVersion: v1
kind: Namespace
metadata:
  name: adsb
  labels:
    # The readsb pod needs privileged plus hostPath /dev/bus/usb to reach the
    # RTL dongle, all forbidden by the baseline profile Talos enforces
    # cluster-wide.
    #
    # On the namespace rather than as another exception in
    # talos/talconfig.yaml: this is GitOps and shows up on deploy, while a
    # change there reboots the control plane.
    pod-security.kubernetes.io/enforce: privileged
