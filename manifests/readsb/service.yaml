apiVersion: v1
kind: Service
metadata:
  name: readsb
  namespace: adsb
  labels:
    app: readsb
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    # Beast output. fr24feed hangs off this, and any number of further feeders
    # can join in parallel without readsb noticing.
    - port: 30005
      targetPort: 30005
      protocol: TCP
      name: beast
    # Prometheus statistics, still without a ServiceMonitor.
    - port: 9273
      targetPort: 9273
      protocol: TCP
      name: metrics
  selector:
    app: readsb
