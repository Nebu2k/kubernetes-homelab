apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace.yaml: "monitoring" belongs to the kube-prometheus-stack app,
# which creates it. Hence this app's Application runs with
# CreateNamespace=false and on a later sync wave.
namespace: monitoring

resources:
  - s3-backup-monitor-credentials-sealed.yaml
  - freshness-cronjob.yaml
