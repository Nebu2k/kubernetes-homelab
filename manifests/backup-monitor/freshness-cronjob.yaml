# Freshness probe over the offsite backup buckets.
#
# The "offsite-backup-jobs" alerts prove a job ran. They do NOT prove anything
# arrived in the bucket, and that gap holds the failures nobody else sees:
#
#   - paperless: the export is a CronJob but the upload runs in a sidecar on
#     its own timer. A failed upload logs "ERROR" and sleeps on, job green.
#   - Home Assistant: there is no job at all. HA uploads itself, and when that
#     fails it fails silently: if the agent ID changes, the automatic backup
#     goes to backup.local only, HA logs one WARNING line, and the sensor
#     stays green because a backup was indeed created.
#   - teslamate: the smallest gap (dump and upload are the same job), but the
#     bucket is still the only place showing the result instead of the intent.
#   - etcd: what matters is that EVERY control plane is checked separately.
#     Each node uploads from its own CronJob and one can fail silently without
#     the bucket as a whole looking odd.
#
# The job exits 1 as soon as a bucket is too old; the reporting is done by
# OffsiteBackupFreshnessCheckFailing in prometheus-rules.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-backup-freshness
  namespace: monitoring
  labels:
    app.kubernetes.io/name: offsite-backup-freshness
spec:
  # 06:00 UTC, after everything that backs up at night: teslamate 01:30, the
  # paperless export 02:00 (its sidecar syncs within the following hour), HA's
  # own run around 05:30 local and the monthly archive at 04:00 on the 1st.
  #
  # timeZone is mandatory: without it a CronJob runs in the timezone of
  # whichever node currently holds the kube-controller-manager lease, and the
  # nodes do not agree, so the schedule wanders with the lease.
  schedule: "0 6 * * *"
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # No retry. A bucket that is too old does not get younger on a second
      # attempt, and the failed job IS the signal for the alert.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: offsite-backup-freshness
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: amazon/aws-cli:2.36.36
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  NOW=$(date -u +%s)
                  FAIL=0

                  # Arguments: bucket, prefix (empty = whole bucket), limit in
                  # hours, display name for the output.
                  pruefe() {
                    BUCKET="$1"; PREFIX="$2"; MAX_H="$3"; LABEL="$4"

                    # sort_by yields the newest object, by LastModified rather
                    # than by key: the three buckets follow three different
                    # naming schemes and the timestamp is the only thing they
                    # share.
                    #
                    # The "Contents || `[]`" is required: if the prefix matches
                    # nothing, Contents is absent entirely and sort_by(null)
                    # aborts with a JMESPath type error instead of an empty
                    # result. That happens for real before the paperless export
                    # has written its first last-export.txt.
                    NEWEST=$(aws s3api list-objects-v2 \
                      --bucket "${BUCKET}" --region "${S3_REGION}" \
                      ${PREFIX:+--prefix "${PREFIX}"} \
                      --query 'sort_by(Contents || `[]`, &LastModified)[-1].[LastModified,Key]' \
                      --output text 2>&1) || {
                        echo "FEHLER: ${LABEL}: Listing fehlgeschlagen: ${NEWEST}"
                        FAIL=1
                        return
                      }

                    if [ -z "${NEWEST}" ] || [ "${NEWEST}" = "None" ]; then
                      echo "FEHLER: ${LABEL}: kein einziges Objekt unter '${PREFIX}'."
                      FAIL=1
                      return
                    fi

                    STAMP=$(echo "${NEWEST}" | cut -f1)
                    KEY=$(echo "${NEWEST}" | cut -f2)
                    AGE_H=$(( (NOW - $(date -u -d "${STAMP}" +%s)) / 3600 ))

                    # The key deliberately stays out of the log: paperless
                    # export filenames carry document titles and
                    # correspondents. The extension alone is enough.
                    #
                    # The case construct is required, not caution: for a key
                    # WITHOUT a dot "${KEY##*.}" returns the whole key. That is
                    # exactly what the etcd snapshots look like.
                    case "${KEY}" in
                      *.*) EXT=".${KEY##*.}" ;;
                      *)   EXT="(ohne Endung)" ;;
                    esac

                    printf '%-28s %4sh alt (Grenze %sh)  %s\n' \
                      "${LABEL}" "${AGE_H}" "${MAX_H}" "${EXT}"

                    if [ "${AGE_H}" -gt "${MAX_H}" ]; then
                      echo "  ZU ALT: seit ${AGE_H}h ist in ${BUCKET} nichts Neues angekommen."
                      FAIL=1
                    fi
                  }

                  echo "Frische der Offsite-Backups, Stand $(date -u +%FT%TZ)"
                  echo

                  # 36h as with the job alerts: one missed run stays quiet.
                  # Since the check runs daily, a failure surfaces on the
                  # morning after next at the latest.
                  pruefe "${TESLAMATE_BUCKET}" "daily/" 36 "teslamate (daily)"

                  # HA uploads every tar itself, so the whole bucket counts.
                  pruefe "${HOME_ASSISTANT_BUCKET}" "" 36 "home assistant"

                  # Mealie like teslamate: creation and upload are the same
                  # job, but the bucket is the only place where arrival shows.
                  pruefe "${MEALIE_BUCKET}" "daily/" 36 "mealie (daily)"

                  # Deliberately the heartbeat file, not the newest object in
                  # the bucket: the sidecar syncs without --delete and uploads
                  # only what changed, and document_exporter keeps the old
                  # mtimes of the media files. If the documents do not change
                  # for days, nothing is uploaded for days, so "newest object"
                  # would be a false-alarm generator.
                  #
                  # last-export.txt is rewritten after every successful export
                  # run, always gets a fresh mtime and is therefore always
                  # synced. If IT is current, both halves are proven: the
                  # export ran AND the sidecar uploaded.
                  pruefe "${PAPERLESS_BUCKET}" "paperless-backup/last-export.txt" 36 "paperless (heartbeat)"

                  # Every control plane runs its own snapshot CronJob every
                  # 12h, and every node is checked separately. A single check
                  # over the whole bucket would go green as soon as ONE node
                  # delivers, hiding that the other two stopped weeks ago.
                  #
                  # The object name carries the node name
                  # ("etcd-snapshot-<node>-<unix-ts>"), so the prefix hits
                  # exactly that node's scheduled snapshots and deliberately
                  # ignores manual runs.
                  #
                  # This list must match the CronJobs in manifests/etcd-backup/
                  # in BOTH directions: a node missing there does not back up,
                  # a node missing here backs up unobserved. After a node
                  # rebuild or rename this probe reports "no object at all",
                  # which is the loud failure we want.
                  #
                  # 26h rather than 18h: the per-node interval is 12h, so one
                  # missed run stays quiet while two in a row are a real
                  # signal.
                  for NODE in talos-cp-1 prodesk raspi5; do
                    pruefe "${ETCD_BUCKET}" "etcd-snapshot-${NODE}-" 26 "etcd ${NODE}"
                  done

                  echo
                  if [ "${FAIL}" -ne 0 ]; then
                    echo "MINDESTENS EIN BUCKET IST NICHT AKTUELL."
                    exit 1
                  fi
                  echo "Alle Buckets sind aktuell."
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: S3_REGION
                - name: PAPERLESS_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: PAPERLESS_BUCKET
                - name: HOME_ASSISTANT_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: HOME_ASSISTANT_BUCKET
                - name: TESLAMATE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: TESLAMATE_BUCKET
                - name: ETCD_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: ETCD_BUCKET
                - name: MEALIE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: MEALIE_BUCKET
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
