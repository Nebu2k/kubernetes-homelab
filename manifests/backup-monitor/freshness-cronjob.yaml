# Frische-Sonde ueber die Offsite-Backup-Buckets.
#
# Die Alerts der Gruppe "offsite-backup-jobs" belegen, dass ein Job durchgelaufen
# ist. Sie belegen NICHT, dass etwas im Bucket angekommen ist. Genau dazwischen
# liegen die Fehler, die sonst niemand sieht:
#
#   - paperless: der Export laeuft als CronJob, der Upload aber im Sidecar auf
#     eigenem Timer. Scheitert der Upload, schreibt der Sidecar "ERROR" ins Log
#     und schlaeft weiter. Der Job bleibt gruen.
#   - Home Assistant: es gibt gar keinen Job. HA laedt selbst hoch, und wenn das
#     ausfaellt, faellt es still aus. Wechselt zum Beispiel beim Key-Tausch die
#     Agenten-ID, geht das automatische Backup nur noch nach backup.local, und
#     HA schreibt dazu genau eine WARNING-Zeile. In der UI sieht alles gesund
#     aus, und der Sensor sensor.backup_last_successful_automatic_backup steht
#     auf gruen, denn ein Backup ist ja entstanden.
#   - teslamate: hier ist die Luecke am kleinsten (Dump und Upload sind derselbe
#     Job), aber der Bucket ist trotzdem die einzige Stelle, an der man das
#     Ergebnis sieht statt der Absicht.
#   - etcd: hier zaehlt, dass JEDE Control-Plane einzeln geprueft wird. Den
#     Upload machen eigene CronJobs je Node (manifests/etcd-backup/), einer
#     davon kann still ausfallen, ohne dass die Summe im Bucket auffaellig
#     aussieht.
#
# Der Job faellt mit exit 1 aus, sobald ein Bucket zu alt ist. Das Melden macht
# die Alert-Regel OffsiteBackupFreshnessCheckFailing in
# manifests/kube-prometheus-stack/prometheus-rules.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-backup-freshness
  namespace: monitoring
  labels:
    app.kubernetes.io/name: offsite-backup-freshness
spec:
  # 06:00 UTC, also nach allem, was nachts sichert: teslamate 01:30, der
  # paperless-Export 02:00 (der Sidecar synct innerhalb der folgenden Stunde),
  # HAs eigener Lauf gegen 05:30 Ortszeit und das Monatsarchiv 04:00 am Ersten.
  #
  # timeZone ist hier PFLICHT und nicht Kosmetik. Ohne das Feld laeuft ein
  # CronJob in der Zeitzone der Node, die gerade den kube-controller-manager
  # haelt, und die Nodes haben nicht alle dieselbe. Der Zeitplan wandert also
  # mit dem Lease: "0 2 * * *" kann genauso gut um 00:00 UTC feuern.
  schedule: "0 6 * * *"
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Kein Retry. Ein zu alter Bucket wird beim zweiten Versuch nicht juenger,
      # und der fehlgeschlagene Job IST das Signal fuer den Alert.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: offsite-backup-freshness
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: amazon/aws-cli:2.36.18
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  NOW=$(date -u +%s)
                  FAIL=0

                  # Argumente: Bucket, Praefix (leer = ganzer Bucket), Grenze in
                  # Stunden, Klartextname fuer die Ausgabe.
                  pruefe() {
                    BUCKET="$1"; PREFIX="$2"; MAX_H="$3"; LABEL="$4"

                    # sort_by liefert das juengste Objekt. Bewusst ueber
                    # LastModified und nicht ueber den Key: die Namen folgen in
                    # den drei Buckets drei verschiedenen Schemata, der
                    # Zeitstempel ist das einzig gemeinsame.
                    #
                    # Das "Contents || `[]`" ist noetig, nicht huebsch: trifft
                    # das Praefix nichts, fehlt Contents ganz, und sort_by(null)
                    # bricht mit einem JMESPath-Typfehler ab statt mit einem
                    # leeren Ergebnis. Der Fall tritt real auf, naemlich bevor
                    # der paperless-Export seine erste last-export.txt
                    # geschrieben hat.
                    NEWEST=$(aws s3api list-objects-v2 \
                      --bucket "${BUCKET}" --region "${S3_REGION}" \
                      ${PREFIX:+--prefix "${PREFIX}"} \
                      --query 'sort_by(Contents || `[]`, &LastModified)[-1].[LastModified,Key]' \
                      --output text 2>&1) || {
                        echo "FEHLER: ${LABEL}: Listing fehlgeschlagen: ${NEWEST}"
                        FAIL=1
                        return
                      }

                    if [ -z "${NEWEST}" ] || [ "${NEWEST}" = "None" ]; then
                      echo "FEHLER: ${LABEL}: kein einziges Objekt unter '${PREFIX}'."
                      FAIL=1
                      return
                    fi

                    STAMP=$(echo "${NEWEST}" | cut -f1)
                    KEY=$(echo "${NEWEST}" | cut -f2)
                    AGE_H=$(( (NOW - $(date -u -d "${STAMP}" +%s)) / 3600 ))

                    # Der Key steht bewusst NICHT im Log: die Dateinamen des
                    # paperless-Exports tragen Titel und Korrespondent. Nur die
                    # Endung, die reicht zum Einordnen.
                    #
                    # Die case-Konstruktion ist Pflicht und keine Vorsicht:
                    # "${KEY##*.}" liefert bei einem Key OHNE Punkt den
                    # vollstaendigen Key zurueck. Genau das sind die
                    # etcd-Snapshots ("etcd-snapshot-<node>-<ts>"), und damit
                    # stuende die Regel oben nur noch auf dem Papier.
                    case "${KEY}" in
                      *.*) EXT=".${KEY##*.}" ;;
                      *)   EXT="(ohne Endung)" ;;
                    esac

                    printf '%-28s %4sh alt (Grenze %sh)  %s\n' \
                      "${LABEL}" "${AGE_H}" "${MAX_H}" "${EXT}"

                    if [ "${AGE_H}" -gt "${MAX_H}" ]; then
                      echo "  ZU ALT: seit ${AGE_H}h ist in ${BUCKET} nichts Neues angekommen."
                      FAIL=1
                    fi
                  }

                  echo "Frische der Offsite-Backups, Stand $(date -u +%FT%TZ)"
                  echo

                  # 36h wie bei den Job-Alerts: ein einzelner ausgefallener Lauf
                  # soll nicht sofort melden. Weil der Check nur einmal taeglich
                  # laeuft, heisst das in der Praxis: ein Ausfall meldet sich
                  # spaetestens am uebernaechsten Morgen.
                  pruefe "${TESLAMATE_BUCKET}" "daily/" 36 "teslamate (daily)"

                  # HA laedt jeden Tar selbst hoch, hier zaehlt der ganze Bucket.
                  pruefe "${HOME_ASSISTANT_BUCKET}" "" 36 "home assistant"

                  # Mealie wie teslamate: Erzeugen und Hochladen sind derselbe
                  # Job, geprueft wird trotzdem der Bucket, weil er die einzige
                  # Stelle ist, an der das Ankommen sichtbar wird.
                  pruefe "${MEALIE_BUCKET}" "daily/" 36 "mealie (daily)"

                  # WICHTIG: hier wird gezielt die Heartbeat-Datei geprueft, nicht
                  # das juengste Objekt im Bucket. Der Sidecar synct ohne
                  # --delete und laedt nur hoch, was sich geaendert hat, und
                  # "document_exporter" behaelt die alten mtimes der Medien-
                  # Dateien bei. Aendert sich an den Dokumenten tagelang nichts,
                  # wird auch tagelang nichts hochgeladen, und die aeltesten
                  # Objekte im Bucket sind Monate alt. "Juengstes Objekt" waere
                  # also ein Fehlalarm-Generator.
                  #
                  # last-export.txt schreibt der Export-CronJob nach jedem
                  # erfolgreichen Lauf frisch, damit hat sie immer eine neue
                  # mtime und wird immer synchronisiert. Ist SIE aktuell, sind
                  # beide Haelften belegt: der Export lief UND der Sidecar hat
                  # hochgeladen.
                  pruefe "${PAPERLESS_BUCKET}" "paperless-backup/last-export.txt" 36 "paperless (heartbeat)"

                  # etcd: auf JEDER Control-Plane laeuft alle 12h ein eigener
                  # Snapshot-CronJob, und geprueft wird JEDE Node einzeln.
                  #
                  # Eine einzige Pruefung ueber den ganzen Bucket waere gruen,
                  # sobald EINE Node liefert, und wuerde damit verdecken, dass
                  # die anderen beiden seit Wochen nichts mehr hochladen. Ein
                  # Bucket-Alter sagt nichts darueber, ob noch drei Erzeuger
                  # leben.
                  #
                  # Der Objektname traegt den Node-Namen
                  # ("etcd-snapshot-<node>-<unix-ts>"), node-eigene Ordner
                  # braucht es dafuer nicht. Das Praefix trifft damit genau die
                  # geplanten Snapshots einer Node und laesst Laeufe von Hand
                  # bewusst aussen vor: geprueft werden soll der automatische Weg.
                  #
                  # Die Node-Namen stehen hier fest. Nach einem Node-Neubau oder
                  # Rename meldet sich diese Sonde mit "kein einziges Objekt" und
                  # muss nachgezogen werden. Das ist der gewollte laute Ausgang,
                  # ein stiller waere genau der Fehler von oben.
                  #
                  # Die Liste muss deshalb zu den CronJobs in
                  # manifests/etcd-backup/ passen, in BEIDE Richtungen. Eine
                  # Node, die dort fehlt, sichert nicht; eine Node, die hier
                  # fehlt, sichert unbeobachtet. Beim Abbau einer Node gehoert
                  # sie aus beiden Dateien raus, sonst meldet diese Zeile ab 26h
                  # nach dem letzten Snapshot dauerhaft rot.
                  #
                  # 26h statt 18h: pro Node ist der Abstand 12h (die CronJobs in
                  # manifests/etcd-backup/ laufen 00:00 und 12:00 UTC, gestaffelt
                  # um 20 Minuten), und ein einzelner ausgefallener Lauf soll
                  # nicht melden. Zwei in Folge sind 24h und damit ein echtes
                  # Signal. Der Check selbst laeuft 06:00 UTC.
                  #
                  # Je CronJob eine Node, damit eine tote Node nur ihren eigenen
                  # Lauf reisst und hier genau eine Zeile rot wird.
                  for NODE in talos-cp-1 prodesk raspi5; do
                    pruefe "${ETCD_BUCKET}" "etcd-snapshot-${NODE}-" 26 "etcd ${NODE}"
                  done

                  echo
                  if [ "${FAIL}" -ne 0 ]; then
                    echo "MINDESTENS EIN BUCKET IST NICHT AKTUELL."
                    exit 1
                  fi
                  echo "Alle Buckets sind aktuell."
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: S3_REGION
                - name: PAPERLESS_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: PAPERLESS_BUCKET
                - name: HOME_ASSISTANT_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: HOME_ASSISTANT_BUCKET
                - name: TESLAMATE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: TESLAMATE_BUCKET
                - name: ETCD_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: ETCD_BUCKET
                - name: MEALIE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-monitor-credentials
                      key: MEALIE_BUCKET
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
