---
# Inside the house the apex resolves to Traefik, because blocky's mapping covers
# it and only www is carved out. Traefik 301s it to www, which then leaves for
# the Cloudflare Worker. Publicly a Cloudflare redirect rule does the same.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: apex-to-www
  namespace: external-services
spec:
  redirectRegex:
    regex: '^https?://elmstreet79\.de/(.*)'
    replacement: 'https://www.elmstreet79.de/${1}'
    permanent: true
---
# Two routes on purpose: a single one carrying both entryPoints plus tls makes
# the plain-HTTP router TLS-terminating as well, and port 80 then answers 404.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apex-redirect
  namespace: external-services
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`elmstreet79.de`)
      kind: Rule
      middlewares:
        - name: apex-to-www
      services:
        # The CRD demands a service; the middleware answers before it, so this
        # one is never reached. noop@internal is Traefik's own dead end.
        - name: noop@internal
          kind: TraefikService
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: apex-redirect-http
  namespace: external-services
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`elmstreet79.de`)
      kind: Rule
      middlewares:
        - name: apex-to-www
      services:
        - name: noop@internal
          kind: TraefikService
