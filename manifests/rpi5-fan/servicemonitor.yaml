# Without these metrics a failed controller would be invisible: the fan would
# stay at its last value, and a quiet Pi looks exactly like a quiet Pi with a
# dead controller. The alert rule lives in prometheus-rules.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rpi5-fan
  namespace: rpi5-fan
  labels:
    app: rpi5-fan
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: rpi5-fan
  endpoints:
    - port: metrics
      interval: 30s
