apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rpi5-fan

resources:
  - namespace.yaml
  - daemonset.yaml
  - service.yaml
  - servicemonitor.yaml

# The controller enters the cluster as a ConfigMap rather than its own
# container image: that would need a build chain, a registry and a Renovate
# entry, while fan.py has no dependencies beyond the Python standard library.
#
# A generator rather than a handwritten ConfigMap, for the hash suffix: the
# pod reads fan.py only at startup, so without it a change would sync but the
# running pod would keep the old copy until something restarted it.
configMapGenerator:
  - name: rpi5-fan-controller
    files:
      - fan.py
