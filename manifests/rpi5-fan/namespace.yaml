# Its own namespace, because the pod must run privileged and that should stay
# contained. The PodSecurity labels are mandatory: the restricted default
# rejects a privileged pod silently at creation, invisibly from the DaemonSet.
apiVersion: v1
kind: Namespace
metadata:
  name: rpi5-fan
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
