# A DaemonSet rather than a Deployment although it hits exactly one node: the
# condition ("the node that is a Pi 5") then lives in the nodeSelector instead
# of a replica count, and a second Pi 5 would need no change.
#
# The nodeSelector uses the hostname rather than a dedicated label, which
# would have to be set in talos/talconfig.yaml and cost an apply-config.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rpi5-fan
  namespace: rpi5-fan
  labels:
    app: rpi5-fan
spec:
  selector:
    matchLabels:
      app: rpi5-fan
  template:
    metadata:
      labels:
        app: rpi5-fan
    spec:
      nodeSelector:
        kubernetes.io/hostname: raspi5
      # The node is control plane. It carries the worker label and has no
      # taint, but a taint returns temporarily during a Talos upgrade, and
      # that is precisely when fan control must NOT disappear.
      tolerations:
        - operator: Exists
      # Without this the pod may still run during node shutdown after the
      # network is gone. 10 seconds suffice for the SIGTERM handler that sets
      # the fan to 100 percent.
      terminationGracePeriodSeconds: 10
      priorityClassName: system-node-critical
      containers:
        - name: fan
          # The official image, kept current by Renovate; the controller
          # itself comes from the ConfigMap next to it.
          image: python:3.14-slim
          command:
            - python3
            - -u
            - /opt/fan/fan.py
          ports:
            - name: metrics
              containerPort: 9101
          securityContext:
            # privileged rather than individual capabilities: what is needed
            # is write access to the RP1's PCI resource file and its mmap, and
            # with CAP_SYS_RAWIO alone even opening it O_RDWR fails, because
            # sysfs resource files demand root plus the lockdown clearance.
            privileged: true
          volumeMounts:
            - name: sys
              mountPath: /host-sys
            - name: script
              mountPath: /opt/fan
          # The probe tests the control loop, not just the process: the
          # metrics endpoint is served by a thread that keeps answering as
          # long as Python lives, while a stalled loop leaves the fan at its
          # last value.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: script
          configMap:
            name: rpi5-fan-controller
