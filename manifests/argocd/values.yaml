# Values of the argo-cd chart, for the argocd Application and for the
# bootstrap in homelab-terraform/argocd-talos/, which reads this file.

global:
  domain: argocd.elmstreet79.de

configs:
  cm:
    # Read-only API key for the homepage widget.
    accounts.readonly: apiKey
    timeout.reconciliation: 30s

    # ArgoCD's built-in default exclusion list, minus core/Endpoints: the
    # hand-written Endpoints in manifests/external-services/ would otherwise
    # never be created, while their Application still reports Synced/Healthy.
    # EndpointSlice stays excluded, those are generated by the mirroring
    # controller.
    #
    # Pinned to ArgoCD 3.5. On an ArgoCD major, compare against the new default
    # ("argocd admin settings resource-overrides list") and update it here.
    resource.exclusions: |
      - apiGroups:
        - discovery.k8s.io
        kinds:
        - EndpointSlice
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest

  params:
    # Traefik terminates TLS.
    server.insecure: true

  rbac:
    policy.csv: "g, readonly, role:readonly"

# Only the *-metrics Services. Their ServiceMonitors live in this directory
# (servicemonitor.yaml): the CRD arrives with kube-prometheus-stack, so the
# chart could not create them during the bootstrap.
controller:
  metrics:
    enabled: true
repoServer:
  metrics:
    enabled: true
server:
  metrics:
    enabled: true
