# Netzwerk-Einstellungen fuer raspi5, nach siderolabs/sbc-raspberrypi#91
#
# WARUM ES DAS GIBT: end0 kommt mit einem 512er-TX-Ring und aktivem TSO/GSO
# hoch. Sobald echter Verkehr anliegt, haengt der macb-TX-Ring lautlos. Fuer
# etcd sieht das so aus: der Leader protokolliert massenhaft "dropped internal
# Raft message since sending buffer is full" in Richtung raspi5, dazu "lost TCP
# streaming connection with remote peer" mit error=EOF und "prober detected
# unhealthy status" mit i/o timeout. raspi5 sieht dabei laufend neue Leader,
# waehrend der Raft-Term clusterweit steht: es gibt keine Wahl, dieser eine
# Member verliert nur wiederholt den Kontakt.
#
# DAS TUECKISCHE DARAN IST, DASS ALLES ANDERE GESUND AUSSIEHT. Leitung (ICMP um
# 4 ms, 0 % Verlust), Link (1000 Mbit/s, null NIC-Fehler, MTU wie ueberall),
# Platte (WAL-fsync im einstelligen Millisekundenbereich), CPU, Speicher,
# Temperatur und cgroup-Drosselung sind unauffaellig, ethtool zaehlt NULL
# Fehler und dmesg schweigt. Mit den ueblichen Netzwerk-Alerts faellt es nicht
# auf.
#
# DIE IRREFUEHRENDE SPUR: die Stalls setzen ein, wenn raspi5 Longhorn-Repliken
# bekommt. Die Longhorn-Last ist aber nicht die Ursache, sie ist nur der
# Verkehr, der den zu kleinen TX-Ring erstmals fuellt.
#
# DREI TRIGGER, DREI GEGENMASSNAHMEN:
#   1. EEE-AutogrEEEn-LPI-Wake-Race auf PHY-Ebene    -> eee off
#   2. macb TSO/GSO TX-Ring-Hang, ohne Treiberfehler -> tso off, gso off
#   3. zu kleiner Default-Ring (512)                 -> rx 4096, tx 2048
#
# Der macb-TX-Fix aus netdev ist in Talos v1.13.3 eingeflossen, Trigger 2
# sollte damit bereits entschaerft sein. Trigger 1 gilt im Issue ausdruecklich
# nur als reduziert, nicht behoben, und laesst sich hier gar nicht pruefen:
# "ethtool --show-eee end0" antwortet mit "netlink error: Not supported".
# Deshalb alle drei, sie kosten nichts ausser etwas TX-Effizienz und sind
# jederzeit reversibel.
#
# WAS ES BRINGT, gemessen beim Ausrollen: etcd-Stalls von 8 bis 42 pro Minute
# auf 0, Peer-Latenz zu und von raspi5 von 200 bis 370 ms auf 6 bis 13 ms.
#
# Die Werte ueberleben einen Link-Reset nicht, deshalb ein DaemonSet, das sie
# haelt, und kein einmaliger Aufruf.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rpi5-net-tuning
  namespace: rpi5-net-tuning
  labels:
    app: rpi5-net-tuning
spec:
  selector:
    matchLabels:
      app: rpi5-net-tuning
  template:
    metadata:
      labels:
        app: rpi5-net-tuning
    spec:
      # Nur raspi5. Die Einstellungen sind eine Pi-5-Eigenheit und haetten auf
      # prodesk oder talos-cp-1 nichts zu suchen.
      nodeSelector:
        kubernetes.io/hostname: raspi5
      tolerations:
        - operator: Exists
      # ethtool wirkt auf das Interface der Node, nicht auf das des Pods.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 5
      containers:
        - name: tune
          image: alpine:3.24.1
          command:
            - /bin/sh
            - -c
            - apk add --no-cache ethtool >/dev/null && exec /bin/sh /opt/tune/tune.sh
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: script
              mountPath: /opt/tune
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: rpi5-net-tuning-script
