# Network settings for raspi5, following siderolabs/sbc-raspberrypi#91.
#
# end0 comes up with a 512-entry TX ring and TSO/GSO enabled, and once real
# traffic arrives the macb TX ring stalls silently. For etcd that looks like
# the leader logging "dropped internal Raft message since sending buffer is
# full" towards raspi5 plus lost peer connections, while raspi5 keeps seeing
# new leaders although the Raft term stands cluster-wide: no election, just
# one member repeatedly losing contact.
#
# The tricky part is that everything else looks healthy: line, link, disk,
# CPU, memory, temperature and cgroup throttling are all unremarkable, ethtool
# counts ZERO errors and dmesg stays quiet. The usual network alerts miss it.
#
# The misleading trail is Longhorn: the stalls begin when raspi5 receives
# replicas, but that load is not the cause, only the traffic that first fills
# the undersized ring.
#
# Three triggers, three countermeasures:
#   1. EEE/LPI wake race at PHY level             -> eee off
#   2. macb TSO/GSO TX ring hang, no driver error -> tso off, gso off
#   3. undersized default ring (512)              -> rx 4096, tx 2048
#
# All three, although the macb TX fix has landed in Talos and trigger 1 counts
# as reduced rather than fixed upstream. They cost nothing but a little TX
# efficiency and are reversible at any time; trigger 1 cannot even be checked
# here, "ethtool --show-eee end0" answers "netlink error: Not supported".
#
# The settings do not survive a link reset, hence a DaemonSet that holds them
# instead of a one-off call.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rpi5-net-tuning
  namespace: rpi5-net-tuning
  labels:
    app: rpi5-net-tuning
spec:
  selector:
    matchLabels:
      app: rpi5-net-tuning
  template:
    metadata:
      labels:
        app: rpi5-net-tuning
    spec:
      # raspi5 only: these settings are a Pi 5 quirk.
      nodeSelector:
        kubernetes.io/hostname: raspi5
      tolerations:
        - operator: Exists
      # ethtool acts on the node's interface, not on the pod's.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 5
      containers:
        - name: tune
          image: alpine:3.24.1
          command:
            - /bin/sh
            - -c
            - apk add --no-cache ethtool >/dev/null && exec /bin/sh /opt/tune/tune.sh
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: script
              mountPath: /opt/tune
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: rpi5-net-tuning-script
