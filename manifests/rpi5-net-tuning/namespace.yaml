# Its own namespace, same reasoning as rpi5-fan: the pod needs NET_ADMIN and
# the host network namespace, and that should stay contained. The PodSecurity
# labels are mandatory, the restricted default rejects such a pod silently at
# creation, invisibly from the DaemonSet.
apiVersion: v1
kind: Namespace
metadata:
  name: rpi5-net-tuning
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
