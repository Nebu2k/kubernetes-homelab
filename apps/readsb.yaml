apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: readsb
  namespace: argocd
  annotations:
    # Before fr24 (15): fr24feed connects to readsb's Beast output.
    argocd.argoproj.io/sync-wave: "14"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nebu2k/kubernetes-homelab.git
    targetRevision: main
    path: manifests/readsb
  destination:
    server: https://kubernetes.default.svc
    namespace: adsb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # No CreateNamespace: the namespace is a manifest in the path because it
      # has to carry the PodSecurity label.
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
