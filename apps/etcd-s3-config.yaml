apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: etcd-s3-config
  namespace: argocd
  annotations:
    # Wave 1: direkt nach sealed-secrets (0), das den Controller stellt, der
    # dieses SealedSecret entsiegelt. Frueher als alles Uebrige, weil der
    # k3s-Server-Prozess das Secret liest, nicht ein Workload. Fehlt es, laeuft
    # der Cluster normal weiter, es kommt nur kein Snapshot in S3 an.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nebu2k/kubernetes-homelab
    targetRevision: main
    path: manifests/etcd-s3-config
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
