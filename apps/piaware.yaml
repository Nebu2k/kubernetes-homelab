apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: piaware
  namespace: argocd
  annotations:
    # Same wave as fr24 (15): both hang off readsb's Beast output in wave 14.
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nebu2k/kubernetes-homelab.git
    targetRevision: main
    path: manifests/piaware
  destination:
    server: https://kubernetes.default.svc
    namespace: piaware
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
