# App of apps: the complete list of what runs in the cluster. Order does not
# matter here, the sync waves live in the Applications themselves.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Platform
  - sealed-secrets.yaml
  - metallb.yaml
  # Enforces the NetworkPolicies, which Flannel alone does not.
  # kubectl top and the homepage's Kubernetes widgets.
  - metrics-server.yaml
  # etcd snapshots to S3. Talos only writes them out on request, so the upload
  # is the cluster's job.
  - etcd-backup.yaml
  - reloader.yaml
  - traefik.yaml
  - cert-manager.yaml
  - csi-driver-smb.yaml
  - longhorn.yaml
  - kube-prometheus-stack.yaml
  - argocd-config.yaml
  - backup-monitor.yaml
  # Pulls the Cloudflare Security Center findings, which Cloudflare itself
  # notifies about nowhere.
  - security-insights.yaml
  # House resolver, cluster instance on 192.168.2.253. The second instance is
  # an LXC on pve (.254) defined in homelab-terraform, so neither a cluster nor
  # a pve outage can take both down at once.
  - blocky.yaml

  # Exporter
  - proxmox-exporter.yaml
  - unifi-poller.yaml

  # Hardware. Replaces a kernel driver the Talos kernel does not ship, see
  # manifests/rpi5-fan/fan.py.
  - rpi5-fan.yaml
  # raspi5 as well: holds end0's ethtool settings, without which the etcd
  # member drops Raft messages. See manifests/rpi5-net-tuning/daemonset.yaml.
  - rpi5-net-tuning.yaml

  # Applications
  - homepage.yaml
  - gatus.yaml
  - external-services.yaml
  - home-assistant.yaml
  - teslamate.yaml
  - mealie.yaml
  - paperless-ngx.yaml
  - ripe-atlas.yaml
  - readsb.yaml
  - fr24.yaml
  - piaware.yaml
