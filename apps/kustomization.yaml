# App-of-Apps. Die einzige Liste, seit das k3s-Cluster am 2026-08-09 abgebaut
# ist: bis dahin gab es daneben clusters/talos/ mit einer zweiten Liste und
# einem Satz Patches, weil beide Cluster denselben Branch lasen.
#
# Reihenfolge egal, die sync-waves stehen in den Applications selbst.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Plattform
  - sealed-secrets.yaml
  - metallb.yaml
  # Setzt die NetworkPolicies durch. Vanilla Flannel tut das nicht, k3s brachte
  # denselben Controller eingebaut mit.
  - kube-router.yaml
  # kubectl top und die Kubernetes-Widgets der Homepage. Ebenfalls etwas, das
  # k3s eingebaut mitbrachte.
  - metrics-server.yaml
  # Der Talos-Ersatz fuer k3s' --etcd-s3-config: Talos schreibt Snapshots nur
  # auf Anforderung heraus, der Upload ist Sache des Clusters.
  - etcd-backup.yaml
  - reloader.yaml
  - traefik.yaml
  - cert-manager.yaml
  - csi-driver-smb.yaml
  - longhorn.yaml
  - kube-prometheus-stack.yaml
  - argocd-config.yaml
  - backup-monitor.yaml

  # Exporter
  - proxmox-exporter.yaml
  - unifi-poller.yaml

  # Anwendungen
  - landing-page.yaml
  - homepage.yaml
  - gatus.yaml
  - external-services.yaml
  - home-assistant.yaml
  - teslamate.yaml
  - mealie.yaml
  - paperless-ngx.yaml
  - ripe-atlas.yaml
  - readsb.yaml
  - fr24.yaml
