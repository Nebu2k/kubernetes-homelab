# App-of-Apps: die vollstaendige Liste dessen, was im Cluster laeuft.
#
# Reihenfolge egal, die sync-waves stehen in den Applications selbst.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Plattform
  - sealed-secrets.yaml
  - metallb.yaml
  # Setzt die NetworkPolicies durch, Flannel allein tut das nicht.
  - kube-router.yaml
  # kubectl top und die Kubernetes-Widgets der Homepage.
  - metrics-server.yaml
  # etcd-Snapshots nach S3. Talos schreibt sie nur auf Anforderung heraus, der
  # Upload ist deshalb Sache des Clusters.
  - etcd-backup.yaml
  - reloader.yaml
  - traefik.yaml
  - cert-manager.yaml
  - csi-driver-smb.yaml
  - longhorn.yaml
  - kube-prometheus-stack.yaml
  - argocd-config.yaml
  - backup-monitor.yaml

  # Exporter
  - proxmox-exporter.yaml
  - unifi-poller.yaml

  # Hardware. Ersetzt auf raspi5 einen Kernel-Treiber, den der Talos-Kernel
  # nicht mitbringt, siehe manifests/rpi5-fan/fan.py.
  - rpi5-fan.yaml
  # Ebenfalls raspi5: haelt die ethtool-Einstellungen von end0, ohne die der
  # etcd-Member Raft-Nachrichten verwirft. Siehe Kopf von
  # manifests/rpi5-net-tuning/daemonset.yaml.
  - rpi5-net-tuning.yaml

  # Anwendungen
  - landing-page.yaml
  - homepage.yaml
  - gatus.yaml
  - external-services.yaml
  - home-assistant.yaml
  - teslamate.yaml
  - mealie.yaml
  - paperless-ngx.yaml
  - ripe-atlas.yaml
  - readsb.yaml
  - fr24.yaml
