apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sealed-secrets.yaml
  - etcd-s3-config.yaml
  - reloader.yaml
  - kured.yaml
  - system-upgrade-controller.yaml
  - coredns-config.yaml
  - metallb.yaml
  - traefik.yaml
  - cert-manager.yaml
  - csi-driver-smb.yaml
  - longhorn.yaml
  - kube-prometheus-stack.yaml
  # proxmox-exporter und unifi-poller sind am 2026-08-09 ins Talos-Cluster
  # gezogen, ohne Restore: beide sind reine Exporter ohne eigenen Zustand. Sie
  # scrapen pve bzw. den UniFi-Controller, es waere also nicht falsch, sie in
  # beiden Clustern laufen zu lassen, aber das haette die Zielsysteme doppelt
  # abgefragt und beide Prometheus-Instanzen dieselben Werte zaehlen lassen:
  #   - proxmox-exporter.yaml
  #   - unifi-poller.yaml
  #
  # argocd-config bleibt dagegen HIER STEHEN, obwohl es zusaetzlich im
  # Talos-Cluster laeuft. Es konfiguriert das ArgoCD des jeweiligen Clusters,
  # und das hiesige muss bis zum Abbau von k3s arbeitsfaehig bleiben. Ein Prune
  # wuerde argocd-cm und argocd-rbac-cm loeschen, nicht bloss die zwei Keys
  # darin zuruecknehmen.
  - argocd-config.yaml
  - home-assistant.yaml
  # fr24 ist am 2026-08-08 ins Talos-Cluster gezogen, zusammen mit dem SDR.
  # Steht dort in clusters/talos/kustomization.yaml. Hier herausgenommen, damit
  # ArgoCD es im alten Cluster abraeumt: die Datenquelle (dump1090 auf raspi5)
  # gibt es nicht mehr.
  #   - fr24.yaml
  #
  # Erste Welle der Workload-Migration, am 2026-08-09 ins Talos-Cluster
  # gezogen. Alle vier sind zustandslos genug fuer einen harten Schwenk:
  #   - gatus.yaml
  #   - homepage.yaml
  #   - external-services.yaml
  #   - landing-page.yaml
  #
  # Was das Herausnehmen hier ausloest: ArgoCD prunt sie samt Namespace. Bei
  # gatus faellt damit auch das Longhorn-Volume gatus-data, die Uptime-Historie
  # ist weg (bewusst so entschieden, statt sie aus dem NAS zu restaurieren).
  #
  # Der Wildcard *.elmstreet79.de zeigt bis zum Schluss auf die .250, also auf
  # dieses Cluster. Die vier Dienste sind ab jetzt nur ueber
  # https://192.168.2.240 mit passendem Host-Header erreichbar, unter ihrem
  # Namen laufen sie ins Leere. Genau der Ausfall, der in der ROADMAP als
  # billiger als per-Dienst-Rewrites in zwei AdGuard-Instanzen entschieden ist.
  #
  # Zweite Welle, die zustandsbehafteten Dienste. Je Dienst ein Longhorn-Restore
  # aus dem NAS-Backup, deshalb einzeln und nicht als Block. Vor dem
  # Herausnehmen hier steht immer ein erzwungenes frisches Backup, denn der
  # Prune loescht PVC und Volume und das Backup ist danach die einzige Kopie:
  #   - ripe-atlas.yaml
  #   - mealie.yaml
  #   - teslamate.yaml
  #   - paperless-ngx.yaml
  - backup-monitor.yaml

