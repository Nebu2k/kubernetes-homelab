apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets/
    chart: sealed-secrets
    targetRevision: 2.19.1
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller

        metrics:
          # The metrics service on :8081 exists in the chart anyway. Without a
          # scrape the one case that really hurts stays invisible: a
          # SealedSecret that can no longer be decrypted because its sealing
          # key is missing. The alert lives in the "sealed-secrets" group of
          # manifests/kube-prometheus-stack/prometheus-rules.yaml.
          #
          # The chart's metrics.prometheusRule stays off on purpose: its
          # default rule fires on "!= 1" and thus also on 0 ("unknown or
          # absent"), and all homelab alerts belong in one place.
          serviceMonitor:
            enabled: true
            # Prometheus accepts every ServiceMonitor
            # (serviceMonitorSelectorNilUsesHelmValues: false), this label is
            # only consistency with the handwritten ones.
            labels:
              release: kube-prometheus-stack
            # Do NOT set to false. sealed_secrets_controller_condition_info
            # carries each SealedSecret's namespace as its own label. Without
            # honorLabels the scrape target's namespace wins and the real one
            # moves to exported_namespace, so the alert shows "kube-system"
            # for every secret.
            honorLabels: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
