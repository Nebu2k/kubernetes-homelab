apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets/
    chart: sealed-secrets
    targetRevision: 2.19.1
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller

        metrics:
          # Der Metrics-Service auf :8081 existiert im Chart ohnehin, gescrapt
          # wurde er bis 2026-08-05 nie. Damit war der einzige Fall, der hier
          # wirklich weh tut, voellig unsichtbar: ein SealedSecret, das sich
          # nicht mehr entschluesseln laesst, weil der zugehoerige Sealing-Key
          # im Cluster fehlt. Der Alert dazu steht in
          # manifests/kube-prometheus-stack/prometheus-rules.yaml, Gruppe
          # "sealed-secrets".
          #
          # metrics.prometheusRule des Charts bleibt bewusst aus: dessen
          # Default-Regel feuert auf "!= 1" und damit auch auf 0 ("unknown or
          # absent"), und alle Homelab-Alerts stehen an einer Stelle.
          serviceMonitor:
            enabled: true
            # Prometheus nimmt jeden ServiceMonitor
            # (serviceMonitorSelectorNilUsesHelmValues: false), das Label ist
            # nur Konsistenz zu den handgeschriebenen ServiceMonitors.
            labels:
              release: kube-prometheus-stack
            # NICHT auf false stellen. sealed_secrets_controller_condition_info
            # traegt den Namespace des jeweiligen SealedSecrets als eigenes
            # Label. Ohne honorLabels gewinnt der Namespace des Scrape-Targets
            # (kube-system) und das echte wandert nach exported_namespace, der
            # Alert zeigt dann fuer jedes Secret "kube-system".
            honorLabels: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
