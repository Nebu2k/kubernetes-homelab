---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-smb
  namespace: argocd
  annotations:
    # Storage layer, after longhorn (4) and before paperless-ngx (9), which
    # uses an SMB PV.
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
      chart: csi-driver-smb
      targetRevision: 1.20.3
      helm:
        releaseName: csi-driver-smb
        valueFiles:
          - $values/manifests/csi-driver-smb/values.yaml
    - repoURL: https://github.com/Nebu2k/kubernetes-homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: csi-driver-smb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The namespace comes from CreateNamespace, so managedNamespaceMetadata is
    # enough here; a service shipping its own namespace.yaml needs the label on
    # that manifest instead.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
