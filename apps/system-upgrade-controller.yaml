---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # Node-Lifecycle-Tooling, zusammen mit kured
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Nebu2k/kubernetes-homelab
    targetRevision: main
    path: manifests/system-upgrade-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Der Namespace kommt aus dem Upstream-Manifest, inklusive des Labels
      # pod-security.kubernetes.io/enforce=privileged. Die Upgrade-Jobs
      # brauchen es (sie mounten das Host-Root), ein von ArgoCD erzeugter
      # Namespace haette es nicht.
      - CreateNamespace=false
      # Die Plan-CRD ist ~70 KB. Client-Side-Apply legt das komplette Manifest
      # als last-applied-configuration-Annotation ab und laeuft bei grossen
      # CRDs ins 256-KB-Limit. Server-Side-Apply umgeht das grundsaetzlich.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
