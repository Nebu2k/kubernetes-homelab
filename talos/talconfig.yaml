# talhelper-Konfiguration fuer das neue Talos-Cluster.
#
# Einzige Quelle der Wahrheit fuer die machine configs. Generiert wird mit
# "talhelper genconfig" nach ./clusterconfig/ (gitignored, enthaelt die CAs im
# Klartext). Nie eine generierte Datei von Hand editieren, sie wird beim
# naechsten genconfig ueberschrieben.
#
# Startaufbau: drei Control-Plane-VMs auf pve, die das Cluster parallel zum
# bestehenden k3s-Cluster bootstrappen. Sie sind temporaer, spaeter ersetzen
# prodesk und raspi5 zwei davon.

clusterName: homelab

# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: v1.13.8
# renovate: datasource=github-releases depName=kubernetes/kubernetes
kubernetesVersion: v1.36.3

# VIP des Clusters. Talos bringt ihn eingebaut mit, es braucht kein kube-vip.
#
# Am 2026-08-09 von der .248 auf die .29 gezogen. Die .248 lag mitten im
# MetalLB-Bereich und riss dort ein Loch: der Pool musste .240-.247 plus
# .249-.253 sein, damit MetalLB die API des Clusters nicht an einen Service
# vergibt. Auf der .29 ist der Pool durchgehend .240-.253.
#
# Warum .29 und nicht .251, wie zuerst ueberlegt: der VIP ist kein Service,
# sondern gehoert zu den Nodes, und im Adressplan ist .20-.29 der Node-Block
# (.29 als letzte darin ist die uebliche Stelle fuer einen VIP). Vor allem aber
# erlaubt die UniFi-Regel den Gast-VLANs den Zugriff auf .249-.254: die
# Kubernetes-API dorthin zu legen haette sie aus den Gast-VLANs erreichbar
# gemacht. Und die .251 ist fuer die Blocky-Instanz vorgemerkt.
endpoint: https://192.168.2.29:6443

# Bewusst dieselben CIDRs wie im k3s-Cluster statt der Talos-Defaults
# (10.244.0.0/16 / 10.96.0.0/12). Beide Cluster sind getrennte L3-Domaenen, die
# Ueberschneidung ist folgenlos, und die migrierten Manifeste stimmen ohne
# Aenderung: home-assistant/configmap-configuration.yaml traegt 10.42.0.0/16 als
# trusted_proxy, gatus/configmap.yaml prueft CoreDNS unter 10.43.0.10.
clusterPodNets:
  - 10.42.0.0/16
clusterSvcNets:
  - 10.43.0.0/16

# Entspricht dem k3s-Ist-Zustand: k3s schedulet per Default auf Server-Nodes,
# keine Node im heutigen Cluster hat einen Taint. Bedingung sind ehrliche
# Requests und Limits, sonst kippt eine hungrige Workload den etcd-Member mit.
allowSchedulingOnControlPlanes: true

# Der VIP und alle Node-IPs muessen im API-Server-Cert stehen, sonst schlaegt
# jeder Zugriff ueber eine andere Adresse als den Endpoint fehl.
additionalApiServerCertSans:
  - 192.168.2.29
  # Die alte VIP-Adresse. Bleibt vorerst im Cert, damit ein kubeconfig oder
  # talosconfig, das noch darauf zeigt, nicht mit einem Zertifikatsfehler
  # abbricht, sondern schlicht nichts findet. Kann raus, sobald nichts mehr
  # darauf zeigt.
  - 192.168.2.248
  - 192.168.2.20
  - 192.168.2.22
  - 192.168.2.23
  - 127.0.0.1
additionalMachineCertSans:
  - 192.168.2.29
  - 192.168.2.248
  - 192.168.2.20
  - 192.168.2.22
  - 192.168.2.23

# Flannel ist der Talos-Default und deckt sich mit k3s. Kein Grund, beim
# Cluster-Neubau gleichzeitig die CNI zu wechseln.
cniConfig:
  name: flannel

nodes:
  - hostname: talos-cp-1
    ipAddress: 192.168.2.20
    controlPlane: true
    installDisk: /dev/sda
    # Fehlerdomaene fuer Longhorn. Seit dem Abbau von talos-cp-2 ist er die
    # einzige Node in dieser Zone, das Label bleibt trotzdem noetig: es sagt,
    # dass seine Disk in pve liegt. Kaeme je eine zweite pve-VM dazu, waeren das
    # fuer Longhorns Node-Anti-Affinity zwei verschiedene Nodes und damit in
    # Ordnung, obwohl beide Repliken auf derselben NVMe laegen und zusammen
    # sterben wuerden. Erst die Zone macht den Unterschied sichtbar.
    #
    # Gegenstueck ist replicaZoneSoftAntiAffinity: "false" in
    # manifests/longhorn/values.yaml. Die beiden gehoeren zusammen: ohne
    # Zonen-Label faellt alles in dieselbe leere Zone und Longhorn koennte nur
    # noch eine einzige Replik je Volume unterbringen. Bei einer neuen Node also
    # zuerst das Label setzen.
    nodeLabels:
      topology.kubernetes.io/zone: pve
    # nocloud-installer, nicht installer: die VMs booten vom
    # nocloud-Disk-Image, ein metal-Installer wuerde die Plattform beim ersten
    # Upgrade umstellen. Die Schematic-ID ist dieselbe wie in
    # homelab-terraform/proxmox/vm-talos.tf.
    talosImageURL: factory.talos.dev/nocloud-installer/88d1f7a5c4f1d3aba7df787c448c1d3d008ed29cfb34af53fa0df4336a56040b
    networkInterfaces:
      # deviceSelector statt festem Namen: Talos vergibt vorhersagbare
      # Interface-Namen (enp0s18 o.ae.), die von der Proxmox-Maschinenklasse
      # abhaengen. Der Treiber ist stabil, der Name nicht.
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        addresses:
          - 192.168.2.20/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.2.1
        vip:
          ip: 192.168.2.29

  # talos-cp-2 (.21, vmid 111) stand hier bis zum 2026-08-09 und ist von raspi5
  # ersetzt worden. Damit liegt die etcd-Mehrheit nicht mehr auf pve: von den
  # drei Membern sitzt nur noch talos-cp-1 dort, prodesk und raspi5 sind Blech.
  # Genau das fordert die Diversitaets-Regel in der ROADMAP. Abgebaut per drain,
  # "talosctl etcd leave" und "kubectl delete node", danach in
  # homelab-terraform/proxmox/vm-talos.tf geloescht. Die .21 ist wieder frei.

  # talos-cp-3 (.22, vmid 112) stand hier bis zum 2026-08-09. Mit prodesk waren
  # es vier etcd-Member, und eine gerade Anzahl vertraegt nicht mehr Ausfaelle
  # als drei. Abgebaut per drain und "talosctl reset --graceful", danach in
  # homelab-terraform/proxmox/vm-talos.tf geloescht. Seine .22 hat raspi5
  # uebernommen, siehe unten.

  # prodesk: erstes Blech im neuen Cluster, HP ProDesk 600 G4 DM, 31 GB RAM.
  # Er hat talos-cp-3 ersetzt und hebt die RAM-Decke des Clusters von 11.7 GB
  # auf ueber 40. Damit ist die schwere zweite Welle (kube-prometheus-stack)
  # ueberhaupt erst moeglich.
  #
  # Am 2026-08-09 aus dem k3s-Cluster gedraint: dort trug er 30 der Pods mit
  # worker-nodeSelector und alle 19 Longhorn-Engines, aber null Replikate.
  #
  # Unterschiede zu den VMs oben, beide sind Blech-bedingt:
  #
  #  - talosImageURL ist der metal-installer, nicht der nocloud-installer, und
  #    eine eigene Schematic ohne siderolabs/qemu-guest-agent. Auf Blech gibt es
  #    keinen virtio-Port, der Dienst haengt sonst dauerhaft in "Waiting" und
  #    steht in jedem "talosctl services" und "talosctl health" im Weg. Beide
  #    Schematics tragen iscsi-tools und util-linux-tools fuer Longhorn, der
  #    Guest-Agent ist der einzige Unterschied.
  #  - installDiskSelector statt installDisk. Der Gastname /dev/nvme0n1 ist
  #    zwar stabil, aber im Maintenance-Mode haengen unter Umstaenden noch
  #    iSCSI-Geraete von Longhorn mit dran (auf prodesk waren es 19 als sda
  #    bis sds). Die Seriennummer ist eindeutig.
  - hostname: prodesk
    ipAddress: 192.168.2.23
    controlPlane: true
    installDiskSelector:
      serial: 39MPA3T0PZXP
    # Eigene Fehlerdomaene: eigenes Blech, eigene NVMe, eigenes Netzteil. Das
    # ist die Zone, die bei einem pve-Ausfall stehen bleibt, und damit die
    # Bedingung aus der Diversitaets-Regel. Faellt spaeter raspi5 dazu, bekommt
    # sie eine eigene Zone und nicht diese.
    nodeLabels:
      topology.kubernetes.io/zone: blech
    talosImageURL: factory.talos.dev/metal-installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245
    networkInterfaces:
      # Auswahl ueber die MAC statt ueber virtio_net wie bei den VMs: hier gibt
      # es genau eine physische NIC (eno1) und die Adresse ist unveraenderlich.
      - deviceSelector:
          hardwareAddr: c4:65:16:bb:4f:cb
        dhcp: false
        addresses:
          - 192.168.2.23/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.2.1
        vip:
          ip: 192.168.2.29

  # raspi5: Raspberry Pi 5 mit NVMe, zweites Blech im Cluster. Er ersetzt
  # talos-cp-2 und holt damit die etcd-Mehrheit von pve herunter: heute liegen
  # zwei der drei Member auf derselben Maschine, ein pve-Ausfall kostet das
  # Quorum. Das ist die Randbedingung aus der ROADMAP, sonst nichts.
  #
  # Reihenfolge: erst joinen, dann talos-cp-2 entfernen. Der Weg dorthin steht
  # in README.md, hier nur, was an dieser Node anders ist:
  #
  #  - Die .22 statt der alten raspi5-Adresse .9. Der Node-Block ist .20-.29,
  #    und vor allem erlaubt die UniFi-Regel den beiden Gast-VLANs im Haus den
  #    Zugriff auf .2-.20: auf der .9 waeren Talos-API und kubelet von dort
  #    erreichbar, auf der .22 nicht. Die alte .9 faellt zurueck in den
  #    Infrastruktur-Block und ist an keiner Stelle mehr verdrahtet.
  #  - Eigene Schematic mit dem rpi_5-Overlay (siderolabs/sbc-raspberrypi), der
  #    Pi bringt keine UEFI-Firmware mit. Extensions sind dieselben zwei wie
  #    ueberall, der Guest-Agent fehlt wie bei prodesk. metal-installer, nicht
  #    nocloud.
  #  - Die SD-Karte ist das Systemziel, die NVMe traegt nur EPHEMERAL. Das ist
  #    keine Vorliebe, sondern die einzige Moeglichkeit, siehe unten.
  #  - Eigene Fehlerdomaene, siehe nodeLabels unten.
  #
  # WARUM SD UND NICHT NVMe (2026-08-09 die Stunde gekostet, die das hier
  # spart): auf dem Pi 5 kann u-boot ausschliesslich von der SD-Karte booten.
  # Weder USB noch NVMe, weil ihm der PCIe-Treiber fuer den RP1-Chip fehlt, an
  # dem beim Pi 5 sowohl die USB-Ports als auch der M.2-Slot haengen. Der
  # EEPROM-Bootloader der Firmware kann beides und laedt u-boot auch brav vom
  # Stick; danach findet u-boot nichts mehr und bleibt mit seinem Logo stehen,
  # ohne Fehlermeldung und ohne Netz. Genau so sah es aus.
  #
  # Der Verschleissgrund, aus dem raspi5 damals von SD auf NVMe umgezogen ist,
  # bleibt trotzdem erledigt: auf der SD liegen nur EFI, BOOT, META und STATE,
  # zusammen ein paar hundert MB, beschrieben praktisch nur bei Upgrades. Alles
  # Schreibintensive steckt in EPHEMERAL (/var, also Container-Images, Logs und
  # /var/lib/longhorn), und das zieht der VolumeConfig-Patch unten auf die NVMe.
  - hostname: raspi5
    ipAddress: 192.168.2.22
    controlPlane: true
    # /dev/mmcblk0 ist der SD-Slot und beim Pi stabil benannt. Ein Selector auf
    # type: sd waere gleichwertig.
    installDisk: /dev/mmcblk0
    # EPHEMERAL auf die NVMe. Node-spezifisch und nicht global, weil prodesk
    # ebenfalls eine NVMe hat und der Ausdruck dort genauso zutraefe.
    #
    # Muss beim ERSTEN apply-config dabei sein: Talos wendet eine VolumeConfig
    # nur an, solange das Volume noch nicht provisioniert ist. Nachtraeglich
    # liegt EPHEMERAL auf der SD und bleibt dort.
    patches:
      - |-
        apiVersion: v1alpha1
        kind: VolumeConfig
        name: EPHEMERAL
        provisioning:
          diskSelector:
            match: disk.transport == 'nvme'
          grow: true
    # Eigene Zone, NICHT "blech" zu prodesk dazu. Mit zwei Zonen und
    # replicaZoneSoftAntiAffinity: "false" liegt bei zwei Repliken zwangslaeufig
    # immer eine davon auf pve. Erst eine dritte Zone erlaubt Longhorn, beide
    # Repliken auf Blech zu legen, und genau das fordert die Diversitaets-Regel
    # in der ROADMAP ("mindestens eine Replik ausserhalb von pve").
    #
    # Dass "blech" ein Klassenname ist und "raspi5" ein Geraetename, ist kein
    # Bruch: die Zone ist hier wie dort genau ein Geraet, "blech" meint faktisch
    # prodesk. Gegenstueck ist manifests/longhorn/values.yaml.
    nodeLabels:
      topology.kubernetes.io/zone: raspi5
    # Dritte Schematic im Cluster, und die einzige mit einer Overlay-Option:
    # configTxtAppend haengt "dtparam=cooling_fan=on" an die config.txt.
    #
    # Ohne das kennt der Kernel den Luefter des Active Cooler gar nicht: es gibt
    # keinen pwm-fan in /sys/class/hwmon und null cooling_devices, also auch
    # nichts zu regeln, und der Luefter laeuft dauerhaft auf voller Drehzahl.
    # Bei 49 Grad CPU. Am Kernel liegt es nicht, CONFIG_SENSORS_PWM_FAN,
    # CONFIG_PWM_BCM2835 und der step_wise-Governor sind alle gebaut, es fehlt
    # allein der Device-Tree-Knoten.
    #
    # Die Vorgaengerschematic ohne die Option war
    # b00ac8400b2ad823d3d5e972136dd89c0d960d58e0ff2b12d5b8b87e9d53e670.
    talosImageURL: factory.talos.dev/metal-installer/5a66af048bde96b95010bf8bba792973932e5bb7359e77f2ef7d8edb9aacc2a6
    networkInterfaces:
      # Auswahl ueber die MAC wie bei prodesk: eine physische NIC, unveraender-
      # liche Adresse, und der Treibername des Pi-5-Ethernets muss so gar nicht
      # erst geraten werden.
      - deviceSelector:
          hardwareAddr: 2c:cf:67:4b:83:14
        dhcp: false
        addresses:
          - 192.168.2.22/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.2.1
        vip:
          ip: 192.168.2.29

patches:
  # Rund 20 Manifeste selektieren auf node-role.kubernetes.io/worker, unter
  # anderem die nodeSelector von MetalLB und cert-manager. Ohne das Label bleibt
  # die halbe Plattform Pending, und zwar ohne Fehler: der Scheduler sagt nur
  # "0/3 nodes are available".
  #
  # Dass Talos das setzen darf, ist nicht selbstverstaendlich: der Prefix
  # node-role.kubernetes.io/ ist fuer das kubelet gesperrt (NodeRestriction).
  # Talos legt Node-Labels aber nicht ueber das kubelet an, sondern ueber einen
  # eigenen Controller. Am 2026-08-08 auf talos-cp-3 verifiziert.
  #
  # Alle drei Nodes bekommen es. "Worker" ist hier ein Label fuer "traegt
  # Workloads", keine Rolle: alle Nodes des Clusters tun das.
  - |-
    machine:
      nodeLabels:
        node-role.kubernetes.io/worker: worker

  # DNS wie auf den k3s-Nodes: AdGuard-LXC auf pve und die macmini-Instanz.
  # Keine RA-v6-Resolver, die waren auf den k3s-Nodes die wiederkehrende Falle.
  - |-
    machine:
      network:
        nameservers:
          - 192.168.2.16
          - 192.168.2.4

  # Longhorn braucht /var/lib/longhorn im kubelet-Mount-Namespace, sonst sieht
  # der Manager die Replikate nicht. Die dafuer noetigen System Extensions
  # (iscsi-tools, util-linux-tools) stecken in der Schematic-ID oben.
  # Achtung: "talosctl reset" nimmt diese Daten mit.
  - |-
    machine:
      kubelet:
        extraMounts:
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options:
              - bind
              - rshared
              - rw

controlPlane:
  patches:
    # etcd-Metriken im LAN erreichbar machen. Talos bindet sie per Default auf
    # 127.0.0.1:2381, und Prometheus laeuft in einem Pod: ohne das hier sieht es
    # kein einziges etcd-Target.
    #
    # Das ist keine Kuer. Die Regelgruppe etcd-homelab in
    # manifests/kube-prometheus-stack/prometheus-rules.yaml enthaelt
    # EtcdMetricsMissing mit einem absent()-Zweig, die feuert ohne Targets
    # sofort und dauerhaft. Entweder die Metriken kommen, oder die Gruppe muesste
    # raus, und eine abgeschaltete etcd-Ueberwachung ist im Homelab die
    # schlechtere Haelfte des Tauschs.
    #
    # Port 2381 ist Klartext ohne Client-Zert. Genau wie im k3s-Cluster
    # (--etcd-expose-metrics=true) und aus demselben Grund vertretbar: nur im
    # LAN erreichbar, und es liegen keine Schluessel darin. Der Client-Port 2379
    # bleibt unangetastet.
    - |-
      cluster:
        etcd:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381

    # Talos-API aus dem Cluster heraus, ausschliesslich fuer etcd-Snapshots.
    #
    # Das ist die Vorbedingung fuer manifests/etcd-backup/: ein CronJob im
    # Cluster laesst sich damit ein talosconfig ausstellen und ruft darueber
    # "talosctl etcd snapshot" auf jeder Control-Plane auf. Ohne das gaebe es
    # keinen Weg an die Talos-API, der nicht die Admin-Credentials vom Laptop
    # in einem Secret ablegt.
    #
    # Talos kennt keine k3s-Entsprechung zu --etcd-s3-config: k3s laedt seine
    # Snapshots selbst hoch, Talos schreibt sie nur auf Anforderung heraus. Der
    # Upload ist deshalb Sache des Clusters und nicht der Node.
    #
    # Eng gehalten in beide Richtungen:
    #   allowedRoles: NUR os:etcd:backup. Diese Rolle erlaubt genau den
    #     EtcdSnapshot-Aufruf, kein Lesen der machine config, kein Reboot,
    #     kein Zugriff auf Secrets der Node.
    #   allowedKubernetesNamespaces: NUR kube-system. Ein ServiceAccount-CR in
    #     einem anderen Namespace bekommt kein talosconfig, auch nicht mit
    #     denselben Rollen.
    #
    # Wirkt ohne Reboot, geprueft mit "talosctl apply-config --dry-run" am
    # 2026-08-09: die Aenderung betrifft nur trustd und den
    # ServiceAccount-Controller.
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:etcd:backup
            allowedKubernetesNamespaces:
              - kube-system

    # Talos erzwingt PodSecurity "baseline", Longhorns CSI-Pods brauchen mehr.
    # Nur der Zusatz steht hier: talhelper merged den Patch in die
    # Talos-Defaults, ein ausgeschriebener Block traegt kube-system doppelt ein.
    #
    # Andere Workloads mit hostNetwork oder hostPath (Home Assistant, csi-driver-smb)
    # brauchen beim Migrieren ein Label am Namespace
    # (pod-security.kubernetes.io/enforce: privileged) statt eines weiteren
    # Eintrags hier: das ist GitOps und faellt beim Deployen auf, eine Aenderung
    # hier rebootet die Control-Plane.
    - |-
      cluster:
        apiServer:
          admissionControl:
            - name: PodSecurity
              configuration:
                exemptions:
                  namespaces:
                    - longhorn-system
