# talhelper configuration of the Talos cluster.
#
# The single source of truth for the machine configs, generated with
# "talhelper genconfig" into ./clusterconfig/ (gitignored, contains the CAs in
# plaintext). Never edit a generated file by hand, the next genconfig
# overwrites it.
#
# Three control-plane nodes, all scheduling workloads. Two of them are bare
# metal and only talos-cp-1 is a VM on pve, so a pve outage costs neither the
# etcd quorum nor all Longhorn replicas.

clusterName: homelab

# renovate: datasource=github-releases depName=siderolabs/talos
talosVersion: v1.13.8
# renovate: datasource=github-releases depName=kubernetes/kubernetes
kubernetesVersion: v1.36.3

# The cluster VIP, built into Talos, no kube-vip needed.
#
# .29 rather than an address from the MetalLB range: the VIP is not a service
# but belongs to the nodes, and .20-.29 is the node block in the address plan.
# Inside the MetalLB range the pool would need a hole so MetalLB cannot hand
# the cluster API to a service, and above all the UniFi rule grants the guest
# VLANs access to .249-.254, which would have exposed the API to them.
endpoint: https://192.168.2.29:6443

# Not the Talos defaults. Manifests rely on these values:
# home-assistant/configuration.yaml carries 10.42.0.0/16 as a
# trusted_proxy and gatus/configmap.yaml checks CoreDNS at 10.43.0.10.
#
# Dual-stack, and v4 stays FIRST and therefore primary: every existing ClusterIP
# keeps its address, kube-dns keeps 10.43.0.10, and services stay SingleStack
# until raised to PreferDualStack one by one.
#
# The v6 ranges are cluster-internal ULAs that are never routed and have nothing
# to do with the LAN prefixes; the LAN side lives in fd2e:9a71:c3b5::/64.
# Kubernetes allows nothing larger than /108 for the v6 service range.
clusterPodNets:
  - 10.42.0.0/16
  - fd00:10:42::/56
clusterSvcNets:
  - 10.43.0.0/16
  - fd00:10:43::/112

# No node carries a taint: with three nodes a reserved control-plane set would
# be pure waste. The condition is honest requests and limits, or a hungry
# workload takes the etcd member down with it.
allowSchedulingOnControlPlanes: true

# The VIP and every node IP must appear in the API server certificate, or any
# access through an address other than the endpoint fails. Both lists are
# cluster-wide and therefore have to be applied to EVERY node, including ones
# that changed nothing else (see README.md).
additionalApiServerCertSans:
  - 192.168.2.29
  - 192.168.2.20
  - 192.168.2.22
  - 192.168.2.23
  - 127.0.0.1
additionalMachineCertSans:
  - 192.168.2.29
  - 192.168.2.20
  - 192.168.2.22
  - 192.168.2.23

# Flannel is the Talos default and brings no NetworkPolicy controller;
# kube-router supplies one in netpol-only mode (manifests/kube-router/).
cniConfig:
  name: flannel

nodes:
  - hostname: talos-cp-1
    ipAddress: 192.168.2.20
    controlPlane: true
    installDisk: /dev/sda
    # Failure domain for Longhorn. It is the only node in this zone, but the
    # label still matters: it says its disk lives in pve. A second pve VM would
    # be two different nodes to Longhorn's node anti-affinity and thus fine,
    # although both replicas would sit on the same NVMe and die together. Only
    # the zone makes that visible.
    #
    # The counterpart is replicaZoneSoftAntiAffinity: "false" in
    # manifests/longhorn/values.yaml. Without a zone label everything falls
    # into the same empty zone and Longhorn could place only one replica per
    # volume, so set the label first when adding a node.
    nodeLabels:
      topology.kubernetes.io/zone: pve
    # nocloud-installer, not installer: the VMs boot from the nocloud disk
    # image and a metal installer would switch the platform on the first
    # upgrade. The schematic ID matches homelab-terraform/proxmox/vm-talos.tf.
    talosImageURL: factory.talos.dev/nocloud-installer/88d1f7a5c4f1d3aba7df787c448c1d3d008ed29cfb34af53fa0df4336a56040b
    networkInterfaces:
      # deviceSelector rather than a fixed name: Talos assigns predictable
      # interface names that depend on the Proxmox machine class. The driver
      # is stable, the name is not.
      - deviceSelector:
          driver: virtio_net
        dhcp: false
        addresses:
          - 192.168.2.20/24
          # Static, mirroring the v4 host part. See the sysctls patch below for
          # why this is not left to SLAAC.
          - fd2e:9a71:c3b5::20/64
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.2.1
          # NOT optional, and not about reachability: flanneld determines its
          # interface from the default route of each family and refuses to
          # start without a v6 one ("failed to get default v6 interface"). With
          # accept_ra off nothing else installs it. The gateway is the UniFi
          # ULA address; a ULA source address gets nowhere on the v6 internet,
          # which is intended, the route exists for the interface lookup.
          - network: "::/0"
            gateway: fd2e:9a71:c3b5::1
        vip:
          ip: 192.168.2.29
    patches:
      # No router advertisements on this interface. Three routers announce
      # prefixes into this LAN: UniFi with the ISP prefix and the manual ULA,
      # and an Apple Thread border router with a ULA of its own on a 30 minute
      # lifetime. Flannel takes the FIRST v6 address of the interface, and
      # which one that is comes down to boot order, so it ended up on the
      # Thread prefix here. When that border router goes away, the address goes
      # with it and v6 pod traffic through this node stops.
      #
      # Turned off, the static address above is the only v6 the interface has,
      # for flannel as well as for the kubelet.
      #
      # The interface name is load-bearing: "all" does not reach accept_ra
      # (measured, all=1 while the interface stood at 2), and "default" only
      # applies to interfaces created afterwards. A renamed interface silently
      # gets its RAs back.
      #
      # The price is the v6 default route. Nothing needs it: DNS, image pulls
      # and both resolver upstreams are v4, and Blocky connects outbound with
      # connectIPVersion v4.
      - |-
        machine:
          sysctls:
            net.ipv6.conf.default.accept_ra: "0"
            net.ipv6.conf.eth0.accept_ra: "0"

  # prodesk: bare metal and the largest share of the cluster's RAM ceiling.
  # Without it the kube-prometheus-stack does not fit.
  #
  # Two differences from the VM above, both because it is bare metal:
  #
  #  - talosImageURL is the metal installer and a schematic without
  #    siderolabs/qemu-guest-agent. Bare metal has no virtio port, so the
  #    service would hang in "Waiting" forever and clutter every
  #    "talosctl services" and "talosctl health". Both schematics carry
  #    iscsi-tools and util-linux-tools for Longhorn.
  #  - installDiskSelector rather than installDisk: /dev/nvme0n1 is stable in
  #    the guest, but in maintenance mode Longhorn iSCSI devices may still be
  #    attached and shift the names. The serial number is unambiguous.
  - hostname: prodesk
    ipAddress: 192.168.2.23
    controlPlane: true
    installDiskSelector:
      serial: 39MPA3T0PZXP
    # Its own failure domain: own hardware, own NVMe, own power supply. One of
    # the two zones that survive a pve outage.
    nodeLabels:
      topology.kubernetes.io/zone: blech
    talosImageURL: factory.talos.dev/metal-installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245
    networkInterfaces:
      # Selected by MAC rather than by driver as on the VMs: there is exactly
      # one physical NIC here and its address is immutable.
      - deviceSelector:
          hardwareAddr: c4:65:16:bb:4f:cb
        dhcp: false
        addresses:
          - 192.168.2.23/24
          - fd2e:9a71:c3b5::23/64
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.2.1
          # See talos-cp-1: flanneld refuses to start without a default route
          # per family.
          - network: "::/0"
            gateway: fd2e:9a71:c3b5::1
        vip:
          ip: 192.168.2.29
    # See talos-cp-1 above for the reasoning.
    patches:
      - |-
        machine:
          sysctls:
            net.ipv6.conf.default.accept_ra: "0"
            net.ipv6.conf.eno1.accept_ra: "0"

  # raspi5: Raspberry Pi 5 with NVMe, the second bare-metal node. Together with
  # prodesk it keeps the etcd majority off pve.
  #
  # What differs on this node:
  #
  #  - .22 from the node block .20-.29. The UniFi rule grants the two guest
  #    VLANs access to .2-.20, so an address from the lower range would expose
  #    the Talos API and the kubelet to them.
  #  - Its own schematic with the rpi_5 overlay (siderolabs/sbc-raspberrypi),
  #    the Pi ships no UEFI firmware. metal installer, not nocloud.
  #  - The SD card is the system target and the NVMe only carries EPHEMERAL.
  #    Not a preference but the only option, see below.
  #  - Its own failure domain, see nodeLabels below.
  #
  # WHY SD AND NOT NVMe: on the Pi 5 u-boot can boot from the SD card only.
  # Neither USB nor NVMe, because it lacks the PCIe driver for the RP1 chip
  # that carries both the USB ports and the M.2 slot. The firmware's EEPROM
  # bootloader can do both and happily loads u-boot from a stick; after that
  # u-boot finds nothing and stops at its logo, without an error and without
  # network.
  #
  # SD wear stays manageable: only EFI, BOOT, META and STATE live there, a few
  # hundred MB written practically only during upgrades. Everything
  # write-intensive sits in EPHEMERAL, which the VolumeConfig patch below
  # moves to the NVMe.
  - hostname: raspi5
    ipAddress: 192.168.2.22
    controlPlane: true
    # /dev/mmcblk0 is the SD slot and stably named on the Pi. A selector on
    # type: sd would be equivalent.
    installDisk: /dev/mmcblk0
    # EPHEMERAL onto the NVMe. Node-specific rather than global, because
    # prodesk has an NVMe too and the expression would match there as well.
    #
    # Must be part of the FIRST apply-config: Talos only applies a VolumeConfig
    # while the volume is not yet provisioned. Added later, EPHEMERAL stays on
    # the SD card.
    patches:
      - |-
        apiVersion: v1alpha1
        kind: VolumeConfig
        name: EPHEMERAL
        provisioning:
          diskSelector:
            match: disk.transport == 'nvme'
          grow: true
      # See talos-cp-1 for the reasoning.
      - |-
        machine:
          sysctls:
            net.ipv6.conf.default.accept_ra: "0"
            net.ipv6.conf.end0.accept_ra: "0"
    # Its own zone, NOT joining prodesk in "blech". With two zones and
    # replicaZoneSoftAntiAffinity: "false" one of two replicas would always end
    # up on pve; only a third zone lets Longhorn put both on bare metal, which
    # is what the diversity rule in the ROADMAP demands.
    #
    # That "blech" is a class name and "raspi5" a device name is not a break:
    # either zone is exactly one device. The counterpart is
    # manifests/longhorn/values.yaml.
    nodeLabels:
      topology.kubernetes.io/zone: raspi5
    # Third schematic in the cluster and the only one with an overlay option:
    # configTxtAppend adds "dtparam=cooling_fan=on" to config.txt.
    #
    # Without it the kernel does not know the Active Cooler's fan at all: no
    # pwm-fan in /sys/class/hwmon, zero cooling_devices, nothing to control,
    # and the fan runs at full speed permanently. The kernel is not at fault,
    # only the device tree node is missing.
    talosImageURL: factory.talos.dev/metal-installer/5a66af048bde96b95010bf8bba792973932e5bb7359e77f2ef7d8edb9aacc2a6
    networkInterfaces:
      # Selected by MAC as on prodesk: one physical NIC with an immutable
      # address, and no need to guess the Pi 5 ethernet driver's name.
      - deviceSelector:
          hardwareAddr: 2c:cf:67:4b:83:14
        dhcp: false
        addresses:
          - 192.168.2.22/24
          - fd2e:9a71:c3b5::22/64
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.2.1
          # See talos-cp-1: flanneld refuses to start without a default route
          # per family.
          - network: "::/0"
            gateway: fd2e:9a71:c3b5::1
        vip:
          ip: 192.168.2.29

patches:
  # Around 20 manifests select on node-role.kubernetes.io/worker, among them
  # the nodeSelectors of MetalLB and cert-manager. Without the label half the
  # platform stays Pending without an error, the scheduler only says
  # "0/3 nodes are available".
  #
  # That Talos may set it is not obvious: the node-role.kubernetes.io/ prefix
  # is blocked for the kubelet (NodeRestriction), but Talos creates node labels
  # through a controller of its own rather than through the kubelet.
  #
  # All three nodes get it. "Worker" here labels "carries workloads", it is not
  # a role: every node in this cluster does.
  - |-
    machine:
      nodeLabels:
        node-role.kubernetes.io/worker: worker

  # Which addresses the kubelet registers as node IPs. Mandatory with
  # dual-stack: every NIC here carries THREE v6 /64s, the rotating ISP prefix,
  # this manual ULA and a second ULA UniFi generates on its own. Without a
  # selection Talos may take the ISP prefix, and then the InternalIP of every
  # node changes with each prefix rotation.
  #
  # v4 first and identical on all three nodes: Longhorn 1.12 supports dual-stack
  # only when every node lists its families in the same order.
  - |-
    machine:
      kubelet:
        nodeIP:
          validSubnets:
            - 192.168.2.0/24
            - fd2e:9a71:c3b5::/64

  # The two Blocky instances. Fixed v4 addresses and explicitly no v6
  # resolvers learned by router advertisement, which would otherwise be sorted
  # to the front unnoticed on a prefix change.
  #
  # This list serves TWO consumers, each with its own condition:
  #
  # 1. The node itself, among other things for image pulls. Hence the LXC
  #    (.254) comes FIRST: it runs outside the cluster. With only the cluster
  #    instance here, a cold node would need DNS to start the pod that
  #    provides DNS.
  # 2. CoreDNS, which inherits exactly this list through
  #    "forward . /etc/resolv.conf". CoreDNS picks its upstreams AT RANDOM, not
  #    in order, so ALL entries must know the same split horizon; otherwise
  #    part of the pod queries resolve publicly and run through hairpin NAT.
  #
  # From 2. it follows that the UniFi gateway must NOT appear here: it returns
  # the public CNAME. For the same reason no public resolver can serve as a
  # third fallback.
  #
  # The remaining case is "pve off AND cluster cold AND image cache empty", in
  # which no node reaches DNS. Manual way out:
  # talosctl patch mc -n <ip> -p '[{"op":"replace",
  #   "path":"/machine/network/nameservers","value":["9.9.9.9"]}]'
  - |-
    machine:
      network:
        nameservers:
          - 192.168.2.254
          - 192.168.2.253

  # Precondition for 2. above: with the Talos default the pod resolv.conf holds
  # only the host DNS proxy (169.254.116.108), so CoreDNS sees a single upstream
  # and cannot fail over. A dead first resolver then costs every lookup in the
  # cluster several seconds. Turned off, the pods get both addresses and the
  # forward plugin drops a dead upstream itself.
  #
  # The host keeps its own hostDNS on 127.0.0.53, this only concerns the pods.
  # Takes effect without a reboot, but CoreDNS has to be restarted: the kubelet
  # writes resolv.conf when the pod is created.
  - |-
    machine:
      features:
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: false

  # Longhorn needs /var/lib/longhorn in the kubelet mount namespace or the
  # manager does not see the replicas. The required system extensions
  # (iscsi-tools, util-linux-tools) are in the schematic ID above. Note that
  # "talosctl reset" takes this data with it.
  - |-
    machine:
      kubelet:
        extraMounts:
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options:
              - bind
              - rshared
              - rw

controlPlane:
  patches:
    # etcd stays on v4. Unset, Talos picks "the first routable address", which
    # is v4 today and would be free to move once the nodes carry v6 node
    # addresses. listenSubnets follows advertisedSubnets, so both are pinned.
    - |-
      cluster:
        etcd:
          advertisedSubnets:
            - 192.168.2.0/24

    # Makes the etcd metrics reachable from the LAN. Talos binds them to
    # 127.0.0.1:2381 by default and Prometheus runs in a pod, so without this
    # it sees not a single etcd target.
    #
    # Not optional: the etcd-homelab group in prometheus-rules.yaml contains
    # EtcdMetricsMissing with an absent() branch, which fires immediately and
    # permanently without targets.
    #
    # Port 2381 is plaintext without a client certificate and still acceptable:
    # reachable only from the LAN and carrying no keys. The client port 2379 is
    # untouched.
    - |-
      cluster:
        etcd:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381

    # Talos API from inside the cluster, exclusively for etcd snapshots.
    #
    # The precondition for manifests/etcd-backup/: a CronJob in the cluster can
    # have a talosconfig issued and calls "talosctl etcd snapshot" on each
    # control plane through it. Without this there would be no path to the
    # Talos API that does not store the laptop's admin credentials in a secret.
    #
    # Confined in both directions:
    #   allowedRoles: ONLY os:etcd:backup, which permits exactly the
    #     EtcdSnapshot call: no reading the machine config, no reboot, no
    #     access to the node's secrets.
    #   allowedKubernetesNamespaces: ONLY kube-system. A ServiceAccount CR in
    #     another namespace gets no talosconfig, not even with the same roles.
    #
    # Takes effect without a reboot, it only concerns trustd and the
    # ServiceAccount controller.
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:etcd:backup
            allowedKubernetesNamespaces:
              - kube-system

    # Talos enforces PodSecurity "baseline" and Longhorn's CSI pods need more.
    # Only the addition belongs here: talhelper merges the patch into the Talos
    # defaults, and a fully written-out block would list kube-system twice.
    #
    # Other workloads with hostNetwork or hostPath get a label on their
    # namespace (pod-security.kubernetes.io/enforce: privileged) rather than
    # another entry here: that is GitOps and shows up on deploy, while a change
    # here reboots the control plane.
    - |-
      cluster:
        apiServer:
          admissionControl:
            - name: PodSecurity
              configuration:
                exemptions:
                  namespaces:
                    - longhorn-system
