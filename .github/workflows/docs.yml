name: Docs

# Keeps README.md current, and is the ONLY thing that does. The file is
# generated from apps/ and manifests/ by docs-generator/generate_readme.py.
# There was a local pre-commit hook doing the same, dropped because nearly
# every commit here is a Renovate merge on GitHub where no hook ever runs.
#
# No commit loop: by GitHub's design, pushes with GITHUB_TOKEN trigger no
# further workflows, and the [skip ci] in the commit is the belt on top.
#
# The local hook stays for fast feedback while developing, it is just no
# longer the only instance.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-main
  cancel-in-progress: false

jobs:
  readme:
    name: Regenerate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Explicitly main, not the pushed SHA: with several merges in quick
          # succession the run has to generate from the current tip, otherwise
          # it commits a README built from an already outdated state.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: python3 -m pip install --quiet -r docs-generator/requirements.txt

      - name: Generate README
        # Through make so a local run cannot drift apart from CI.
        run: make docs

      - name: Commit if changed
        run: |
          set -euo pipefail

          if git diff --quiet README.md; then
            echo "README.md unchanged, nothing to do."
            exit 0
          fi

          echo "README.md changed:"
          git --no-pager diff --stat README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): update version table [skip ci]"

          # One retry in case something else pushed to main in the meantime
          # (two merges in quick succession).
          git push || {
            echo "Push rejected, rebasing and retrying."
            git pull --rebase
            git push
          }
