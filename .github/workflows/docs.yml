name: Docs

# Keeps README.md current. The file is generated from apps/ and manifests/ by
# docs-generator/generate_readme.py. The local pre-commit hook alone is not
# enough: Renovate merges on GitHub, and with automerge there are no local
# commits left to trigger it.
#
# The trigger is workflow_run and not push:main on purpose. Semantic release
# pushes a commit to main itself on every release, and running both on the
# same push event would have them push simultaneously with one failing
# non-fast-forward. This way the workflow runs after it and sees the finished
# state including the release commit.
#
# No commit loop: by GitHub's design, pushes with GITHUB_TOKEN trigger no
# further workflows, and the [skip ci] in the commit is the belt on top.
#
# The local hook stays for fast feedback while developing, it is just no
# longer the only instance.

on:
  workflow_run:
    workflows: ["Semantic Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-main
  cancel-in-progress: false

jobs:
  readme:
    name: README generieren
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Explicitly main: on workflow_run the default points at the state
          # that started the triggering workflow, not at its result, and we
          # want the release commit included.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: python3 -m pip install --quiet -r docs-generator/requirements.txt

      - name: Generate README
        # Through make so CI and the local pre-commit hook share one entry
        # point and cannot drift apart.
        run: make docs

      - name: Commit bei Aenderung
        run: |
          set -euo pipefail

          if git diff --quiet README.md; then
            echo "README.md unveraendert, nichts zu tun."
            exit 0
          fi

          echo "README.md hat sich geaendert:"
          git --no-pager diff --stat README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # docs() triggers no release under the angular preset.
          git commit -m "docs(readme): Versionstabelle aktualisieren [skip ci]"

          # One retry in case something else pushed to main in the meantime
          # (two merges in quick succession).
          git push || {
            echo "Push abgelehnt, rebase und zweiter Versuch."
            git pull --rebase
            git push
          }
