name: Renovate

on:
  schedule:
    # Taeglich 04:00 UTC. Einzige Zeitsteuerung, die Renovate-Config selbst hat
    # bewusst kein "schedule:".
    #
    # Frueher woechentlich (montags). Umgestellt mit Phase 3 (Automerge), weil
    # Renovate selbst merged statt GitHubs Auto-Merge zu nutzen (Begruendung in
    # renovate.json5 bei platformAutomerge). Gemerged wird dadurch nur waehrend
    # eines Laufs: Lauf N oeffnet den PR, die CI wird kurz danach gruen, Lauf
    # N+1 merged. Bei woechentlichem Cron waere das eine Woche Latenz pro
    # Image-Patch. minimumReleaseAge (3 Tage) bleibt der eigentliche Puffer
    # gegen frische kaputte Releases, nicht der Cron.
    #
    # Zwei Laeufe pro Tag, und das ist kein Komfort, sondern die Bedingung dafuer
    # dass Automerge ueberhaupt greift. Ein Lauf, der den Branch anfasst (neue
    # Version, Rebase bei Konflikt), setzt die Status-Checks zurueck. Die
    # brauchen ~60s, der Lauf ist nach ~80s vorbei: er sieht den gruenen Stand
    # nie und merged folglich nicht.
    #
    # Bei einer Dependency mit taeglichem Release trifft das jeden Lauf.
    # amazon/aws-cli taggt werktags gegen 19:15 UTC, mit minimumReleaseAge von
    # 3 Tagen wird also jeden Abend eine neue Version reif. Der 04:00-Lauf hebt
    # den Branch darauf an, statt den vom Vortag zu mergen. PR #52 lag so seit
    # dem 04.08. Der zweite Lauf findet den Branch gruen und unveraendert vor
    # und merged ihn.
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Nur analysieren, keine Branches/PRs anlegen'
        type: boolean
        default: false
      logLevel:
        description: 'Log-Level'
        type: choice
        options:
          - info
          - debug
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Renovate
        uses: renovatebot/github-action@v46.2.0
        with:
          # Fine-grained PAT, nur auf dieses Repo eingeschraenkt, als
          # Repo-Secret RENOVATE_TOKEN hinterlegt. Noetige Permissions:
          # Contents RW, Pull requests RW, Issues RW (Dependency Dashboard),
          # Workflows RW (sonst blocken Action-Updates), Commit statuses RW.
          # Der Default-GITHUB_TOKEN reicht nicht: von ihm erzeugte PRs starten
          # keine Workflows, semantic-release wuerde also nie greifen.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Beide Repos aus einem Lauf. Der PAT deckt seit dem 2026-08-09 beide
          # ab, und ein GitHub-Secret laesst sich nicht auslesen: es ein zweites
          # Mal zu hinterlegen haette bedeutet, den Token neu auszustellen.
          #
          # Renovate liest die Konfiguration je Repo aus dem Repo selbst, die
          # beiden renovate.json5 bleiben also getrennt und unterschiedlich
          # zugeschnitten (drueben kein Automerge, weil dort nichts von selbst
          # ausrollt).
          RENOVATE_REPOSITORIES: Nebu2k/kubernetes-homelab,Nebu2k/homelab-terraform
          # Die Action erwartet fuer "aus" den String "null", nicht leer.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
