name: Renovate

on:
  schedule:
    # The only schedule; the Renovate config deliberately carries no
    # "schedule:" of its own.
    #
    # The frequency IS the merge throughput. Renovate merges itself rather than
    # using GitHub's auto-merge (see platformAutomerge in renovate.json5), so a
    # merge can only happen while a run is in progress, and a run automerges at
    # most TWO PRs: after the first it restarts the repository job once, and
    # the recursive call is passed canRetry=false, which ends it.
    #
    # Every two hours gives 24 merges a day of headroom. The buffer against
    # freshly broken releases is minimumReleaseAge, not the cron.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Nur analysieren, keine Branches/PRs anlegen'
        type: boolean
        default: false
      logLevel:
        description: 'Log-Level'
        type: choice
        options:
          - info
          - debug
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          # Fine-grained PAT scoped to this repo, stored as the repo secret
          # RENOVATE_TOKEN. Required permissions: Contents RW, Pull requests
          # RW, Issues RW (dependency dashboard), Workflows RW (action updates
          # block otherwise), Commit statuses RW. The default GITHUB_TOKEN is
          # not enough: PRs it creates start no workflows, so validate.yml
          # would never run and the automerge-on-green would never trigger.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Both repos from one run, the PAT covers both. A GitHub secret
          # cannot be read back, so storing it in the second repo would mean
          # issuing a new token.
          #
          # The five website repos deliberately do NOT ride along: they have
          # their own PAT and their own run, in elmstreet79-de. One token per
          # domain of work, so revoking one does not stop the other.
          #
          # Renovate reads each repo's configuration from the repo itself, so
          # the two renovate.json5 stay separate and differently scoped (no
          # automerge over there, because nothing rolls out by itself).
          RENOVATE_REPOSITORIES: Nebu2k/kubernetes-homelab,Nebu2k/homelab-terraform
          # The action expects the string "null" for "off", not an empty value.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || 'null' }}
          # Without this Renovate commits as renovate@whitesourcesoftware.com
          # and warns on every run. The noreply address rather than the real
          # one: the account's primary address is set to private, and GitHub
          # still attributes the commits through the id.
          RENOVATE_GIT_AUTHOR: 'Nebu2k <64439522+Nebu2k@users.noreply.github.com>'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
