name: Renovate

on:
  schedule:
    # The only schedule; the Renovate config deliberately carries no
    # "schedule:" of its own.
    #
    # Daily rather than weekly, because Renovate merges itself instead of using
    # GitHub's auto-merge (see platformAutomerge in renovate.json5): merging
    # only happens during a run. The buffer against freshly broken releases is
    # minimumReleaseAge, not the cron.
    #
    # Two runs a day, and that is not convenience but the condition for
    # automerge to work at all. A run that touches the branch (new version,
    # rebase on conflict) resets the status checks, which take longer than the
    # run itself: it never sees the green state and therefore does not merge.
    #
    # With a dependency that releases daily that hits every run. The first run
    # lifts the branch onto the new version instead of merging yesterday's, and
    # the second finds it green and unchanged and merges it.
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Nur analysieren, keine Branches/PRs anlegen'
        type: boolean
        default: false
      logLevel:
        description: 'Log-Level'
        type: choice
        options:
          - info
          - debug
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Renovate
        uses: renovatebot/github-action@v46.2.1
        with:
          # Fine-grained PAT scoped to this repo, stored as the repo secret
          # RENOVATE_TOKEN. Required permissions: Contents RW, Pull requests
          # RW, Issues RW (dependency dashboard), Workflows RW (action updates
          # block otherwise), Commit statuses RW. The default GITHUB_TOKEN is
          # not enough: PRs it creates start no workflows, so validate.yml
          # would never run and the automerge-on-green would never trigger.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # All repos from one run, the PAT covers them all. A GitHub secret
          # cannot be read back, so storing it in a second repo would mean
          # issuing a new token.
          #
          # Renovate reads each repo's configuration from the repo itself, so
          # every renovate.json5 stays separate and differently scoped (no
          # automerge in homelab-terraform, because nothing rolls out by
          # itself; the websites automerge patches behind their build gate).
          RENOVATE_REPOSITORIES: >-
            Nebu2k/kubernetes-homelab,Nebu2k/homelab-terraform,Nebu2k/elmstreet79-de,Nebu2k/seb-it-com,Nebu2k/homeworx-solutions,Nebu2k/haushelden-service,Nebu2k/peters.club
          # The action expects the string "null" for "off", not an empty value.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
