name: Renovate

on:
  schedule:
    # Taeglich 04:00 UTC. Einzige Zeitsteuerung, die Renovate-Config selbst hat
    # bewusst kein "schedule:".
    #
    # Frueher woechentlich (montags). Umgestellt mit Phase 3 (Automerge), weil
    # Renovate selbst merged statt GitHubs Auto-Merge zu nutzen (Begruendung in
    # renovate.json5 bei platformAutomerge). Gemerged wird dadurch nur waehrend
    # eines Laufs: Lauf N oeffnet den PR, die CI wird kurz danach gruen, Lauf
    # N+1 merged. Bei woechentlichem Cron waere das eine Woche Latenz pro
    # Image-Patch. minimumReleaseAge (3 Tage) bleibt der eigentliche Puffer
    # gegen frische kaputte Releases, nicht der Cron.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Nur analysieren, keine Branches/PRs anlegen'
        type: boolean
        default: false
      logLevel:
        description: 'Log-Level'
        type: choice
        options:
          - info
          - debug
        default: info

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Renovate
        uses: renovatebot/github-action@v46.2.1
        with:
          # Fine-grained PAT, nur auf dieses Repo eingeschraenkt, als
          # Repo-Secret RENOVATE_TOKEN hinterlegt. Noetige Permissions:
          # Contents RW, Pull requests RW, Issues RW (Dependency Dashboard),
          # Workflows RW (sonst blocken Action-Updates), Commit statuses RW.
          # Der Default-GITHUB_TOKEN reicht nicht: von ihm erzeugte PRs starten
          # keine Workflows, semantic-release wuerde also nie greifen.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Die Action erwartet fuer "aus" den String "null", nicht leer.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
