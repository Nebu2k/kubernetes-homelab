# App of apps, everything else in the cluster hangs off it.
#
# Applied by hand exactly once after the ArgoCD bootstrap from
# homelab-terraform/argocd-talos/. This is the only step that does not run
# through ArgoCD, which manages everything except itself.
#
#   KUBECONFIG=talos/clusterconfig/kubeconfig \
#     kubectl apply -f bootstrap/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nebu2k/kubernetes-homelab
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Without this "homelab" sits on OutOfSync permanently because of exactly one
  # Application: longhorn.
  #
  # The Longhorn chart ships a PreDelete hook, so ArgoCD adds two finalizers of
  # its own to be able to run it before deletion, while git only carries
  # resources-finalizer.argocd.argoproj.io. The Application is Synced and
  # Healthy and its spec matches git, the diff consists solely of those fields.
  #
  # Narrowed to longhorn on purpose: if a second app gained a PreDelete hook it
  # should show up again, rather than a blanket rule also silencing a genuine
  # removal of resources-finalizer.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: longhorn
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
