# App-of-Apps. Alles andere im Cluster haengt daran.
#
# Wird von Hand appliziert, genau einmal nach dem ArgoCD-Bootstrap aus
# homelab-terraform/argocd-talos/. Das ist der einzige Handgriff, der nicht
# ueber ArgoCD laeuft: ArgoCD verwaltet alles ausser sich selbst.
#
#   KUBECONFIG=talos/clusterconfig/kubeconfig \
#     kubectl apply -f bootstrap/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nebu2k/kubernetes-homelab
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Ohne das steht "homelab" dauerhaft auf OutOfSync, und zwar wegen genau einer
  # Application: longhorn.
  #
  # Der Longhorn-Chart bringt einen PreDelete-Hook mit (das Uninstall-Job).
  # ArgoCD haengt der Application deshalb von sich aus zwei eigene Finalizer an,
  # "pre-delete-finalizer.argocd.argoproj.io" und ".../cleanup", damit es den
  # Hook vor dem Loeschen noch ausfuehren kann. In git steht nur
  # "resources-finalizer.argocd.argoproj.io". Die Application selbst ist Synced
  # und Healthy, ihre spec deckt sich mit git, der Diff besteht ausschliesslich
  # aus diesen zwei Feldern.
  #
  # Bewusst auf longhorn eingegrenzt und nicht auf alle Applications. Bekaeme
  # eine zweite App einen PreDelete-Hook, soll sie wieder auffallen, statt dass
  # eine pauschale Regel auch ein echtes Entfernen von resources-finalizer
  # stillstellt.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: longhorn
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
