# App-of-Apps des Talos-Clusters.
#
# Gegenstueck zu root-app.yaml (k3s), zeigt aber auf clusters/talos statt auf
# apps/. Beide Cluster lesen denselben Branch; was im neuen laeuft, steht in
# clusters/talos/kustomization.yaml und waechst mit der Migration.
#
# Wird von Hand appliziert, genau einmal nach dem ArgoCD-Bootstrap aus
# homelab-terraform/argocd-talos/:
#
#   KUBECONFIG=talos/clusterconfig/kubeconfig \
#     kubectl apply -f bootstrap/root-app-talos.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-talos
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nebu2k/kubernetes-homelab
    targetRevision: main
    path: clusters/talos
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
