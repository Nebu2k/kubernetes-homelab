---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-pool
  namespace: metallb-system
spec:
  addresses:
    # Disjunkt zum k3s-Pool, der seit dem 2026-08-09 bei .251-.253 anfaengt.
    # Beide Cluster haengen im selben L2-Segment; eine ueberlappende Adresse
    # hiesse zwei Speaker, die dieselbe IP per ARP ankuendigen, und der Dienst
    # waere abwechselnd erreichbar.
    #
    # Die .248 fehlt absichtlich, das ist der Talos-VIP fuer den
    # Kubernetes-Endpoint und keine Adresse, die MetalLB vergeben darf. Deshalb
    # zwei Bereiche statt einem durchgehenden.
    - 192.168.2.240-192.168.2.247
    # Die .250 ist der Split-Horizon-Wildcard *.elmstreet79.de und das Ziel des
    # UniFi-Portforwards auf 80/443. Sie kam am 2026-08-09 aus dem k3s-Pool
    # herueber, nachdem das dortige Traefik auf die .251 gewichen war.
    - 192.168.2.250/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-pool
