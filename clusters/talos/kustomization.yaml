# App-of-Apps des Talos-Clusters.
#
# Bewusst kein zweiter Satz Application-Manifeste: die Dateien aus apps/ sind
# die gemeinsame Basis, hier steht nur, WELCHE davon im neuen Cluster schon
# laufen und WAS sich unterscheidet. Ein Dienst wandert damit durch genau eine
# Zeile mehr in dieser Liste, und eine Aenderung an einem Dienst muss nie an
# zwei Stellen nachgezogen werden.
#
# Reihenfolge egal, die sync-waves stehen in den Applications selbst.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../../apps/sealed-secrets.yaml
  - ../../apps/metallb.yaml
  - ../../apps/traefik.yaml
  - ../../apps/cert-manager.yaml

patches:
  # MetalLB: eigener Pool, PodSecurity und die Exclude-Label-Ausnahme.
  #
  # ignoreExcludeLB ist der Unterschied, der am meisten Zeit gekostet hat:
  # vanilla Kubernetes setzt auf Control-Plane-Nodes
  # node.kubernetes.io/exclude-from-external-load-balancers, k3s tut das nicht.
  # MetalLB respektiert das Label und kuendigt von solchen Nodes nichts an. Im
  # Startaufbau sind alle drei Nodes Control-Plane, also kuendigt niemand an:
  # der Service bekommt seine IP, ArgoCD meldet Healthy, und trotzdem
  # beantwortet kein Node das ARP fuer die .240. Sichtbar nur daran, dass
  # ServiceL2Status leer bleibt.
  #
  # Das Label passt nicht zu allowSchedulingOnControlPlanes: diese Nodes SIND
  # die Worker. Es hier zu ignorieren ist richtiger, als es an den Nodes zu
  # loeschen: Talos setzt es beim naechsten Reconcile ohnehin wieder.
  - target:
      kind: Application
      name: metallb
    patch: |-
      - op: replace
        path: /spec/sources/2/path
        value: clusters/talos/metallb
      - op: add
        path: /spec/sources/0/helm/valuesObject
        value:
          speaker:
            ignoreExcludeLB: true
      - op: add
        path: /spec/syncPolicy/managedNamespaceMetadata
        value:
          labels:
            pod-security.kubernetes.io/enforce: privileged

  # Traefik: eigene LoadBalancer-IP aus dem neuen Pool. Die .250 gehoert bis
  # zum Schluss dem k3s-Cluster, an ihr haengen der UniFi-Portforward und der
  # Split-Horizon-Wildcard. valuesObject wird nach den valueFiles gemergt,
  # ueberschrieben wird deshalb nur diese eine Annotation, der Rest von
  # manifests/traefik/values.yaml bleibt stehen.
  - target:
      kind: Application
      name: traefik
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valuesObject
        value:
          service:
            annotations:
              metallb.io/loadBalancerIPs: "192.168.2.240"
          metrics:
            prometheus:
              serviceMonitor:
                enabled: false

  # --- Bis kube-prometheus-stack migriert ist -------------------------------
  #
  # Drei Plattform-Apps legen einen ServiceMonitor an. Die CRD dafuer
  # (monitoring.coreos.com/v1) bringt kube-prometheus-stack mit, und das laeuft
  # hier noch nicht. ArgoCD scheitert dabei nicht am ServiceMonitor allein: es
  # bricht die ganze Sync-Operation ab ("failed to discover server resources"),
  # die App bleibt komplett Missing.
  #
  # Bewusst abschalten statt prometheus-operator-crds vorzuziehen: dann gaebe es
  # zwei Besitzer derselben CRDs, und beim spaeteren Entfernen der CRD-App
  # wuerde ArgoCDs prune jeden ServiceMonitor im Cluster mitnehmen.
  #
  # DIESE DREI PATCHES ENTFERNEN, sobald kube-prometheus-stack in der
  # resources-Liste oben steht. validate.sh baut das Overlay mit, ein
  # vergessener Patch faellt beim naechsten Lauf nicht auf: er ist syntaktisch
  # in Ordnung. Der Hinweis hier ist die einzige Bremse.
  - target:
      kind: Application
      name: sealed-secrets
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/metrics/serviceMonitor/enabled
        value: false

  - target:
      kind: Application
      name: cert-manager
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valuesObject
        value:
          prometheus:
            servicemonitor:
              enabled: false
