# App-of-Apps des Talos-Clusters.
#
# Bewusst kein zweiter Satz Application-Manifeste: die Dateien aus apps/ sind
# die gemeinsame Basis, hier steht nur, WELCHE davon im neuen Cluster schon
# laufen und WAS sich unterscheidet. Ein Dienst wandert damit durch genau eine
# Zeile mehr in dieser Liste, und eine Aenderung an einem Dienst muss nie an
# zwei Stellen nachgezogen werden.
#
# Reihenfolge egal, die sync-waves stehen in den Applications selbst.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../../apps/sealed-secrets.yaml
  - ../../apps/metallb.yaml
  - ../../apps/traefik.yaml
  - ../../apps/cert-manager.yaml
  - ../../apps/longhorn.yaml
  # Erste Welle von Schritt 4. readsb haengt am RTL-Stick, der per USB an
  # talos-cp-1 durchgereicht wird, fr24feed zieht seinen Beast-Stream daraus.
  # Beide zusammen, weil fr24feed aus dem alten Cluster keinen ClusterIP hier
  # erreichen kann. Im alten Cluster ist fr24 dafuer aus apps/kustomization.yaml
  # herausgenommen.
  - ../../apps/readsb.yaml
  - ../../apps/fr24.yaml
  # Rest der ersten Welle (2026-08-09): die zustandslosen Dienste. reloader
  # gehoert dazu, weil alle vier ihre Pods per reloader.stakater.com/auto
  # neustarten lassen; ohne ihn wuerde eine ConfigMap-Aenderung still nicht
  # greifen. Im alten Cluster bleibt reloader stehen, die dortigen Dienste
  # brauchen ihn weiter.
  #
  # kured und system-upgrade-controller kommen dagegen nie mit: beide setzen
  # ein OS mit Paketmanager voraus, Talos-Upgrades laufen ueber talosctl.
  - ../../apps/reloader.yaml
  - ../../apps/landing-page.yaml
  - ../../apps/gatus.yaml
  - ../../apps/homepage.yaml
  - ../../apps/external-services.yaml
  # Zweite Welle (2026-08-09). kube-prometheus-stack zuerst, weil es die
  # monitoring.coreos.com-CRDs mitbringt: erst danach duerfen die uebrigen Apps
  # ihre ServiceMonitor anlegen.
  - ../../apps/kube-prometheus-stack.yaml
  # Vorgezogen, weil paperless-ngx sein Consume-Verzeichnis darueber mountet.
  - ../../apps/csi-driver-smb.yaml
  # Erster zustandsbehafteter Dienst: seine beiden Longhorn-Volumes sind aus dem
  # NAS-Backup restauriert, im k3s-Cluster ist er dafuer geprunt. Der Ablauf
  # steht in talos/README.md, das Cluster-Spezifische in clusters/talos/ripe-atlas/.
  - ../../apps/ripe-atlas.yaml

patches:
  # MetalLB: eigener Pool, PodSecurity und die Exclude-Label-Ausnahme.
  #
  # ignoreExcludeLB ist der Unterschied, der am meisten Zeit gekostet hat:
  # vanilla Kubernetes setzt auf Control-Plane-Nodes
  # node.kubernetes.io/exclude-from-external-load-balancers, k3s tut das nicht.
  # MetalLB respektiert das Label und kuendigt von solchen Nodes nichts an. Im
  # Startaufbau sind alle drei Nodes Control-Plane, also kuendigt niemand an:
  # der Service bekommt seine IP, ArgoCD meldet Healthy, und trotzdem
  # beantwortet kein Node das ARP fuer die .240. Sichtbar nur daran, dass
  # ServiceL2Status leer bleibt.
  #
  # Das Label passt nicht zu allowSchedulingOnControlPlanes: diese Nodes SIND
  # die Worker. Es hier zu ignorieren ist richtiger, als es an den Nodes zu
  # loeschen: Talos setzt es beim naechsten Reconcile ohnehin wieder.
  - target:
      kind: Application
      name: metallb
    patch: |-
      - op: replace
        path: /spec/sources/2/path
        value: clusters/talos/metallb
      - op: add
        path: /spec/sources/0/helm/valuesObject
        value:
          speaker:
            ignoreExcludeLB: true
      - op: add
        path: /spec/syncPolicy/managedNamespaceMetadata
        value:
          labels:
            pod-security.kubernetes.io/enforce: privileged

  # Traefik: eigene LoadBalancer-IP aus dem neuen Pool. Die .250 gehoert bis
  # zum Schluss dem k3s-Cluster, an ihr haengen der UniFi-Portforward und der
  # Split-Horizon-Wildcard. valuesObject wird nach den valueFiles gemergt,
  # ueberschrieben wird deshalb nur diese eine Annotation, der Rest von
  # manifests/traefik/values.yaml bleibt stehen.
  - target:
      kind: Application
      name: traefik
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valuesObject
        value:
          service:
            annotations:
              metallb.io/loadBalancerIPs: "192.168.2.240"

  # Longhorn: eigener Manifest-Pfad, weil die Node-CRs im k3s-Cluster auf
  # k3s-worker-1, raspi5 und prodesk lauten und der ServiceMonitor hier noch
  # nicht gehen kann. Was genau abweicht, steht in clusters/talos/longhorn/.
  #
  # Die Helm-Values bleiben geteilt: die Ruecksicht auf langsame Nodes
  # (concurrentReplicaRebuildPerNodeLimit, backupConcurrentLimit) schadet auf
  # den VMs nicht, und geteilte Values heisst, dass eine Einstellung nicht an
  # zwei Stellen auseinanderlaufen kann.
  #
  # Die Voraussetzungen stehen in talos/talconfig.yaml: extraMounts fuer
  # /var/lib/longhorn, die PodSecurity-Ausnahme fuer longhorn-system und die
  # System Extensions iscsi-tools und util-linux-tools in der Schematic-ID.
  # Am 2026-08-08 auf allen drei Nodes geprueft (ext-iscsid Running).
  #
  # replicaZoneSoftAntiAffinity ist der eine Wert, der NICHT geteilt werden
  # darf. Hier tragen die Nodes ein Zonen-Label (pve fuer die beiden VMs, blech
  # fuer prodesk, gesetzt in talos/talconfig.yaml), und "false" zwingt Longhorn,
  # die zwei Repliken auf zwei Zonen zu verteilen. Ohne das genuegt Longhorn
  # schon, dass die Repliken auf zwei verschiedenen NODES liegen: talos-cp-1 und
  # talos-cp-2 sind zwei Nodes, aber eine einzige NVMe in pve. Beide Repliken
  # dort waeren keine Redundanz, nur zwei Kopien auf demselben Datentraeger.
  #
  # Im k3s-Cluster traegt keine Node ein Zonen-Label. Der Wert dort waere nicht
  # bloss wirkungslos, er wuerde schaden: ohne Zonen faellt alles in dieselbe
  # leere Zone und Longhorn koennte nur noch eine einzige Replik je Volume
  # unterbringen.
  - target:
      kind: Application
      name: longhorn
    patch: |-
      - op: replace
        path: /spec/sources/2/path
        value: clusters/talos/longhorn
      - op: add
        path: /spec/sources/0/helm/valuesObject
        value:
          defaultSettings:
            replicaZoneSoftAntiAffinity: "false"

  # csi-driver-smb: PodSecurity-Ausnahme. Der Node-DaemonSet mountet CIFS und
  # braucht dafuer privileged plus hostPath, Talos erzwingt clusterweit
  # baseline. Ueber managedNamespaceMetadata und nicht ueber ein
  # Namespace-Manifest, weil der Namespace aus CreateNamespace=true entsteht.
  # Gleiche Bauart wie beim metallb-Patch oben.
  #
  # Der Hinweis stand schon in talos/talconfig.yaml: solche Ausnahmen gehoeren
  # ins GitOps und nicht in die machine config, eine Aenderung dort rebootet die
  # Control-Plane.
  - target:
      kind: Application
      name: csi-driver-smb
    patch: |-
      - op: add
        path: /spec/syncPolicy/managedNamespaceMetadata
        value:
          labels:
            pod-security.kubernetes.io/enforce: privileged

  # kube-prometheus-stack: eigener Manifest-Pfad. Abweichend sind die
  # etcd-Adressen und die beiden home-assistant-Dateien, Einzelheiten in
  # clusters/talos/kube-prometheus-stack/. Die Helm-Values bleiben geteilt.
  #
  # externalLabels ist der zweite Unterschied und gehoert in die Values, nicht
  # ins Overlay: den Prometheus-CR erzeugt das Chart. Beide Cluster alarmieren
  # waehrend der Migration in dieselbe SNS-Topic, und ohne unterscheidendes
  # Label steht in der Mail nur der Alertname. Das group_by in values.yaml
  # enthaelt 'cluster' laengst, gesetzt war es nur nie.
  #
  # Der dritte Unterschied, die PodSecurity-Ausnahme fuer den node-exporter,
  # steht als Namespace-Manifest im Overlay statt als managedNamespaceMetadata.
  #
  # Der Unterschied zu csi-driver-smb weiter oben, wo genau das funktioniert:
  # managedNamespaceMetadata wirkt beim ANLEGEN des Namespace. Fuer
  # csi-driver-smb entstand er frisch und trug das Label sofort; monitoring gab
  # es laengst, und ein nachtraeglich gesetztes managedNamespaceMetadata
  # erreicht ihn nicht mehr. Live geprueft am 2026-08-09, das Label kam nicht
  # an, auch nach terminierter Sync-Operation nicht.
  #
  # Faustregel fuer die restliche Migration: bei einem neuen Dienst reicht
  # managedNamespaceMetadata, bei einem schon laufenden braucht es das Manifest.
  - target:
      kind: Application
      name: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/sources/2/path
        value: clusters/talos/kube-prometheus-stack
      - op: add
        path: /spec/sources/0/helm/valuesObject
        value:
          prometheus:
            prometheusSpec:
              externalLabels:
                cluster: talos

  # ripe-atlas: eigener Manifest-Pfad. Abweichend sind die PVs zu den
  # restaurierten Volumes und die PodSecurity-Ausnahme am Namespace,
  # Einzelheiten in clusters/talos/ripe-atlas/.
  #
  # Anders als bei metallb, longhorn und kube-prometheus-stack ist es
  # /spec/source/path und nicht /spec/sources/2/path: die Application hat nur
  # eine einzige Source, es haengt kein Helm-Chart daran.
  - target:
      kind: Application
      name: ripe-atlas
    patch: |-
      - op: replace
        path: /spec/source/path
        value: clusters/talos/ripe-atlas

  # Die vier ServiceMonitor-Ausnahmen (sealed-secrets, cert-manager, traefik,
  # gatus) sind am 2026-08-09 entfallen, weil kube-prometheus-stack seine CRDs
  # jetzt hier mitbringt. Sie standen hier, weil ArgoCD an einer fehlenden CRD
  # nicht nur den einen Task, sondern die ganze Sync-Operation abbricht.
