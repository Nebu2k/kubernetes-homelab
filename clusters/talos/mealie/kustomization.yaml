# mealie im Talos-Cluster.
#
# Einziger Unterschied zum k3s-Cluster sind die PVs zu den restaurierten
# Volumes. Eine PodSecurity-Ausnahme braucht es nicht: mealie startet zwar als
# root, das erlaubt das baseline-Profil, und es setzt weder zusaetzliche
# capabilities noch hostPath oder hostNetwork.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../manifests/mealie
  - pv.yaml
