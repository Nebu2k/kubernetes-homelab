# paperless-ngx im Talos-Cluster.
#
# Einziger Unterschied zum k3s-Cluster sind die PVs zu den fuenf restaurierten
# Longhorn-Volumes. Das CIFS-Consume-Verzeichnis kommt unveraendert aus
# manifests/: csi-driver-smb laeuft hier schon (mit PodSecurity-Ausnahme am
# Namespace, siehe ../kustomization.yaml), und das Share ist dasselbe.
#
# Solange beide Cluster laufen, wuerden zwei paperless-Instanzen dasselbe
# Consume-Verzeichnis leerraeumen. Deshalb ist paperless im k3s-Cluster mit
# derselben Aenderung geprunt und nicht parallel gefahren.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../manifests/paperless-ngx
  - pv.yaml
