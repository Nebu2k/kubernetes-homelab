# kube-prometheus-stack im Talos-Cluster.
#
# Gleiches Muster wie clusters/talos/longhorn und clusters/talos/gatus: die
# Application aus apps/ bleibt die gemeinsame Basis, nur der git-Pfad ihrer
# dritten Source zeigt hierher. Die Helm-Values sind geteilt, hier stehen nur
# die Manifeste, die sich unterscheiden.
#
# Das ist der einzige Dienst, der waehrend der Migration bewusst in BEIDEN
# Clustern laeuft: er ueberwacht jeweils sein eigenes. Er bleibt deshalb auch in
# apps/kustomization.yaml stehen, bis das k3s-Cluster abgebaut wird.
# Auseinanderhalten lassen sich die Alarme am externalLabel cluster=talos, das
# in clusters/talos/kustomization.yaml gesetzt wird.
#
# Ohne Restore aufgesetzt (2026-08-09): die Metrik-Historie ist auf 30d begrenzt
# und laut values.yaml bewusst regenerierbar, die Dashboards liegen als Code in
# manifests/kube-prometheus-stack/dashboards/, und das Grafana-Volume traegt nur
# noch Benutzer und Einstellungen. Ein Volume-Restore waere hier Aufwand ohne
# Gegenwert, anders als bei paperless oder home-assistant.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  # Traegt nur das PodSecurity-Label, Begruendung im Kopf der Datei.
  - namespace.yaml
  - ../../../manifests/kube-prometheus-stack/grafana-ingress.yaml
  - ../../../manifests/kube-prometheus-stack/prometheus-ingress.yaml
  - ../../../manifests/kube-prometheus-stack/alertmanager-ingress.yaml
  - ../../../manifests/kube-prometheus-stack/node-exporter-external-scrapeconfig.yaml
  - ../../../manifests/kube-prometheus-stack/aws-credentials-sealed.yaml
  - ../../../manifests/kube-prometheus-stack/grafana-admin-sealed.yaml
  # Eigene Fassung mit den Talos-Adressen, siehe Kopf der Datei.
  - etcd-scrapeconfig.yaml
  # Am 2026-08-09 nachgezogen, nachdem die zweite Welle durch war. Ab hier
  # liegen die homelab-eigenen Regeln und der Home-Assistant-Scrape nur noch
  # hier, in manifests/kube-prometheus-stack/kustomization.yaml sind sie
  # auskommentiert.
  - ../../../manifests/kube-prometheus-stack/prometheus-rules.yaml
  - ../../../manifests/kube-prometheus-stack/home-assistant-scrapeconfig.yaml
  - ../../../manifests/kube-prometheus-stack/home-assistant-token-sealed.yaml

# Was beim Zurueckholen der Regeln zu beachten war: die absent()-Zweige der
# Gruppe offsite-backup-jobs greifen erst, wenn der jeweilige CronJob in DIESEM
# Cluster einmal durchgelaufen ist. kube_job_status_completion_time entsteht
# nicht durch das Anlegen des CronJob. Statt bis zum naechsten Nachtlauf zu
# warten, sind die vier Jobs am 2026-08-09 einmal von Hand angestossen worden
# (kubectl create job --from=cronjob/...). Das raeumt die Alarme sofort ab und
# belegt zugleich, dass der Backup-Pfad aus dem neuen Cluster funktioniert.
#
# Der Job MUSS dabei den Namen seines CronJob als Praefix behalten. Die Regeln
# selektieren auf job_name=~"<cronjob>.*", ein frei gewaehlter Name erzeugt
# zwar eine Metrik, aber keine, die der absent()-Zweig sieht. Beim ersten
# Versuch hiessen alle vier "manual-migration-<datum>" und die Alarme blieben
# stehen, obwohl die Jobs sauber durchgelaufen waren.

# Die Dashboards liegen neben den Manifesten und werden hier genauso erzeugt wie
# dort. Bewusst kopiert statt referenziert: ein configMapGenerator laesst sich
# nicht aus einer fremden kustomization erben, und die JSON-Dateien selbst
# bleiben die eine Quelle.
#
# disableNameSuffixHash, weil der grafana-sc-dashboard-Sidecar sonst bei jeder
# Aenderung ein zweites Dashboard unter neuem Namen importiert, statt zu
# ersetzen.
configMapGenerator:
  - name: grafana-dashboard-node-overview
    files:
      - node-overview.json=../../../manifests/kube-prometheus-stack/dashboards/node-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-traefik-overview
    files:
      - traefik-overview.json=../../../manifests/kube-prometheus-stack/dashboards/traefik-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-backup-overview
    files:
      - backup-overview.json=../../../manifests/kube-prometheus-stack/dashboards/backup-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-proxmox-overview
    files:
      - proxmox-overview.json=../../../manifests/kube-prometheus-stack/dashboards/proxmox-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: grafana-dashboard-verfuegbarkeit
    files:
      - verfuegbarkeit.json=../../../manifests/kube-prometheus-stack/dashboards/verfuegbarkeit.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
